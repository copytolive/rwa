<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../superapp-v5.css?v=6"></head><body>
<div class="app"><header class="topbar"><a class="brand" href="#terminal">RWA</a><nav class="topnav"></nav><div class="top-actions"><span id="liveText">Market network</span><button class="signin">Connect Wallet</button><button class="institutional">Institutional</button></div></header><div class="productbar"><div class="product-left"></div><div class="product-nav"></div></div><div class="layout"><aside class="left"><input id="search"><div id="pairList"></div></aside><main id="terminal"><div id="selName">ONDO / USDT</div><div id="statPrice">1.25</div><div id="statChange">+3.50%</div><div id="statHigh">1.30</div><div id="statLow">1.12</div><div id="statVol">12000000</div><div id="buyPct">61%</div><div id="bestBid">1.249</div><div id="bestAsk">1.251</div><div id="lastTick">now</div><section id="rwaExchange"><input id="exCoin"><button id="exLong"></button><button id="exShort"></button></section></main><aside id="depth"></aside></div><div class="credibility-strip"></div><nav class="mobile-tabs"></nav></div><div id="toast"></div>
<script>
window.S={selected:'ONDOUSDT',interval:'15',pairs:[{base:'ONDO',symbol:'ONDOUSDT',price:1.25,change:3.5,vol:12000000,high:1.30,low:1.12,rwa:true},{base:'PAXG',symbol:'PAXGUSDT',price:3400,change:-1.2,vol:5000000,rwa:true},{base:'BTC',symbol:'BTCUSDT',price:100000,change:1.1,vol:900000000,rwa:false}],map:new Map()};S.pairs.forEach(x=>S.map.set(x.symbol,x));
window.selectPair=(sym)=>{S.selected=sym;const x=S.map.get(sym);if(x)document.getElementById('selName').textContent=x.base+' / USDT'};
window.toast=()=>{};
window.RWAQuickActions={watch:()=>{},alert:()=>{},share:()=>{},loadSuite:async()=>window.RWASuite};
window.RWASuite={version:'2.0.0',open:(tab)=>{let e=document.getElementById('suite');if(!e){e=document.createElement('section');e.id='suite';document.body.appendChild(e)}e.style.display='block';e.dataset.tab=tab}};
</script>
<script src="../superapp-v5.js?v=6"></script>
</body></html>
