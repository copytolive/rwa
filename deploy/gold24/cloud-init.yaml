#cloud-config
package_update: true
packages:
  - git
  - python3
  - python3-venv
  - python3-pip
runcmd:
  - [ bash, -lc, 'git clone https://github.com/copytolive/rwa.git /opt/rwa || true' ]
  - [ bash, -lc, 'chmod +x /opt/rwa/deploy/gold24/install.sh && /opt/rwa/deploy/gold24/install.sh' ]
final_message: "GOLD24 bootstrap complete. Configure /etc/gold24.env + Google credential + canonical 2026 data/cross-check; service fails closed until Gate A passes."
