name: Redirect legacy realworldasset to canonical rwa

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare redirect site
        run: |
          mkdir -p _site
          cp index.html 404.html .nojekyll _site/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  validate-public-redirect:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Validate canonical and legacy Pages routes
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL='https://copytolive.github.io/rwa/'
          LEGACY_ROOT='https://copytolive.github.io/realworldasset/'
          LEGACY_DEEP='https://copytolive.github.io/realworldasset/merchant/orders/'

          code="$(curl -L -sS -o /tmp/canonical.html -w '%{http_code}' --retry 6 --retry-delay 5 --retry-all-errors "$CANONICAL")"
          test "$code" = '200'

          pass=0
          for i in $(seq 1 24); do
            curl -sS -L "$LEGACY_ROOT" -o /tmp/legacy-root.html || true
            curl -sS -L "$LEGACY_DEEP" -o /tmp/legacy-deep.html || true
            if grep -Fq "$CANONICAL" /tmp/legacy-root.html && grep -Fq "$CANONICAL" /tmp/legacy-deep.html; then
              pass=1
              break
            fi
            sleep 5
          done
          test "$pass" = '1'
          grep -Fq "window.location.replace('$CANONICAL')" /tmp/legacy-root.html
          grep -Fq "window.location.replace('$CANONICAL')" /tmp/legacy-deep.html
          echo "PUBLIC_REDIRECT_PASS canonical=$CANONICAL legacy_root=$LEGACY_ROOT legacy_deep=$LEGACY_DEEP"
