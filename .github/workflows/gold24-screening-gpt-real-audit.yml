name: GOLD24 Screening GPT Real Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gold24-screening-gpt-real-audit.yml'
      - 'backtest/gold24/screening_gpt_real_audit.py'
      - 'backtest/gold24/qualified_scripts/**'
      - 'backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv'
      - 'backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-screening-gpt-real-audit
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  STATE_DIR: ${{ github.workspace }}/.gold24-screening-audit-state
  OUT_DIR: ${{ github.workspace }}/backtest/gold24/runtime_screening_gpt
  SOURCE_SUMMARY: ${{ github.workspace }}/backtest/gold24/runtime_v11/latest_validation_summary.json

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install GOLD24 dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt

      - name: Freeze authoritative canonical source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/source.env"
          import json, os, pathlib
          x=json.loads(pathlib.Path(os.environ['SOURCE_SUMMARY']).read_text())
          assert x.get('validation') == 'PASS'
          assert x.get('gate_a_strict',{}).get('gate_a') == 'PASS'
          print('SOURCE_RUN_ID=' + str(x['github_run_id']))
          print('SOURCE_BATCH=' + str(x['batch']))
          print('SOURCE_ARCHIVED=' + str(x['cumulative_configs_archived']))
          PY
          cat "$RUNNER_TEMP/source.env"
          cat "$RUNNER_TEMP/source.env" >> "$GITHUB_ENV"

      - name: Restore exact canonical state artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n gold24-canonical-v11-state -D "$STATE_DIR"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"

      - name: Run exact canonical screening audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python backtest/gold24/screening_gpt_real_audit.py             --state-dir "$STATE_DIR"             --source-summary "$SOURCE_SUMMARY"             --out-dir "$OUT_DIR"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['OUT_DIR'])/'screening_gpt_real_audit.json'
          x=json.loads(p.read_text())
          assert x['status']=='PASS'
          assert x['all_rows_verified'] is True
          import csv
          strict=list(csv.DictReader(open('backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv')))
          multi=list(csv.DictReader(open('backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv')))
          expected=len(strict)+len(multi)
          assert int(x['total_methods'])==expected,(x['total_methods'],expected)
          assert int(x['source_batch'])==int(os.environ['SOURCE_BATCH'])
          assert str(x['source_run_id'])==str(os.environ['SOURCE_RUN_ID'])
          assert int(x['source_archive_total'])==int(os.environ['SOURCE_ARCHIVED'])
          assert all(r['verification_status']=='PASS' for r in x['rows'])
          print(json.dumps({
            'status':x['status'],
            'all_rows_verified':x['all_rows_verified'],
            'total_methods':x['total_methods'],
            'source_batch':x['source_batch'],
            'source_run_id':x['source_run_id'],
            'dataset_sha256':x['dataset_sha256'],
          },indent=2))
          PY

      - name: Run current selected-package global correlation portfolio audit
        shell: bash
        run: |
          set -euo pipefail
          python backtest/gold24/screening_gpt_combined_portfolio_audit.py \
            --state-dir "$STATE_DIR" \
            --out "$OUT_DIR/combined_portfolio_audit.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['OUT_DIR'])/'combined_portfolio_audit.json'
          x=json.loads(p.read_text())
          assert x['status']=='PASS'
          import csv
          strict=list(csv.DictReader(open('backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv')))
          multi=list(csv.DictReader(open('backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv')))
          expected=len(strict)+len(multi)
          assert int(x['methods_input'])==expected,(x['methods_input'],expected)
          assert int(x['global_pair_count'])==expected*(expected-1)//2
          assert int(x['methods_final'])==int(x['global_greedy_kept_count'])
          assert all(r['global_corr_gate']=='PASS' for r in x['rows'] if r['global_selection']=='KEPT')
          print(json.dumps({
            'methods_input':x['methods_input'],
            'methods_final':x['methods_final'],
            'global_pair_count':x['global_pair_count'],
            'pairs_gt_0_50':x['pairs_gt_0_50'],
            'distinct_family':x['final_distinct_family_count'],
            'max_family_share':x['final_max_family_share'],
            'portfolio_ready_diversification':x['portfolio_ready_diversification'],
          },indent=2))
          PY

      - name: Publish audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backtest/gold24/runtime_screening_gpt/screening_gpt_real_audit.json \
            backtest/gold24/runtime_screening_gpt/screening_gpt_real_audit.csv \
            backtest/gold24/runtime_screening_gpt/combined_portfolio_audit.json
          if git diff --cached --quiet; then
            echo "No audit delta"
            exit 0
          fi
          git commit -m "chore(gold24): publish verified GPT screening audit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-screening-gpt-real-audit-${{ github.run_id }}
          path: |
            backtest/gold24/runtime_screening_gpt/screening_gpt_real_audit.json
            backtest/gold24/runtime_screening_gpt/screening_gpt_real_audit.csv
            backtest/gold24/runtime_screening_gpt/combined_portfolio_audit.json
          if-no-files-found: error
          retention-days: 90
