name: RWA Ecommerce Production Gate
on:
  push:
    branches: ["main"]
    paths:
      - "rwa-commerce-config.json"
      - "tools/rwa-ecommerce-production-gate.mjs"
      - ".github/workflows/rwa-ecommerce-production-gate.yml"
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify ecommerce is honestly LOCKED or production LIVE
        run: node tools/rwa-ecommerce-production-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwa-ecommerce-production-gate-${{ github.run_id }}
          path: artifacts/rwa-ecommerce-production-gate
          if-no-files-found: error
