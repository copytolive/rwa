name: MULTI CHAIN V3 Engine Patch Once

on:
  push:
    branches: [feat/multichain-real-execution-fees-v3-20260828]
    paths: [.github/workflows/multichain-v3-engine-patch-once.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multichain-real-execution-fees-v3-20260828
          fetch-depth: 0
      - name: Patch revenue-aware quote engine and browser contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('rwa-multichain-engine.js')
          s=p.read_text()
          assert "const INTEGRATOR='copytolive-rwa';" in s
          if "const REVENUE_URL='rwa-multichain-revenue.json';" not in s:
              s=s.replace("const INTEGRATOR='copytolive-rwa';", "const INTEGRATOR='copytolive-rwa';\nconst REVENUE_URL='rwa-multichain-revenue.json';\nlet revenueCfg=null;")
          anchor="async function loadRegistry(registry){if(registry)state.registry=registry;if(!state.registry){const r=await json('rwa-multichain-registry.json?v=2');if(!Array.isArray(r?.networks))throw Error('Invalid multi-chain registry');state.registry=r}return state.registry}"
          addition=anchor+"\nasync function loadRevenue(){if(revenueCfg)return revenueCfg;try{const r=await json(REVENUE_URL+'?v=1');revenueCfg=r&&typeof r==='object'?r:{}}catch{revenueCfg={mode:'UNAVAILABLE',lifi:{enabled:false,partner_configured:false,payout_wallet_configured_externally:false,fee_bps:0,fee_decimal:0}}}return revenueCfg}\nfunction lifiRevenueEnabled(r){const x=r?.lifi||{};return x.enabled===true&&x.partner_configured===true&&x.payout_wallet_configured_externally===true&&Number(x.fee_bps)>0&&Number(x.fee_decimal)>0}"
          if 'async function loadRevenue()' not in s:
              assert anchor in s
              s=s.replace(anchor,addition)
          old="integrator:INTEGRATOR});if(fromAmountForGas)p.set('fromAmountForGas',String(fromAmountForGas));const q=validateQuote(await json(`${LIFI}/quote?${p}`),{fromChain,toChain,fromAddress:addr});q.__rwa={createdAt:Date.now(),fromNetwork:fn.id,toNetwork:tn.id,fromToken:ft,toToken:tt};"
          new="integrator:INTEGRATOR});const revenue=await loadRevenue(),feeEnabled=lifiRevenueEnabled(revenue);if(feeEnabled)p.set('fee',String(Number(revenue.lifi.fee_decimal)));if(fromAmountForGas)p.set('fromAmountForGas',String(fromAmountForGas));const q=validateQuote(await json(`${LIFI}/quote?${p}`),{fromChain,toChain,fromAddress:addr});q.__rwa={createdAt:Date.now(),fromNetwork:fn.id,toNetwork:tn.id,fromToken:ft,toToken:tt,revenue:{enabled:feeEnabled,integrator:INTEGRATOR,feeBps:feeEnabled?Number(revenue.lifi.fee_bps):0,status:String(revenue.mode||'DISABLED')}};"
          if 'feeEnabled=lifiRevenueEnabled(revenue)' not in s:
              assert old in s
              s=s.replace(old,new)
          old2="approvalAddress:e.approvalAddress||null,ageMs:q.__rwa?.createdAt?Date.now()-q.__rwa.createdAt:null}}"
          new2="approvalAddress:e.approvalAddress||null,appFeeEnabled:q.__rwa?.revenue?.enabled===true,appFeeBps:Number(q.__rwa?.revenue?.feeBps||0),revenueStatus:q.__rwa?.revenue?.status||'DISABLED',integrator:q.__rwa?.revenue?.integrator||INTEGRATOR,ageMs:q.__rwa?.createdAt?Date.now()-q.__rwa.createdAt:null}}"
          if 'appFeeEnabled:' not in s:
              assert old2 in s
              s=s.replace(old2,new2)
          old3="version:VERSION,policy:POLICY,loadRegistry,loadChains,chainMeta,walletAddress"
          new3="version:VERSION,revision:'3.0.0-revenue-ready',policy:POLICY,loadRegistry,loadRevenue,revenueReady:async()=>lifiRevenueEnabled(await loadRevenue()),loadChains,chainMeta,walletAddress"
          if "revision:'3.0.0-revenue-ready'" not in s:
              assert old3 in s
              s=s.replace(old3,new3)
          s=s.replace("constants:{LIFI,NATIVE,SOL_NATIVE,SOL_LIFI_ID,INTEGRATOR}","constants:{LIFI,NATIVE,SOL_NATIVE,SOL_LIFI_ID,INTEGRATOR,REVENUE_URL}")
          p.write_text(s)

          b=Path('tools/multichain-browser.mjs')
          t=b.read_text()
          needle="if(u.pathname==='/v1/quote'){\n      const from=Number(u.searchParams.get('fromChain'))"
          repl="if(u.pathname==='/v1/quote'){\n      if(u.searchParams.has('fee'))throw Error(`${label}: disabled revenue config must not append an application fee`);\n      const from=Number(u.searchParams.get('fromChain'))"
          if 'disabled revenue config must not append an application fee' not in t:
              assert needle in t
              t=t.replace(needle,repl)
          b.write_text(t)

          ix=Path('index.html')
          x=ix.read_text()
          if 'rwa-multichain-engine.js?v=2' in x:
              x=x.replace('rwa-multichain-engine.js?v=2','rwa-multichain-engine.js?v=3')
              ix.write_text(x)
          print('MULTICHAIN_V3_ENGINE_PATCH=PASS')
          PY
          node --check rwa-multichain-engine.js
          node tools/multichain-revenue-contract.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rwa-multichain-engine.js tools/multichain-browser.mjs index.html
          if git diff --cached --quiet; then
            echo 'No patch needed'
          else
            git commit -m 'feat(multichain): make routing revenue-ready without bypassing mainnet lock'
            git push origin HEAD:feat/multichain-real-execution-fees-v3-20260828
          fi
