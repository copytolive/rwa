name: P45 Frozen Holdout 2025
on:
  pull_request:
    paths:
      - 'research/p45-live-cert/p45_holdout_2025.py'
      - '.github/workflows/p45-frozen-holdout-2025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run frozen P45 holdout
        id: h
        shell: bash
        run: |
          set +e
          python research/p45-live-cert/p45_holdout_2025.py --output p45_holdout_2025_result.json 2>&1 | tee p45_holdout_2025.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-holdout-2025
          path: |
            p45_holdout_2025_result.json
            p45_holdout_2025.log
          retention-days: 90
      - name: Enforce holdout gate
        if: always()
        shell: bash
        run: |
          code='${{ steps.h.outputs.code }}'
          test "$code" = "0"
