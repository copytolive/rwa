name: GOLD24 Recovery Owner Repair

on:
  push:
    paths:
      - '.github/workflows/gold24-recovery-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold24-recovery-owner-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore proven authoritative Recovery v11 and repair anti-race source freeze
        shell: bash
        run: |
          set -euo pipefail
          BASE='c2ecb4c9dd4235f41dddcb21ef548a4958bd54e7'
          git fetch origin "$BASE" || true
          git show "$BASE:.github/workflows/gold24-canonical-recovery.yml" > .github/workflows/gold24-canonical-recovery.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gold24-canonical-recovery.yml')
          s=p.read_text()
          s=s.replace('cancel-in-progress: false','cancel-in-progress: true',1)
          old='''      - name: Freeze latest published canonical source\n        shell: bash\n        run: |\n          set -euo pipefail\n          python - <<'PY' > "$RUNNER_TEMP/source.env"\n          import json, pathlib\n          x=json.loads(pathlib.Path('backtest/gold24/runtime_v11/latest_validation_summary.json').read_text())\n'''
          new='''      - name: Freeze latest published canonical source\n        shell: bash\n        run: |\n          set -euo pipefail\n          git fetch origin main\n          git show origin/main:backtest/gold24/runtime_v11/latest_validation_summary.json > "$RUNNER_TEMP/latest_validation_source.json"\n          python - <<'PY' > "$RUNNER_TEMP/source.env"\n          import json, os, pathlib\n          x=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'] + '/latest_validation_source.json').read_text())\n'''
          if old not in s:
              raise SystemExit('repair pattern missing: Freeze latest published canonical source')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

          cat > backtest/gold24/GITHUB_RUNNER_KICK <<'EOF'
          policy=GOLD_CANONICAL_V11_20260828
          reason=restore_authoritative_recovery_owner_after_noncanonical_v2_failclosed_override_20260830
          ranking=minimum_trades_first_then_net_profit_factor_desc
          continuity=restore_latest_published_state_then_20_concurrent_logical_workers_single_writer_merge
          workers=20
          worker_mode=20_LOGICAL_PROCESS_WORKERS_SINGLE_RUNNER_SINGLE_WRITER_PROMOTION
          raw_cursor_count=400000
          promotion=single_writer_global_novelty_exact_ledger_dedupe_atomic_publish_readback
          correlation=max_abs_pearson_log_return_equity_0.50_per_symbol_greedy_lower_quality_removed
          report_filter=entry_ge_100_standard_lot_net_profit_usd_ge_20000_corr_le_0.50
          requested_by=user_refresh_sheet_fix_progress_and_continue_search
          nonce=20260830T2123WIB-RECOVERY-RESTORE
          EOF
          sed -i 's/^          //' backtest/gold24/GITHUB_RUNNER_KICK

          grep -q 'name: GOLD Canonical v11 Recovery Continuation' .github/workflows/gold24-canonical-recovery.yml
          grep -q 'cancel-in-progress: true' .github/workflows/gold24-canonical-recovery.yml
          grep -q 'git show origin/main:backtest/gold24/runtime_v11/latest_validation_summary.json' .github/workflows/gold24-canonical-recovery.yml
          grep -q 'workers=20' backtest/gold24/GITHUB_RUNNER_KICK

          git config user.name 'gold24-repair-bot'
          git config user.email 'gold24-repair-bot@users.noreply.github.com'
          git add .github/workflows/gold24-canonical-recovery.yml backtest/gold24/GITHUB_RUNNER_KICK
          git commit -m 'fix(gold24): restore authoritative v11 recovery and restart search'
          git push origin HEAD:main
