name: GOLD24 CopyToLive Production Parity

on:
  workflow_dispatch:
    inputs:
      run_live_parity:
        description: Execute active GOLD strategies against current CopyToLive OHLCV
        required: false
        default: false
        type: boolean
      max_strategies:
        description: Optional strategy limit for live parity (0 = all)
        required: false
        default: '0'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gold24-copytolive-parity.yml'
      - 'backtest/gold24/copytolive_parity_engine.py'
      - 'backtest/gold24/test_copytolive_parity_engine.py'
      - 'backtest/gold24/copytolive_active_gold_manifest.json'
      - 'backtest/gold24/copytolive_gold_strategy_sources.json'
      - 'backtest/gold24/requirements_copytolive.txt'
      - 'backtest/gold24/COPYTOLIVE_PARITY.md'

permissions:
  contents: read

concurrency:
  group: gold24-copytolive-production-parity
  cancel-in-progress: true

jobs:
  contract:
    name: CopyToLive execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight contract dependencies
        run: |
          set -euo pipefail
          python -m pip install 'numpy>=2,<3' 'pandas>=2.2,<3' 'pyarrow>=17,<30'

      - name: Compile parity engine
        run: python -m py_compile backtest/gold24/copytolive_parity_engine.py

      - name: Verify 118-source production snapshot
        run: |
          set -euo pipefail
          python backtest/gold24/copytolive_parity_engine.py --contract-only

      - name: Verify CopyToLive execution semantics
        run: |
          set -euo pipefail
          python backtest/gold24/test_copytolive_parity_engine.py

  live-parity:
    name: Optional active-GOLD live parity
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_parity }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact strategy runtime dependencies
        run: |
          set -euo pipefail
          python -m pip install -r backtest/gold24/requirements_copytolive.txt

      - name: Run current-production parity
        shell: bash
        env:
          MAX_STRATEGIES: ${{ inputs.max_strategies }}
        run: |
          set -euo pipefail
          mkdir -p backtest/gold24/runtime_copytolive_parity
          LIMIT_ARGS=()
          if [ "${MAX_STRATEGIES:-0}" != "0" ]; then
            LIMIT_ARGS=(--max-strategies "$MAX_STRATEGIES")
          fi
          python backtest/gold24/copytolive_parity_engine.py \
            --fetch-production \
            "${LIMIT_ARGS[@]}" \
            --out backtest/gold24/runtime_copytolive_parity/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: gold24-copytolive-production-parity-${{ github.run_id }}
          path: backtest/gold24/runtime_copytolive_parity/latest.json
          if-no-files-found: error
          retention-days: 30
