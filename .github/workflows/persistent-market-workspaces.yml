name: Legacy Persistent Market Workspaces (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-market:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: V3 legacy source contract
        run: |
          set -euo pipefail
          node --check market-performance.js
          node --check tools/persistent-market-shell-v3-browser.mjs
          grep -Fq "persistent-market-shell-v3.css?v=3" market-performance.js
          ! grep -Fq "persistent-market-router-v2.js" market-performance.js
          grep -Fq "css-core-router-v3" market-performance.js
          grep -Fq "body.rwa-super-workspace-open .layout" persistent-market-shell-v3.css
          grep -Fq "body.rwa-super-suite-open .layout" persistent-market-shell-v3.css
          grep -Fq "MARKET_SHELL_NEVER_LEAVES=PASS" tools/persistent-market-shell-v3-browser.mjs
      - name: Browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve legacy path
        run: |
          mkdir -p /tmp/rwa-pm-site/rwa
          cp -a . /tmp/rwa-pm-site/rwa/
          cd /tmp/rwa-pm-site
          python -m http.server 4173 >/tmp/rwa-pm-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-pm-http.log
          exit 1
      - name: Legacy market shell never leaves browser acceptance
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/persistent-market-shell-v3-browser.mjs
      - name: P1-P15 legacy static audit
        run: node tools/superapp-v5-audit.mjs
      - name: P16-P20 legacy static audit
        run: node tools/superapp-p16-p20-audit.mjs
      - name: Legacy security gate
        run: node tools/security-gate.mjs
      - name: Existing legacy browser regression
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: |
          node tools/superapp-v5-browser.mjs
          node tools/superapp-p16-p20-browser.mjs
