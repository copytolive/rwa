name: RENKO GOLD Origin Snapshot
on:
  push:
    branches:
      - fix/renko-total-history-origin-20260829
    paths:
      - '.github/workflows/renko-gold-origin-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-gold-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Dukascopy XAU-USD origin and aggregate fixed S1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/gold-origin
          python3 - <<'PY'
          import json, urllib.request, hashlib, datetime, math, os
          BASE='https://jetta.dukascopy.com/v1/ticks/XAU-USD/2003/5/5/{}'
          TARGET=6000
          EXPECTED=1052092863421
          ticks=[]; source=[]; min_move=None
          for hour in range(24):
              url=BASE.format(hour)
              req=urllib.request.Request(url,headers={'User-Agent':'RENKO-total-history-proof/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              source.append({'hour':hour,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
              j=json.loads(raw)
              mult=float(j['multiplier']); base=float(j['bid']); ts=float(j['timestamp'])
              if mult>0: min_move=mult if min_move is None else min(min_move,mult)
              units=round(base/mult)
              for dt,db in zip(j.get('times',[]),j.get('bids',[])):
                  ts += float(dt); units += int(db); price=units*mult
                  if math.isfinite(ts) and math.isfinite(price): ticks.append((int(ts),price))
              if len(ticks)>=TARGET*5: break
          bars={}
          for ts,p in ticks:
              sec=(ts//1000)*1000
              b=bars.get(sec)
              if b is None: bars[sec]={'openTime':sec,'closeTime':sec+999,'open':p,'high':p,'low':p,'close':p,'volume':0}
              else:
                  b['high']=max(b['high'],p); b['low']=min(b['low'],p); b['close']=p
          rows=[bars[k] for k in sorted(bars)][:TARGET]
          if len(rows)<100: raise SystemExit(f'not enough S1 bars: {len(rows)}')
          earliest=rows[0]['openTime']
          if abs(earliest-EXPECTED)>3600000: raise SystemExit(f'origin mismatch {earliest}')
          payload={'schema':'renko-gold-origin-v1','provider':'Dukascopy','instrumentCode':'XAU-USD','symbol':'XAUUSD','interval':'1s','source':'public XAU-USD tick feed aggregated to fixed 1-second OHLC','sourceDate':'2003-05-05','documentedEarliestS1Ms':EXPECTED,'earliestAvailableMs':earliest,'originWindowNewestMs':rows[-1]['closeTime'],'tickSize':min_move or 0.001,'bars':rows,'sourceBuckets':source,'generator':'github-actions python fixed-s1 v1'}
          canonical=json.dumps(payload,separators=(',',':'),sort_keys=True).encode()
          payload['payloadSha256']=hashlib.sha256(canonical).hexdigest()
          out='artifacts/gold-origin/renko-gold-xauusd-origin.json'
          with open(out,'w') as f: json.dump(payload,f,separators=(',',':'))
          print(json.dumps({'bars':len(rows),'earliest':earliest,'newest':rows[-1]['closeTime'],'tickSize':payload['tickSize'],'payloadSha256':payload['payloadSha256'],'sourceBuckets':len(source)}))
          PY
      - name: Validate snapshot
        run: |
          python3 - <<'PY'
          import json
          p=json.load(open('artifacts/gold-origin/renko-gold-xauusd-origin.json'))
          assert p['provider']=='Dukascopy' and p['instrumentCode']=='XAU-USD' and p['interval']=='1s'
          assert p['documentedEarliestS1Ms']==1052092863421 and p['earliestAvailableMs']<=1052093100000
          assert len(p['bars'])>=100 and len(p['sourceBuckets'])>=1
          assert all(all(isinstance(b[k],(int,float)) for k in ('openTime','closeTime','open','high','low','close')) for b in p['bars'])
          print('GOLD_ORIGIN_SNAPSHOT_PASS',len(p['bars']),p['payloadSha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-origin-snapshot-${{ github.sha }}
          path: artifacts/gold-origin/renko-gold-xauusd-origin.json
          retention-days: 30
