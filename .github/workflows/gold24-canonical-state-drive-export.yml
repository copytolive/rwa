name: GOLD24 Canonical State Drive Export Chunks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-canonical-state-drive-export.yml'
      - 'backtest/gold24/CANONICAL_STATE_DRIVE_EXPORT_KICK'

permissions:
  contents: read
  actions: read

concurrency:
  group: gold24-canonical-state-drive-export
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '33520049754'
  SOURCE_BATCH: '282'
  SOURCE_CANDIDATE_CURSOR: '44242557'
  SOURCE_ARTIFACT_NAME: 'gold24-canonical-v11-state'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download exact resumable canonical state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/state"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT_NAME" -D "$RUNNER_TEMP/state"
          test -s "$RUNNER_TEMP/state/gold24-v11.db"
          test -d "$RUNNER_TEMP/state/ledgers_v11"
          du -sh "$RUNNER_TEMP/state"

      - name: Build lossless chunked archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/drive-export"
          mkdir -p "$OUT/chunks"
          ARCHIVE="$OUT/GOLD24_CANONICAL_STATE_BATCH282_RUN33520049754.tar.gz"
          tar -C "$RUNNER_TEMP/state" -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$OUT/ARCHIVE_SHA256.txt"
          split -b 150M -d -a 2 "$ARCHIVE" "$OUT/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-"
          sha256sum "$OUT"/chunks/* > "$OUT/CHUNKS_SHA256.txt"
          ls -lh "$OUT"/chunks > "$OUT/CHUNKS_LS.txt"
          cat > "$OUT/RESTORE_INSTRUCTIONS.txt" <<'EOF'
          GOLD24 CANONICAL STATE - LOSSLESS CHUNKED EXPORT
          Source workflow run: 33520049754
          Source batch: 282
          Source candidate cursor: 44242557
          Source artifact: gold24-canonical-v11-state

          Restore:
            cat GOLD24_CANONICAL_STATE_BATCH282.part-* > GOLD24_CANONICAL_STATE_BATCH282_RUN33520049754.tar.gz
            sha256sum -c ARCHIVE_SHA256.txt
            mkdir restored && tar -xzf GOLD24_CANONICAL_STATE_BATCH282_RUN33520049754.tar.gz -C restored

          The chunks are byte-for-byte pieces of one tar.gz archive. Keep all parts and CHUNKS_SHA256.txt together.
          EOF
          echo "chunk_count=$(find "$OUT/chunks" -type f | wc -l)"
          test "$(find "$OUT/chunks" -type f | wc -l)" -le 10

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-manifest
          path: |
            ${{ runner.temp }}/drive-export/ARCHIVE_SHA256.txt
            ${{ runner.temp }}/drive-export/CHUNKS_SHA256.txt
            ${{ runner.temp }}/drive-export/CHUNKS_LS.txt
            ${{ runner.temp }}/drive-export/RESTORE_INSTRUCTIONS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-00
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-00
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-01
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-01
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 02
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-02
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-02
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 03
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-03
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-03
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 04
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-04
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-04
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 05
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-05
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-05
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 06
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-06
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-06
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 07
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-07
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-07
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 08
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-08
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-08
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
      - name: Upload chunk 09
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state-b282-part-09
          path: ${{ runner.temp }}/drive-export/chunks/GOLD24_CANONICAL_STATE_BATCH282.part-09
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
