name: CopyToLive ALL PAIRS 0ms Public Browser Validation

on:
  push:
    branches: [main]
    paths:
      - "validation-requests/history-allpairs-0ms/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^validation-requests/history-allpairs-0ms/.*\.json$' | tail -n 1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Capture production ALL PAIRS with zero intentional delay
        shell: bash
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
        run: |
          set -euo pipefail
          OUT="validation/history-allpairs-0ms/$ACCEPT_ID"
          mkdir -p "$OUT"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/ctl-all0-chrome.out 2>/tmp/ctl-all0-chrome.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/ctl-all0-pages.json && break; sleep .20; done

          cat >/tmp/ctl-all0.mjs <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const ID=process.env.ACCEPT_ID;
          const DIR='validation/history-allpairs-0ms/'+ID;
          const MAN=DIR+'/manifest.json';
          const result={
            ok:false,id:ID,acceptance:'FAIL',
            target:'📋 Detailed Trade Log · ALL PAIRS',
            requestedScreenshotDelayMs:0,
            desktop:{},mobile:{},screenshots:{},
            consoleErrors:[],exceptions:[],networkFailed:[],httpErrors:[]
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          let ws,seq=0;
          const pending=new Map(), urls=new Map();

          function save(name,b64){
            const buf=Buffer.from(b64,'base64');
            const path=DIR+'/'+name;
            fs.writeFileSync(path,buf);
            result.screenshots[name]={path,bytes:buf.length,sha256:hash(buf)};
          }

          try{
            const pages=JSON.parse(fs.readFileSync('/tmp/ctl-all0-pages.json','utf8'));
            const target=pages.find(x=>x.type==='page');
            if(!target?.webSocketDebuggerUrl) throw Error('NO_CDP_PAGE');

            ws=new WebSocket(target.webSocketDebuggerUrl);
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const id=++seq;
              const timer=setTimeout(()=>{pending.delete(id);reject(Error('CDP_TIMEOUT '+method));},25000);
              pending.set(id,{resolve:v=>{clearTimeout(timer);resolve(v)},reject:e=>{clearTimeout(timer);reject(e)}});
              ws.send(JSON.stringify({id,method,params}));
            });

            ws.onmessage=e=>{
              const m=JSON.parse(e.data);
              if(m.id&&pending.has(m.id)){
                const p=pending.get(m.id); pending.delete(m.id);
                m.error?p.reject(Error(JSON.stringify(m.error))):p.resolve(m.result); return;
              }
              if(m.method==='Runtime.exceptionThrown') result.exceptions.push(String(m.params?.exceptionDetails?.exception?.description||m.params?.exceptionDetails?.text||'exception'));
              if(m.method==='Runtime.consoleAPICalled'&&m.params?.type==='error') result.consoleErrors.push((m.params.args||[]).map(a=>String(a.value??a.description??'')).join(' '));
              if(m.method==='Network.requestWillBeSent') urls.set(m.params.requestId,m.params?.request?.url||'');
              if(m.method==='Network.loadingFailed'&&!m.params?.canceled) result.networkFailed.push((urls.get(m.params.requestId)||'')+' :: '+(m.params.errorText||''));
              if(m.method==='Network.responseReceived'){
                const r=m.params?.response;
                if(r&&Number(r.status)>=400) result.httpErrors.push({status:Number(r.status),url:r.url||''});
              }
            };

            await new Promise((resolve,reject)=>{
              const t=setTimeout(()=>reject(Error('CDP_OPEN_TIMEOUT')),10000);
              ws.onopen=()=>{clearTimeout(t);resolve()}; ws.onerror=reject;
            });

            await send('Runtime.enable'); await send('Network.enable'); await send('Page.enable');

            const ev=async expression=>{
              const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});
              if(r.exceptionDetails) throw Error(r.exceptionDetails.exception?.description||r.exceptionDetails.text||'EVAL');
              return r.result.value;
            };
            const j=async expression=>{
              const v=await ev(expression);
              return typeof v==='string'?JSON.parse(v):v;
            };
            async function wait(expr,timeout=50000){
              const end=Date.now()+timeout;
              while(Date.now()<end){
                try{if(await ev(expr))return true;}catch{}
                await sleep(75);
              }
              return false;
            }
            async function viewport(width,height,mobile=false){
              await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile,screenWidth:width,screenHeight:height});
            }
            async function rect(selector){
              return await j(`(()=>{
                const e=document.querySelector(${JSON.stringify(selector)});
                if(!e)return JSON.stringify(null);
                const r=e.getBoundingClientRect();
                return JSON.stringify({x:Math.max(0,r.left+scrollX),y:Math.max(0,r.top+scrollY),width:Math.max(1,r.width),height:Math.max(1,r.height)});
              })()`);
            }
            async function capture(name,clip){
              const r=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:true,clip:{x:clip.x,y:clip.y,width:clip.width,height:clip.height,scale:1}});
              save(name,r.data);
            }
            async function viewportCapture(name){
              const r=await send('Page.captureScreenshot',{format:'png',fromSurface:true,captureBeyondViewport:false});
              save(name,r.data);
            }

            async function validateCase(label,width,height,mobile){
              await viewport(width,height,mobile);
              await ev("window.scrollTo(0,0);true");

              const panel=await rect('#backtestHistoryPanel');
              const filters=await rect('#historyTypeFilters');
              if(!panel||!filters) throw Error('TARGET_MISSING_'+label);

              const sync=await j(`(()=>{
                const b=document.querySelector('#historyTypeFilters [data-history-type="all"]');
                if(!b)return JSON.stringify({ok:false,error:'ALL_BUTTON_MISSING'});
                const t0=performance.now();
                b.click();
                const t1=performance.now();
                const active=document.querySelector('#historyTypeFilters [data-history-type].active')?.dataset?.historyType||'';
                const st=window.__CTL_HISTORY_STABLE__;
                const title=document.querySelector('#backtestHistoryPanel')?.firstElementChild?.firstElementChild?.textContent||'';
                const cs=getComputedStyle(b);
                return JSON.stringify({
                  ok:true,
                  requestedDelayMs:0,
                  syncApplyMs:t1-t0,
                  mode:st?.mode||'',
                  active,
                  title,
                  animationName:cs.animationName,
                  animationDuration:cs.animationDuration,
                  transitionProperty:cs.transitionProperty,
                  transitionDuration:cs.transitionDuration
                });
              })()`);

              if(!sync.ok||sync.mode!=='all'||sync.active!=='all'||sync.title.trim()!=='📋 Detailed Trade Log · ALL PAIRS'){
                throw Error('ALL_STATE_FAIL_'+label+' '+JSON.stringify(sync));
              }
              if(sync.animationName!=='none'||sync.transitionProperty!=='none'){
                throw Error('ALL_BUTTON_ANIMATION_FAIL_'+label+' '+JSON.stringify(sync));
              }

              // Zero intentional delay: screenshot command is issued immediately after the synchronous ALL state assertion.
              const hostStart=process.hrtime.bigint();
              await capture(label+'-allpairs-0ms-panel.png',panel);
              const hostEnd=process.hrtime.bigint();
              await capture(label+'-allpairs-0ms-filters.png',filters);
              await viewportCapture(label+'-allpairs-0ms-viewport.png');

              await sleep(100);
              await capture(label+'-allpairs-100ms-panel.png',panel);
              await capture(label+'-allpairs-100ms-filters.png',filters);

              const p0=result.screenshots[label+'-allpairs-0ms-panel.png'];
              const p100=result.screenshots[label+'-allpairs-100ms-panel.png'];
              const f0=result.screenshots[label+'-allpairs-0ms-filters.png'];
              const f100=result.screenshots[label+'-allpairs-100ms-filters.png'];

              const out={
                width,height,requestedDelayMs:0,
                syncApplyMs:sync.syncApplyMs,
                screenshotCommandRoundTripMs:Number(hostEnd-hostStart)/1e6,
                mode:sync.mode,active:sync.active,title:sync.title,
                animationName:sync.animationName,
                transitionProperty:sync.transitionProperty,
                panelPixelExact0to100:p0.sha256===p100.sha256,
                filtersPixelExact0to100:f0.sha256===f100.sha256
              };
              if(!out.panelPixelExact0to100||!out.filtersPixelExact0to100){
                throw Error('PIXEL_CHANGED_0_TO_100MS_'+label+' '+JSON.stringify(out));
              }
              return out;
            }

            await viewport(2048,933,false);
            await send('Page.navigate',{url:'https://copytolive.com/dashboard/index.html?allpairs0ms='+encodeURIComponent(ID)});
            const ready=await wait("document.readyState==='complete'&&document.querySelector('#backtestHistoryPanel')&&document.querySelector('#historyTypeFilters')&&window.__CTL_NATIVE_FILTER_V51__?.ready&&window.__CTL_HISTORY_STABLE__?.render?.__ctlV51===true&&window.__CTL_HL_LEDGER_V32__?.version>=33");
            if(!ready) throw Error('HISTORY_V51_NOT_READY');

            result.runtime=await j(`JSON.stringify({
              href:location.href,
              documentTitle:document.title,
              source:window.__CTL_NATIVE_FILTER_V51__?.source||'',
              ledgerVersion:window.__CTL_HL_LEDGER_V32__?.version||0,
              accountCount:(window.__CTL_REAL_FILTERS_V36__?.accounts||[]).length,
              fills:(window.__CTL_HISTORY_STABLE__?.fills||[]).length,
              historyCount:document.getElementById('historyCount')?.textContent||'',
              status:document.getElementById('tradeLogInfo')?.textContent||''
            })`);

            result.desktop=await validateCase('desktop',2048,933,false);
            result.mobile=await validateCase('mobile',390,844,true);

            result.consoleErrors=[...new Set(result.consoleErrors)].filter(Boolean).slice(0,50);
            result.exceptions=[...new Set(result.exceptions)].filter(Boolean).slice(0,50);
            result.networkFailed=[...new Set(result.networkFailed)].filter(x=>x&&!/ERR_ABORTED|favicon/i.test(x)).slice(0,50);
            result.httpErrors=[...new Map(result.httpErrors.map(x=>[x.status+'|'+x.url,x])).values()].filter(x=>x.status!==401&&!/favicon/i.test(x.url)).slice(0,50);

            const serious=result.consoleErrors.concat(result.exceptions).filter(x=>/SyntaxError|Uncaught|already been declared/i.test(x));
            if(serious.length) throw Error('JS_ERRORS '+JSON.stringify(serious));
            if(result.networkFailed.length) throw Error('NETWORK_FAILED '+JSON.stringify(result.networkFailed));
            const badHttp=result.httpErrors.filter(x=>!((x.status===429&&/hyperliquid/i.test(x.url))||(/googleapis|gstatic/i.test(x.url)&&[403,404,429].includes(x.status))));
            if(badHttp.length) throw Error('HTTP_ERRORS '+JSON.stringify(badHttp));

            result.ok=true;
            result.acceptance='PASS';
          }catch(e){
            result.ok=false;
            result.acceptance='FAIL';
            result.error=String(e?.stack||e);
          }finally{
            try{ws?.close()}catch{}
            fs.writeFileSync(MAN,JSON.stringify(result,null,2)+'\n');
            console.log(JSON.stringify(result,null,2));
          }
          NODE

          node /tmp/ctl-all0.mjs || true
          test -s "$OUT/manifest.json"

      - name: Commit public validation evidence
        if: always()
        shell: bash
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
        run: |
          set -euo pipefail
          OUT="validation/history-allpairs-0ms/$ACCEPT_ID"
          test -s "$OUT/manifest.json"
          git config user.name "CopyToLive Public Browser Acceptance"
          git config user.email "copytolive-public-browser@local.invalid"
          git add "$OUT"
          git commit -m "validation: ALL PAIRS 0ms $ACCEPT_ID" || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$attempt"; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Enforce PASS
        if: always()
        shell: bash
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
        run: |
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("ok") else 1)' "validation/history-allpairs-0ms/$ACCEPT_ID/manifest.json"
