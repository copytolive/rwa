name: RWA Super App Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'product-os-v3.js'
      - 'legacy-canonical.js'
      - 'trade/index.html'
      - 'asset/index.html'
      - 'trader/index.html'
      - 'backtest/index.html'
      - 'renko/index.html'
      - 'suite-nav.js'
      - 'human-operability-v1.css'
      - 'rwa-8-engines/**'
      - 'tools/human-operability-browser.mjs'
      - 'tools/superapp-v5-browser-smoke.py'
      - 'tools/superapp-v5-live-browser-smoke.py'
      - 'qa/superapp-v5-harness.html'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'rwa-discovery-catalog.json'
      - 'rwa-sw-v5.js'
      - 'manifest.webmanifest'
      - 'tools/superapp-v5-audit.mjs'
      - 'tools/security-gate.mjs'
      - 'tools/superapp-v5-browser.mjs'
      - 'tools/superapp-p16-p20-audit.mjs'
      - 'tools/superapp-p16-p20-browser.mjs'
      - '.github/workflows/superapp-regression.yml'
      - '.github/workflows/pages.yml'
  push:
    branches: ['main']
    paths:
      - 'index.html'
      - 'product-os-v3.js'
      - 'legacy-canonical.js'
      - 'trade/index.html'
      - 'asset/index.html'
      - 'trader/index.html'
      - 'backtest/index.html'
      - 'renko/index.html'
      - 'suite-nav.js'
      - 'human-operability-v1.css'
      - 'rwa-8-engines/**'
      - 'tools/human-operability-browser.mjs'
      - 'tools/superapp-v5-browser-smoke.py'
      - 'tools/superapp-v5-live-browser-smoke.py'
      - 'qa/superapp-v5-harness.html'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'rwa-discovery-catalog.json'
      - 'rwa-sw-v5.js'
      - 'manifest.webmanifest'
      - 'tools/superapp-v5-audit.mjs'
      - 'tools/security-gate.mjs'
      - 'tools/superapp-v5-browser.mjs'
      - 'tools/superapp-p16-p20-audit.mjs'
      - 'tools/superapp-p16-p20-browser.mjs'
      - '.github/workflows/superapp-regression.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Static single-page contract
        run: |
          set -euo pipefail
          test -s human-operability-v1.css
          test -s rwa-8-engines/human-operability.css
          test -s tools/human-operability-browser.mjs
          node --check superapp-v5.js
          node --check legacy-canonical.js
          node --check rwa-sw-v5.js
          node --check suite-nav.js
          node --check rwa-8-engines/app.js
          node --check tools/superapp-v5-audit.mjs
          node --check tools/superapp-v5-browser.mjs
          node --check tools/human-operability-browser.mjs
          grep -Fq 'human-operability-v1.css?v=1' suite-nav.js
          grep -Fq 'human-operability.css?v=1' rwa-8-engines/app.js
          node tools/superapp-v5-audit.mjs
          python -m json.tool rwa-discovery-catalog.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: P16-P20 static product contract
        run: |
          node --check tools/superapp-p16-p20-audit.mjs
          node --check tools/superapp-p16-p20-browser.mjs
          node tools/superapp-p16-p20-audit.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve canonical /rwa/ path
        run: |
          mkdir -p /tmp/rwa-superapp-site/rwa
          cp -a . /tmp/rwa-superapp-site/rwa/
          cd /tmp/rwa-superapp-site
          python -m http.server 4173 >/tmp/rwa-superapp-http.log 2>&1 &
          echo $! >/tmp/rwa-superapp-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
      - name: Browser regression
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/superapp-v5-browser.mjs
      - name: P16-P20 product regression
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/superapp-p16-p20-browser.mjs
      - name: Human operability matrix
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/human-operability-browser.mjs
