name: RWA Renko V8 Smooth TradingView-style Gate

on:
  pull_request:
    paths:
      - 'renko/**'
      - 'tools/renko-v8-browser-smoke.mjs'
      - 'tools/renko-v8-live-smoke.mjs'
      - '.github/workflows/renko-v5-gate.yml'
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-v8-browser-smoke.mjs'
      - 'tools/renko-v8-live-smoke.mjs'
      - '.github/workflows/renko-v5-gate.yml'

permissions:
  contents: read
  statuses: write

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Static V8 contract
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v5.js
          node --check renko/renko-v8-worker.js
          node --check renko/renko-v8-smooth.js
          node --check tools/renko-v8-browser-smoke.mjs
          node --check tools/renko-v8-live-smoke.mjs
          grep -Fq "version:'8.0.0'" renko/renko-v8-smooth.js
          grep -Fq "mode:'smooth-tv-interaction'" renko/renko-v8-smooth.js
          grep -Fq "traditional:{continuationBoxes:1,reversalBoxes:2}" renko/renko-v8-smooth.js
          grep -Fq "historicalSource:'binance-1m-close-background-worker'" renko/renko-v8-smooth.js
          grep -Fq "liveSource:'binance-individual-@trade'" renko/renko-v8-smooth.js
          grep -Fq 'renko-v8-smooth.js?v=80' renko/index.html
          grep -Fq 'renko-v8-smooth.css?v=80' renko/index.html
          grep -Fq 'renko-v8-worker.js?v=80' renko/renko-v8-smooth.js
          ! grep -Fq 'renko-v61-lazy.js' renko/index.html
          ! grep -Fq 'renko-v7-tv.js' renko/index.html
          grep -Fq '@trade' renko/renko-v3.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko.log; exit 1
      - name: Smooth desktop + mobile + wheel + drag + all-market search
        run: node tools/renko-v8-browser-smoke.mjs

  live-after-main:
    if: github.event_name == 'push'
    needs: local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Pages V8
        run: |
          set -euo pipefail
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            h="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            v="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/renko-v8-smooth.js?v=$q" || true)"
            if grep -Fq 'renko-v8-smooth.js?v=80' <<<"$h" && grep -Fq "version:'8.0.0'" <<<"$v"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify real public V8 + live ticks + smooth controls
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-v8-live-smoke.mjs
      - name: Publish V8 status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-v8-e2e' -f description='V8 smooth Traditional Renko: 50 view + wheel/pinch/drag + lazy history + live @trade PASS'
