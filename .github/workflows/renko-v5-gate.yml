name: RWA Renko V5 End-to-End Gate

on:
  pull_request:
    paths:
      - 'renko/**'
      - 'tools/renko-v5-browser-smoke.mjs'
      - 'tools/renko-live-smoke.mjs'
      - '.github/workflows/renko-v5-gate.yml'
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-v5-browser-smoke.mjs'
      - 'tools/renko-live-smoke.mjs'
      - '.github/workflows/renko-v5-gate.yml'

permissions:
  contents: read
  statuses: write

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static raw-tick-only contract
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v5.js
          node --check renko/renko-v5-auto.js
          node --check renko/archive-worker-v5.js
          node --check tools/renko-v5-browser-smoke.mjs
          grep -Fq "version:'5.0.0'" renko/renko-v5.js
          grep -Fq "mode:'auto-selected-market-lifetime-raw-tick'" renko/renko-v5-auto.js
          grep -Fq '/data/spot/monthly/trades/' renko/archive-worker-v5.js
          grep -Fq '/data/spot/daily/trades/' renko/archive-worker-v5.js
          grep -Fq '@trade' renko/renko-v3.js
          grep -Fq 'TOTAL TICK HISTORY · AUTO' renko/index.html
          grep -Fq 'renko-v5-auto.js?v=51' renko/index.html
          for f in renko/renko-v5.js renko/renko-v5-auto.js renko/archive-worker-v5.js; do
            ! grep -Fq '/klines' "$f"
            ! grep -Fq '@aggTrade' "$f"
            ! grep -Fq '@kline_' "$f"
          done
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko.log; exit 1
      - name: Browser desktop + mobile + worker selftest
        run: node tools/renko-v5-browser-smoke.mjs

  live-after-main:
    if: github.event_name == 'push'
    needs: local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Pages V5
        run: |
          set -euo pipefail
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            h="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            if grep -Fq 'TOTAL TICK HISTORY · AUTO' <<<"$h" && grep -Fq 'renko-v5-auto.js?v=51' <<<"$h"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Live moving tick + real Binance Vision archive decode
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-live-smoke.mjs
      - name: Publish status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-v5-e2e' -f description='V5 raw-tick lifetime Renko end-to-end PASS'
