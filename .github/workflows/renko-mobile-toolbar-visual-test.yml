name: RENKO Mobile Toolbar Visual Test
on:
  push:
    branches:
      - fix/renko-mobile-toolbar-wrap-20260828
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          mkdir -p /tmp/site/rwa
          cp -a . /tmp/site/rwa/
          cd /tmp/site
          python3 -m http.server 8080 >/tmp/renko-mobile-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/?symbol=XAUT >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Mobile toolbar geometry and screenshot
        run: |
          mkdir -p artifacts/renko-mobile-toolbar
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const b=await chromium.launch({headless:true});
          const p=await b.newPage({viewport:{width:390,height:844}});
          await p.goto('http://127.0.0.1:8080/rwa/renko/?symbol=XAUT',{waitUntil:'domcontentloaded'});
          await p.waitForFunction(()=>window.RWARenkoTV?.state?.status==='live',null,{timeout:90000});
          const g=await p.evaluate(()=>{
            const bar=document.querySelector('.chart-toolbar');
            const br=bar.getBoundingClientRect();
            const children=[...bar.children].map(x=>({text:x.textContent.trim(),r:x.getBoundingClientRect().toJSON()}));
            const cs=getComputedStyle(bar);
            return {viewport:innerWidth,bar:{left:br.left,right:br.right,width:br.width},flexWrap:cs.flexWrap,overflowX:cs.overflowX,children};
          });
          console.log(JSON.stringify(g,null,2));
          if(g.flexWrap!=='wrap') throw new Error('toolbar not wrapping');
          for(const c of g.children){if(c.r.left<-.5||c.r.right>g.viewport+.5)throw new Error('clipped child '+c.text+' '+JSON.stringify(c.r));}
          await p.screenshot({path:'artifacts/renko-mobile-toolbar/mobile.png',fullPage:true});
          await b.close();
          NODE
      - name: XAUT provider browser regression
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_XAUT_OUT=artifacts/renko-mobile-toolbar/provider node tools/renko-xaut-live-provider-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-mobile-toolbar-${{ github.sha }}
          path: artifacts/renko-mobile-toolbar
