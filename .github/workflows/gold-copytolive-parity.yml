name: GOLD CopyToLive Parity Backtest

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: Dukascopy GOLD H1 start date
        required: false
        default: '2003-05-05'
      to_date:
        description: Dukascopy GOLD H1 end date (exclusive)
        required: false
        default: '2026-08-28'
      mc_sims:
        description: Monte Carlo simulations per strategy
        required: false
        default: '1000'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/gold-copytolive-parity.yml'
      - 'backtest/copytolive_gold/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold-copytolive-parity
  cancel-in-progress: true

jobs:
  parity:
    name: Replay 118 active CopyToLive GOLD strategies
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FROM_DATE: ${{ github.event.inputs.from_date || '2003-05-05' }}
      TO_DATE: ${{ github.event.inputs.to_date || '2026-08-28' }}
      MC_SIMS: ${{ github.event.inputs.mc_sims || '1000' }}
      DATA_DIR: ${{ github.workspace }}/.cache/copytolive-gold-h1
      DATA_FILE: ${{ github.workspace }}/.cache/copytolive-gold-h1/GOLD_H1.csv
      OUT_DIR: ${{ github.workspace }}/backtest/copytolive_gold/runtime

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parity dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2,<3" "pandas>=2.2,<3" "pyarrow>=17,<30" "TA-Lib>=0.6,<0.7"
          npm install --no-save --ignore-scripts dukascopy-node@1.50.0

      - name: Unit-test exact CopyToLive execution contract
        run: |
          set -euo pipefail
          python backtest/copytolive_gold/test_engine.py

      - name: Cache Dukascopy GOLD H1 dataset
        uses: actions/cache@v4
        with:
          path: |
            .cache/copytolive-gold-h1
            .dukascopy-cache-copytolive-gold
          key: copytolive-gold-h1-v1-${{ env.FROM_DATE }}-${{ env.TO_DATE }}

      - name: Fetch canonical hosted-runner GOLD H1 if cache is empty
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          if [ ! -s "$DATA_FILE" ]; then
            node backtest/copytolive_gold/fetch_dukascopy_h1.cjs "$DATA_FILE" "$FROM_DATE" "$TO_DATE"
          else
            echo "Using cached $DATA_FILE"
          fi
          python - <<'PY'
          import hashlib, os, pandas as pd
          p=os.environ['DATA_FILE']
          d=pd.read_csv(p)
          assert len(d) > 10000, len(d)
          assert {'Date','open','high','low','close'}.issubset(d.columns)
          print({
              'rows':len(d),
              'start':d['Date'].iloc[0],
              'end':d['Date'].iloc[-1],
              'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),
          })
          PY

      - name: Replay all 118 production strategy scripts
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          python backtest/copytolive_gold/engine.py             --data "$DATA_FILE"             --out-dir "$OUT_DIR"             --mc-sims "$MC_SIMS"

      - name: Acceptance gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, pathlib
          out=pathlib.Path(os.environ['OUT_DIR'])
          p=out/'copytolive_gold_replay.json'
          c=out/'copytolive_gold_replay.csv'
          assert p.is_file() and c.is_file()
          x=json.loads(p.read_text())
          rows=list(csv.DictReader(c.open()))
          assert x['status']=='PASS'
          assert x['profile']=='copytolive-gold-parity-v1'
          assert int(x['strategies_input'])==118
          assert len(rows)==118
          assert int(x['dataset_rows'])>10000
          assert float(x['contract']['deposit_usd'])==10000.0
          assert float(x['contract']['risk_usd_per_trade'])==200.0
          assert abs(float(x['contract']['fee_rate'])-0.0016)<1e-12
          assert x['contract']['entry']=='signal_bar_close'
          assert x['contract']['intrabar_priority']=='SL_BEFORE_TP'
          assert x['contract']['walk_forward']=='70/30'
          assert all(r['Python Script'].startswith('strategies/scripts/python/GOLD/') for r in rows)
          assert all(r['MT5 Script']=='NOT PRESENT' for r in rows)
          print(json.dumps({
              'status':x['status'],
              'strategies_input':x['strategies_input'],
              'base_gate_pass':x['base_gate_pass'],
              'monte_carlo_pass':x['monte_carlo_pass'],
              'corr_kept':x['corr_kept'],
              'strict_final_pass':x['strict_final_pass'],
              'dataset_rows':x['dataset_rows'],
              'dataset_sha256':x['dataset_sha256'],
          }, indent=2))
          PY

      - name: Publish latest replay evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             backtest/copytolive_gold/runtime/copytolive_gold_replay.json             backtest/copytolive_gold/runtime/copytolive_gold_replay.csv
          if git diff --cached --quiet; then
            echo "No replay delta"
            exit 0
          fi
          git commit -m "chore(backtest): publish CopyToLive GOLD parity replay [skip ci]"
          for TRY in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "publish PASS try=$TRY"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((TRY * 2))
          done
          exit 1

      - name: Upload replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-copytolive-parity-${{ github.run_id }}
          path: |
            backtest/copytolive_gold/runtime/copytolive_gold_replay.json
            backtest/copytolive_gold/runtime/copytolive_gold_replay.csv
          if-no-files-found: error
          retention-days: 90
