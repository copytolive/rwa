name: Verify Social Deployment

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check app.js
          node --check mobile.js
          grep -q "RWA SOCIAL" index.html
          grep -q "social-screen" mobile.css
      - name: Verify production
        run: |
          ok=0
          for i in {1..12}; do
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/?verify=${GITHUB_RUN_ID}-${i}" | grep -q "RWA SOCIAL"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "SOCIAL MOBILE DEPLOYMENT SUCCESS. Source syntax valid and RWA SOCIAL verified on production: https://narzulalistiqlal.github.io/rwa/"
