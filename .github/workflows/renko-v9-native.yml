name: Renko V9 Native TradingView Interaction Gate

on:
  pull_request:
    paths:
      - 'renko/**'
      - 'tools/renko-v9-browser-smoke.mjs'
      - 'tools/renko-v9-live-smoke.mjs'
      - '.github/workflows/renko-v9-native.yml'
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-v9-browser-smoke.mjs'
      - 'tools/renko-v9-live-smoke.mjs'
      - '.github/workflows/renko-v9-native.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V9 source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v5.js
          node --check renko/renko-v8-worker.js
          node --check renko/renko-v9-lwc.js
          node --check tools/renko-v9-browser-smoke.mjs
          node --check tools/renko-v9-live-smoke.mjs
          grep -Fq "version:'9.1.0'" renko/renko-v9-lwc.js
          grep -Fq "mode:'native-lightweight-charts'" renko/renko-v9-lwc.js
          grep -Fq "renderer:'tradingview-lightweight-charts-5.1'" renko/renko-v9-lwc.js
          grep -Fq "traditional:{continuationBoxes:1,reversalBoxes:2}" renko/renko-v9-lwc.js
          grep -Fq "historicalSource:'binance-1m-close-background-worker'" renko/renko-v9-lwc.js
          grep -Fq "liveSource:'binance-individual-@trade'" renko/renko-v9-lwc.js
          grep -Fq 'vendor/lightweight-charts-5.1.0.production.js?v=510' renko/index.html
          grep -Fq 'TradingView Lightweight Charts™ v5.1.0' renko/vendor/lightweight-charts-5.1.0.production.js
          grep -Fq 'renko-v9-lwc.js?v=92' renko/index.html
          grep -Fq 'renko-v3.js?v=31' renko/index.html
          grep -Fq 'renko-v9-lwc.css?v=91' renko/index.html
          grep -Fq 'TradingView Lightweight Charts' renko/index.html
          ! grep -Fq 'renko-v8-smooth.js' renko/index.html
          ! grep -Fq 'renko-v8-controls.js' renko/index.html
          grep -Fq '@trade' renko/renko-v3.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify vendored Lightweight Charts
        run: |
          test "$(sha256sum renko/vendor/lightweight-charts-5.1.0.production.js | cut -d' ' -f1)" = '756b0ba9f58930226d6b8b9d47ad310448ab85d799ea1f7c2c02304777c10b52'
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko-v9.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/renko-v9.log
          exit 1
      - name: Native Chromium interaction + lazy history + pair switch
        run: node tools/renko-v9-browser-smoke.mjs

  public-e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for public Pages V9
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            q="${GITHUB_RUN_ID}-${i}"
            h="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            v="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/renko-v9-lwc.js?v=$q" || true)"
            if grep -Fq 'renko-v9-lwc.js?v=92' <<<"$h" && grep -Fq "version:'9.1.0'" <<<"$v"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify real public V9 native interaction
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-v9-live-smoke.mjs
      - name: Publish V9 success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-v9-e2e' -f description='V9 native Lightweight Charts: kinetic pan/zoom + 50 view + lazy history + live @trade PASS'
