name: RENKO XAUT Fixed 1s Depth Probe
on:
  push:
    branches:
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - '.github/workflows/renko-xaut-bulk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Gate XAUT fixed 1s REST and archive
        shell: bash
        run: |
          set -euo pipefail
          echo '--- Gate latest 1s REST ---'
          curl -fsS 'https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=XAUT_USDT&interval=1s&limit=10' -o /tmp/latest.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/latest.json'))
          print('rows',len(a),'first',a[0] if a else None,'last',a[-1] if a else None)
          PY
          echo '--- Gate historical 1s REST about 12 days back ---'
          now=$(date +%s)
          to=$((now-12*86400))
          from=$((to-999))
          curl -fsS "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=XAUT_USDT&interval=1s&from=$from&to=$to" -o /tmp/old.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/old.json'))
          print('rows',len(a),'first',a[0] if a else None,'last',a[-1] if a else None)
          PY
          echo '--- Gate daily 1s archive variants ---'
          d=$(date -u -d '2 days ago' +%Y%m%d)
          ym=${d:0:6}
          for url in \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-$d.csv.gz" \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-$ym.csv.gz" \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-${ym}01.csv.gz"; do
            code=$(curl -L -sS -o /tmp/a.gz -w '%{http_code}' "$url" || true)
            bytes=$(wc -c </tmp/a.gz 2>/dev/null || echo 0)
            echo "$code $bytes $url"
            if [[ "$code" == 200 && "$bytes" -gt 100 ]]; then
              gzip -dc /tmp/a.gz >/tmp/a.csv
              echo "lines=$(wc -l </tmp/a.csv)"
              head -n 2 /tmp/a.csv
              tail -n 2 /tmp/a.csv
            fi
          done
