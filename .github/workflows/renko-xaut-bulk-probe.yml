name: RENKO XAUT Fixed 1s Depth Probe
on:
  push:
    branches:
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - '.github/workflows/renko-xaut-bulk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe OKX XAUT-USDT fixed 1s history
        shell: bash
        run: |
          set -euo pipefail
          echo '--- instrument ---'
          curl -fsS 'https://www.okx.com/api/v5/public/instruments?instType=SPOT&instId=XAUT-USDT' | tee /tmp/inst.json
          echo
          echo '--- ticker ---'
          curl -fsS 'https://www.okx.com/api/v5/market/ticker?instId=XAUT-USDT' | tee /tmp/ticker.json
          echo
          nowms=$(( $(date +%s) * 1000 ))
          for age in 0 3600 86400 604800 1036800 5184000; do
            target=$((nowms-age*1000))
            url="https://www.okx.com/api/v5/market/history-candles?instId=XAUT-USDT&bar=1s&after=$target&limit=5"
            code=$(curl -sS -o /tmp/c.json -w '%{http_code}' "$url")
            echo "AGE=$age HTTP=$code CODE=$(jq -r '.code' /tmp/c.json) MSG=$(jq -r '.msg' /tmp/c.json) ROWS=$(jq '.data|length' /tmp/c.json) FIRST=$(jq -c '.data[0]' /tmp/c.json) LAST=$(jq -c '.data[-1]' /tmp/c.json)"
          done
          test "$(jq -r '.code' /tmp/inst.json)" = 0
          test "$(jq '.data|length' /tmp/inst.json)" -gt 0
