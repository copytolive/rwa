name: RENKO XAUT Gate Bulk Probe
on:
  push:
    branches:
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - '.github/workflows/renko-xaut-bulk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe XAUT daily 1m archive and CORS
        shell: bash
        run: |
          set -euo pipefail
          url='https://download.gatedata.org/spot/candlesticks_1m/202607/XAUT_USDT-20260731.csv.gz'
          echo "URL=$url"
          curl -sSIL "$url" | tee /tmp/headers
          grep -iE '^(access-control-allow-origin|content-type|content-length|etag|last-modified):' /tmp/headers || true
          curl -fL --retry 3 --retry-delay 1 "$url" -o /tmp/xaut.csv.gz
          gzip -dc /tmp/xaut.csv.gz >/tmp/xaut.csv
          echo "compressed=$(wc -c </tmp/xaut.csv.gz) lines=$(wc -l </tmp/xaut.csv)"
          head -n 3 /tmp/xaut.csv
          tail -n 3 /tmp/xaut.csv
