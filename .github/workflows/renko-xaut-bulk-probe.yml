name: RENKO XAUT Provider Depth Probe
on:
  push:
    branches:
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - '.github/workflows/renko-xaut-bulk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Bitfinex XAUT spot symbols and history
        shell: bash
        run: |
          set -euo pipefail
          echo '--- XAUT pairs from Bitfinex config ---'
          curl -fsS 'https://api-pub.bitfinex.com/v2/conf/pub:list:pair:exchange' -o /tmp/pairs.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/pairs.json'))
          pairs=x[0] if x and isinstance(x[0],list) else []
          print([p for p in pairs if 'XAUT' in p])
          PY
          for sym in 'tXAUTUSD' 'tXAUTUST' 'tXAUT:UST'; do
            echo "--- $sym ticker ---"
            curl -sS -w '\nHTTP=%{http_code}\n' "https://api-pub.bitfinex.com/v2/ticker/$sym" || true
            echo "--- $sym first 1m from Jan 2020 ---"
            curl -sS -w '\nHTTP=%{http_code}\n' "https://api-pub.bitfinex.com/v2/candles/trade:1m:$sym/hist?start=1577836800000&end=1609459200000&sort=1&limit=5" || true
          done
