name: RENKO XAUT Fixed 1s Depth Probe
on:
  push:
    branches:
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - '.github/workflows/renko-xaut-bulk-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure Gate XAUT fixed 1s retention and archive
        shell: bash
        run: |
          set -u
          root='https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=XAUT_USDT&interval=1s'
          now=$(date +%s)
          for age in 0 3600 86400 604800 1036800; do
            to=$((now-age)); from=$((to-999))
            code=$(curl -sS -o /tmp/r.json -w '%{http_code}' "$root&from=$from&to=$to" || true)
            echo "AGE=$age HTTP=$code BODY=$(cat /tmp/r.json | head -c 500)"
            if [[ "$code" == 200 ]]; then python3 - <<'PY'
import json
x=json.load(open('/tmp/r.json')); print('rows',len(x),'first',x[0] if x else None,'last',x[-1] if x else None)
PY
            fi
          done
          echo '--- Gate daily 1s archive variants ---'
          d=$(date -u -d '2 days ago' +%Y%m%d); ym=${d:0:6}
          for url in \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-$d.csv.gz" \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-$ym.csv.gz" \
            "https://download.gatedata.org/spot/candlesticks_1s/$ym/XAUT_USDT-${ym}01.csv.gz"; do
            code=$(curl -L -sS -o /tmp/a.gz -w '%{http_code}' "$url" || true)
            bytes=$(wc -c </tmp/a.gz 2>/dev/null || echo 0)
            echo "$code $bytes $url"
            if [[ "$code" == 200 && "$bytes" -gt 100 ]]; then
              gzip -dc /tmp/a.gz >/tmp/a.csv
              echo "lines=$(wc -l </tmp/a.csv)"
              head -n 2 /tmp/a.csv; tail -n 2 /tmp/a.csv
            fi
          done
