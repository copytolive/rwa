name: RWA Safe Runtime Candidate Promotion

on:
  push:
    branches: [main]
    paths:
      - 'agent-worker/public-config.json'
      - 'agent-worker/control.json'
      - 'rwa-commerce-config.json'
      - 'tools/worker-candidate-probe.mjs'
      - 'tools/commerce-candidate-probe.mjs'
      - 'tools/promote-runtime-candidates.mjs'
      - '.github/workflows/runtime-candidate-promotion.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: rwa-runtime-candidate-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate promotion guard
        run: |
          set -euo pipefail
          node --check tools/worker-candidate-probe.mjs
          node --check tools/commerce-candidate-probe.mjs
          node --check tools/promote-runtime-candidates.mjs
          python -m json.tool agent-worker/public-config.json >/dev/null
          python -m json.tool agent-worker/control.json >/dev/null
          python -m json.tool rwa-commerce-config.json >/dev/null
          grep -Fq '"mainnet_enabled": false' agent-worker/control.json

      - name: Probe and safely promote independently
        run: |
          set -euo pipefail
          ARGS=()
          if node tools/worker-candidate-probe.mjs --require-live; then
            ARGS+=(--worker)
          else
            echo 'Worker candidate not ready; no promotion.'
          fi
          if node tools/commerce-candidate-probe.mjs --require-live; then
            ARGS+=(--commerce)
          else
            echo 'Commerce candidate not ready; no promotion.'
          fi
          if [ "${#ARGS[@]}" -gt 0 ]; then
            node tools/promote-runtime-candidates.mjs "${ARGS[@]}"
          fi
          grep -Fq '"mainnet_enabled": false' agent-worker/control.json

      - name: Commit proven runtime activation
        run: |
          set -euo pipefail
          if git diff --quiet -- agent-worker/public-config.json agent-worker/control.json rwa-commerce-config.json; then
            echo 'No runtime promotion change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-worker/public-config.json agent-worker/control.json rwa-commerce-config.json
          git commit -m 'launch: promote publicly proven TESTNET runtimes [skip ci]'
          git push origin HEAD:main
