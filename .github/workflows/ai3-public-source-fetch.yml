name: AI3 Public Source Fetch

on:
  push:
    branches: [main]
    paths:
      - "ai3-public-source-requests/**"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-public-source-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai3-public-source-results/$ID" >> "$GITHUB_OUTPUT"
      - name: Fetch production source
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"; mkdir -p "$OUT"
          curl -fsSL -H 'Cache-Control: no-cache' "https://copytolive.com/?source-audit=${{ steps.req.outputs.id }}" -o "$OUT/index.html"
          python3 - <<'PY' "$OUT"
          import json,re,sys,pathlib
          out=pathlib.Path(sys.argv[1]); s=(out/"index.html").read_text(errors="ignore")
          scripts=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',s,re.I)
          links=re.findall(r'<link[^>]+href=["\x27]([^"\x27]+)',s,re.I)
          summary={"bytes":len(s.encode()),"scripts":scripts,"links":links,"has_ai3_public_shell":any("ai3_public_shell" in x for x in scripts),"has_githubio":any("github.io" in x for x in scripts+links)}
          (out/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          PY
      - name: Commit fetched public source
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          git config user.name "CopyToLive AI3 Source Audit"
          git config user.email "copytolive-ai3-source@local.invalid"
          git add "$OUT"
          git commit -m "ai3 public source: ${{ steps.req.outputs.id }}"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$n"
          done
          exit 1
