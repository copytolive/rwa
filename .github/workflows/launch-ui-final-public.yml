name: RWA Launch UI Final Public

on:
  workflow_run:
    workflows: ["Deploy RWA to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-matrix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout deployed SHA
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current main for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify exact deployed SHA and public bytes
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 20); do
            DEPLOYED="$(curl -fsSL -H 'Cache-Control: no-cache' "https://copytolive.github.io/rwa/deployment-sha.txt?proof=$RANDOM" | tr -d '\r\n' || true)"
            if [ "$DEPLOYED" = "$EXPECTED_SHA" ]; then exit 0; fi
            echo "waiting for exact Pages SHA: expected=$EXPECTED_SHA got=$DEPLOYED"
            sleep 5
          done
          exit 1

      - name: Run public desktop mobile stress startup matrix
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/launch-ui-final-public
        run: node tools/launch-ui-final-browser.mjs

      - name: Upload public launch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-ui-final-public-${{ github.run_id }}
          path: proof/launch-ui-final-public/
          if-no-files-found: warn
          retention-days: 30
