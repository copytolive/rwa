name: AI7 Canonical GOLD Production Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai7-canonical-gold-cert.yml"
      - "backtest/gold24/AI7_CANONICAL_CERT_KICK"

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout corrected producer parity branch
        uses: actions/checkout@v4
        with:
          repository: copytolive/rwa
          ref: ai7-copytolive-producer-parity-clean-20260903
          path: cert
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install replay dependencies
        working-directory: cert
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backtest/gold24/requirements.txt
          python -m pip install "TA-Lib>=0.6,<0.7"

      - name: Fetch exact production GOLD H1 and D1
        env:
          SSH_HOST: 109.123.239.76
          SSH_USER: root
          SSH_PORT: "22"
          SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          mkdir -p "$HOME/.ssh" cert/.canonical-gold
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai7_cert"
          chmod 600 "$HOME/.ssh/ai7_cert"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          BASE="/home/opentrue-platform/backend/trading-service/data/ohlcv"
          scp -q -i "$HOME/.ssh/ai7_cert" -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$BASE/GOLD_H1.parquet" cert/.canonical-gold/GOLD_H1.parquet
          scp -q -i "$HOME/.ssh/ai7_cert" -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$BASE/GOLD_D1.parquet" cert/.canonical-gold/GOLD_D1.parquet
          rm -f "$HOME/.ssh/ai7_cert"
          test -s cert/.canonical-gold/GOLD_H1.parquet
          test -s cert/.canonical-gold/GOLD_D1.parquet

      - name: Validate source lock and replay engine
        working-directory: cert
        run: |
          set -euo pipefail
          python -m unittest -v backtest.gold24.test_copytolive_compat
          python -m py_compile backtest/gold24/copytolive_active_replay.py
          python - <<'PY'
          import json,hashlib,pathlib
          m=json.loads(pathlib.Path("backtest/gold24/copytolive_active_gold_manifest.json").read_text())
          s=json.loads(pathlib.Path("backtest/gold24/copytolive_gold_strategy_sources.json").read_text())
          assert m["snapshot"]["active_gold_count"]==118
          assert m["snapshot"]["timeframe_counts"]=={"H1":118}
          assert len(m["strategies"])==118 and len(s["scripts"])==118
          assert s["farm_sha256"]==m["snapshot"]["farm_sha256"]
          assert s["state_sha256"]==m["snapshot"]["state_sha256"]
          for row in m["strategies"]:
              sid=row["id"]
              assert hashlib.sha256(s["scripts"][sid].encode()).hexdigest()==row["source_script"]["sha256"]
          print("SOURCE LOCK PASS 118/118")
          PY

      - name: Replay exact 118 on canonical production H1/D1
        working-directory: cert
        run: |
          set -euo pipefail
          rm -rf backtest/gold24/runtime_ai7_canonical_cert
          python backtest/gold24/copytolive_active_replay.py             --dataset .canonical-gold/GOLD_H1.parquet             --d1-dataset .canonical-gold/GOLD_D1.parquet             --manifest backtest/gold24/copytolive_active_gold_manifest.json             --sources backtest/gold24/copytolive_gold_strategy_sources.json             --out-dir backtest/gold24/runtime_ai7_canonical_cert

      - name: Build and enforce 118/118 parity
        working-directory: cert
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          out=pathlib.Path("backtest/gold24/runtime_ai7_canonical_cert")
          x=json.loads((out/"latest_copytolive_active_replay.json").read_text())
          rows=x.get("ranking") or x.get("rows") or []
          assert len(rows)==118, len(rows)
          tolerances={
              "totalTrades":0.0,
              "winRate":0.11,
              "profitFactor":0.011,
              "netProfit":0.51,
              "maxDrawdownPercent":0.11,
              "sqn":0.011,
              "recoveryFactor":0.011,
              "wf_test_pf":0.011,
          }
          by={k:0 for k in tolerances}; max_abs={k:0.0 for k in tolerances}; worst={k:None for k in tolerances}; exact=0
          for row in rows:
              ok=True
              parity=row.get("parity_delta") or {}
              for key,tol in tolerances.items():
                  item=parity.get(key)
                  if item is None:
                      ok=False
                      continue
                  delta=abs(float(item["delta"]))
                  if delta<=tol: by[key]+=1
                  else: ok=False
                  if delta>max_abs[key]:
                      max_abs[key]=delta
                      worst[key]={"strategy_id":row.get("strategy_id"),"expected":item.get("expected"),"actual":item.get("actual"),"delta":item.get("delta")}
              exact+=int(ok)
          report={
              "status":"PASS" if exact==118 else "PARITY_MISMATCH",
              "strategies":118,
              "exact_all_metrics":exact,
              "parity_by_metric":by,
              "max_abs_delta":max_abs,
              "worst_delta":worst,
              "dataset":x["dataset"],
              "d1_dataset":x["d1_dataset"],
              "source":x["source"],
              "execution_contract":x["execution_contract"],
              "producer_reference":x.get("producer_reference"),
              "producer_filter_modes":x.get("producer_filter_modes"),
              "strict_gate_counts":{
                  "pre_corr_pass_count":x["pre_corr_pass_count"],
                  "corr_kept_count":x["corr_kept_count"],
                  "hard_pass_count":x["hard_pass_count"],
              },
          }
          (out/"copytolive_production_parity.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          assert report["status"]=="PASS", report
          assert report["exact_all_metrics"]==118, report
          PY

      - name: Comment certification report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require("fs");
            const p="cert/backtest/gold24/runtime_ai7_canonical_cert/copytolive_production_parity.json";
            let body="## AI7 Canonical GOLD Production Certification\n\n";
            if (fs.existsSync(p)) {
              const x=JSON.parse(fs.readFileSync(p,"utf8"));
              body += "Status: **"+x.status+"** — exact metrics **"+x.exact_all_metrics+"/118**\n\n";
              body += "\`\`\`json\n"+JSON.stringify(x,null,2).slice(0,55000)+"\n\`\`\`";
            } else {
              body += "Parity report was not produced. Inspect the failed workflow step.";
            }
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:context.issue.number,
              body
            });

      - name: Upload canonical certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai7-canonical-gold-cert-${{ github.run_id }}
          path: cert/backtest/gold24/runtime_ai7_canonical_cert
          if-no-files-found: warn
          retention-days: 90
