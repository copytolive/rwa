name: Seablueprint Ecommerce Public Smoke

on:
  workflow_run:
    workflows: ["Deploy RWA to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout deployed SHA
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout current main for manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed public Seablueprint shell
        env:
          RWA_PUBLIC_URL: https://copytolive.github.io/rwa/
          RWA_PUBLIC_PROOF_DIR: proof/seablueprint-commerce-public
        run: node tools/seablueprint-commerce-public-smoke.mjs

      - name: Upload public proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seablueprint-commerce-public-${{ github.run_id }}
          path: proof/seablueprint-commerce-public/
          if-no-files-found: warn
          retention-days: 30
