name: RWA Global Chrome Persistence

on:
  push:
    branches:
      - fix/global-chrome-persistence-20260827
      - main
    paths:
      - 'persistent-market-operability-patch-v1.css'
      - 'persistent-market-shell-v3.css'
      - 'market-performance.js'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'tools/global-chrome-persistence-browser.mjs'
      - 'tools/persistent-market-shell-v3-browser.mjs'
      - '.github/workflows/global-chrome-persistence.yml'
  pull_request:
    paths:
      - 'persistent-market-operability-patch-v1.css'
      - 'persistent-market-shell-v3.css'
      - 'market-performance.js'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'tools/global-chrome-persistence-browser.mjs'
      - 'tools/persistent-market-shell-v3-browser.mjs'
      - '.github/workflows/global-chrome-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static contract
        run: |
          node --check tools/global-chrome-persistence-browser.mjs
          node --check tools/persistent-market-shell-v3-browser.mjs
          grep -Fq 'GLOBAL CHROME PERSISTENCE V3' persistent-market-operability-patch-v1.css
          grep -Fq 'position:fixed' persistent-market-operability-patch-v1.css
          grep -Fq 'z-index:9950' persistent-market-operability-patch-v1.css
          grep -Fq 'z-index:9900' persistent-market-operability-patch-v1.css
          grep -Fq 'top:94px' persistent-market-operability-patch-v1.css
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve canonical app
        run: |
          mkdir -p /tmp/rwa-global-chrome/rwa
          cp -a . /tmp/rwa-global-chrome/rwa/
          cd /tmp/rwa-global-chrome
          python -m http.server 4173 >/tmp/rwa-global-chrome-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
      - name: Existing persistent market contract
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/persistent-market-shell-v3-browser.mjs
      - name: Header and workflow rail persistence
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        run: node tools/global-chrome-persistence-browser.mjs
