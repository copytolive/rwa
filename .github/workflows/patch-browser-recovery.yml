name: Patch Browser Recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-browser-recovery.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove parser-blocking TradingView and install recovery layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Never let the third-party TradingView widget participate in the document load event.
          pat=r'<div id="tvHost" class="tv-host"><div class="tradingview-widget-container".*?</script></div></div>'
          s2,n=re.subn(pat,'<div id="tvHost" class="tv-host"></div>',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'TradingView static block match count={n}')
          # Install recovery after app.js defines loadTradingView and before mobile bootstrap calls it.
          pat2=r'(<script src="app\.js\?v=\d+"></script>)\s*(<script src="mobile\.js\?v=\d+"></script>)'
          rep=r'\1\n<script src="browser-recovery.js?v=1"></script>\n\2'
          s3,n2=re.subn(pat2,rep,s2,count=1)
          if n2!=1:
              raise SystemExit(f'app/mobile script match count={n2}')
          # Fresh asset versions prevent the affected browser from reusing the stale bootstrap.
          s3=re.sub(r'app\.js\?v=\d+','app.js?v=9',s3)
          s3=re.sub(r'mobile\.js\?v=\d+','mobile.js?v=10',s3)
          p.write_text(s3)
          PY
          node --check app.js
          node --check mobile.js
          node --check browser-recovery.js
          grep -Fq 'browser-recovery.js?v=1' index.html
          ! grep -Fq 'external-embedding/embed-widget-advanced-chart.js" async>{' index.html
      - name: Commit and self-remove
        run: |
          rm .github/workflows/patch-browser-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html browser-recovery.js .github/workflows/patch-browser-recovery.yml
          git commit -m 'fix: prevent stuck browser loading from TradingView'
          git push
