name: GOLD24 Qualified Native MetaQuotes MT5 Certification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-qualified-mt5-metaquotes-certification.yml'
      - 'backtest/gold24/qualified_scripts/**'
      - 'backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv'
      - 'backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv'

permissions:
  contents: read
  actions: read

concurrency:
  group: gold24-qualified-mt5-metaquotes-certification
  cancel-in-progress: true

env:
  STATE_DIR: ${{ github.workspace }}/.gold24-canonical-v11
  GH_TOKEN: ${{ github.token }}

jobs:
  canonical-python-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GOLD24 dependencies
        run: pip install -r backtest/gold24/requirements.txt
      - name: Restore exact latest canonical state artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR" "$RUNNER_TEMP/qstate"
          mkdir -p "$STATE_DIR" "$RUNNER_TEMP/qstate"
          read -r SOURCE_RUN SOURCE_ATTEMPT < <(python - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('backtest/gold24/runtime_v11/latest_validation_summary.json').read_text())
          print(x['github_run_id'],x.get('github_run_attempt','1'))
          PY
          )
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > "$RUNNER_TEMP/arts.json"
          URL="$(python - "$RUNNER_TEMP/arts.json" "$SOURCE_ATTEMPT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]));attempt=max(1,int(sys.argv[2]))
          a=[z for z in x['artifacts'] if z['name']=='gold24-canonical-v11-state' and not z['expired']]
          a=sorted(a,key=lambda z:z.get('created_at',''))
          assert len(a)>=attempt,(len(a),attempt)
          print(a[attempt-1]['archive_download_url'])
          PY
          )"
          curl -L --fail --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$URL" -o "$RUNNER_TEMP/state.zip"
          unzip -q "$RUNNER_TEMP/state.zip" -d "$RUNNER_TEMP/qstate"
          cp -a "$RUNNER_TEMP/qstate/." "$STATE_DIR/"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"
      - name: Exact canonical parity for exact selected Python method set
        run: python backtest/gold24/qualified_scripts/validate_qualified_scripts.py --state-dir "$STATE_DIR" --out "$RUNNER_TEMP/qualified_scripts_validation.json"
      - name: Upload Python parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-metaquotes-python-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/qualified_scripts_validation.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish canonical D1 for native MetaQuotes certification
        uses: actions/upload-artifact@v4
        with:
          name: gold24-metaquotes-canonical-d1-${{ github.run_id }}
          path: ${{ env.STATE_DIR }}/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
          if-no-files-found: error
          retention-days: 1

  native-metaquotes-mt5-tester:
    needs: canonical-python-parity
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download certified canonical D1
        uses: actions/download-artifact@v4
        with:
          name: gold24-metaquotes-canonical-d1-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical
      - name: Prepare MT5 canonical CSV
        shell: powershell
        run: |
          $dataset=Join-Path $env:RUNNER_TEMP 'canonical\GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv'
          if(!(Test-Path $dataset)){throw "canonical dataset missing $dataset"}
          python backtest/gold24/qualified_scripts/prepare_mt5_canonical.py --input $dataset --output "$env:RUNNER_TEMP\gold24_canonical_d1_mt5.csv" --expected-rows 6500
      - name: Install official MetaQuotes MT5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $setup
          $installer=Start-Process -FilePath $setup -ArgumentList '/auto' -PassThru
          $terminal=$null
          $deadline=(Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 10
            $c=@()
            foreach($r in @('C:\Program Files','C:\Program Files (x86)',"$env:LOCALAPPDATA\Programs")){
              if(Test-Path $r){$c+=Get-ChildItem $r -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue}
            }
            $terminal=($c|Sort-Object LastWriteTime -Descending|Select-Object -First 1).FullName
            if(-not [string]::IsNullOrWhiteSpace($terminal)){break}
          } while((-not $installer.HasExited) -and (Get-Date) -lt $deadline)
          if(-not $installer.HasExited){
            Write-Host 'MetaQuotes installer bootstrap exceeded bounded wait; stopping installer process after terminal discovery/check'
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
          }
          if([string]::IsNullOrWhiteSpace($terminal)){
            $c=@()
            foreach($r in @('C:\Program Files','C:\Program Files (x86)',"$env:LOCALAPPDATA\Programs")){
              if(Test-Path $r){$c+=Get-ChildItem $r -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue}
            }
            $terminal=($c|Sort-Object LastWriteTime -Descending|Select-Object -First 1).FullName
          }
          if([string]::IsNullOrWhiteSpace($terminal)){throw 'MetaQuotes terminal64.exe not found after bounded installer bootstrap'}
          $meta=Join-Path (Split-Path $terminal) 'metaeditor64.exe'
          if(!(Test-Path $meta)){throw 'MetaQuotes metaeditor64.exe missing'}
          "MT5_TERMINAL=$terminal"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_META=$meta"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "METAQUOTES_TERMINAL=$terminal"
      - name: Bootstrap real MetaQuotes demo account context
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP 'metaquotes-mt5-evidence';New-Item -ItemType Directory -Force $evidence|Out-Null
          "MT5_EVIDENCE=$evidence"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public class NativeGold24 {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindowAsync(IntPtr hWnd, int nCmdShow);
          }
          '@
          function Elements {
            return [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.Condition]::TrueCondition)
          }
          function FindElement([string]$nameRegex,[string]$typeRegex='.*'){
            foreach($el in (Elements)){
              try{
                if($el.Current.Name -match $nameRegex -and $el.Current.ControlType.ProgrammaticName -match $typeRegex){return $el}
              }catch{}
            }
            return $null
          }
          function DumpUi([string]$tag){
            $out=Join-Path $evidence ("ui-"+$tag+".txt")
            foreach($el in (Elements)){
              try{
                $n=$el.Current.Name;$t=$el.Current.ControlType.ProgrammaticName;$a=$el.Current.AutomationId
                if(-not [string]::IsNullOrWhiteSpace($n) -or -not [string]::IsNullOrWhiteSpace($a)){"type=$t id=$a name=$n"|Out-File $out -Append -Encoding utf8}
              }catch{}
            }
            try{
              $b=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp=New-Object System.Drawing.Bitmap $b.Width,$b.Height
              $g=[System.Drawing.Graphics]::FromImage($bmp);$g.CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
              $bmp.Save((Join-Path $evidence ("screen-"+$tag+".png")),[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose()
            }catch{"screenshot_error=$($_.Exception.Message)"|Out-File $out -Append}
          }
          function InvokeButton([string]$regex){
            $el=FindElement $regex 'ControlType.Button'
            if($null -eq $el){throw "button not found regex=$regex"}
            $p=$el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$p.Invoke()
          }
          function SetEditByName([string]$regex,[string]$value){
            $el=FindElement $regex 'ControlType.Edit'
            if($null -eq $el){return $false}
            $p=$el.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern);$p.SetValue($value);return $true
          }
          function SelectByName([string]$regex,[string]$type='ControlType.RadioButton'){
            $el=FindElement $regex $type
            if($null -eq $el){return $false}
            try{
              $p=$el.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern)
              if($p.Current.IsSelected){Write-Host "SELECT_ALREADY_ACTIVE regex=$regex";return $true}
              if(-not $el.Current.IsEnabled){Write-Host "SELECT_DISABLED_NOT_ACTIVE regex=$regex";return $false}
              $p.Select()
              return $true
            }catch{
              try{
                if($el.Current.ControlType -eq [System.Windows.Automation.ControlType]::RadioButton){
                  $click=$el.GetClickablePoint()
                  [System.Windows.Forms.Cursor]::Position=New-Object System.Drawing.Point([int]$click.X,[int]$click.Y)
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Start-Sleep -Milliseconds 500
                  $p2=$el.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern)
                  if($p2.Current.IsSelected){Write-Host "SELECT_FALLBACK_ACTIVE regex=$regex";return $true}
                }
              }catch{}
              Write-Host "SELECT_FAIL regex=$regex error=$($_.Exception.Message)"
              return $false
            }
          }
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $env:MT5_TERMINAL -PassThru
          Start-Sleep -Seconds 15
          $tp=Get-Process terminal64 -ErrorAction Stop | Sort-Object StartTime -Descending | Select-Object -First 1
          [NativeGold24]::ShowWindowAsync($tp.MainWindowHandle,3)|Out-Null
          [NativeGold24]::SetForegroundWindow($tp.MainWindowHandle)|Out-Null
          [System.Windows.Forms.SendKeys]::SendWait('%f');Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait('a');Start-Sleep -Seconds 8
          DumpUi 'broker'
          $searchEdits=@()
          foreach($el in (Elements)){try{if($el.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit){$searchEdits+=$el}}catch{}}
          if($searchEdits.Count -gt 0){
            try{$vp=$searchEdits[0].GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern);$vp.SetValue('MetaQuotes');Start-Sleep -Seconds 8}catch{}
          }
          $company=FindElement 'MetaQuotes Software|MetaQuotes' 'ControlType.(ListItem|DataItem|Text)'
          if($null -ne $company){try{$sp=$company.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern);$sp.Select()}catch{}}
          InvokeButton 'Next|Continue'
          Start-Sleep -Seconds 6
          DumpUi 'account-type'
          if(-not (SelectByName 'demo account|virtual money')){throw 'demo-account radio option not found'}
          InvokeButton 'Next|Continue'
          Start-Sleep -Seconds 5
          DumpUi 'registration'
          $named=0
          if(SetEditByName 'First name|Name' 'GOLD24'){$named++}
          if(SetEditByName 'Last name|Surname' 'Certification'){$named++}
          if(SetEditByName 'E-mail|Email' 'gold24-ci@copytolive.com'){$named++}
          if(SetEditByName 'Phone|Mobile' '+12025550123'){$named++}
          if($named -lt 4){
            $edits=@()
            foreach($el in (Elements)){try{if($el.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit){$edits+=$el}}catch{}}
            $vals=@('GOLD24','Certification','gold24-ci@copytolive.com','+12025550123')
            for($i=0;$i -lt [Math]::Min(4,$edits.Count);$i++){try{$vp=$edits[$i].GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern);$vp.SetValue($vals[$i])}catch{}}
          }
          $agree=FindElement 'agree|terms|personal data' 'ControlType.CheckBox'
          if($null -eq $agree){throw 'demo-account agreement checkbox not found'}
          $toggle=$agree.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
          if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){$toggle.Toggle()}
          InvokeButton 'Next|Continue'
          Start-Sleep -Seconds 20
          DumpUi 'created'
          $finish=FindElement 'Finish|Done' 'ControlType.Button'
          if($null -ne $finish){$ip=$finish.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$ip.Invoke()}
          Start-Sleep -Seconds 20
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $base=Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $cand=Get-ChildItem $base -Directory -ErrorAction Stop | Where-Object {Test-Path (Join-Path $_.FullName 'MQL5')} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if($null -eq $cand){throw 'MetaQuotes MT5 data dir missing'}
          "MT5_DATA=$($cand.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $logs=Join-Path $cand.FullName 'logs'
          $latestLogs=@(Get-ChildItem $logs -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 6)
          $latestLogs | ForEach-Object {Copy-Item $_.FullName (Join-Path $evidence ("bootstrap-"+$_.Name)) -Force}
          $accounts=Join-Path $cand.FullName 'config\accounts.dat'
          $login=$null;$server=$null
          foreach($lf in $latestLogs){
            $txt=Get-Content $lf.FullName -Raw -ErrorAction SilentlyContinue
            $m=[regex]::Match($txt,'(?im)(?<login>\d{5,})\s*:\s*authorized on\s+(?<server>MetaQuotes-Demo(?:\s+\d+)?)(?:\s|,|$)')
            if($m.Success){$login=$m.Groups['login'].Value;$server=$m.Groups['server'].Value;break}
          }
          if(!(Test-Path $accounts) -or (Get-Item $accounts).Length -le 0 -or [string]::IsNullOrWhiteSpace($login) -or $login -eq '0' -or [string]::IsNullOrWhiteSpace($server)){
            "status=FAIL`naccounts_dat=$(Test-Path $accounts)`nlogin_resolved=$login`nserver_resolved=$server" | Set-Content (Join-Path $evidence 'account-bootstrap-receipt.txt')
            throw 'MetaQuotes demo account bootstrap FAIL: no real authorized account context'
          }
          "MT5_LOGIN=$login"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_SERVER=$server"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "status=PASS`nlogin=$login`nserver=$server`naccounts_dat_bytes=$((Get-Item $accounts).Length)" | Set-Content (Join-Path $evidence 'account-bootstrap-receipt.txt')
          Write-Host "METAQUOTES_ACCOUNT_CONTEXT_PASS login=$login server=$server"
      - name: Compile exact dynamically resolved qualified EA set in native MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $expert=Join-Path $env:MT5_DATA 'MQL5\Experts\Gold24Qualified';$script=Join-Path $env:MT5_DATA 'MQL5\Scripts\Gold24Qualified'
          New-Item -ItemType Directory -Force $expert,$script | Out-Null
          "MT5_EXPERT_DIR=$expert"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item 'backtest/gold24/qualified_scripts/qualified_engine.mqh' $expert -Force
          Copy-Item 'backtest/gold24/qualified_scripts/multimethod_engine.mqh' $expert -Force
          Get-ChildItem 'backtest/gold24/qualified_scripts' -Filter '*.mq5' | Where-Object {$_.Name -notmatch '^qualified_import_'} | Copy-Item -Destination $expert -Force
          Copy-Item 'backtest/gold24/qualified_scripts/qualified_import_canonical.mq5' $script -Force
          function Compile([string]$p){
            $log=[IO.Path]::ChangeExtension($p,'.log');$ex5=[IO.Path]::ChangeExtension($p,'.ex5');Remove-Item $log,$ex5 -Force -ErrorAction SilentlyContinue
            $proc=Start-Process -FilePath $env:MT5_META -ArgumentList @("/compile:$p",'/log') -PassThru
            if(-not $proc.WaitForExit(120000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue;throw "MetaEditor timeout: $p"}
            for($i=0;$i -lt 20 -and (!(Test-Path $log) -or !(Test-Path $ex5));$i++){Start-Sleep -Milliseconds 500}
            if(Test-Path $log){Copy-Item $log $env:MT5_EVIDENCE -Force;$txt=Get-Content $log -Raw}else{$txt='NO COMPILE LOG'}
            if(!(Test-Path $ex5)){throw "no EX5: $p`n$txt"}
            if(!(Test-Path $log)){throw "no compile log: $p"}
            if($txt -notmatch '0 errors, 0 warnings'){throw "MetaEditor compile not clean: $p`n$txt"}
          }
          Compile (Join-Path $script 'qualified_import_canonical.mq5')
          $strictCount=@(Import-Csv 'backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv').Count
          $multiCount=@(Import-Csv 'backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv').Count
          $expectedCount=[int]$strictCount+[int]$multiCount
          if($expectedCount -lt 1){throw 'no selected methods found in runtime CSVs'}
          $eas=@(Get-ChildItem $expert -Filter '*.mq5' | Sort-Object Name)
          if($eas.Count -ne $expectedCount){throw "selected EA count mismatch: runtime CSVs=$expectedCount wrappers=$($eas.Count)"}
          "QUALIFIED_EA_COUNT=$expectedCount"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          foreach($ea in $eas){Compile $ea.FullName}
      - name: Import exact canonical D1 series as MT5 custom symbol
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $common=Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files\Gold24Qualified';New-Item -ItemType Directory -Force $common|Out-Null
          Copy-Item "$env:RUNNER_TEMP\gold24_canonical_d1_mt5.csv" (Join-Path $common 'gold24_canonical_d1_mt5.csv') -Force
          $receipt=Join-Path $common 'import_receipt.txt';Remove-Item $receipt -Force -ErrorAction SilentlyContinue
          $ini=Join-Path $env:RUNNER_TEMP 'import.ini'
          @('[Common]','NewsEnable=0','CertInstall=0','[StartUp]','Script=Gold24Qualified\qualified_import_canonical','Symbol=XAUUSD','Period=D1') | Set-Content $ini -Encoding ASCII
          $p=Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList "/config:$ini" -PassThru
          for($i=0;$i -lt 90 -and !(Test-Path $receipt);$i++){Start-Sleep -Seconds 2}
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if(!(Test-Path $receipt)){throw 'custom symbol import receipt missing'}
          $txt=Get-Content $receipt -Raw;Copy-Item $receipt $env:MT5_EVIDENCE -Force
          if($txt -notmatch 'status=PASS'){throw "custom symbol import FAIL`n$txt"}
      - name: Native MT5 Strategy Tester operational smoke for exact selected EA set
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $common=Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files\Gold24Qualified'
          $eas=@(Get-ChildItem $env:MT5_EXPERT_DIR -Filter '*.mq5' | Sort-Object Name)
          if([string]::IsNullOrWhiteSpace($env:QUALIFIED_EA_COUNT)){throw 'QUALIFIED_EA_COUNT missing'}
          if($eas.Count -ne [int]$env:QUALIFIED_EA_COUNT){throw "EA count changed before tester: expected=$env:QUALIFIED_EA_COUNT found=$($eas.Count)"}
          foreach($ea in $eas){
            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $name=[IO.Path]::GetFileNameWithoutExtension($ea.Name);$src=Get-Content $ea.FullName -Raw
            $mm=[regex]::Match($src,'#define\s+(?:QM|MM)_MAGIC\s+(\d+)');if(!$mm.Success){throw "magic missing $name"};$magic=$mm.Groups[1].Value
            $receipt=Join-Path $common "receipt_$magic.txt";Remove-Item $receipt -Force -ErrorAction SilentlyContinue
            $report=Join-Path $env:MT5_EVIDENCE "$name.html";$ini=Join-Path $env:RUNNER_TEMP "$name.ini";Remove-Item $report -Force -ErrorAction SilentlyContinue
            @(
              '[Common]',"Login=$env:MT5_LOGIN","Server=$env:MT5_SERVER",'NewsEnable=0','CertInstall=0','[Tester]',
              "Expert=Gold24Qualified\$name",'Symbol=GOLD24-CANON','Period=D1','Model=2','ExecutionMode=0','Optimization=0','ForwardMode=0',
              'FromDate=2000.10.23','ToDate=2026.08.27','Deposit=10000','Currency=USD','ProfitInPips=0','Leverage=1:100',
              'UseLocal=1','UseRemote=0','UseCloud=0','Visual=0',"Report=$report",'ReplaceReport=1','ShutdownTerminal=1'
            ) | Set-Content $ini -Encoding ASCII
            Write-Host "START_TESTER $name"
            $p=Start-Process -FilePath $env:MT5_TERMINAL -ArgumentList "/config:$ini" -PassThru
            $deadline=(Get-Date).AddMinutes(4)
            do {if((Test-Path $report) -and (Test-Path $receipt)){break};Start-Sleep -Seconds 2} while((Get-Date) -lt $deadline)
            if(!(Test-Path $report)){
              $alt=Get-ChildItem $env:MT5_DATA -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.BaseName -eq $name -and $_.Extension -match '^\.html?$'} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
              if($null -ne $alt){Copy-Item $alt.FullName $report -Force}
            }
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
            Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if(!(Test-Path $report) -or !(Test-Path $receipt)){
              $diag=Join-Path $env:MT5_EVIDENCE "$name-diagnostic.txt";"name=$name`nreport_exists=$(Test-Path $report)`nreceipt_exists=$(Test-Path $receipt)`nconfig=$ini"|Set-Content $diag
              Get-ChildItem (Join-Path $env:MT5_DATA 'logs') -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3 | ForEach-Object {Copy-Item $_.FullName (Join-Path $env:MT5_EVIDENCE ("terminal-"+$_.Name)) -Force}
              throw "tester evidence missing $name report=$(Test-Path $report) receipt=$(Test-Path $receipt)"
            }
            $txt=Get-Content $receipt -Raw;Copy-Item $receipt (Join-Path $env:MT5_EVIDENCE "$name-receipt.txt") -Force
            $kv=@{};foreach($line in ($txt -split "`r?`n")){if($line -match '^([^=]+)=(.*)$'){$kv[$matches[1]]=$matches[2]}}
            if($kv.status -ne 'PASS'){throw "EA operational status != PASS $name`n$txt"}
            if([int64]$kv.bars -lt 6000 -or [int64]$kv.signals -le 0 -or [int64]$kv.order_attempts -le 0 -or [int64]$kv.order_accepted -le 0 -or [int64]$kv.trade_errors -ne 0){throw "EA operational counters FAIL $name`n$txt"}
            Write-Host "MT5_OPERATIONAL_PASS $name bars=$($kv.bars) signals=$($kv.signals) accepted=$($kv.order_accepted)"
          }
      - name: Upload native MetaQuotes MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold24-qualified-metaquotes-mt5-${{ github.run_id }}
          path: ${{ env.MT5_EVIDENCE }}
          if-no-files-found: warn
          retention-days: 90
