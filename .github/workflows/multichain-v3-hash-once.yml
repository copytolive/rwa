name: MULTI CHAIN V3 Hash Once

on:
  push:
    branches: [feat/multichain-real-execution-fees-v3-20260828]
    paths: [.github/workflows/multichain-v3-hash-once.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit certified hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            rwa-multichain.js \
            rwa-multichain-engine.js \
            rwa-multichain-registry.json \
            tools/multichain-browser.mjs \
            .github/workflows/multichain-browser.yml \
            rwa-multichain-revenue.json \
            tools/multichain-revenue-contract.mjs \
            .github/workflows/multichain-revenue-gate.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          x=Path('index.html').read_text()
          m=re.search(r'(<style id="rwaMultiChainLauncherBootstrapStyle">.*?<script id="rwaMultiChainLazyBootstrap">.*?</script>)',x,re.S)
          assert m
          print(hashlib.sha256(m.group(1).encode()).hexdigest(),'INDEX_MULTICHAIN_BOOTSTRAP')
          PY
