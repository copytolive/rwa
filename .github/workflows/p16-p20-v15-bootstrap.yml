name: P16-P20 V15 Recovery Bootstrap

on:
  push:
    branches:
      - recovery/p16-p20-v15-launch-20260827

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified V15 recovery
        shell: bash
        run: |
          set -euo pipefail
          cat tools/.v15-recovery-part1.b64 tools/.v15-recovery-part2.b64 tools/.v15-recovery-part3.b64 > /tmp/v15-recovery.b64
          base64 -d /tmp/v15-recovery.b64 | gzip -d > /tmp/reconstruct-p16-p20-v15-ci.sh
          printf '%s  %s\n' '4e1680d96c8bb9655a8987ccae195fe36206ee9b64dd3ef47fd7be45d70749c9' '/tmp/reconstruct-p16-p20-v15-ci.sh' | sha256sum -c -
          bash -n /tmp/reconstruct-p16-p20-v15-ci.sh
          bash /tmp/reconstruct-p16-p20-v15-ci.sh
      - name: Commit only validated product transaction
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/.v15-recovery-part1.b64 tools/.v15-recovery-part2.b64 tools/.v15-recovery-part3.b64 .github/workflows/p16-p20-v15-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: complete RWA Super App P16-P20 V15 recovery'
          git push origin HEAD:recovery/p16-p20-v15-launch-20260827
