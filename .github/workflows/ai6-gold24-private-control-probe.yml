name: AI6 GOLD24 Private Control Probe

on:
  push:
    branches: [main]
    paths:
      - "ai6-gold24-private-control/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: gold24-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai6-gold24-private-control/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai6-gold24-private-control-results/$ID.json" >> "$GITHUB_OUTPUT"

      - name: Probe production bridge without exposing secrets
        env:
          HOST: ${{ secrets.GOLD24_HOST }}
          USER: ${{ secrets.GOLD24_USER }}
          KEY: ${{ secrets.GOLD24_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          mkdir -p "$(dirname "$OUT")" "$HOME/.ssh"
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          printf '%s\n' "$KEY" > "$HOME/.ssh/ai6gold"
          chmod 600 "$HOME/.ssh/ai6gold"
          ssh-keyscan -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -i "$HOME/.ssh/ai6gold" "$USER@$HOST" 'python3 -' > "$OUT" <<'PY'
          import json,os,shutil,subprocess
          def run(cmd):
              p=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
              return p.returncode,(p.stdout or "").strip()
          gh=shutil.which("gh")
          auth=False
          if gh:
              rc,_=run([gh,"auth","status","-h","github.com"])
              auth=rc==0
          _,dirs=run(["bash","-lc","find /root /opt /home -maxdepth 6 -type d -name archive-bridge-private 2>/dev/null | head -20"])
          _,deploy=run(["bash","-lc","find /root /opt /home /tmp -maxdepth 8 -type f -path '*/ai6-live-pending/deploy.py' 2>/dev/null | head -20"])
          _,web=run(["bash","-lc","test -d /var/www/copytolive && echo yes || echo no"])
          print(json.dumps({
            "ok":web=="yes",
            "host_copytolive":os.path.isdir("/var/www/copytolive"),
            "gh_present":bool(gh),
            "gh_auth_ok":auth,
            "gh_hosts_exists":os.path.isfile(os.path.expanduser("~/.config/gh/hosts.yml")),
            "private_repo_dirs":[x for x in dirs.splitlines() if x],
            "deploy_files":[x for x in deploy.splitlines() if x],
          },indent=2))
          PY

      - name: Commit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          test -s "$OUT"
          git config user.name "CopyToLive AI6 GOLD24 Bridge"
          git config user.email "copytolive-ai6-gold24@local.invalid"
          git add "$OUT"
          git commit -m "ai6 GOLD24 private control probe: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$n"
          done
          exit 1

      - name: Enforce
        if: always()
        shell: bash
        run: |
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("ok") else 1)' "${{ steps.req.outputs.out }}"
