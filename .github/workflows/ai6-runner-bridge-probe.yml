name: AI6 Runner Bridge Probe
on:
  push:
    branches: [main]
    paths:
      - "ai6-runner-bridge/**"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe secret and VPS reachability
        env:
          SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ai6-runner-bridge-results "$HOME/.ssh"
          if [ -z "${SSH_KEY:-}" ]; then
            printf '{"ok":false,"secret_present":false,"ssh_reachable":false}\n' > ai6-runner-bridge-results/probe.json
          else
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai6_bridge"
            chmod 600 "$HOME/.ssh/ai6_bridge"
            ssh-keyscan -H 109.123.239.76 >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            if ssh -o BatchMode=yes -o ConnectTimeout=8 -i "$HOME/.ssh/ai6_bridge" root@109.123.239.76 'test -d /home/opentrue-platform/backend && echo ok' >/tmp/ai6_ssh 2>/dev/null; then
              printf '{"ok":true,"secret_present":true,"ssh_reachable":true}\n' > ai6-runner-bridge-results/probe.json
            else
              printf '{"ok":false,"secret_present":true,"ssh_reachable":false}\n' > ai6-runner-bridge-results/probe.json
            fi
          fi
      - name: Commit probe result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CopyToLive AI6 Runner Bridge"
          git config user.email "copytolive-ai6@local.invalid"
          git add ai6-runner-bridge-results/probe.json
          git commit -m "ai6 runner bridge probe result" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
