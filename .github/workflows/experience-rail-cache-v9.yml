name: RWA Experience Rail Cache V9

on:
  push:
    branches:
      - fix/experience-rail-cache-bust-v9-20260827
    paths:
      - 'index.html'
      - 'market-performance.js'
      - 'persistent-market-operability-patch-v1.css'
      - 'tools/experience-rail-visual-parity-v9.mjs'
      - '.github/workflows/experience-rail-cache-v9.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'market-performance.js'
      - 'persistent-market-operability-patch-v1.css'
      - 'tools/experience-rail-visual-parity-v9.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache contract
        run: |
          grep -Fq 'market-performance.js?v=9' index.html
          grep -Fq 'persistent-market-operability-patch-v1.css?v=9' market-performance.js
          test "$(grep -o '<script src=' index.html | wc -l | tr -d ' ')" = "6"
          grep -Fq 'padding:0!important' persistent-market-operability-patch-v1.css
          grep -Fq 'gap:0!important' persistent-market-operability-patch-v1.css
          grep -Fq 'outline:0!important' persistent-market-operability-patch-v1.css
          node --check market-performance.js
          node --check tools/experience-rail-visual-parity-v9.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve canonical app
        run: |
          mkdir -p /tmp/rwa-rail-cache-v9/rwa
          cp -a . /tmp/rwa-rail-cache-v9/rwa/
          cd /tmp/rwa-rail-cache-v9
          python -m http.server 4173 >/tmp/rwa-rail-cache-v9-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
      - name: Validate 2048px and 1600px V9 parity
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
          RWA_PROOF_DIR: proof/experience-rail-cache-v9
        run: node tools/experience-rail-visual-parity-v9.mjs
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: experience-rail-cache-v9-proof
          path: proof/experience-rail-cache-v9
          retention-days: 30
