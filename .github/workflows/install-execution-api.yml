# trigger: v2
name: Install RWA Execution API
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/install-execution-api.yml"]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire execution bootstrap and CI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text()
          s=re.sub(r'mobile\.js\?v=\d+','mobile.js?v=12',s)
          marker='<script src="realtime-core.js?v=2"></script>'
          block='''<script src="realtime-core.js?v=2"></script>\n<script src="execution-api.js?v=1"></script>\n<script src="execution-ops-bridge.js?v=1"></script>\n<script src="execution-ui.js?v=1"></script>\n<script src="suite-execution-patch.js?v=5"></script>'''
          if 'execution-api.js?v=1' not in s:
              if marker not in s: raise SystemExit('realtime marker not found in index')
              s=s.replace(marker,block,1)
          p.write_text(s)

          p=Path('mobile.js'); s=p.read_text()
          s=s.replace("suite-nav.js?v=1","suite-nav.js?v=2")
          p.write_text(s)

          p=Path('realtime-core.js'); s=p.read_text()
          s=s.replace("suite-nav.js?v=1","suite-nav.js?v=2")
          s=s.replace("suite-execution-patch.js?v=4","suite-execution-patch.js?v=5")
          anchor="'walletconnect.js?v=2'"
          if "execution-api.js?v=1" not in s:
              s=s.replace(anchor,"'execution-api.js?v=1','execution-ops-bridge.js?v=1','execution-ui.js?v=1',"+anchor,1)
          p.write_text(s)

          p=Path('suite-execution-patch.js'); s=p.read_text()
          if 'if(window.RWAExecutionBridge)return;' not in s:
              s=s.replace("'use strict';","'use strict';\nif(window.RWAExecutionBridge)return;",1)
          p.write_text(s)

          p=Path('.github/workflows/pages.yml'); s=p.read_text()
          if 'node --check execution-api.js' not in s:
              s=s.replace('          node --check mobile.js\n','          node --check mobile.js\n          node --check execution-api.js\n          node --check execution-ops-bridge.js\n          node --check execution-ui.js\n',1)
          if '          test -s execution-api.js\n' not in s:
              s=s.replace('          test -s mobile.css\n','          test -s mobile.css\n          test -s execution-api.js\n          test -s execution-ops-bridge.js\n          test -s execution-ui.js\n          test -s rwa-execution-config.json\n          test -s EXECUTION_API.md\n',1)
          if 'python -m json.tool rwa-execution-config.json' not in s:
              s=s.replace('          python -m json.tool rwa-assets.json >/dev/null\n','          python -m json.tool rwa-assets.json >/dev/null\n          python -m json.tool rwa-execution-config.json >/dev/null\n',1)
          contract='''          grep -Fq "RWAExecutionAPI" execution-api.js\n          grep -Fq "approveAgent" execution-api.js\n          grep -Fq "execution-api.js?v=1" index.html\n          grep -Fq "execution-ops-bridge.js?v=1" index.html\n          grep -Fq "suite-execution-patch.js?v=5" index.html\n          grep -Fq "execution-api.js?v=1" suite-nav.js\n          grep -Fq "execution-ops-bridge.js?v=1" suite-nav.js\n'''
          if 'grep -Fq "approveAgent" execution-api.js' not in s:
              s=s.replace('          grep -Fq "suite-nav.js" mobile.js\n',contract+'          grep -Fq "suite-nav.js" mobile.js\n',1)
          p.write_text(s)
          PY
          node --check app.js
          node --check mobile.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check execution-ui.js
          node --check suite-execution-patch.js
          python -m json.tool rwa-execution-config.json >/dev/null
          grep -Fq 'execution-api.js?v=1' index.html
          grep -Fq 'suite-nav.js?v=2' mobile.js
          grep -Fq 'if(window.RWAExecutionBridge)return;' suite-execution-patch.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/install-execution-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.js realtime-core.js suite-execution-patch.js .github/workflows/pages.yml .github/workflows/install-execution-api.yml
          git commit -m 'feat: install Hyperliquid-style execution API bootstrap'
          git push
