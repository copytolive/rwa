name: RWA Lockfile Bootstrap

on:
  push:
    branches: ["fix/rwa-total-ready-screen-20260901"]
    paths:
      - ".github/workflows/rwa-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rwa-total-ready-screen-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed canonical lockfile
        working-directory: apps/realworldasset
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1); console.log('RWA_LOCKFILE_PASS',p.lockfileVersion)"
      - name: Enforce npm ci in canonical pipelines and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('.github/workflows/pages.yml'),
            Path('.github/workflows/realworldasset-ui-total-audit.yml'),
            Path('.github/workflows/combined-ui-system-gate.yml'),
          ]
          for p in files:
            s=p.read_text()
            old=s
            s=s.replace('cache-dependency-path: apps/realworldasset/package.json','cache-dependency-path: apps/realworldasset/package-lock.json')
            s=s.replace('run: npm install --no-audit --no-fund','run: npm ci --no-audit --no-fund')
            if s==old:
              raise SystemExit(f'no canonical install replacement in {p}')
            if 'working-directory: apps/realworldasset\n        run: npm install --no-audit --no-fund' in s:
              raise SystemExit(f'stale npm install remains in {p}')
            p.write_text(s)
            print('RWA_NPM_CI_PATCH',p)
          PY
          git rm .github/workflows/rwa-lockfile-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pages.yml .github/workflows/realworldasset-ui-total-audit.yml .github/workflows/combined-ui-system-gate.yml
          git diff --cached --check
          git commit -m 'ci(rwa): use locked canonical UI dependencies [skip ci]'
          git push origin HEAD:fix/rwa-total-ready-screen-20260901
          echo RWA_REPRODUCIBLE_INSTALLS_COMMITTED
