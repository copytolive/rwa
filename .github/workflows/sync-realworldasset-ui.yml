name: Sync complete realworldasset UI into RWA

on:
  push:
    branches: ["main", "integrate/total-ui-realworldasset-20260831-v2"]
    paths:
      - '.github/workflows/sync-realworldasset-ui.yml'
      - '.ui-sync-trigger'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realworldasset-ui-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout RWA system repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull complete UI source into canonical app and compatibility mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/realworldasset-ui
          git clone --quiet https://github.com/copytolive/realworldasset.git /tmp/realworldasset-ui
          UI_SHA="$(git -C /tmp/realworldasset-ui rev-parse HEAD)"
          UI_TREE_SHA="$(git -C /tmp/realworldasset-ui rev-parse HEAD^{tree})"
          test -s /tmp/realworldasset-ui/package.json
          test -s /tmp/realworldasset-ui/next.config.js
          test -d /tmp/realworldasset-ui/src/components
          test -d /tmp/realworldasset-ui/scripts
          test -d /tmp/realworldasset-ui/public
          grep -Fq 'MerchantGrowthRoute' '/tmp/realworldasset-ui/src/app/[...slug]/page.tsx'

          for DEST in apps/realworldasset ui/realworldasset; do
            rm -rf "$DEST"
            mkdir -p "$DEST"
            rsync -a --delete --exclude='.git/' /tmp/realworldasset-ui/ "$DEST/"
            python3 - "$DEST/next.config.js" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text()
          s=s.replace('const basePath = isGitHubPages ? "/realworldasset" : "";', 'const basePath = process.env.RWA_BASE_PATH || (isGitHubPages ? "/rwa" : "");')
          p.write_text(s)
          PY
            printf '%s\n' "$UI_SHA" > "$DEST/UPSTREAM_SHA.txt"
          done

          python3 - <<PY
          import json, pathlib
          sha=${UI_SHA@Q}
          tree_sha=${UI_TREE_SHA@Q}
          data={
            'schema':'rwa-ui-sync-v2',
            'uiRepository':'copytolive/realworldasset',
            'uiCommit':sha,
            'uiTree':tree_sha,
            'systemRepository':'copytolive/rwa',
            'canonicalPublicUrl':'https://copytolive.github.io/rwa/',
            'canonicalPath':'apps/realworldasset',
            'compatibilityMirror':'ui/realworldasset'
          }
          pathlib.Path('UI_SYNC_MANIFEST.json').write_text(json.dumps(data,indent=2)+'\n')
          PY

          test -s apps/realworldasset/package.json
          test -s apps/realworldasset/src/app/page.tsx
          test -s apps/realworldasset/scripts/verify-all-interactions.mjs
          grep -Fq '"/rwa"' apps/realworldasset/next.config.js
          diff -qr --exclude='next.config.js' --exclude='UPSTREAM_SHA.txt' apps/realworldasset ui/realworldasset
          FILE_COUNT="$(find apps/realworldasset -type f | wc -l | tr -d ' ')"
          test "$FILE_COUNT" -gt 50
          echo "UI_TOTAL_SYNC_READY source=$UI_SHA tree=$UI_TREE_SHA files=$FILE_COUNT canonical=apps/realworldasset"

      - name: Commit synchronized UI if changed
        shell: bash
        run: |
          set -euo pipefail
          git add -f -A apps/realworldasset ui/realworldasset UI_SYNC_MANIFEST.json
          CANONICAL_COUNT="$(git ls-files apps/realworldasset | wc -l | tr -d ' ')"
          MIRROR_COUNT="$(git ls-files ui/realworldasset | wc -l | tr -d ' ')"
          test "$CANONICAL_COUNT" -gt 50
          test "$MIRROR_COUNT" -gt 50
          if git diff --cached --quiet; then
            echo "UI_ALREADY_IN_SYNC canonical=$CANONICAL_COUNT mirror=$MIRROR_COUNT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          UI_SHA="$(cat apps/realworldasset/UPSTREAM_SHA.txt)"
          git commit -m "sync(ui): canonicalize complete realworldasset UI ${UI_SHA} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
