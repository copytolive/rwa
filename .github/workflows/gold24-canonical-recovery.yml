name: GOLD24 V2 Gate A Guard

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOLD24_POLICY: GOLD24_WEEKLY_PROFIT_RR12_V2_20260828
  GOLD24_GATE_A: BLOCKED_DRIVE_APPROVED_CROSSCHECK_BYTES_RECEIPT_MISSING
  GOLD24_STRATEGY_ENGINE: PAUSED

jobs:
  fail_closed_guard:
    runs-on: ubuntu-latest
    steps:
      - name: Record canonical fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          echo "policy=$GOLD24_POLICY"
          echo "gate_a=$GOLD24_GATE_A"
          echo "strategy_engine=$GOLD24_STRATEGY_ENGINE"
          echo "simulation_executed=false"
          echo "counter_increment=0"
          echo "top200_goal=UNCHANGED"
          echo "top100_compliant=UNCHANGED"
          echo "weekly_profit_runner=NOT_RUN"
          echo "github_goal_rr12_runner=NOT_RUN"
          echo "reason=Approved Drive-first OANDA/TradingView XAUUSD cross-check bytes + verifiable receipt reaching 2026 are not present; no simulation is permitted."
