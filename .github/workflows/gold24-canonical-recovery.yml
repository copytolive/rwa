    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce GOLD24_WEEKLY_PROFIT_RR12_V2_20260828 fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          echo 'policy=GOLD24_WEEKLY_PROFIT_RR12_V2_20260828'
          echo 'gate_a=BLOCKED_DRIVE_APPROVED_CROSSCHECK_BYTES_RECEIPT_MISSING'
          echo 'strategy_engine=PAUSED'
          echo 'simulation_executed=false'
          echo 'counter_increment=0'
          echo 'TOP200_GOAL=UNCHANGED'
          echo 'TOP100_COMPLIANT=UNCHANGED'
          echo 'reason=Drive canonical-data and receipts folders do not contain approved OANDA/TradingView XAUUSD cross-check bytes reaching 2026 plus a verifiable crosscheck_pass=true receipt with provider/symbol/timeframe/coverage/primary SHA256 and required UTC/duplicate/gap/NaN/OHLC/volume/SHA256/lineage audits.'
          echo 'weekly_profit_runner=NOT_RUN'
          echo 'github_goal_rr12_runner=NOT_RUN'

      - name: Explain re-enable condition
        run: |
          echo 'Automatic or strategy execution must remain disabled until Drive-first Gate A is independently proven PASS under GOLD24_WEEKLY_PROFIT_RR12_V2_20260828.'
