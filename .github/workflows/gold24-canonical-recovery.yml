name: GOLD Canonical v11 Recovery Continuation

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backtest/gold24/GITHUB_RUNNER_KICK'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-canonical-v11
  cancel-in-progress: false

env:
  GOLD24_TIMEFRAME: D1
  GOLD24_FLAT_LOT: '1.0'
  SHARD_COUNT: '20'
  RAW_CURSOR_COUNT: '100000'
  MAX_SIMULATIONS_PER_SHARD: '1000000'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  authoritative_20worker:
    name: Authoritative 20 logical workers + single-writer publish
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GOLD24_STATE_DIR: ${{ github.workspace }}/.gold24-canonical-v11
      GOLD24_DATASET: ${{ github.workspace }}/.gold24-canonical-v11/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
      GOLD24_CROSSCHECK: ${{ github.workspace }}/.gold24-canonical-v11/gate_a/gate_a_receipt.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          pip install -r backtest/gold24/requirements.txt

      - name: Prove canonical and 20-worker semantics
        run: |
          set -euo pipefail
          python backtest/gold24/pipeline_selftest.py
          python backtest/gold24/v11_runner.py --self-test
          python backtest/gold24/v11_screening.py --self-test
          python backtest/gold24/parallel_search_probe.py selftest
          python backtest/gold24/parallel_canonical_promote.py selftest

      - name: Freeze latest published canonical source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:backtest/gold24/runtime_v11/latest_validation_summary.json > "$RUNNER_TEMP/latest_validation_source.json"
          python - <<'PY' > "$RUNNER_TEMP/source.env"
          import json, os, pathlib
          x=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'] + '/latest_validation_source.json').read_text())
          assert x.get('validation') == 'PASS'
          assert x.get('restored_previous_state') is True
          assert x.get('gate_a_strict',{}).get('gate_a') == 'PASS'
          assert x.get('simulation_executed') is True
          assert x.get('strategy_engine') == 'RUNNING'
          print('SOURCE_RUN_ID=' + str(x['github_run_id']))
          print('SOURCE_BATCH=' + str(x['batch']))
          print('SOURCE_CURSOR=' + str(x['candidate_cursor']))
          print('SOURCE_ARCHIVED=' + str(x['cumulative_configs_archived']))
          PY
          cat "$RUNNER_TEMP/source.env"
          cat "$RUNNER_TEMP/source.env" >> "$GITHUB_ENV"

      - name: Restore exact canonical authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GOLD24_STATE_DIR" parallel-all worker-input worker-logs
          mkdir -p "$GOLD24_STATE_DIR" parallel-all worker-input worker-logs
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            -n gold24-canonical-v11-state -D "$GOLD24_STATE_DIR"
          test -s "$GOLD24_STATE_DIR/gold24-v11.db"
          test -d "$GOLD24_STATE_DIR/ledgers_v11"
          test -s "$GOLD24_DATASET"
          test -s "$GOLD24_CROSSCHECK"
          printf '%s\n' "$SOURCE_RUN_ID" > "$GOLD24_STATE_DIR/previous_successful_run_id.txt"
          printf 'true\n' > "$GOLD24_STATE_DIR/restored_previous_state.txt"
          python - <<'PY'
          import json,os,sqlite3
          db=sqlite3.connect(os.environ['GOLD24_STATE_DIR']+'/gold24-v11.db')
          n=db.execute('SELECT COUNT(*) FROM configs').fetchone()[0]
          cursor=int(json.loads(db.execute("SELECT v FROM state WHERE k='candidate_cursor'").fetchone()[0]))
          db.close()
          assert cursor==int(os.environ['SOURCE_CURSOR']), (cursor,os.environ['SOURCE_CURSOR'])
          assert n==int(os.environ['SOURCE_ARCHIVED']), (n,os.environ['SOURCE_ARCHIVED'])
          print(f'frozen canonical source: PASS configs={n} cursor={cursor}')
          PY

      - name: Strict Gate A before simulation
        run: |
          set -euo pipefail
          python backtest/gold24/strict_gate_a.py --self-test
          python backtest/gold24/strict_gate_a.py \
            --dataset "$GOLD24_DATASET" \
            --receipt "$GOLD24_CROSSCHECK" \
            --timeframe "$GOLD24_TIMEFRAME" \
            --out "$GOLD24_STATE_DIR/STRICT_GATE_A_AUDIT.json"

      - name: Run all 20 logical simulation workers concurrently
        shell: bash
        run: |
          set -euo pipefail
          pids=()
          for INDEX in $(seq 0 19); do
            DB="worker-input/gold24-v11-$(printf '%02d' "$INDEX").db"
            OUT="parallel-all/shard_$(printf '%02d' "$INDEX").json"
            LOG="worker-logs/shard_$(printf '%02d' "$INDEX").log"
            cp "$GOLD24_STATE_DIR/gold24-v11.db" "$DB"
            (
              set -euo pipefail
              echo "WORKER_START index=$INDEX utc=$(date -u +%FT%TZ)"
              python backtest/gold24/parallel_search_probe.py shard \
                --baseline-db "$DB" \
                --dataset "$GOLD24_DATASET" \
                --crosscheck "$GOLD24_CROSSCHECK" \
                --timeframe "$GOLD24_TIMEFRAME" \
                --flat-lot "$GOLD24_FLAT_LOT" \
                --start-cursor "$SOURCE_CURSOR" \
                --raw-count "$RAW_CURSOR_COUNT" \
                --shard-index "$INDEX" \
                --shard-count "$SHARD_COUNT" \
                --max-simulations "$MAX_SIMULATIONS_PER_SHARD" \
                --source-run-id "$SOURCE_RUN_ID" \
                --source-batch "$SOURCE_BATCH" \
                --source-candidate-cursor "$SOURCE_CURSOR" \
                --out "$OUT"
              python - "$OUT" "$INDEX" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          expected=int(sys.argv[2])
          assert int(x['shard_index'])==expected
          assert x['gate_a']=='PASS'
          assert x['scan_exhausted_global_range'] is True
          assert x['canonical_state_mutation'] is False
          assert x['counter_increment']==0
          print('WORKER_PASS', expected, 'raw=',x['raw_cursor_scanned'],'sim=',x['simulated_candidates'])
          PY
              echo "WORKER_END index=$INDEX utc=$(date -u +%FT%TZ)"
            ) >"$LOG" 2>&1 &
            pids+=("$!")
          done

          echo "launched=${#pids[@]} logical_workers=$SHARD_COUNT"
          test "${#pids[@]}" -eq 20
          failed=0
          for INDEX in $(seq 0 19); do
            if ! wait "${pids[$INDEX]}"; then
              echo "worker $INDEX FAILED"
              failed=1
            fi
          done
          for LOG in worker-logs/shard_*.log; do
            echo "===== $LOG ====="
            tail -80 "$LOG"
          done
          test "$failed" -eq 0

          python - <<'PY'
          import glob,json
          paths=sorted(glob.glob('parallel-all/shard_*.json'))
          assert len(paths)==20, len(paths)
          rows=[json.load(open(p)) for p in paths]
          indices=sorted(int(x['shard_index']) for x in rows)
          assert indices==list(range(20)), indices
          assert all(x.get('gate_a')=='PASS' for x in rows)
          assert all(x.get('scan_exhausted_global_range') is True for x in rows)
          assert all(x.get('canonical_state_mutation') is False for x in rows)
          assert all(int(x.get('counter_increment',-1))==0 for x in rows)
          print('20/20 logical workers: PASS')
          print('raw_scanned_total=',sum(int(x.get('raw_cursor_scanned',0)) for x in rows))
          print('simulated_total=',sum(int(x.get('simulated_candidates',0)) for x in rows))
          PY

      - name: Deterministic central novelty + exact-ledger promotion
        shell: bash
        run: |
          set -euo pipefail
          python backtest/gold24/parallel_canonical_promote.py promote \
            --input-root parallel-all \
            --state-root "$GOLD24_STATE_DIR" \
            --expected-shards "$SHARD_COUNT" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-batch "$SOURCE_BATCH" \
            --source-cursor "$SOURCE_CURSOR" \
            --source-archived "$SOURCE_ARCHIVED" \
            --raw-count "$RAW_CURSOR_COUNT" \
            --timeframe "$GOLD24_TIMEFRAME"
          cat "$GOLD24_STATE_DIR/PARALLEL_CANONICAL_PROMOTION_V11.json"

      - name: Run v11 robustness and portfolio screening
        run: |
          set -euo pipefail
          python backtest/gold24/v11_screening.py

      - name: Build authoritative public validation summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,sqlite3
          root=pathlib.Path(os.environ['GOLD24_STATE_DIR'])
          strict=json.loads((root/'STRICT_GATE_A_AUDIT.json').read_text())
          status=json.loads((root/'status_v11.json').read_text())
          promotion=json.loads((root/'PARALLEL_CANONICAL_PROMOTION_V11.json').read_text())
          screening=json.loads((root/'SCREENING_V11.json').read_text())
          top200=json.loads((root/'TOP200_SAMPLE_PF_V11.json').read_text())
          qualified=json.loads((root/'TOP100_QUALIFIED_V11.json').read_text())
          final=json.loads((root/'TOP100_COMPLIANT_V11.json').read_text())
          rules=pathlib.Path('backtest/gold24/RULES_GOLD_V11_2026.md')
          rules_sha=hashlib.sha256(rules.read_bytes()).hexdigest()
          db=sqlite3.connect(root/'gold24-v11.db'); db.row_factory=sqlite3.Row
          rows=db.execute('SELECT execution_hash,metrics_json FROM configs').fetchall(); db.close()
          metrics=[json.loads(r['metrics_json']) if r['metrics_json'] else {} for r in rows]
          hashes=[r['execution_hash'] for r in rows if r['execution_hash']]
          summary={
            'schema':'gold-v11-public-validation-v2','validation':'PASS',
            'workflow':'GOLD Canonical v11 Recovery Continuation',
            'policy':'GOLD_CANONICAL_V11_20260828',
            'ranking_rule':'minimum trades first; then NET Profit Factor descending',
            'github_run_id':os.environ['GITHUB_RUN_ID'],'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'github_event':os.environ['GITHUB_EVENT_NAME'],'github_sha':os.environ['GITHUB_SHA'],
            'previous_successful_run_id':os.environ['SOURCE_RUN_ID'],'restored_previous_state':True,
            'parallel_workers':20,'worker_mode':'20_LOGICAL_PROCESS_WORKERS_SINGLE_RUNNER_SINGLE_WRITER_PROMOTION',
            'authoritative_parallel':True,'single_writer_promotion':True,'global_exact_ledger_dedupe_executed':True,
            'source_batch':int(os.environ['SOURCE_BATCH']),'source_candidate_cursor':int(os.environ['SOURCE_CURSOR']),
            'raw_cursor_range':int(os.environ['RAW_CURSOR_COUNT']),'promotion':promotion,
            'rules_sha256':rules_sha,'gate_a_strict':strict,
            'timeframe':status.get('timeframe'),'minimum_trades':status.get('minimum_trades'),
            'pf_target_min':status.get('pf_target_min'),'pf_max':status.get('pf_max'),
            'batch':status.get('batch'),'candidate_cursor':status.get('candidate_cursor'),
            'simulation_executed':status.get('simulation_executed'),'strategy_engine':status.get('strategy_engine'),
            'cumulative_configs_archived':len(rows),
            'cumulative_configs_with_trades':sum(int(int(m.get('trades',0) or 0)>0) for m in metrics),
            'cumulative_sample_rankable':sum(int(bool(m.get('sample_pass_v11')) and not bool(m.get('exact_execution_duplicate'))) for m in metrics),
            'cumulative_baseline_qualified':sum(int(bool(m.get('baseline_qualified_v11')) and not bool(m.get('exact_execution_duplicate'))) for m in metrics),
            'cumulative_target_pf_2_to_8':sum(int(bool(m.get('target_candidate_v11')) and not bool(m.get('exact_execution_duplicate'))) for m in metrics),
            'cumulative_exact_execution_duplicates':sum(int(bool(m.get('exact_execution_duplicate'))) for m in metrics),
            'execution_hash_nonzero':len(hashes),'execution_hash_unique':len(set(hashes)),
            'top200_sample_pf_count':top200.get('count',0),'top100_qualified_count':qualified.get('count',0),
            'screening':{'target_pf_candidates_screened':screening.get('target_pf_candidates_screened',0),'preportfolio_pass':screening.get('preportfolio_pass_count',0),'portfolio_draft':screening.get('portfolio_draft_count',0),'top100_compliant':final.get('count',0)},
            'portfolio':final.get('portfolio',{})}
          assert strict.get('gate_a')=='PASS' and strict.get('crosscheck_bytes_verified') is True
          assert strict.get('no_resampling_attested') is True and strict.get('timeframe')=='D1'
          assert str(strict.get('primary_end_utc',''))[:4] >= '2026'
          assert status.get('gate_a')=='PASS' and status.get('simulation_executed') is True
          assert status.get('strategy_engine')=='RUNNING' and status.get('rules_sha256')==rules_sha
          assert status.get('parallel_workers')==20 and status.get('authoritative') is True
          assert promotion.get('status')=='PASS' and promotion.get('authoritative') is True
          assert promotion.get('single_writer_promotion') is True and promotion.get('global_exact_ledger_dedupe_executed') is True
          assert int(status.get('minimum_trades'))==300 and float(status.get('pf_target_min'))==2.0
          assert int(status.get('candidate_cursor')) == int(os.environ['SOURCE_CURSOR']) + int(os.environ['RAW_CURSOR_COUNT'])
          if final.get('count',0):
            assert final.get('portfolio',{}).get('required_coverage_complete') is True
            assert final.get('portfolio',{}).get('family_cap_complete') is True
            assert all(float(x.get('correlation_max',0))<=0.50 for x in final.get('ranking',[]))
          (root/'VALIDATION_SUMMARY_V11.json').write_text(json.dumps(summary,indent=2,sort_keys=True))
          print(json.dumps({k:v for k,v in summary.items() if k not in {'promotion','gate_a_strict','portfolio'}},indent=2,sort_keys=True))
          PY

      - name: Publish authoritative 20-worker runtime proof race-safe
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/gold24-runtime-publish"
          rm -rf "$PAYLOAD"; mkdir -p "$PAYLOAD"
          cp "$GOLD24_STATE_DIR/status_v11.json" "$PAYLOAD/latest_status.json"
          cp "$GOLD24_STATE_DIR/gate_a/gate_a_receipt.json" "$PAYLOAD/latest_gate_a_receipt.json"
          cp "$GOLD24_STATE_DIR/STRICT_GATE_A_AUDIT.json" "$PAYLOAD/latest_strict_gate_a.json"
          cp "$GOLD24_STATE_DIR/TOP200_SAMPLE_PF_V11.json" "$PAYLOAD/latest_top200_sample_pf.json"
          cp "$GOLD24_STATE_DIR/TOP100_QUALIFIED_V11.json" "$PAYLOAD/latest_top100_qualified.json"
          cp "$GOLD24_STATE_DIR/SCREENING_V11.json" "$PAYLOAD/latest_screening.json"
          cp "$GOLD24_STATE_DIR/TOP100_COMPLIANT_V11.json" "$PAYLOAD/latest_top100_compliant.json"
          cp "$GOLD24_STATE_DIR/VALIDATION_SUMMARY_V11.json" "$PAYLOAD/latest_validation_summary.json"
          cp "$GOLD24_STATE_DIR/PARALLEL_CANONICAL_PROMOTION_V11.json" "$PAYLOAD/latest_parallel_canonical_promotion.json"
          LATEST="$(find "$GOLD24_STATE_DIR/receipts_v11" -name 'batch_*.json' -type f | sort | tail -1)"
          test -n "$LATEST"; cp "$LATEST" "$PAYLOAD/latest_batch_receipt.json"
          git config user.name 'gold24-bot'
          git config user.email 'gold24-bot@users.noreply.github.com'
          for TRY in 1 2 3 4 5; do
            git fetch origin main
            git show origin/main:backtest/gold24/runtime_v11/latest_validation_summary.json > "$RUNNER_TEMP/current-main-validation.json"
            python - <<'PY'
          import json, os, pathlib
          current=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'] + '/current-main-validation.json').read_text())
          candidate=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'] + '/gold24-runtime-publish/latest_validation_summary.json').read_text())
          cc=int(candidate['candidate_cursor']); mc=int(current.get('candidate_cursor',0))
          ca=int(candidate['cumulative_configs_archived']); ma=int(current.get('cumulative_configs_archived',0))
          assert cc >= mc, f'REFUSE_STALE_CURSOR candidate={cc} current_main={mc}'
          assert ca >= ma, f'REFUSE_STALE_ARCHIVE candidate={ca} current_main={ma}'
          print(f'monotonic publish gate: PASS candidate_cursor={cc} current_cursor={mc} candidate_archived={ca} current_archived={ma}')
          PY
            git reset --hard origin/main
            mkdir -p backtest/gold24/runtime_v11
            cp -a "$PAYLOAD/." backtest/gold24/runtime_v11/
            git add backtest/gold24/runtime_v11
            if git diff --cached --quiet; then
              echo 'runtime already identical'; break
            fi
            git commit -m 'chore(gold24): publish authoritative 20-worker v11 proof [skip ci]'
            if git push origin HEAD:main; then
              echo '20-worker runtime publish: PASS'
              break
            fi
            test "$TRY" -lt 5
            sleep $((TRY * 2))
          done

      - name: Verify authoritative 20-worker read-back
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:backtest/gold24/runtime_v11/latest_validation_summary.json > "$RUNNER_TEMP/readback.json"
          python - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/readback.json'))
          assert x['validation']=='PASS'
          assert x['policy']=='GOLD_CANONICAL_V11_20260828'
          assert str(x['github_run_id'])==os.environ['GITHUB_RUN_ID']
          assert x['parallel_workers']==20
          assert x['authoritative_parallel'] is True
          assert x['single_writer_promotion'] is True
          assert x['global_exact_ledger_dedupe_executed'] is True
          assert x['worker_mode']=='20_LOGICAL_PROCESS_WORKERS_SINGLE_RUNNER_SINGLE_WRITER_PROMOTION'
          assert int(x['candidate_cursor']) > int(os.environ['SOURCE_CURSOR'])
          assert int(x['cumulative_configs_archived']) >= int(os.environ['SOURCE_ARCHIVED'])
          print('authoritative 20-worker canonical readback: PASS')
          PY

      - name: Upload authoritative resumable 20-worker canonical state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-v11-state
          path: ${{ env.GOLD24_STATE_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
