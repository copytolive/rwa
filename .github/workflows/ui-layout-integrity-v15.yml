name: RWA Target V4 Layout Integrity

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "tools/ui-layout-integrity-v15-browser.mjs"
      - ".github/workflows/ui-layout-integrity-v15.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "tools/ui-layout-integrity-v15-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax
        run: |
          node --check rwa-live-home-v1.js
          node --check tools/ui-layout-integrity-v15-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve target and run layout acceptance
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/ui-layout-integrity-v17
        run: |
          mkdir -p /tmp/rwa-ui-site/rwa
          cp -a . /tmp/rwa-ui-site/rwa/
          cd /tmp/rwa-ui-site
          python -m http.server 4173 >/tmp/rwa-ui-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/ui-layout-integrity-v15-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-v4-layout-${{ github.sha }}
          path: proof/ui-layout-integrity-v17/
          retention-days: 30
          if-no-files-found: error
