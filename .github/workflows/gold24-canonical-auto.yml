name: GOLD24 Canonical Auto Backtest

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'backtest/gold24/tradingview_gate_a.py'
      - 'backtest/gold24/weekly_profit_runner.py'
      - 'backtest/gold24/weekly_metrics.py'
      - 'backtest/gold24/core.py'
      - 'backtest/gold24/store.py'
      - 'backtest/gold24/RULES_GOAL_RR12_2026.md'
      - 'backtest/gold24/GITHUB_RUNNER_KICK'
      - '.github/workflows/gold24-canonical-auto.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-canonical-auto
  cancel-in-progress: false

jobs:
  canonical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOLD24_STATE_DIR: ${{ github.workspace }}/.gold24-canonical
      GOLD24_TIMEFRAME: D1
      GOLD24_BATCH_SIZE: '32'
      GOLD24_FLAT_LOT: '1.0'
      GOLD24_SEED: '20260828'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          pip install -r backtest/gold24/requirements.txt
          pip install 'websocket-client>=1.8,<2' 'requests>=2.32,<3'
          pip install 'git+https://github.com/rongardF/tvdatafeed.git@e6f6aaa7de439ac6e454d9b26d2760ded8dc4923'

      - name: Restore frozen canonical state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GOLD24_STATE_DIR" "$RUNNER_TEMP/gold24-prev"
          mkdir -p "$GOLD24_STATE_DIR" "$RUNNER_TEMP/gold24-prev"
          PREV="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gold24-canonical-auto.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            gh run download "$PREV" --repo "$GITHUB_REPOSITORY" -n gold24-canonical-state -D "$RUNNER_TEMP/gold24-prev" || true
          fi
          if [ -f "$RUNNER_TEMP/gold24-prev/gate_a/gate_a_receipt.json" ] && [ -f "$RUNNER_TEMP/gold24-prev/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv" ]; then
            PASS="$(python -c 'import json,sys; print(str(bool(json.load(open(sys.argv[1])).get("crosscheck_pass"))).lower())' "$RUNNER_TEMP/gold24-prev/gate_a/gate_a_receipt.json")"
            END_YEAR="$(python -c 'import json,sys; x=json.load(open(sys.argv[1])); print(str(x.get("primary_end_utc", ""))[:4])' "$RUNNER_TEMP/gold24-prev/gate_a/gate_a_receipt.json")"
            if [ "$PASS" = "true" ] && [ "${END_YEAR:-0}" -ge 2026 ]; then
              cp -a "$RUNNER_TEMP/gold24-prev/." "$GOLD24_STATE_DIR/"
              echo 'GOLD24_CANONICAL_RESTORED=true' >> "$GITHUB_ENV"
              echo "Restored frozen Gate-A PASS state from run $PREV; search will continue without resetting candidate history."
            fi
          fi
          if [ ! -f "$GOLD24_STATE_DIR/gate_a/gate_a_receipt.json" ]; then
            echo 'GOLD24_CANONICAL_RESTORED=false' >> "$GITHUB_ENV"
          fi

      - name: Bootstrap true-source TradingView Gate A material when needed
        if: env.GOLD24_CANONICAL_RESTORED != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/gold24-data"
          mkdir -p "$RUNNER_TEMP/gold24-data" "$GOLD24_STATE_DIR/gate_a"
          python backtest/gold24/tradingview_gate_a.py --out-dir "$RUNNER_TEMP/gold24-data" --bars 6500
          cp -a "$RUNNER_TEMP/gold24-data/." "$GOLD24_STATE_DIR/gate_a/"

      - name: Verify frozen Gate A receipt and canonical dataset hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.gold24-canonical/gate_a')
          receipt = json.loads((root/'gate_a_receipt.json').read_text())
          data = root/'GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv'
          got = hashlib.sha256(data.read_bytes()).hexdigest()
          assert receipt.get('crosscheck_pass') is True, 'Gate A receipt is not PASS'
          assert str(receipt.get('primary_end_utc',''))[:4] >= '2026', 'canonical data does not reach 2026'
          assert receipt.get('primary_sha256') == got, 'canonical dataset SHA differs from Gate A receipt'
          print(json.dumps({'gate_a':'PASS','primary_sha256':got,'end_utc':receipt.get('primary_end_utc')}, sort_keys=True))
          PY

      - name: Run one legal canonical batch
        working-directory: backtest/gold24
        env:
          GOLD24_DATASET: ${{ github.workspace }}/.gold24-canonical/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
          GOLD24_CROSSCHECK: ${{ github.workspace }}/.gold24-canonical/gate_a/gate_a_receipt.json
        run: |
          set -euo pipefail
          python weekly_profit_runner.py --self-test
          python weekly_profit_runner.py --once

      - name: Show canonical status and latest receipt
        if: always()
        shell: bash
        run: |
          set -u
          echo '===== GATE A ====='
          cat "$GOLD24_STATE_DIR/gate_a/gate_a_receipt.json" 2>/dev/null || true
          echo '===== STATUS ====='
          cat "$GOLD24_STATE_DIR/status.json" 2>/dev/null || true
          echo '===== LATEST BATCH RECEIPT ====='
          LATEST="$(find "$GOLD24_STATE_DIR/weekly_profit_receipts" -name 'batch_*.json' -type f 2>/dev/null | sort | tail -1)"
          [ -z "$LATEST" ] || cat "$LATEST"

      - name: Publish compact runtime proof to repository
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backtest/gold24/runtime
          [ ! -f "$GOLD24_STATE_DIR/status.json" ] || cp "$GOLD24_STATE_DIR/status.json" backtest/gold24/runtime/latest_status.json
          [ ! -f "$GOLD24_STATE_DIR/gate_a/gate_a_receipt.json" ] || cp "$GOLD24_STATE_DIR/gate_a/gate_a_receipt.json" backtest/gold24/runtime/latest_gate_a_receipt.json
          LATEST="$(find "$GOLD24_STATE_DIR/weekly_profit_receipts" -name 'batch_*.json' -type f 2>/dev/null | sort | tail -1)"
          [ -z "$LATEST" ] || cp "$LATEST" backtest/gold24/runtime/latest_batch_receipt.json
          [ ! -f "$GOLD24_STATE_DIR/TOP200_WEEKLY_PROFIT.json" ] || cp "$GOLD24_STATE_DIR/TOP200_WEEKLY_PROFIT.json" backtest/gold24/runtime/latest_top200.json
          git config user.name 'gold24-bot'
          git config user.email 'gold24-bot@users.noreply.github.com'
          git add backtest/gold24/runtime
          if ! git diff --cached --quiet; then
            git commit -m 'chore(gold24): publish canonical runtime proof [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No runtime proof changes to publish.'
          fi

      - name: Upload resumable canonical state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold24-canonical-state
          path: ${{ env.GOLD24_STATE_DIR }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
