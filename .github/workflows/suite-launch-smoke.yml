name: RWA Suite Launch Controls Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "suite.js"
      - "ops-suite.js"
      - "rwa-verify-client.js"
      - "launch-status.js"
      - "copy-24x7-client.js"
      - "beta-proof-client.js"
      - ".github/workflows/suite-launch-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  suite-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate suite launch extensions
        run: |
          node --check suite.js
          node --check ops-suite.js
          node --check rwa-verify-client.js
          node --check launch-status.js
          node --check copy-24x7-client.js
          node --check beta-proof-client.js
          grep -Fq 'ops-suite.js?v=2' suite.js
          grep -Fq 'rwa-verify-client.js?v=2' suite.js
          grep -Fq 'launch-status.js?v=2' suite.js
          grep -Fq 'copy-24x7-client.js?v=2' suite.js
          grep -Fq 'beta-proof-client.js?v=1' suite.js
          grep -Fq 'public-https-distinct-probed-v1' tools/rwa-evidence-policy.mjs
          grep -Fq 'BETA_PROOF_JSON_START' beta-proof-client.js
      - name: Verify live GitHub Pages extension bundle
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            suite="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite.js?v=$q" || true)"
            copy="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/copy-24x7-client.js?v=$q" || true)"
            beta="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/beta-proof-client.js?v=$q" || true)"
            launch="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/launch-status.js?v=$q" || true)"
            if grep -Fq 'copy-24x7-client.js?v=2' <<<"$suite" \
              && grep -Fq 'beta-proof-client.js?v=1' <<<"$suite" \
              && grep -Fq 'RWA 24/7 COPY AUTHORIZE V2' <<<"$copy" \
              && grep -Fq 'BETA_PROOF_JSON_START' <<<"$beta" \
              && grep -Fq 'MAINNET PUBLIC LAUNCH' <<<"$launch"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish suite launch status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/suite-launch-live' -f description='RWA verify + 24x7 worker + beta proof + launch controls live'
