name: RENKO GOLD Bidirectional Zoom Production

on:
  push:
    branches:
      - feat/renko-gold-total-history-2003-2026
    paths:
      - 'renko/index.html'
      - 'renko/renko-chart-bridge.js'
      - 'renko/renko-gold-manual-viewport-lock.js'
      - 'renko/renko-gold-recent-history.js'
      - 'renko/renko-gold-total-history.js'
      - '.github/workflows/renko-gold-ui-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: GOLD production gate
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-chart-bridge.js
          node --check renko/renko-gold-manual-viewport-lock.js
          node --check renko/renko-gold-recent-history.js
          node --check renko/renko-gold-total-history.js
          grep -q 'renko-gold-manual-viewport-lock.js' renko/index.html
          python3 - <<'PY'
          import json
          m=json.load(open('renko/history/gold/full-manifest.json'))
          c=json.load(open('renko/history/gold/coverage.json'))
          assert m['provider']=='Dukascopy'
          assert m['instrumentCode']=='XAU-USD'
          assert m['symbol']=='XAUUSD'
          assert m['interval']=='1s'
          assert m['backfillComplete'] is True
          assert c['backfillComplete'] is True
          assert c['sourceUnavailableHours']==0
          assert c['originWitnessSatisfied'] is True
          assert c['earliestSecond']==1052092863
          assert len(m['months'])==280
          print('GOLD_DATA_GATE_PASS',len(m['months']),c['barCount'],c['earliestSecond'],c['latestSecond'])
          PY
          if find . -type f -name 'xauusd-s1-*.csv.gz' -print -quit | grep -q .; then
            echo 'large canonical GOLD CSV gzip leaked into Pages tree'
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy GOLD UI
        uses: actions/deploy-pages@v4

  public-ui-proof:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait exact deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            got="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "GOLD_UI_SHA_PASS $got"
              exit 0
            fi
            sleep 5
          done
          echo 'Pages did not converge to expected SHA'
          exit 1
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify real zoom-out and zoom-in never snap back
        shell: bash
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1672,height:941}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://copytolive.github.io/rwa/renko/?gold=1&bidirZoomProof=2',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecent==='true'&&document.querySelector('#chartHost canvas')&&window.RWARenkoGoldManualViewport&&window.RWARenkoGoldViewport,{timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldManualViewportRebuildGuard==='true'&&document.documentElement.dataset.renkoGoldManualViewportRangeObserver==='true',{timeout:15000});
          await page.waitForTimeout(700);

          const snap=()=>page.evaluate(()=>{
            const T=window.RWARenkoTV,M=window.RWARenkoGoldManualViewport,r=window.__RWARenkoChart.timeScale().getVisibleLogicalRange();
            return {range:r,span:r?Number(r.to)-Number(r.from):NaN,locked:M.locked,following:T.state.following,method:T.settings.method,rebuilds:M.stats.rebuilds,zoomOut:M.stats.zoomOutCommands,zoomIn:M.stats.zoomInCommands,wheelEvents:M.stats.wheelEvents,guardVersion:M.version};
          });
          const delta=(a,b)=>Math.max(Math.abs(Number(a.range.from)-Number(b.range.from)),Math.abs(Number(a.range.to)-Number(b.range.to)));
          async function rebuildStorm(){
            for(let i=0;i<4;i++){
              await page.evaluate(()=>window.RWARenkoTV.rebuild({fit:true}));
              await page.waitForTimeout(180);
            }
            await page.waitForTimeout(300);
          }
          async function label(text,data){
            await page.evaluate(({text,data})=>{
              document.getElementById('zoomProof')?.remove();const wrap=document.getElementById('chartWrap'),e=document.createElement('div');e.id='zoomProof';
              e.style.cssText='position:absolute;left:16px;top:16px;z-index:99999;background:rgba(7,12,20,.94);border:1px solid #496078;border-radius:8px;padding:10px 12px;color:#eef5ff;font:700 12px/1.5 ui-monospace,Menlo,monospace;pointer-events:none';
              e.innerHTML=`<b style="font-size:14px">${text}</b><br>GOLD / XAUUSD · Dukascopy · fixed 1s<br>RANGE: ${Number(data.range.from).toFixed(2)} → ${Number(data.range.to).toFixed(2)} · SPAN ${Number(data.span).toFixed(2)}<br>MANUAL LOCK: ${data.locked?'PASS':'FAIL'} · following=${data.following}<br>REBUILD STABILITY: PASS · REBUILDS ${data.rebuilds}`;
              wrap.appendChild(e);
            },{text,data});
          }
          async function resetManual(){
            await page.evaluate(()=>{window.RWARenkoGoldManualViewport.unlock('proof-reset');window.RWARenkoGoldViewport?.unlockViewport?.('proof-reset')});
            await page.click('#tvReset');await page.waitForTimeout(280);
          }
          async function setMethod(method){
            await resetManual();
            const ok=await page.evaluate(async method=>method==='atr'?await window.RWARenkoATRControl.applyLocal(14,'bidir-proof'):window.RWARenkoTraditionalControl.activate(1,'bidir-proof',false,false),method);
            if(!ok)throw new Error(method+' method apply failed');
            await page.waitForTimeout(300);await resetManual();
          }
          async function testMethod(method,prefix){
            await setMethod(method);
            const initial=await snap();
            for(let i=0;i<4;i++){await page.click('#tvZoomOut');await page.waitForTimeout(100)}
            await page.waitForTimeout(300);
            const outBefore=await snap();
            if(!outBefore.locked||outBefore.following!==false||!(outBefore.span>initial.span+1))throw new Error(method+' real zoom-out failed '+JSON.stringify({initial,outBefore}));
            await rebuildStorm();const outAfter=await snap();
            if(delta(outBefore,outAfter)>=0.05||!outAfter.locked||outAfter.following!==false)throw new Error(method+' zoom-out snapped back '+JSON.stringify({outBefore,outAfter}));
            await label(method.toUpperCase()+' · ZOOM OUT · STAYS HERE',outAfter);await page.screenshot({path:`proof/${prefix}-zoom-out-stable.png`,fullPage:false});

            for(let i=0;i<3;i++){await page.click('#tvZoomIn');await page.waitForTimeout(100)}
            await page.waitForTimeout(300);
            const inBefore=await snap();
            if(!inBefore.locked||inBefore.following!==false||!(inBefore.span<outAfter.span-1))throw new Error(method+' real zoom-in failed '+JSON.stringify({outAfter,inBefore}));
            await rebuildStorm();const inAfter=await snap();
            if(delta(inBefore,inAfter)>=0.05||!inAfter.locked||inAfter.following!==false)throw new Error(method+' zoom-in snapped back '+JSON.stringify({inBefore,inAfter}));
            await label(method.toUpperCase()+' · ZOOM IN · STAYS HERE',inAfter);await page.screenshot({path:`proof/${prefix}-zoom-in-stable.png`,fullPage:false});
            return {initial,outBefore,outAfter,outDelta:delta(outBefore,outAfter),inBefore,inAfter,inDelta:delta(inBefore,inAfter)};
          }

          const atr=await testMethod('atr','01-atr');
          const traditional=await testMethod('traditional','03-traditional');

          await resetManual();await page.hover('#chartHost');
          await page.mouse.wheel(0,-900);await page.waitForTimeout(350);
          const wheelBefore=await snap();
          if(!wheelBefore.locked||wheelBefore.following!==false)throw new Error('wheel/trackpad did not acquire manual viewport '+JSON.stringify(wheelBefore));
          await rebuildStorm();const wheelAfter=await snap();
          if(delta(wheelBefore,wheelAfter)>=0.05||wheelAfter.following!==false)throw new Error('wheel/trackpad viewport snapped back '+JSON.stringify({wheelBefore,wheelAfter}));

          await page.click('#tvLive');await page.waitForTimeout(250);const released=await snap();
          if(released.locked)throw new Error('LIVE did not release manual viewport '+JSON.stringify(released));
          if(errors.length)throw new Error('page errors '+JSON.stringify(errors));
          const proof={productionSha:process.env.GITHUB_SHA,guardVersion:(await snap()).guardVersion,atr,traditional,wheel:{before:wheelBefore,after:wheelAfter,delta:delta(wheelBefore,wheelAfter)},released,errors};
          fs.writeFileSync('proof/proof.json',JSON.stringify(proof,null,2));
          console.log('GOLD_BIDIRECTIONAL_ZOOM_PASS',JSON.stringify({sha:process.env.GITHUB_SHA,atrOut:atr.outDelta,atrIn:atr.inDelta,traditionalOut:traditional.outDelta,traditionalIn:traditional.inDelta,wheel:proof.wheel.delta,guard:proof.guardVersion}));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-bidirectional-zoom-proof
          path: proof/
          retention-days: 30
