name: RENKO GOLD Clean UI Production

on:
  push:
    branches:
      - feat/renko-gold-total-history-2003-2026
    paths:
      - 'renko/renko-chart-bridge.js'
      - 'renko/renko-gold-recent-history.js'
      - '.github/workflows/renko-gold-ui-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: GOLD-only production gate
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-chart-bridge.js
          node --check renko/renko-gold-recent-history.js
          python3 - <<'PY'
          import json
          m=json.load(open('renko/history/gold/full-manifest.json'))
          c=json.load(open('renko/history/gold/coverage.json'))
          assert m['provider']=='Dukascopy'
          assert m['instrumentCode']=='XAU-USD'
          assert m['symbol']=='XAUUSD'
          assert m['interval']=='1s'
          assert m['backfillComplete'] is True
          assert c['backfillComplete'] is True
          assert c['sourceUnavailableHours']==0
          print('GOLD_DATA_GATE_PASS', len(m['months']), c['barCount'])
          PY
          if find . -type f -name 'xauusd-s1-*.csv.gz' -print -quit | grep -q .; then
            echo 'large canonical GOLD CSV gzip leaked into Pages tree'
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy clean GOLD-only UI
        uses: actions/deploy-pages@v4

  public-ui-proof:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait exact deployed SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            got="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "GOLD_UI_SHA_PASS $got"
              exit 0
            fi
            sleep 5
          done
          echo 'Pages did not converge to expected SHA'
          exit 1
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify clean GOLD-only layout and capture screenshot
        shell: bash
        run: |
          mkdir -p proof
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1672,height:941}});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://copytolive.github.io/rwa/renko/?gold=1&cleanProof=1',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecent==='true'&&document.querySelector('#chartHost canvas'),{timeout:60000});
          await page.waitForTimeout(1200);
          const proof=await page.evaluate(()=>{
            const vis=el=>!!el&&getComputedStyle(el).display!=='none'&&getComputedStyle(el).visibility!=='hidden'&&!el.hidden&&el.getBoundingClientRect().width>0&&el.getBoundingClientRect().height>0;
            const chart=document.getElementById('chartWrap')?.getBoundingClientRect();
            const host=document.getElementById('chartHost')?.getBoundingClientRect();
            return {
              downloadedOnly:document.documentElement.dataset.renkoDownloadedOnly,
              pair:document.getElementById('pairName')?.textContent?.trim(),
              symbol:window.RWARenkoTV?.state?.symbol,
              provider:window.RWARenkoTV?.state?.historyMeta?.provider,
              marketsVisible:vis(document.querySelector('.markets')),
              openPairsVisible:vis(document.getElementById('openPairs')),
              easybarVisible:vis(document.querySelector('.easybar')),
              sourceCardVisible:vis(document.querySelector('.source-card')),
              statsVisible:vis(document.querySelector('.instrument-bar .stats')),
              methodCardVisible:vis(document.querySelector('.method-card')),
              summaryVisible:vis(document.querySelector('.summary')),
              chartWidth:Math.round(chart?.width||0),
              chartHeight:Math.round(chart?.height||0),
              hostWidth:Math.round(host?.width||0),
              hostHeight:Math.round(host?.height||0),
              viewport:{width:innerWidth,height:innerHeight},
              listChildren:document.getElementById('pairList')?.childElementCount||0,
              errors:[]
            };
          });
          proof.errors=errors;
          if(proof.downloadedOnly!=='gold')throw new Error('downloaded-only lock missing '+JSON.stringify(proof));
          if(proof.pair!=='XAU / USD'||proof.symbol!=='XAUUSD'||proof.provider!=='Dukascopy')throw new Error('GOLD identity mismatch '+JSON.stringify(proof));
          if(proof.marketsVisible||proof.openPairsVisible||proof.easybarVisible||proof.sourceCardVisible||proof.statsVisible||proof.summaryVisible)throw new Error('unused area still visible '+JSON.stringify(proof));
          if(!proof.methodCardVisible)throw new Error('ATR/Traditional controls must remain visible '+JSON.stringify(proof));
          if(proof.listChildren!==0)throw new Error('non-GOLD pair rows still present '+JSON.stringify(proof));
          if(proof.chartWidth<1600||proof.chartHeight<620||proof.hostWidth<1600)throw new Error('chart not enlarged enough '+JSON.stringify(proof));
          if(errors.length)throw new Error('page errors '+JSON.stringify(errors));
          await page.screenshot({path:'proof/gold-clean-only.png',fullPage:true});
          await import('node:fs').then(fs=>fs.writeFileSync('proof/proof.json',JSON.stringify(proof,null,2)));
          console.log('GOLD_CLEAN_UI_PUBLIC_PASS',JSON.stringify(proof));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-clean-ui-proof
          path: proof/
          retention-days: 30
