name: action-viewport-hotfix
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('superapp-v5.js')
          s=p.read_text()
          old="    const ex=$('rwaExchange')||$('terminal');\n    ex?.scrollIntoView({behavior:'smooth',block:'start'});"
          new="    /* RWA_ACTION_VIEWPORT_STABILITY_V6: Trade initialization must never move the root viewport. */\n    const ex=$('rwaExchange')||$('terminal');\n    if(ex)ex.dataset.rwaTradeReady='1';"
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          p=Path('index.html')
          s=p.read_text()
          assert s.count('superapp-v5.js?v=16')==1
          p.write_text(s.replace('superapp-v5.js?v=16','superapp-v5.js?v=17',1))
          PY
          rm .github/workflows/action-viewport-stability-hotfix.yml
          node --check superapp-v5.js
          grep -Fq RWA_ACTION_VIEWPORT_STABILITY_V6 superapp-v5.js
          grep -Fq 'superapp-v5.js?v=17' index.html
          git diff --check
      - name: commit
        shell: bash
        run: |
          git config user.name copytolive-actions
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Fix Action navigation viewport stability'
          git push origin HEAD:fix/action-viewport-stability-v6-20260827
