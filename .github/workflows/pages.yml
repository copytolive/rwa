name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages-${{ github.event_name }}"
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check mobile.js
      - name: Verify production files
        run: test -s index.html && test -s app.js && test -s mobile.js && test -s styles.css && test -s mobile.css

  deploy:
    if: github.event_name != 'issues'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  issue_verify:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate social source
        run: |
          node --check app.js
          node --check mobile.js
          grep -q "RWA SOCIAL" index.html
          grep -q "social-screen" mobile.css
      - name: Verify social production
        run: |
          ok=0
          for i in {1..12}; do
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/?social=${GITHUB_RUN_ID}-${i}" | grep -q "RWA SOCIAL"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "SOCIAL MOBILE DEPLOYMENT SUCCESS. app.js + mobile.js syntax valid and RWA SOCIAL verified on production: https://narzulalistiqlal.github.io/rwa/"
