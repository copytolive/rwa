name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Actions started
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "GitHub Actions is running. Starting Pages deployment."
      - name: Diagnostic output
        run: echo "GitHub Actions started successfully"

  deploy:
    needs: diagnostic
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
