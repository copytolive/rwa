name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check mobile.js
          node --check suite-ui.js
          node --check suite.js
          node --check suite-nav.js
          node --check backtest/app.js
          node --check backtest/worker.js

      - name: Verify production files
        run: |
          test -s index.html
          test -s app.js
          test -s mobile.js
          test -s styles.css
          test -s mobile.css
          test -s suite-ui.js
          test -s suite.js
          test -s suite-nav.js
          test -s suite.css
          test -s rwa-assets.json
          python -m json.tool rwa-assets.json >/dev/null
          test -s backtest/index.html
          test -s backtest/app.js
          test -s backtest/worker.js
          test -s backtest/styles.css
          test -s backtest/data/manifest.json
          test -s backtest/results/campaign.json
          test -s backtest/results/evaluation_ids.json
          test -s backtest/results/latest_batch.json
          test -s backtest/results/batches.json

      - name: Validate VectorForge ledger, DOM contract and source catalog
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path('backtest/data/manifest.json').read_text())
          campaign = json.loads(Path('backtest/results/campaign.json').read_text())
          ids = json.loads(Path('backtest/results/evaluation_ids.json').read_text()).get('ids', [])
          batches = json.loads(Path('backtest/results/batches.json').read_text()).get('batches', [])
          html = Path('backtest/index.html').read_text()
          app = Path('backtest/app.js').read_text()

          files = manifest.get('files', [])
          months = [x.get('month') for x in files]
          assert len(files) == 111, f'expected 111 source files, got {len(files)}'
          assert len(set(months)) == len(months), 'duplicate source months in manifest'
          assert months[0] == '2009-05' and months[-1] == '2018-07', 'coverage mismatch'
          assert campaign['target_evaluations'] == 1_000_000_000_000
          assert len(ids) == len(set(ids)), 'duplicate evaluation IDs persisted'
          assert campaign['verified_completed'] == len(set(ids)), 'ledger count != unique evaluation IDs'
          assert campaign['verified_completed'] <= campaign['target_evaluations']
          assert all(len(x.get('dataset_sha256', '')) == 64 for x in batches), 'invalid batch dataset hash'

          html_ids = set(re.findall(r'id=["\']([^"\']+)', html))
          app_ids = set(re.findall(r"\$\('([^']+)'\)", app))
          missing = sorted(app_ids - html_ids)
          assert not missing, f'app.js references missing DOM ids: {missing}'

          print(
              f"VectorForge QA PASS: {len(files)} source files, "
              f"{len(set(ids))} verified evaluations, {len(batches)} batch records"
          )
          PY

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
