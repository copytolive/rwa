name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "monitor/status.json"
      - "docs/workflow-archive/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rwa-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current Super App source and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html superapp-v5.js superapp-v5.css rwa-sw-v5.js suite-nav.js \
            execution-api.js execution-ops-bridge.js exchange-core.js \
            rwa-execution-config.json token/config.json manifest.webmanifest rwa-discovery-catalog.json \
            tools/superapp-v5-audit.mjs tools/superapp-v5-browser.mjs \
            tools/superapp-p16-p20-audit.mjs tools/superapp-p16-p20-browser.mjs \
            tools/security-gate.mjs; do test -s "$f"; done

          node --check superapp-v5.js
          node --check rwa-sw-v5.js
          node --check suite-nav.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check tools/superapp-v5-audit.mjs
          node --check tools/superapp-v5-browser.mjs
          node --check tools/superapp-p16-p20-audit.mjs
          node --check tools/superapp-p16-p20-browser.mjs
          node --check tools/security-gate.mjs

          python -m json.tool rwa-execution-config.json >/dev/null
          python -m json.tool token/config.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool rwa-discovery-catalog.json >/dev/null

          SUPER_CSS_REF="$(grep -oE 'superapp-v5\.css\?v=[0-9]+' index.html | head -1)"
          SUPER_JS_REF="$(grep -oE 'superapp-v5\.js\?v=[0-9]+' index.html | head -1)"
          test -n "$SUPER_CSS_REF"
          test -n "$SUPER_JS_REF"
          grep -Fq "./$SUPER_CSS_REF" rwa-sw-v5.js
          grep -Fq "./$SUPER_JS_REF" rwa-sw-v5.js
          grep -Fq 'realtime-core.js?v=3' index.html
          grep -Fq 'market-performance.js?v=2' index.html
          ! grep -Fq 'product-os-v3.js' index.html
          ! grep -Fq 'product-os-mobile-contract-v3.js' index.html
          ! grep -Fq 'walletconnect.js' index.html
          ! grep -Fq 'wallet-core.js' index.html
          ! grep -Fq 'unified-design-v3.css' index.html
          ! grep -Fq 'browser-recovery.js' index.html

          grep -Fq 'walletconnect.js?v=4' suite-nav.js
          grep -Fq 'execution-api.js?v=4' suite-nav.js
          grep -Fq 'execution-ops-bridge.js?v=4' suite-nav.js
          grep -Fq 'suite-execution-patch.js?v=6' suite-nav.js

          grep -Fq '"enabled": false' rwa-execution-config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          ! grep -Fq 'ExchangeClient' execution-ops-bridge.js

          node tools/superapp-v5-audit.mjs
          node tools/superapp-p16-p20-audit.mjs
          node tools/security-gate.mjs

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run current Super App browser regressions locally
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rwa-superapp-site/rwa
          cp -a . /tmp/rwa-superapp-site/rwa/
          cd /tmp/rwa-superapp-site
          python -m http.server 4173 >/tmp/rwa-superapp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/superapp-v5-browser.mjs
          node tools/superapp-p16-p20-browser.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin RENKO V180 Vision deep-history runtime in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/renko-v15-controller-bootstrap\.js\?v=(154|158|170|171|180)/renko-v15-controller-bootstrap.js?v=180/g' renko/index.html
          grep -Fq 'renko-v15-controller-bootstrap.js?v=180' renko/index.html
          grep -Fq "renkoController:'180'" legacy-canonical.js
          grep -Fq "version:'1.8.0'" renko/renko-v15-method-controller-v170.js
          grep -Fq 'renko-v15-deep-history-worker.js?v=180' renko/renko-v15-method-controller-v170.js

      - name: Stamp exact deployed SHA
        run: printf '%s\n' "$GITHUB_SHA" > deployment-sha.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build failover backup package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p backup
          git archive --format=zip --output=backup/repo.zip "$GITHUB_SHA"
          git bundle create backup/repo.bundle --all
          git show-ref | sort > backup/refs.txt
          python - <<'PY'
          import json, os, datetime
          receipt={
            "name":"RWA-LIVE-SYNC",
            "version":"8.0",
            "timestamp":datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S'),
            "sha":os.environ['GITHUB_SHA'],
            "remote":"https://github.com/copytolive/rwa.git",
            "pages":"https://copytolive.github.io/rwa/",
            "gate":"pages-deploy-success"
          }
          open('backup/receipt.json','w').write(json.dumps(receipt,separators=(',',':'))+'\n')
          PY
          (cd backup && sha256sum repo.zip repo.bundle refs.txt receipt.json > SHA256SUMS.txt)
          git bundle verify backup/repo.bundle

      - name: Upload failover backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-live-sync-${{ github.sha }}
          path: backup/
          retention-days: 30
          if-no-files-found: error