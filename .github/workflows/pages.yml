name: Deploy RWA Trading UI v3 + MULTI CHAIN
# FINAL_TRADING_NO_ECOMMERCE_CERT

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "app.js"
      - "realtime-core.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - "wallet-core.js"
      - "walletconnect.js"
      - "superapp-v5.js"
      - "superapp-v5.css"
      - "styles.css"
      - "mobile.css"
      - "stable-shell.css"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rwa-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify trading-only root
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s chart-core.js
          test -s rwa-live-home-v1.js
          test -s rwa-multichain.js
          test -s rwa-multichain-engine.js
          test -s rwa-multichain-registry.json
          test -s execution-api.js
          test -s exchange-core.js
          grep -Fq '<strong>RWA</strong>' index.html
          grep -Fq 'data-rwa-target-nav="markets"' index.html
          grep -Fq 'id="fallbackChart"' index.html
          grep -Fq 'id="tvHost"' index.html
          grep -Fq 'rwaMultiChainLazyBootstrap' index.html
          grep -Fq "rwa-live-home-v1.js?v=3.2.0" chart-core.js
          grep -Fq "rwa-live-home-v1.css?v=3.2.0" chart-core.js
          ! grep -Fq "rwa-live-orderbook-v1.css" chart-core.js
          grep -Fq "openIntelligence" rwa-live-home-v1.js
          grep -Fq "openPortfolio" rwa-live-home-v1.js
          grep -Fq "openOrders" rwa-live-home-v1.js
          grep -Fq "openReports" rwa-live-home-v1.js
          ! grep -Fq "rwaContextBrief" index.html
          grep -Fq "Hyperliquid Testnet" rwa-live-home-v1.js
          grep -Fq "Mainnet locked" rwa-live-home-v1.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v2'" rwa-multichain.js
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          ! grep -Fq 'rwa-seablueprint-commerce-bridge.js' chart-core.js
          ! grep -Fq '/rwa/_next/' index.html
          ! grep -Eiq 'renko' index.html
          echo RWA_TRADING_UI_V3_SOURCE_PASS

      - name: Compose trading-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          rsync -a             --exclude='.git'             --exclude='.github'             --exclude='apps'             --exclude='tools'             --exclude='docs'             --exclude='qa'             --exclude='commerce-service'             --exclude='assets/ecommerce'             --exclude='rwa-commerce-*'             --exclude='rwa-ecommerce-*'             --exclude='rwa-seablueprint-*'             --exclude='rwa-storefront*'             --exclude='rwa-store-detail*'             --exclude='rwa-store-draft*'             --exclude='rwa-checkout-ui*'             --exclude='rwa-home-commerce*'             ./ site/
          touch site/.nojekyll
          echo "$GITHUB_SHA" > site/deployment-sha.txt
          test -s site/index.html
          test -s site/renko/index.html
          test -s site/backtest/index.html
          test -s site/rwa-multichain.js
          test -s site/execution-api.js
          test ! -e site/rwa-seablueprint-commerce-bridge.js
          test ! -e site/rwa-commerce-config.json
          test ! -e site/commerce-service
          echo RWA_TRADING_ONLY_ARTIFACT_PASS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  validate-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate public trading-only root
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          PASS=0
          for i in $(seq 1 36); do
            SHA="$(curl -fsSL --retry 2 "$BASE/deployment-sha.txt" 2>/dev/null || true)"
            if [ "$SHA" = "$GITHUB_SHA" ]; then PASS=1; break; fi
            sleep 5
          done
          test "$PASS" = 1
          curl -fsSL "$BASE/" > /tmp/root.html
          grep -Fq '<strong>RWA</strong>' /tmp/root.html
          grep -Fq 'id="fallbackChart"' /tmp/root.html
          grep -Fq 'id="tvHost"' /tmp/root.html
          grep -Fq 'rwaMultiChainLazyBootstrap' /tmp/root.html
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' /tmp/root.html
          ! grep -Fq '/rwa/_next/' /tmp/root.html
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$BASE/rwa-multichain.js")" = "200"
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$BASE/execution-api.js")" = "200"
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$BASE/rwa-seablueprint-commerce-bridge.js")" != "200"
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$BASE/rwa-commerce-config.json")" != "200"
          echo PUBLIC_RWA_TRADING_MULTICHAIN_PASS
