name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "monitor/status.json"
      - "docs/workflow-archive/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RENKO_SEED_CACHE_KEY: renko-sol-v185-seed-20260827

concurrency:
  group: rwa-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate current Super App source and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html superapp-v5.js superapp-v5.css rwa-sw-v5.js suite-nav.js \
            execution-api.js execution-ops-bridge.js exchange-core.js \
            rwa-execution-config.json token/config.json manifest.webmanifest rwa-discovery-catalog.json \
            tools/superapp-v5-audit.mjs tools/superapp-v5-browser.mjs \
            tools/superapp-p16-p20-audit.mjs tools/superapp-p16-p20-browser.mjs \
            tools/security-gate.mjs tools/build-renko-first-frame-preload.mjs \
            renko/renko-v15-first-frame-preload.js renko/renko-v15-method-controller-v186.js \
            renko/renko-v15-controller-bootstrap.js renko/renko-v15-mobile-first-frame.css; do test -s "$f"; done

          node --check superapp-v5.js
          node --check rwa-sw-v5.js
          node --check suite-nav.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check tools/superapp-v5-audit.mjs
          node --check tools/superapp-v5-browser.mjs
          node --check tools/superapp-p16-p20-audit.mjs
          node --check tools/superapp-p16-p20-browser.mjs
          node --check tools/security-gate.mjs
          node --check tools/build-renko-first-frame-preload.mjs
          node --check renko/renko-v15-first-frame-preload.js
          node --check renko/renko-v15-method-controller-v186.js
          node --check renko/renko-v15-controller-bootstrap.js

          python -m json.tool rwa-execution-config.json >/dev/null
          python -m json.tool token/config.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool rwa-discovery-catalog.json >/dev/null

          SUPER_CSS_REF="$(grep -oE 'superapp-v5\.css\?v=[0-9]+' index.html | head -1)"
          SUPER_JS_REF="$(grep -oE 'superapp-v5\.js\?v=[0-9]+' index.html | head -1)"
          test -n "$SUPER_CSS_REF"
          test -n "$SUPER_JS_REF"
          grep -Fq "./$SUPER_CSS_REF" rwa-sw-v5.js
          grep -Fq "./$SUPER_JS_REF" rwa-sw-v5.js
          grep -Fq 'realtime-core.js?v=3' index.html
          grep -Fq 'market-performance.js?v=9' index.html
          ! grep -Fq 'product-os-v3.js' index.html
          ! grep -Fq 'product-os-mobile-contract-v3.js' index.html
          ! grep -Fq 'walletconnect.js' index.html
          ! grep -Fq 'wallet-core.js' index.html
          ! grep -Fq 'unified-design-v3.css' index.html
          ! grep -Fq 'browser-recovery.js' index.html

          grep -Fq 'walletconnect.js?v=4' suite-nav.js
          grep -Fq 'execution-api.js?v=4' suite-nav.js
          grep -Fq 'execution-ops-bridge.js?v=4' suite-nav.js
          grep -Fq 'suite-execution-patch.js?v=6' suite-nav.js

          grep -Fq '"enabled": false' rwa-execution-config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          ! grep -Fq 'ExchangeClient' execution-ops-bridge.js

          grep -Fq 'renko-v15-controller-bootstrap.js?v=186' renko/index.html
          grep -Fq "renkoController:'186'" legacy-canonical.js
          grep -Fq "dataset.renkoMethodBootstrap='186'" renko/renko-v15-controller-bootstrap.js
          grep -Fq "version:'1.9.0'" renko/renko-v15-method-controller-v186.js

          node tools/superapp-v5-audit.mjs
          node tools/superapp-p16-p20-audit.mjs
          node tools/security-gate.mjs

      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run current Super App browser regressions locally
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rwa-superapp-site/rwa
          cp -a . /tmp/rwa-superapp-site/rwa/
          cd /tmp/rwa-superapp-site
          python -m http.server 4173 >/tmp/rwa-superapp-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/superapp-v5-browser.mjs
          node tools/superapp-p16-p20-browser.mjs

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore SOL first-frame seed cache
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: renko/preload/SOLUSDT.json
          key: ${{ env.RENKO_SEED_CACHE_KEY }}

      - name: Restore previously verified SOL seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/renko-seed-zip /tmp/renko-seed-site renko/preload
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9638529318/zip" -o /tmp/renko-seed.zip || true
          if [ -s /tmp/renko-seed.zip ]; then
            unzip -q /tmp/renko-seed.zip -d /tmp/renko-seed-zip
            tar -xf /tmp/renko-seed-zip/artifact.tar -C /tmp/renko-seed-site
            cp /tmp/renko-seed-site/renko/preload/SOLUSDT.json renko/preload/SOLUSDT.json
          fi

      - name: Build or validate SOL tick-derived first-frame preload
        env:
          RENKO_PRELOAD_SYMBOL: SOLUSDT
          RENKO_PRELOAD_DAYS: 30
          RENKO_PRELOAD_KEEP: 140
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s renko/preload/SOLUSDT.json ]; then node tools/build-renko-first-frame-preload.mjs; fi
          node - <<'NODE'
          const p=require('./renko/preload/SOLUSDT.json');
          const one=p.seeds.find(x=>Math.abs(x.box-1)<.02),ten=p.seeds.find(x=>Math.abs(x.box-10)<.2);
          if(!one||one.bricks<46||!ten||ten.bricks<46)throw Error('RENKO first-frame seed incomplete');
          console.log('RENKO_PRELOAD_READY',{one:one.bricks,ten:ten.bricks});
          NODE

      - name: Pin RENKO V186 instant Apply runtime in Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'renko-v15-controller-bootstrap.js?v=186' renko/index.html
          grep -Fq 'renko-v15-mobile-first-frame.css?v=186' renko/index.html
          grep -Fq "renkoController:'186'" legacy-canonical.js
          grep -Fq "dataset.renkoMethodBootstrap='186'" renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-first-frame-preload.js?v=186' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-method-controller-v186.js?v=186' renko/renko-v15-controller-bootstrap.js
          grep -Fq "version:'1.9.0'" renko/renko-v15-method-controller-v186.js
          grep -Fq "APPLY_DEBOUNCE=0" renko/renko-v15-method-controller-v186.js
          grep -Fq 'instant-first-frame-apply-no-blocking-history' renko/renko-v15-method-controller-v186.js
          grep -Fq "inputWaitMs='0'" renko/renko-v15-first-frame-preload.js

      - name: Stamp exact deployed SHA
        run: |
          printf '%s\n' "$GITHUB_SHA" > deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Build failover backup package
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          mkdir -p backup
          git archive --format=zip --output=backup/repo.zip "$GITHUB_SHA"
          git bundle create backup/repo.bundle --all
          git show-ref | sort > backup/refs.txt
          python - <<'PY'
          import json, os, datetime
          receipt={"name":"RWA-LIVE-SYNC","version":"8.0","timestamp":datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M%S'),"sha":os.environ['GITHUB_SHA'],"remote":"https://github.com/copytolive/rwa.git","pages":"https://copytolive.github.io/rwa/","gate":"pages-deploy-success"}
          open('backup/receipt.json','w').write(json.dumps(receipt,separators=(',',':'))+'\n')
          PY
          (cd backup && sha256sum repo.zip repo.bundle refs.txt receipt.json > SHA256SUMS.txt)
          git bundle verify backup/repo.bundle

      - name: Upload failover backup artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-live-sync-${{ github.sha }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
