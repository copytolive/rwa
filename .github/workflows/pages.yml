name: Deploy RWA Live No-Mock HOME

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "app.js"
      - "realtime-core.js"
      - "styles.css"
      - "mobile.css"
      - "stable-shell.css"
      - "superapp-v5.css"
      - "superapp-v5.js"
      - "chart-core.js"
      - "market-performance.js"
      - "mobile.js"
      - "rwa-target-dashboard-v2.css"
      - "rwa-target-dashboard-v2-hardening.css"
      - "rwa-target-dashboard-v2.js"
      - "rwa-target-dashboard-v2-hardening.js"
      - "rwa-ecommerce-target-controller-v1.js"
      - "rwa-ecommerce-target-hardening-v1.js"
      - "rwa-ecommerce-parity-finish-v2.js"
      - "rwa-ecommerce-production-visual-v1.js"
      - "rwa-seablueprint-commerce-bridge.css"
      - "rwa-seablueprint-commerce-bridge.js"
      - "rwa-live-home-v1.js"
      - "app.js"
      - "chart-core.js"
      - "rwa-storefront.js"
      - "rwa-commerce-registry.json"
      - "assets/ecommerce/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rwa-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify live no-mock HOME
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq 'RWA × Seablueprint' index.html
          grep -Fq 'IN-PAGE COMMERCE' index.html
          grep -Fq 'data-rwa-target-nav="markets"' index.html
          grep -Fq 'data-rwa-target-nav="ecommerce"' index.html
          grep -Fq 'id="fallbackChart"' index.html
          grep -Fq 'id="tvHost"' index.html
          ! grep -Eiq 'renko' index.html
          ! grep -Fq '/rwa/_next/' index.html
          test ! -e apps/realworldasset
          test ! -e REALWORLDASSET_MIGRATION_MANIFEST.json
          test ! -e UI_SYNC_MANIFEST.json
          ! grep -Fq 'rwa-golden-home-integration-v1.js' index.html
          ! grep -Fq 'rwa-screenshot-parity-v1.js' index.html
          grep -Fq 'rwa-live-home-v1.js' chart-core.js
          echo RWA_LIVE_NO_MOCK_PASS

      - name: Compose static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='apps' --exclude='tools' --exclude='docs' --exclude='qa' ./ site/
          touch site/.nojekyll
          echo "$GITHUB_SHA" > site/deployment-sha.txt
          test -s site/index.html
          test -s site/renko/index.html
          test -s site/backtest/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  validate-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate public live no-mock HOME
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          PASS=0
          for i in $(seq 1 36); do
            SHA="$(curl -fsSL --retry 2 "$BASE/deployment-sha.txt" 2>/dev/null || true)"
            if [ "$SHA" = "$GITHUB_SHA" ]; then PASS=1; break; fi
            sleep 5
          done
          test "$PASS" = 1
          curl -fsSL "$BASE/" > /tmp/root.html
          grep -Fq 'RWA × Seablueprint' /tmp/root.html
          grep -Fq 'IN-PAGE COMMERCE' /tmp/root.html
          grep -Fq 'id="fallbackChart"' /tmp/root.html
          grep -Fq 'id="tvHost"' /tmp/root.html
          ! grep -Eiq 'renko' /tmp/root.html
          ! grep -Fq '/rwa/_next/' /tmp/root.html
          ! grep -Fq 'rwa-golden-home-integration-v1.js' /tmp/root.html
          ! grep -Fq 'rwa-screenshot-parity-v1.js' /tmp/root.html
          echo PUBLIC_RWA_LIVE_NO_MOCK_PASS
