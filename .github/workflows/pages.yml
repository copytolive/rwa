name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Verify terminal files
        run: test -s index.html && test -s app.js && test -s styles.css
      - name: Report verification
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "INSTITUTIONAL UI JS PASS. Terminal files verified; starting Pages deployment."

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always() && github.event_name == 'issues'
    needs: [deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "INSTITUTIONAL UI DEPLOYMENT SUCCESS. Live at ${PAGE_URL:-https://narzulalistiqlal.github.io/rwa/}"
          else
            gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "INSTITUTIONAL UI DEPLOYMENT FAILED. Deploy result: $RESULT"
          fi
