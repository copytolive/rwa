name: Deploy RWA System + Canonical Realworldasset UI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "apps/realworldasset/**"
      - "renko/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "mobile.css"
      - "stable-shell.css"
      - "superapp-v5.js"
      - "superapp-v5.css"
      - "rwa-sw-v5.js"
      - "rwa-target-dashboard-v2.js"
      - "rwa-target-dashboard-v2.css"
      - "rwa-ecommerce-target-controller-v1.js"
      - "rwa-ecommerce-target-hardening-v1.js"
      - "manifest.webmanifest"
      - "UI_SYNC_MANIFEST.json"
      - "REALWORLDASSET_MIGRATION_MANIFEST.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rwa-pages-production
  cancel-in-progress: false

jobs:
  verify-system:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
      - name: Validate RWA system/runtime payload
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js styles.css mobile.css stable-shell.css superapp-v5.js superapp-v5.css rwa-sw-v5.js rwa-target-dashboard-v2.js rwa-target-dashboard-v2.css rwa-ecommerce-target-controller-v1.js rwa-ecommerce-target-hardening-v1.js manifest.webmanifest; do test -s "$f"; done
          node --check app.js
          node --check superapp-v5.js
          node --check rwa-target-dashboard-v2.js
          node --check rwa-ecommerce-target-controller-v1.js
          node --check rwa-ecommerce-target-hardening-v1.js
          echo RWA_SYSTEM_RUNTIME_PASS
      - name: Validate RENKO system payload
        shell: bash
        run: |
          set -euo pipefail
          for f in renko/index.html renko/renko-tv.css renko/renko-tv-engine.js renko/renko-tv-engine-fastpath.js renko/renko-tv-app.js renko/renko-tv-fixed-1s.js renko/renko-tv-atr-control.js renko/renko-tv-atr-fixed1s.js renko/renko-tv-atr-ui-sync.js renko/renko-tv-traditional-control.js renko/renko-tv-locale-guard.js renko/renko-tv-total-history.js renko/renko-gold-origin-pack.js renko/history/renko-gold-xauusd-origin.json.gz renko/xaut-okx-1s-pack.csv.gz renko/xaut-okx-1s-pack.meta.json; do test -s "$f"; done
          node --check renko/renko-tv-engine.js
          node --check renko/renko-tv-app.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('renko/xaut-okx-1s-pack.meta.json').read_text()); p=m.get('provenance') or {}
          assert m['schema']=='renko-xaut-okx-1s-pack-v2',m
          assert m['provider']=='OKX Spot' and m['instrument']=='XAUT-USDT',m
          assert m['interval']=='1s' and m['intervalMs']==1000,m
          assert m['rows']==1_005_000,m
          assert p.get('upsampled') is False and p.get('synthetic1s') is False,p
          print('RENKO_SYSTEM_PAYLOAD_PASS')
          PY

  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
      - name: Verify canonical migrated live-only UI source
        shell: bash
        run: |
          set -euo pipefail
          test -s UI_SYNC_MANIFEST.json
          test -s REALWORLDASSET_MIGRATION_MANIFEST.json
          test -s apps/realworldasset/UPSTREAM_SHA.txt
          test -s apps/realworldasset/package.json
          test -s apps/realworldasset/package-lock.json
          test -s apps/realworldasset/next.config.js
          test -s 'apps/realworldasset/src/app/[...slug]/page.tsx'
          test -s apps/realworldasset/scripts/every-page-live-proof.py
          FILE_COUNT="$(git ls-files apps/realworldasset | wc -l | tr -d ' ')"
          test "$FILE_COUNT" -gt 50
          grep -Fq 'LiveRouteWorkspace' 'apps/realworldasset/src/app/[...slug]/page.tsx'
          grep -Fq 'ProgramWorkspace kind="markets"' 'apps/realworldasset/src/app/[...slug]/page.tsx'
          grep -Fq '"/rwa"' apps/realworldasset/next.config.js
          SOURCE_SHA="$(cat apps/realworldasset/UPSTREAM_SHA.txt)"
          python3 - <<'PY'
          import json
          from pathlib import Path
          source=Path('apps/realworldasset/UPSTREAM_SHA.txt').read_text().strip()
          manifest=json.loads(Path('REALWORLDASSET_MIGRATION_MANIFEST.json').read_text())
          sync=json.loads(Path('UI_SYNC_MANIFEST.json').read_text())
          assert source == manifest['sourceSha'], (source, manifest.get('sourceSha'))
          assert sync['canonicalPath']=='apps/realworldasset', sync
          assert sync.get('compatibilityMirror') is None, sync
          assert sync.get('syncMode')=='embedded-canonical-source', sync
          print('CANONICAL_REALWORLDASSET_SOURCE_IDENTITY_PASS', source)
          PY
          test ! -e ui/realworldasset
          test ! -e .github/workflows/sync-realworldasset-ui.yml
          echo "TOTAL_UI_SOURCE_PASS files=$FILE_COUNT upstream=$SOURCE_SHA canonical_only=1 live_only=1"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/realworldasset/package-lock.json
      - name: Install UI dependencies
        working-directory: apps/realworldasset
        run: npm ci --no-audit --no-fund
      - name: Verify live-only interactions
        working-directory: apps/realworldasset
        run: npm run verify:interactions
      - name: TypeScript verification
        working-directory: apps/realworldasset
        run: npm run typecheck
      - name: Build realworldasset UI at canonical /rwa base path
        working-directory: apps/realworldasset
        env:
          RWA_BASE_PATH: /rwa
          GITHUB_ACTIONS: "true"
        run: npm run build
      - name: Compose single production artifact and route manifest
        shell: bash
        run: |
          set -euo pipefail
          O=apps/realworldasset/out
          test -s "$O/index.html"
          for route in markets intelligence merchant merchant/orders merchant/updates/new merchant/ads community settings checkout account/orders; do test -s "$O/$route/index.html"; done
          grep -Rq '/rwa/_next/' "$O/index.html" "$O/merchant/index.html"
          if grep -RqiE 'UI DEMO|Alex Morgan|Level 3[[:space:]]*[·-][[:space:]]*Demo|Connected Account \(Preview\)|POS-DEMO|ORD-DEMO' "$O" --include='*.html'; then echo 'SYNTHETIC_PUBLIC_HTML_FOUND' >&2; exit 1; fi
          rm -rf "$O/renko"
          cp -a renko "$O/renko"
          printf '%s\n' "$GITHUB_SHA" > "$O/deployment-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$O/renko/deployment-sha.txt"
          printf '%s\n' "$GITHUB_SHA" > "$O/system-sha.txt"
          cp apps/realworldasset/UPSTREAM_SHA.txt "$O/ui-source-sha.txt"
          cp UI_SYNC_MANIFEST.json "$O/UI_SYNC_MANIFEST.json"
          cp REALWORLDASSET_MIGRATION_MANIFEST.json "$O/REALWORLDASSET_MIGRATION_MANIFEST.json"
          touch "$O/.nojekyll"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/realworldasset/out')
          routes=[]
          for index in sorted(root.rglob('index.html')):
              rel=index.relative_to(root)
              if rel.parts and rel.parts[0]=='_next':
                  continue
              parent=rel.parent.as_posix()
              route='/' if parent=='.' else f'/{parent}/'
              routes.append(route)
          routes=sorted(set(routes),key=lambda x:(x!='/',x))
          assert len(routes)>=88,(len(routes),routes[:10])
          (root/'public-route-manifest.txt').write_text('\n'.join(routes)+'\n')
          print('PUBLIC_ROUTE_MANIFEST_PASS',len(routes))
          PY
          test -s "$O/renko/index.html"
          test -s "$O/renko/deployment-sha.txt"
          test -s "$O/public-route-manifest.txt"
          echo SINGLE_RWA_REALWORLDASSET_PRODUCTION_ARTIFACT_PASS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/realworldasset/out

  deploy:
    needs: [verify-system, build-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy single RWA production
        id: deployment
        uses: actions/deploy-pages@v4

  validate-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for exact public deployment and validate every route
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          PASS=0
          for i in $(seq 1 48); do
            SHA="$(curl -fsSL --retry 2 "$BASE/deployment-sha.txt" 2>/dev/null || true)"
            RENKO_SHA="$(curl -fsSL --retry 2 "$BASE/renko/deployment-sha.txt" 2>/dev/null || true)"
            if [ "$SHA" = "$GITHUB_SHA" ] && [ "$RENKO_SHA" = "$GITHUB_SHA" ]; then PASS=1; break; fi
            sleep 5
          done
          test "$PASS" = 1
          UI_SHA="$(curl -fsSL "$BASE/ui-source-sha.txt")"
          test -n "$UI_SHA"
          curl -fsSL --retry 4 --retry-delay 2 "$BASE/public-route-manifest.txt?v=$GITHUB_RUN_ID" -o /tmp/rwa-public-routes.txt
          ROUTE_COUNT="$(grep -c '^/' /tmp/rwa-public-routes.txt)"
          test "$ROUTE_COUNT" -ge 88
          while IFS= read -r route; do
            test -n "$route" || continue
            CODE="$(curl -sS -L -o /tmp/page.html -w '%{http_code}' --retry 4 --retry-delay 2 "$BASE$route")"
            test "$CODE" = 200
          done < /tmp/rwa-public-routes.txt
          echo "PUBLIC_SINGLE_RWA_REALWORLDASSET_PASS system=$GITHUB_SHA renko=$GITHUB_SHA ui=$UI_SHA routes=$ROUTE_COUNT"
      - name: Install Chromium and image analysis runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0 pillow
          python3 -m playwright install --with-deps chromium
      - name: Screenshot and analyze every public route desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-proof/desktop production-proof/mobile
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re, time
          from PIL import Image
          from playwright.sync_api import sync_playwright

          base='https://copytolive.github.io/rwa'
          routes=[x.strip() for x in Path('/tmp/rwa-public-routes.txt').read_text().splitlines() if x.strip()]
          transient={502,503,504}
          forbidden=[re.compile(r'\bdemo\b',re.I),re.compile(r'Alex Morgan',re.I),re.compile(r'Sample dataset',re.I),re.compile(r'Connected Account\s*\(Preview\)',re.I),re.compile(r'(?:ORD|POS)-DEMO',re.I)]
          failures=[]; retries=[]; metrics=[]

          def safe(route): return route.strip('/').replace('/','--') or 'root'
          def white_ratio(path):
              im=Image.open(path).convert('RGB'); im.thumbnail((700,700)); px=list(im.getdata())
              if not px: return 0.0
              return sum(1 for r,g,b in px if r>=242 and g>=242 and b>=242)/len(px)
          def same_origin(url):
              a=urlparse(url); b=urlparse(base)
              return (a.scheme,a.netloc)==(b.scheme,b.netloc)

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for viewport,width,height in [('desktop',1672,941),('mobile',390,844)]:
                  for route in routes:
                      last=None
                      for attempt in range(1,5):
                          page=browser.new_page(viewport={'width':width,'height':height},device_scale_factor=1)
                          page_errors=[]; bad=[]
                          page.on('pageerror',lambda e: page_errors.append(str(e)))
                          page.on('response',lambda r: bad.append({'status':r.status,'url':r.url}) if r.status>=400 and same_origin(r.url) else None)
                          try:
                              response=page.goto(base+route,wait_until='domcontentloaded',timeout=30000)
                              status=response.status if response else 0
                              page.wait_for_timeout(650)
                              text=page.locator('body').inner_text()
                              dims=page.evaluate('() => ({iw:innerWidth,sw:document.documentElement.scrollWidth})')
                              light=page.evaluate("""() => Array.from(document.querySelectorAll('body *')).filter(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();if(r.width<innerWidth*.55||r.height<innerHeight*.18)return false;const m=s.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);return m&&+m[1]>235&&+m[2]>235&&+m[3]>235}).slice(0,8).map(el=>({tag:el.tagName,cls:el.className,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height,bg:getComputedStyle(el).backgroundColor}))""")
                              markers=[pat.pattern for pat in forbidden if pat.search(text)]
                              path=Path('production-proof')/viewport/f'{safe(route)}.png'
                              page.screenshot(path=str(path),full_page=True)
                              ratio=white_ratio(path)
                              last={'viewport':viewport,'route':route,'status':status,'pageErrors':page_errors,'bad':bad,'overflow':dims['sw']>dims['iw']+3,'light':light,'markers':markers,'whitePixelRatio':round(ratio,6)}
                          except Exception as exc:
                              last={'viewport':viewport,'route':route,'exception':repr(exc),'pageErrors':page_errors,'bad':bad}
                          finally:
                              page.close()
                          bad_statuses=[x['status'] for x in last.get('bad',[])]
                          transient_only=bool(bad_statuses) and all(s in transient for s in bad_statuses)
                          ok=(last.get('status')==200 and not last.get('pageErrors') and not last.get('bad') and not last.get('overflow') and not last.get('light') and not last.get('markers') and last.get('whitePixelRatio',1)<=0.10)
                          if ok:
                              if attempt>1: retries.append({'viewport':viewport,'route':route,'attempts':attempt})
                              metrics.append(last); break
                          if transient_only and attempt<4:
                              time.sleep(1.5*attempt); continue
                          failures.append(last); break
              browser.close()

          expected=len(routes)*2
          actual=len(metrics)+len(failures)
          Path('production-proof/result.txt').write_text(f'PUBLIC_EVERY_PAGE_LIVE_PROOF routes={len(routes)} viewports=2 expected={expected} checked={actual} failures={len(failures)} retries={len(retries)}\n')
          import json
          Path('production-proof/report.json').write_text(json.dumps({'routes':len(routes),'viewports':2,'expected':expected,'checked':actual,'failures':failures,'retries':retries,'metrics':metrics},indent=2)+'\n')
          assert actual==expected,(actual,expected)
          assert not failures,failures[:10]
          print(f'PUBLIC_EVERY_PAGE_LIVE_PROOF_PASS routes={len(routes)} screenshots={expected}')
          PY
      - name: Upload every-page public production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-every-page-public-production-proof-${{ github.sha }}
          path: production-proof/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
