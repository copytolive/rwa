name: Deploy RWA Home Market Chart + Research Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/pages.yml"
      - "index.html"
      - "renko/**"
      - "backtest/**"
      - "legacy-canonical.js"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rwa-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4

      - name: Verify HOME market chart and research pages
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -Fq '<title>RWA Market — Live Social Trading Terminal</title>' index.html
          grep -Fq 'id="fallbackChart"' index.html
          grep -Fq 'id="tvHost"' index.html
          grep -Fq 's3.tradingview.com/external-embedding/embed-widget-advanced-chart.js' index.html
          ! grep -Eiq 'renko' index.html
          ! grep -Fq 'RWA × Seablueprint' index.html
          ! grep -Fq '/rwa/_next/' index.html
          test -s renko/index.html
          test -s backtest/index.html
          test -s legacy-canonical.js
          echo RWA_HOME_MARKET_CHART_PASS

      - name: Compose static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          cp index.html site/index.html
          cp legacy-canonical.js site/legacy-canonical.js
          cp -a renko site/renko
          cp -a backtest site/backtest
          touch site/.nojekyll
          printf '%s\n' "$GITHUB_SHA" > site/deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > site/renko/deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > site/backtest/deployment-sha.txt
          echo STATIC_HOME_MARKET_ARTIFACT_PASS

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy RWA HOME market chart
        id: deployment
        uses: actions/deploy-pages@v4

  validate-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate public HOME market chart and routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          PASS=0
          for i in $(seq 1 36); do
            SHA="$(curl -fsSL --retry 2 "$BASE/deployment-sha.txt" 2>/dev/null || true)"
            if [ "$SHA" = "$GITHUB_SHA" ]; then PASS=1; break; fi
            sleep 5
          done
          test "$PASS" = 1
          curl -fsSL "$BASE/" > /tmp/root.html
          grep -Fq '<title>RWA Market — Live Social Trading Terminal</title>' /tmp/root.html
          grep -Fq 'id="fallbackChart"' /tmp/root.html
          grep -Fq 'id="tvHost"' /tmp/root.html
          ! grep -Eiq 'renko' /tmp/root.html
          ! grep -Fq 'RWA × Seablueprint' /tmp/root.html
          ! grep -Fq '/rwa/_next/' /tmp/root.html
          test "$(curl -sS -L -o /dev/null -w '%{http_code}' "$BASE/backtest/")" = "200"
          echo PUBLIC_RWA_HOME_MARKET_CHART_PASS
