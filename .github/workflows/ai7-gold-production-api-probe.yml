name: AI7 GOLD Production API Probe

on:
  pull_request:
    branches: [main]
    paths:
      - "backtest/gold24/AI7_API_PROBE_KICK"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query production trading API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BASE="http://109.123.239.76:8000"
          probe() {
            NAME="$1"; URL="$2"
            CODE="$(curl -sS --retry 2 --connect-timeout 10 --max-time 60 -o "out/$NAME.body" -w '%{http_code}' "$URL" || true)"
            printf '%s\n' "$CODE" > "out/$NAME.status"
            python3 - "$NAME" "$URL" "$CODE" <<'PY'
          import json,sys,pathlib
          name,url,code=sys.argv[1:]
          body=pathlib.Path("out/"+name+".body").read_text(errors="replace") if pathlib.Path("out/"+name+".body").exists() else ""
          try: parsed=json.loads(body)
          except Exception: parsed=None
          pathlib.Path("out/"+name+".json").write_text(json.dumps({
            "url":url,"status":code,"bytes":len(body.encode()),"body_json":parsed,
            "body_preview":body[:20000] if parsed is None else None
          },indent=2,default=str)+"\n")
          PY
          }
          probe farm-stats "$BASE/trading/farm/stats"
          probe farm-list-5 "$BASE/trading/farm/strategies?limit=5"
          probe farm-list-gold "$BASE/trading/farm/strategies?pair=GOLD&timeframe=H1&limit=500"
          probe farm-linreg "$BASE/trading/farm/strategies/ND_MTF_LINREG_SLP_f21s55_GOLD_H1_SL0.025_TP2.5"
          probe farm-obv "$BASE/trading/farm/strategies/ND_ALL_OBV_CROSS_f8s21_GOLD_H1_SL0.025_TP2.0"
          probe farm-bbsqz "$BASE/trading/farm/strategies/ND_ALL_BB_SQZ_f13s34_GOLD_H1_SL0.012_TP3.0"
          probe ohlcv-gold-h1 "$BASE/trading/market-data/ohlcv/FOREX/GOLD?tf=1h&limit=50000"
          probe ohlcv-xauusd-h1 "$BASE/trading/market-data/ohlcv/FOREX/XAUUSD?tf=1h&limit=50000"
          probe symbols-forex "$BASE/trading/market-data/symbols/FOREX"
          probe dashboard-strategies "$BASE/trading/dashboard/strategies"
          probe dashboard-linreg "$BASE/trading/dashboard/strategies/ND_MTF_LINREG_SLP_f21s55_GOLD_H1_SL0.025_TP2.5"
          probe dashboard-obv "$BASE/trading/dashboard/strategies/ND_ALL_OBV_CROSS_f8s21_GOLD_H1_SL0.025_TP2.0"
          probe dashboard-bbsqz "$BASE/trading/dashboard/strategies/ND_ALL_BB_SQZ_f13s34_GOLD_H1_SL0.012_TP3.0"
          probe compounding-status "$BASE/trading/compounding/status"
          probe compounding-strategies "$BASE/trading/compounding/strategies"
          probe compounding-history "$BASE/trading/compounding/history"
          probe unified-strategies "$BASE/trading/signals/unified/strategies"
          python3 - <<'PY'
          import json,pathlib
          for p in sorted(pathlib.Path("out").glob("*.json")):
              x=json.loads(p.read_text())
              print(p.name, "status", x.get("status"), "bytes", x.get("bytes"))
              bj=x.get("body_json")
              if isinstance(bj,dict): print(" keys",list(bj)[:60])
              elif isinstance(bj,list): print(" list_len",len(bj))
          PY

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: ai7-gold-production-api-probe-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 30
