name: RWA Security Gate

on:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "*.json"
      - "agent-worker/**"
      - "launch/**"
      - "token/**"
      - "tools/security-gate.mjs"
      - ".github/workflows/security-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Run source security gate
        run: node tools/security-gate.mjs | tee /tmp/security-report.json
      - name: Validate report
        run: node -e "const x=require('/tmp/security-report.json');if(x.status!=='PASS')process.exit(1);console.log('Security PASS',x.checked_runtime_files,'runtime files')"
      - name: Publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/security-gate' -f description='Single-write, risk, mainnet, worker replay/fund isolation gates PASS'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/security-gate' -f description='RWA security source gate failed'
