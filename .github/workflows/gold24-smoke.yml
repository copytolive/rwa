name: GOLD24 Smoke
on:
  push:
    paths:
      - 'backtest/gold24/**'
      - 'deploy/gold24/**'
      - '.github/workflows/gold24-*.yml'
  pull_request:
    paths:
      - 'backtest/gold24/**'
      - 'deploy/gold24/**'
      - '.github/workflows/gold24-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backtest/gold24/requirements.txt
      - name: Legacy engine regression selftest
        run: python backtest/gold24/worker.py --self-test
      - name: Weekly-profit policy selftest
        working-directory: backtest/gold24
        run: python weekly_profit_runner.py --self-test
      - name: Prove weekly-profit runner fail-closed without Gate A evidence
        shell: bash
        run: |
          set -euo pipefail
          GOLD24_STATE_DIR="$RUNNER_TEMP/gold24-weekly" \
          GOLD24_DATASET="$RUNNER_TEMP/missing.csv" \
          GOLD24_CROSSCHECK="$RUNNER_TEMP/missing.json" \
          GOLD24_TIMEFRAME="H4" \
          python backtest/gold24/weekly_profit_runner.py --once
          test -f "$RUNNER_TEMP/gold24-weekly/status.json"
          grep -q '"strategy_engine": "PAUSED"' "$RUNNER_TEMP/gold24-weekly/status.json"
          grep -q '"gate_a": "BLOCKED"' "$RUNNER_TEMP/gold24-weekly/status.json"
          grep -q '"simulation_executed": false' "$RUNNER_TEMP/gold24-weekly/status.json"
          grep -q '"counter_increment": 0' "$RUNNER_TEMP/gold24-weekly/status.json"
      - name: Prove canonical rules SHA
        shell: bash
        run: |
          set -euo pipefail
          sha256sum backtest/gold24/RULES_GOAL_RR12_2026.md
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('backtest/gold24/RULES_GOAL_RR12_2026.md')
          print('RULES_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY
      - name: Build tested immutable source package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/gold24-source
          cp -a backtest/gold24 dist/gold24-source/backtest-gold24
          cp -a deploy/gold24 dist/gold24-source/deploy-gold24
          cp .github/workflows/gold24-smoke.yml .github/workflows/gold24-deploy.yml .github/workflows/gold24-health.yml dist/gold24-source/
          printf '%s\n' "$GITHUB_SHA" > dist/gold24-source/GIT_COMMIT_SHA.txt
          sha256sum backtest/gold24/RULES_GOAL_RR12_2026.md | awk '{print $1}' > dist/gold24-source/RULES_SHA256.txt
          tar -C dist -czf "dist/GOLD24_24X7_SOURCE_${GITHUB_SHA}.tar.gz" gold24-source
          (cd dist && sha256sum "GOLD24_24X7_SOURCE_${GITHUB_SHA}.tar.gz" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Upload tested source package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gold24-tested-source-${{ github.sha }}
          path: |
            dist/GOLD24_24X7_SOURCE_${{ github.sha }}.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
