name: Renko Private Source Probe

on:
  pull_request:
    paths:
      - '.github/workflows/renko-private-source-probe.yml'
      - 'renko/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose live private Renko CORS
        shell: bash
        run: |
          set -euo pipefail
          for origin in https://seablueprint.com https://copytolive.com; do
            for limit in 5000 25000; do
              echo "=== $origin limit=$limit ==="
              curl -sS --max-time 60 -D /tmp/h -o /tmp/b \
                -H 'Origin: https://narzulalistiqlal.github.io' \
                "$origin/api/charting/hyperliquid/renko/BTC?limit=$limit&offset=0&live=1&history=all" || true
              grep -iE '^(HTTP/|access-control|content-type|content-length|vary:|x-renko-cache)' /tmp/h || true
              python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/b'))
              print('error',repr(d.get('error')),'count',d.get('count'),'returned',d.get('returnedCount'),'hasMore',d.get('hasMore'),'window',d.get('windowStart'),d.get('windowEnd'))
          except Exception as e: print('BODY_NOT_JSON',e)
          PY
            done
          done
