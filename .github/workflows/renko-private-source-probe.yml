name: Renko Private Source Probe

on:
  pull_request:
    paths:
      - '.github/workflows/renko-private-source-probe.yml'
      - 'renko/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe private Renko live origins
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://copytolive.com' 'https://seablueprint.com'; do
            url="$origin/api/charting/hyperliquid/renko/BTC?limit=5000&live=1&smaPeriod=10&sma=10"
            slug=$(echo "$origin" | tr -cd '[:alnum:]')
            echo "== $url =="
            rm -f "/tmp/h-$slug" "/tmp/b-$slug"
            curl -sS -D "/tmp/h-$slug" -o "/tmp/b-$slug" --max-time 45 "$url" || true
            sed -n '1,30p' "/tmp/h-$slug" || true
            python3 - "$slug" <<'PY'
          import json, pathlib, sys
          slug=sys.argv[1]
          p=pathlib.Path('/tmp/b-'+slug)
          if not p.exists():
              print('no body'); raise SystemExit(0)
          raw=p.read_text(errors='replace')
          print('body_bytes',len(raw.encode()))
          try:d=json.loads(raw)
          except Exception as e:
              print('not json:',e,'prefix=',raw[:300]); raise SystemExit(0)
          print('type',type(d).__name__)
          if isinstance(d,dict):
              print('keys',sorted(d.keys()))
              c=d.get('candles')
              if isinstance(c,list):
                  print('candles',len(c))
                  if c:
                      print('first',c[0]); print('last',c[-1])
              for k in ('lockedSma','lockedSmaPeriod','lockedProfile','source','provider','symbol'):
                  if k in d: print(k,d[k])
          PY
          done

      - name: Probe public Binance raw trade archive headers
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            'https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2026-08-23.zip' \
            'https://data.binance.vision/data/spot/monthly/trades/BTCUSDT/BTCUSDT-trades-2026-07.zip'; do
            echo "== $u =="
            curl -sSI --max-time 20 "$u" | sed -n '1,30p' || true
          done
