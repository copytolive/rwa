name: Renko Private Source Probe

on:
  pull_request:
    paths:
      - '.github/workflows/renko-private-source-probe.yml'
      - 'renko/**'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify private Renko full window and CORS
        shell: bash
        run: |
          set -euo pipefail
          url='https://seablueprint.com/api/charting/hyperliquid/renko/BTC?limit=100000&live=1&history=all'
          echo '== CORS HEADERS =='
          curl -sS -D /tmp/headers -o /tmp/body --max-time 60 -H 'Origin: https://narzulalistiqlal.github.io' "$url"
          grep -iE '^(HTTP/|access-control|content-type|content-length|vary:|x-renko-cache)' /tmp/headers || true
          echo '== CONTRACT =='
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/body'))
          c=d.get('candles',[])
          print('candles',len(c))
          for k in ('source','construction','dataQuality','historyStart','historyEnd','windowStart','windowEnd','hasMore','truncated','returnedCount','inputBars','brickSize','reversalBricks','recordedTickCount','recordedTickStart'):
              print(k,repr(d.get(k)))
          if c: print('first',c[0]); print('last',c[-1])
          PY

      - name: Verify Binance raw trade archive
        shell: bash
        run: |
          set -euo pipefail
          u='https://data.binance.vision/data/spot/daily/trades/BTCUSDT/BTCUSDT-trades-2026-08-23.zip'
          curl -sSI --max-time 20 -H 'Origin: https://narzulalistiqlal.github.io' "$u" | grep -iE '^(HTTP/|content-type|content-length|access-control|accept-ranges)' || true
