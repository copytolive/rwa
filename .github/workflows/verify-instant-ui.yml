name: Verify Instant UI

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[QA-INSTANT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        id: source
        shell: bash
        run: |
          set +e
          fail=""
          node --check app.js >/tmp/a 2>&1 || fail="$fail app.js:$(cat /tmp/a);"
          node --check mobile.js >/tmp/m 2>&1 || fail="$fail mobile.js:$(cat /tmp/m);"
          grep -Fq 'instantChartBoot' mobile.js || fail="$fail missing instantChartBoot;"
          grep -Fq 'warmConnections' mobile.js || fail="$fail missing warmConnections;"
          grep -Fq 'mobile.js?v=7' index.html || fail="$fail stale mobile asset version;"
          grep -Fq 'rel="preload" href="mobile.js?v=7"' index.html || fail="$fail missing mobile preload;"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          test -z "$fail"
      - name: Report source pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "INSTANT UI SOURCE PASS. mobile.js syntax and instant-chart/preload contracts are valid."
      - name: Report source failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAIL: ${{ steps.source.outputs.fail }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "INSTANT UI SOURCE FAIL: $FAIL"
      - name: Verify production
        if: success()
        run: |
          ok=0
          for i in {1..24}; do
            q="${GITHUB_RUN_ID}-${i}"
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" | grep -Fq 'mobile.js?v=7' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" | grep -Fq 'instantChartBoot' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" | grep -Fq 'warmConnections'; then
              ok=1; break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "INSTANT UI PRODUCTION SUCCESS. Chart bootstrap starts before market-universe REST completes, cached/fallback chart paints immediately, duplicate TradingView reload is suppressed, and feature assets warm in parallel."
