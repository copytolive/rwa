name: RWA Real Testnet E2E Proof Review

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[E2E-PROOF]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Install proof verifier dependency
        run: npm install --no-save --ignore-scripts viem@2.37.3
      - name: Verify wallet signature and Hyperliquid testnet evidence
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node tools/e2e-proof.mjs --write
      - name: Commit verified E2E registry
        run: |
          if git diff --quiet -- launch/e2e-registry.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launch/e2e-registry.json
          git commit -m "registry: add verified real-wallet testnet E2E proof"
          git push
      - name: Close verified request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "✅ Wallet signature and live Hyperliquid TESTNET activity verified. Added to launch/e2e-registry.json."
          gh issue close "${{ github.event.issue.number }}"
      - name: Report failed verification
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "❌ E2E proof did not pass wallet-signature + live Hyperliquid TESTNET verification. The launch registry was not changed."
