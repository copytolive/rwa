name: GOLD Multi-Method v1 Full Archive Rescan macOS Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-multimethod-v1-full-rescan-macos.yml'
      - 'backtest/gold24/MULTIMETHOD_V1_RESCAN_MAC_KICK'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-multimethod-v1-full-rescan-macos
  cancel-in-progress: true

jobs:
  full_rescan:
    name: Full canonical archive rescan → Multi-Method v1 (macOS fallback)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_DIR: ${{ github.workspace }}/.gold24-multimethod-v1-state
      OUT_DIR: ${{ github.workspace }}/backtest/gold24/runtime_multimethod_v1
      SOURCE_SUMMARY: ${{ github.workspace }}/backtest/gold24/runtime_v11/latest_validation_summary.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install -r backtest/gold24/requirements.txt

      - name: Freeze latest authoritative canonical source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/source.env"
          import json, os, pathlib
          p=pathlib.Path(os.environ['SOURCE_SUMMARY'])
          x=json.loads(p.read_text())
          assert x.get('validation') == 'PASS'
          assert x.get('restored_previous_state') is True
          assert x.get('gate_a_strict',{}).get('gate_a') == 'PASS'
          assert x.get('simulation_executed') is True
          assert x.get('strategy_engine') == 'RUNNING'
          print('SOURCE_RUN_ID=' + str(x['github_run_id']))
          print('SOURCE_BATCH=' + str(x['batch']))
          print('SOURCE_CURSOR=' + str(x['candidate_cursor']))
          print('SOURCE_ARCHIVED=' + str(x['cumulative_configs_archived']))
          PY
          cat "$RUNNER_TEMP/source.env"
          cat "$RUNNER_TEMP/source.env" >> "$GITHUB_ENV"

      - name: Restore full canonical archive artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n gold24-canonical-v11-state -D "$STATE_DIR"
          test -s "$STATE_DIR/gold24-v11.db"
          test -d "$STATE_DIR/ledgers_v11"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"
          python - <<'PY'
          import json, os, sqlite3
          db=sqlite3.connect(os.environ['STATE_DIR']+'/gold24-v11.db')
          n=db.execute('SELECT COUNT(*) FROM configs').fetchone()[0]
          cursor=int(json.loads(db.execute("SELECT v FROM state WHERE k='candidate_cursor'").fetchone()[0]))
          batch=int(json.loads(db.execute("SELECT v FROM state WHERE k='batch'").fetchone()[0]))
          db.close()
          assert n==int(os.environ['SOURCE_ARCHIVED']), (n, os.environ['SOURCE_ARCHIVED'])
          assert cursor==int(os.environ['SOURCE_CURSOR']), (cursor, os.environ['SOURCE_CURSOR'])
          assert batch==int(os.environ['SOURCE_BATCH']), (batch, os.environ['SOURCE_BATCH'])
          print(f'canonical archive restore PASS rows={n} batch={batch} cursor={cursor}')
          PY

      - name: Full rescan entire archive with Multi-Method v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python backtest/gold24/multimethod_v1_full_rescan.py --state-dir "$STATE_DIR" --out-dir "$OUT_DIR" --source-summary "$SOURCE_SUMMARY"
          test -s "$OUT_DIR/latest_multimethod_v1_full_rescan.json"
          test -s "$OUT_DIR/latest_multimethod_v1_full_rescan.csv"
          test -s "$OUT_DIR/latest_multimethod_v1_full_rescan_summary.json"
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['OUT_DIR'])/'latest_multimethod_v1_full_rescan_summary.json'
          x=json.loads(p.read_text())
          assert x['status']=='PASS'
          assert int(x['full_archive_rows_scanned'])==int(os.environ['SOURCE_ARCHIVED'])
          assert int(x['source_batch'])==int(os.environ['SOURCE_BATCH'])
          assert int(x['source_candidate_cursor'])==int(os.environ['SOURCE_CURSOR'])
          assert int(x['library_count']) >= int(x['active_count']) >= int(x['elite_count'])
          print(json.dumps(x, indent=2, sort_keys=True))
          PY

      - name: Publish Multi-Method v1 results race-safe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan.json backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan.csv backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan_summary.json
          if git diff --cached --quiet; then
            echo "No Multi-Method v1 output delta to publish"
            exit 0
          fi
          git commit -m "chore(gold24): publish Multi-Method v1 full archive rescan [skip ci]"
          for TRY in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "publish PASS try=$TRY"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((TRY * 2))
          done
          exit 1

      - name: Upload compact rescan evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-multimethod-v1-full-rescan-macos
          path: |
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan.json
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan.csv
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_full_rescan_summary.json
          if-no-files-found: error
          retention-days: 30
