name: RENKO GOLD Total History Backfill 2003-Current

on:
  push:
    branches:
      - feat/renko-gold-total-history-2003-2026
    paths:
      - '.github/workflows/renko-gold-total-history-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  ORIGIN: '2003-05-05T00:00:00Z'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cutoff: ${{ steps.lock.outputs.cutoff }}
      side: ${{ steps.lock.outputs.side }}
    steps:
      - uses: actions/checkout@v4
      - id: lock
        name: Lock calibrated side and closed-hour cutoff
        shell: bash
        run: |
          set -euo pipefail
          side="$(python3 -c 'import json;print(json.load(open("renko/history/gold/calibration.json"))["priceSide"])')"
          test "$side" = bid
          cutoff="$(date -u -d '1 hour ago' '+%Y-%m-%dT%H:59:59Z')"
          echo "side=$side" >> "$GITHUB_OUTPUT"
          echo "cutoff=$cutoff" >> "$GITHUB_OUTPUT"
          echo "GOLD_BACKFILL_LOCK side=$side cutoff=$cutoff"

  build-year:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical fixed-1s months with bounded RAM
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
          SIDE: ${{ needs.prepare.outputs.side }}
          CUTOFF: ${{ needs.prepare.outputs.cutoff }}
        run: |
          set -euo pipefail
          mkdir -p "year-$YEAR"
          python3 scripts/renko_gold_full_year_job.py \
            --year "$YEAR" \
            --side "$SIDE" \
            --start "$ORIGIN" \
            --end "$CUTOFF" \
            --workers 8 \
            --output-dir "year-$YEAR"
      - name: Audit every monthly gzip before publication
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          python3 scripts/renko_gold_audit.py audit-year \
            --summary "year-$YEAR/summary-$YEAR.json" \
            --data-dir "year-$YEAR" \
            --output "year-$YEAR/audit-$YEAR.json" \
            --write-summary
      - name: Publish year as Git LFS objects with pointer-only Git tree
        shell: bash
        env:
          YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          DATA_BRANCH="renko-gold-lfs-$YEAR"
          mkdir -p /tmp/gold-data /tmp/gold-meta
          cp "year-$YEAR"/xauusd-s1-*.csv.gz /tmp/gold-data/
          cp "year-$YEAR/summary-$YEAR.json" "year-$YEAR/audit-$YEAR.json" /tmp/gold-meta/
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git lfs install --local
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH:$DATA_BRANCH"
            GIT_LFS_SKIP_SMUDGE=1 git checkout "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
          else
            git checkout --orphan "$DATA_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
            git clean -fdx >/dev/null 2>&1 || true
          fi
          git lfs track '*.csv.gz'
          cp /tmp/gold-data/*.csv.gz .
          git add .gitattributes *.csv.gz
          git commit -m "data(renko): publish canonical GOLD $YEAR via LFS" || true
          git push origin "HEAD:$DATA_BRANCH"
          DATA_SHA="$(git rev-parse HEAD)"
          for f in *.csv.gz; do
            test "$(git cat-file -s "HEAD:$f")" -lt 1000
          done
          python3 - "$YEAR" "$DATA_SHA" <<'PY'
          import json, pathlib, sys
          year, sha = int(sys.argv[1]), sys.argv[2]
          p=pathlib.Path(f'/tmp/gold-meta/summary-{year}.json')
          x=json.loads(p.read_text())
          x['dataBranch']=f'renko-gold-lfs-{year}'
          x['dataCommitSha']=sha
          x['storage']='git-lfs-media'
          for m in x['months']:
              m['dataCommitSha']=sha
              m['storage']='git-lfs-media'
              m['assetUrl']=f'https://media.githubusercontent.com/media/copytolive/rwa/{sha}/{m["asset"]}'
          p.write_text(json.dumps(x,indent=2)+'\n')
          print('GOLD_YEAR_LFS_POINTER_PASS',year,sha,len(x['months']),x['bytes'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gold-year-${{ matrix.year }}
          path: |
            /tmp/gold-meta/summary-${{ matrix.year }}.json
            /tmp/gold-meta/audit-${{ matrix.year }}.json
          retention-days: 90

  manifest:
    needs: [prepare, build-year]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gold-year-*
          path: summaries
          merge-multiple: true
      - name: Build total manifest coverage and checksum inventory
        shell: bash
        env:
          CUTOFF: ${{ needs.prepare.outputs.cutoff }}
        run: |
          set -euo pipefail
          python3 scripts/renko_gold_audit.py build-manifest \
            --summaries-dir summaries \
            --cutoff "$CUTOFF" \
            --output-dir generated
          python3 - <<'PY'
          import json
          x=json.load(open('generated/coverage.json'))
          assert x['provider']=='Dukascopy' and x['instrumentCode']=='XAU-USD'
          assert x['allMonthlyAuditsPass'] is True
          assert x['duplicateSeconds']==0 and x['conflictingOHLC']==0
          assert not x['missingMonths'] and not x['extraMonths'] and not x['overlaps']
          print('GOLD_TOTAL_COVERAGE_AUDIT',json.dumps(x,separators=(',',':')))
          PY
      - name: Commit lightweight total-history metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git pull --rebase origin feat/renko-gold-total-history-2003-2026
          cp generated/full-manifest.json renko/history/gold/full-manifest.json
          cp generated/coverage.json renko/history/gold/coverage.json
          cp generated/checksums.json renko/history/gold/checksums.json
          cp generated/checksums.sha256 renko/history/gold/checksums.sha256
          git add renko/history/gold/full-manifest.json renko/history/gold/coverage.json renko/history/gold/checksums.json renko/history/gold/checksums.sha256
          git commit -m 'data(renko): publish audited GOLD total-history manifest' || true
          git push origin HEAD:feat/renko-gold-total-history-2003-2026
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-total-history-manifest
          path: generated/
          retention-days: 90
