name: VectorForge Verified Batch

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'EURUSD source month (YYYY-MM)'
        required: false
        default: '2018-01'
  push:
    branches: ['main']
    paths:
      - 'backtest/factory/**'

permissions:
  contents: write

concurrency:
  group: vectorforge-verified-batch
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VF_MONTH: ${{ github.event.inputs.month || '2018-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric engine
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run verified batch
        run: python backtest/factory/run_batch.py
      - name: Validate result JSON
        run: |
          python -m json.tool backtest/results/campaign.json >/dev/null
          python -m json.tool backtest/results/latest_batch.json >/dev/null
          python -m json.tool backtest/results/evaluation_ids.json >/dev/null
      - name: Persist verified results
        run: |
          git config user.name 'vectorforge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backtest/results/
          if git diff --cached --quiet; then
            echo 'No new unique evaluations.'
          else
            git commit -m "VectorForge verified batch ${VF_MONTH}"
            git push
          fi
