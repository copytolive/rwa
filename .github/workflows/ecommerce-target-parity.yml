name: Ecommerce Target Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'chart-core.js'
      - 'rwa-target-dashboard-v2.js'
      - 'rwa-target-dashboard-v2.css'
      - 'rwa-target-dashboard-v2-hardening.css'
      - 'rwa-ecommerce-target-controller-v1.js'
      - 'rwa-ecommerce-production-visual-v1.js'
      - 'rwa-ecommerce-parity-finish-v2.js'
      - 'rwa-target-topbar-cleanup-v1.js'
      - 'rwa-seablueprint-commerce-bridge.js'
      - 'rwa-seablueprint-commerce-bridge.css'
      - 'rwa-storefront.js'
      - 'rwa-screenshot-parity-v1.js'
      - 'rwa-screenshot-parity-v1.css'
      - 'assets/ecommerce/**'
      - 'tools/ecommerce-first-paint-browser.mjs'
      - 'tools/ecommerce-target-parity-browser.mjs'
      - 'tools/screenshot-to-code-parity-browser.mjs'
      - 'tools/screenshot-parity-production-guard-browser.mjs'
      - 'tools/visual-style-audit-browser.mjs'
      - '.github/workflows/ecommerce-target-parity.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local RWA shell
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/rwa-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-http.log
          exit 1
      - name: Prove 0ms first paint has no legacy shell
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/ecommerce-first-paint-local
        run: node tools/ecommerce-first-paint-browser.mjs
      - name: Run target interaction matrix
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/ecommerce-target-parity-local
        run: node tools/ecommerce-target-parity-browser.mjs
      - name: Run responsive computed-style visual audit
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/visual-style-audit-local
        run: node tools/visual-style-audit-browser.mjs
      - name: Prove screenshot overlay is absent in normal mode
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/screenshot-parity-production-guard-local
        run: node tools/screenshot-parity-production-guard-browser.mjs
      - name: Run screenshot-to-code exact 1672x941 preview
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/screenshot-to-code-parity-local
        run: node tools/screenshot-to-code-parity-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-target-parity-local-${{ github.sha }}
          path: |
            proof/ecommerce-first-paint-local/
            proof/ecommerce-target-parity-local/
            proof/visual-style-audit-local/
            proof/screenshot-parity-production-guard-local/
            proof/screenshot-to-code-parity-local/
          if-no-files-found: error
          retention-days: 30

  public-browser:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact GitHub Pages SHA
        shell: bash
        run: |
          set -euxo pipefail
          url='https://copytolive.github.io/rwa/deployment-sha.txt'
          for i in $(seq 1 60); do
            deployed="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?v=${GITHUB_SHA}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            [ "$deployed" = "$GITHUB_SHA" ] && echo "Exact Pages SHA is live: $deployed" && exit 0
            echo "Waiting for Pages. expected=$GITHUB_SHA actual=${deployed:-unavailable}"
            sleep 10
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove public 0ms first paint has no legacy shell
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/ecommerce-first-paint-public
        run: node tools/ecommerce-first-paint-browser.mjs
      - name: Run public target interaction matrix
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/ecommerce-target-parity-public
        run: node tools/ecommerce-target-parity-browser.mjs
      - name: Run public responsive computed-style visual audit
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/visual-style-audit-public
        run: node tools/visual-style-audit-browser.mjs
      - name: Prove public production has no screenshot overlay
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/screenshot-parity-production-guard-public
        run: node tools/screenshot-parity-production-guard-browser.mjs
      - name: Run public screenshot-to-code exact preview
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/screenshot-to-code-parity-public
        run: node tools/screenshot-to-code-parity-browser.mjs
      - name: Verify fail-closed and zero-duration contract
        run: |
          python3 - <<'PY'
          import json
          f=json.load(open('proof/ecommerce-first-paint-public/browser-result.json'))
          assert f['ok'] is True and not f['failures'], f
          assert all(r['captureDelayMs']==0 for r in f['results']), f
          p=json.load(open('proof/ecommerce-target-parity-public/browser-result.json'))
          assert p['ok'] is True and p['publicMode'] is True and not p['failures'], p
          for r in p['results']:
              assert r['audit']['target']['transitionMs'] == 0, r
              assert r['audit']['target']['animationMs'] == 0, r
              assert r['audit']['target']['backendLocked'] is True, r
          v=json.load(open('proof/visual-style-audit-public/browser-result.json'))
          assert v['ok'] is True and not v['failures'], v
          assert all(x['status'] != 'FAIL' for x in v['interactions']), v['interactions']
          g=json.load(open('proof/screenshot-parity-production-guard-public/browser-result.json'))
          assert g['ok'] is True and not g['failures'], g
          assert g['audit']['parityApiLoaded'] is False and g['audit']['parityRootPresent'] is False, g
          assert g['audit']['canonicalTargetPresent'] is True and g['audit']['backendLocked'] is True, g
          s=json.load(open('proof/screenshot-to-code-parity-public/browser-result.json'))
          assert s['ok'] is True and not s['failures'], s
          print('PUBLIC_ECOMMERCE_FIRST_PAINT_STYLE_AND_PARITY_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ecommerce-target-parity-public-${{ github.sha }}
          path: |
            proof/ecommerce-first-paint-public/
            proof/ecommerce-target-parity-public/
            proof/visual-style-audit-public/
            proof/screenshot-parity-production-guard-public/
            proof/screenshot-to-code-parity-public/
          if-no-files-found: error
          retention-days: 30
