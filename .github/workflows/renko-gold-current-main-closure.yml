name: RENKO GOLD Current Main Canonical Closure

on:
  push:
    branches:
      - main
    paths:
      - 'renko/**'
      - 'scripts/renko_gold_canonical_reader.py'
      - '.github/workflows/renko-gold-current-main-closure.yml'
      - '.github/workflows/renko-traditional-control-all-pairs.yml'
      - '.github/workflows/renko-atr-control-all-pairs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renko-gold-current-main-proof
  cancel-in-progress: false

jobs:
  validate-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: GOLD canonical full-history contract
        shell: bash
        run: |
          set -euo pipefail
          test -s renko/renko-tv-engine-fastpath.js
          node --check renko/renko-chart-bridge.js
          node --check renko/renko-gold-total-history.js
          node --check renko/renko-gold-total-history-worker.js
          node --check renko/renko-tv-atr-control.js
          node --check renko/renko-tv-traditional-control.js
          python3 -m py_compile scripts/renko_gold_canonical_reader.py
          test -s renko/history/gold/full-manifest.json
          test -s renko/history/gold/coverage.json
          test -s renko/history/gold/checksums.json
          test -s renko/history/gold/checksums.sha256
          python3 - <<'PY'
          import datetime as dt,json
          m=json.load(open('renko/history/gold/full-manifest.json'))
          c=json.load(open('renko/history/gold/coverage.json'))
          s=json.load(open('renko/history/gold/checksums.json'))
          assert m['schema']=='renko-gold-s1-full-manifest-v1'
          assert m['provider']=='Dukascopy' and m['instrumentCode']=='XAU-USD' and m['symbol']=='XAUUSD'
          assert m['interval']=='1s' and m['priceSide']=='bid' and float(m['tickSize'])==0.001
          assert m['backfillComplete'] is True and c['backfillComplete'] is True
          assert c['originWitnessSatisfied'] is True and c['allMonthlyAuditsPass'] is True
          assert c['sourceStatusAccountingPass'] is True
          assert c['sourceUnavailableHours']==0 and c['duplicateSeconds']==0 and c['conflictingOHLC']==0
          assert c['missingMonths']==[] and c['extraMonths']==[] and c['overlaps']==[]
          months=m['months']
          assert months and (months[0]['year'],months[0]['month'])==(2003,5)
          assert months[0]['earliestSecond']==1052092863
          cutoff=dt.datetime.fromisoformat(m['cutoff'].replace('Z','+00:00'))
          assert (months[-1]['year'],months[-1]['month'])==(cutoff.year,cutoff.month)
          assert all(x['auditPass'] and x['sourceStatusAccountingPass'] and x['sourceUnavailableHours']==0 for x in months)
          assert all(x['notFoundHours']==x['marketClosedNotFoundHours'] for x in months)
          assert all(x['emptySourceHours']==x['marketClosedEmptyHours']+x['providerEmptyHours'] for x in months)
          assert all(x['marketClosedHours']==x['marketClosedEmptyHours']+x['marketClosedNotFoundHours'] for x in months)
          assert len(s['assets'])==len(months)==c['publishedMonths']==c['expectedMonths']
          assert len({(x['year'],x['month']) for x in months})==len(months)
          assert all(x['assetUrl'].startswith('https://media.githubusercontent.com/media/copytolive/rwa/') for x in months)
          assert m['dataVersion']==c['dataVersion']==s['dataVersion']
          assert isinstance(m['versionSha256'],str) and len(m['versionSha256'])==64
          html=open('renko/index.html').read()
          assert '<script src="renko-gold-total-history.js' in html
          assert '<script src="renko-tv-engine-fastpath.js' in html
          assert 'data-apply-method="atr"' in html and 'data-apply-method="traditional"' in html
          r=open('renko/renko-gold-total-history.js').read()
          assert 'history/gold/full-manifest.json' in r
          print('GOLD_CURRENT_MAIN_DATA_GATE_PASS',json.dumps({'months':len(months),'bars':c['barCount'],'bytes':c['compressedBytes'],'earliestSecond':c['earliestSecond'],'latestSecond':c['latestSecond'],'cutoff':c['cutoff'],'version':m['dataVersion'],'versionSha256':m['versionSha256']},separators=(',',':')))
          PY
          if find . -type f -name 'xauusd-s1-*.csv.gz' -print -quit | grep -q .; then echo 'large canonical CSV gzip leaked into repository tree'; exit 1; fi
          echo "GOLD_CANONICAL_VALIDATION_ONLY_PASS $GITHUB_SHA"

  public-browser:
    needs: validate-canonical
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact canonical production SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            root="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            renko="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            if [ "$root" = "$GITHUB_SHA" ] && [ "$renko" = "$GITHUB_SHA" ]; then echo "GOLD_CANONICAL_PRODUCTION_SHA_PASS $renko"; exit 0; fi
            sleep 5
          done
          echo 'Canonical Pages did not converge to expected root + RENKO SHA'; exit 1
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Desktop canonical chart proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1672,height:941}});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const started=Date.now();await page.goto('https://copytolive.github.io/rwa/renko/?gold=1&currentMainClosure=1',{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecent==='true'&&document.querySelector('#chartHost canvas'),{timeout:60000});
          const firstPaintMs=Date.now()-started;
          const result=await page.evaluate(async()=>{
            const H=window.RWARenkoGoldTotalHistory,T=window.RWARenkoTV;if(!H||!T)throw new Error('total runtime missing');
            const m=await H.loadManifest(true);if(!m.backfillComplete)throw new Error('public manifest incomplete');
            const recentOldest=Math.floor(T.state.closedBars[0].openTime/1000),ts=window.__RWARenkoChart.timeScale();
            const beforeRange=ts.getVisibleRange();await H.prefetchPreviousFor(recentOldest);const afterRange=ts.getVisibleRange();
            if(beforeRange&&afterRange&&(Number(beforeRange.from)!==Number(afterRange.from)||Number(beforeRange.to)!==Number(afterRange.to)))throw new Error('prefetch moved viewport');
            for(let i=0;i<4;i++){const ok=await H.prependOlder({panOlder:true});if(!ok)throw new Error('repeated prepend failed '+i);await new Promise(r=>setTimeout(r,80));}
            const bars=T.state.closedBars;if(bars.length>140000)throw new Error('bounded RAM source-bar cap exceeded');
            for(let i=1;i<bars.length;i++)if(bars[i].openTime<=bars[i-1].openTime)throw new Error('duplicate/non-monotonic loaded second');
            const origin=await H.decodeMonth(m.months[0]);if(origin.sec[0]!==1052092863)throw new Error('true origin mismatch '+origin.sec[0]);
            const latest=m.months.at(-1),latestBytes=await H.getBytes(latest);if(latestBytes.byteLength!==Number(latest.bytes))throw new Error('latest canonical bytes mismatch');
            return {months:m.months.length,dataVersion:m.dataVersion,versionSha256:m.versionSha256,backfillComplete:m.backfillComplete,recentOldest,loadedOldest:Math.floor(bars[0].openTime/1000),memoryBars:bars.length,originSecond:origin.sec[0],latestSecond:latest.latestSecond,stats:{...H.stats},provider:T.state.historyMeta.provider,interval:T.state.historyMeta.interval};
          });
          if(errors.length)throw new Error('page errors '+JSON.stringify(errors));
          console.log('GOLD_PUBLIC_DESKTOP_CURRENT_MAIN_PASS',JSON.stringify({firstPaintMs,...result}));
          await browser.close();
          NODE
      - name: Mobile canonical chart proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium,devices } from 'playwright';const browser=await chromium.launch({headless:true});const page=await browser.newPage({...devices['iPhone 13']});const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          const t=Date.now();await page.goto('https://copytolive.github.io/rwa/renko/?gold=1&currentMainClosureMobile=1',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecent==='true'&&document.querySelector('#chartHost canvas'),{timeout:60000});
          const x=await page.evaluate(async()=>{const H=window.RWARenkoGoldTotalHistory,T=window.RWARenkoTV,m=await H.loadManifest();return{symbol:T.state.symbol,status:T.state.status,bars:T.state.closedBars.length,provider:m.provider,instrument:m.instrumentCode,interval:m.interval,side:m.priceSide,complete:m.backfillComplete,months:m.months.length,dataVersion:m.dataVersion,versionSha256:m.versionSha256,canvas:!!document.querySelector('#chartHost canvas')}});
          if(x.symbol!=='XAUUSD'||x.provider!=='Dukascopy'||x.instrument!=='XAU-USD'||x.interval!=='1s'||x.side!=='bid'||!x.complete||x.bars>100000||!x.canvas||errors.length)throw new Error(JSON.stringify({x,errors}));
          console.log('GOLD_PUBLIC_MOBILE_CURRENT_MAIN_PASS',JSON.stringify({firstPaintMs:Date.now()-t,...x}));await browser.close();
          NODE
      - name: GOLD Traditional + ATR Chromium method proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium,devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function prove(opts,label){
            const page=await browser.newPage(opts),errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`https://copytolive.github.io/rwa/renko/?gold=1&methodProof=1&v=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.RENKO_GOLD_ONLY===true&&document.documentElement.dataset.renkoGoldRecent==='true'&&window.RWARenkoTV?.state?.symbol==='XAUUSD'&&document.querySelector('#chartHost canvas'),{timeout:60000});
            await page.fill('#traditionalBox','1');await page.click('[data-apply-method="traditional"]');
            await page.waitForFunction(()=>window.RWARenkoTV?.settings?.method==='traditional'&&Number(window.RWARenkoTV?.state?.box)>0,{timeout:15000});
            const traditional=await page.evaluate(()=>({method:RWARenkoTV.settings.method,box:Number(RWARenkoTV.state.box),bars:RWARenkoTV.state.closedBars.length,interval:RWARenkoTV.settings.interval}));
            await page.fill('#atrLength','14');await page.click('[data-apply-method="atr"]');
            await page.waitForFunction(()=>window.RWARenkoTV?.settings?.method==='atr'&&Number(window.RWARenkoTV?.state?.box)>0,{timeout:15000});
            const atr=await page.evaluate(async()=>{const T=RWARenkoTV,H=RWARenkoGoldTotalHistory,m=await H.loadManifest();return{method:T.settings.method,box:Number(T.state.box),atrLength:Number(T.settings.atrLength),bars:T.state.closedBars.length,interval:T.settings.interval,symbol:T.state.symbol,provider:m.provider,instrument:m.instrumentCode,complete:m.backfillComplete,canvas:!!document.querySelector('#chartHost canvas')}});
            if(traditional.method!=='traditional'||!(traditional.box>0)||traditional.bars<100||traditional.interval!=='1s'||atr.method!=='atr'||!(atr.box>0)||atr.atrLength!==14||atr.bars<100||atr.interval!=='1s'||atr.symbol!=='XAUUSD'||atr.provider!=='Dukascopy'||atr.instrument!=='XAU-USD'||!atr.complete||!atr.canvas||errors.length)throw new Error(JSON.stringify({label,traditional,atr,errors}));
            console.log('GOLD_TRADITIONAL_ATR_PUBLIC_CHROMIUM_PASS',JSON.stringify({label,traditional,atr}));await page.close();
          }
          await prove({viewport:{width:1672,height:941}},'desktop');await prove({...devices['iPhone 13']},'mobile');await browser.close();
          NODE

  public-backtest-reader:
    needs: public-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact canonical public SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..120}; do
            root="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            renko="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null || true)"
            if [ "$root" = "$GITHUB_SHA" ] && [ "$renko" = "$GITHUB_SHA" ]; then echo "GOLD_BACKTEST_PUBLIC_SHA_PASS $renko"; exit 0; fi
            sleep 5
          done
          echo 'Canonical Pages did not converge before public backtest'; exit 1
      - name: Prove backtester identity equals chart manifest and stream across year boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gold-reader-cache
          python3 - <<'PY'
          import json,pathlib,sys,urllib.request
          sys.path.insert(0,'scripts')
          from renko_gold_canonical_reader import CanonicalGoldReader,WilderATRState
          url='https://copytolive.github.io/rwa/renko/history/gold/full-manifest.json'
          r=CanonicalGoldReader.from_path_or_url(url,pathlib.Path('/tmp/gold-reader-cache'))
          with urllib.request.urlopen(url,timeout=60) as q: public=json.load(q)
          ident=r.reproducibility_identity()
          assert ident['dataVersion']==public['dataVersion'] and ident['versionSha256']==public['versionSha256']
          assert len(ident['assets'])==len(public['months'])
          assert [x['assetSha256'] for x in ident['assets']]==[x['assetSha256'] for x in public['months']]
          state=WilderATRState(14);count=0;cross=None;prev_year=None;first=last=None
          for b in r.iter_bars(1735603200,1735862400):
              atr=state.update(b);year=__import__('datetime').datetime.fromtimestamp(b.unix_second,__import__('datetime').timezone.utc).year
              if first is None:first=b.unix_second
              if prev_year is not None and year!=prev_year and cross is None:cross={'second':b.unix_second,'atrTicks':atr,'stateCount':state.count}
              prev_year=year;last=b.unix_second;count+=1
          assert count>10000 and cross and cross['atrTicks'] is not None and cross['stateCount']>14
          print('GOLD_PUBLIC_BACKTEST_SAME_DATASET_PASS',json.dumps({'bars':count,'first':first,'last':last,'crossYear':cross,'dataVersion':ident['dataVersion'],'versionSha256':ident['versionSha256'],'assets':len(ident['assets'])},separators=(',',':')))
          PY

  final-no-drift:
    if: github.ref == 'refs/heads/main'
    needs:
      - public-browser
      - public-backtest-reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Final same-artifact public no-drift recertification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          remote="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$GITHUB_SHA" "$remote" || { echo "proof SHA is not an ancestor of current main: $GITHUB_SHA -> $remote"; exit 1; }
          renko_sha="$(curl -fsS "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" | tr -d '\r\n')"
          root_sha="$(curl -fsS "https://copytolive.github.io/rwa/deployment-sha.txt?cb=$RANDOM" | tr -d '\r\n')"
          [ "$renko_sha" = "$GITHUB_SHA" ] || { echo "renko public drift: $renko_sha"; exit 1; }
          [ "$root_sha" = "$GITHUB_SHA" ] || { echo "root public drift: $root_sha"; exit 1; }
          curl -fsS "https://copytolive.github.io/rwa/renko/history/gold/full-manifest.json?cb=$RANDOM" -o /tmp/public-full-manifest.json
          cmp -s renko/history/gold/full-manifest.json /tmp/public-full-manifest.json || { echo 'public manifest bytes drift'; exit 1; }
          python3 - <<'PY'
          import json
          local=json.load(open('renko/history/gold/full-manifest.json'))
          public=json.load(open('/tmp/public-full-manifest.json'))
          assert local==public
          assert public['provider']=='Dukascopy' and public['instrumentCode']=='XAU-USD' and public['symbol']=='XAUUSD'
          assert public['interval']=='1s' and public['backfillComplete'] is True
          assert public['months'][0]['earliestSecond']==1052092863
          assert len(public['months'])==281
          print('GOLD_FINAL_MANIFEST_IDENTITY_PASS',public['dataVersion'],public['versionSha256'],len(public['months']))
          PY
          echo "NO_EVIDENCE_MIXED_BETWEEN_SHAS $GITHUB_SHA current_main=$remote"
          echo "PUBLIC_PRODUCTION_PASS $GITHUB_SHA"
