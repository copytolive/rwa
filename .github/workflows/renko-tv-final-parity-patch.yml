name: RENKO TradingView Final Parity Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/renko-tv-final-parity-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch controller and browser proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('renko/renko-v15-method-controller-v186.js')
          s=p.read_text()
          old="if(m==='percentage')return roundTick(roundSig1(Math.abs(Number(st.ltpSnapshot))*profiles.percentage.percentage/100),tick);"
          new="if(m==='percentage')return roundTick(Math.abs(Number(st.ltpSnapshot))*profiles.percentage.percentage/100,tick);"
          if s.count(old)!=1: raise SystemExit(f'controller expected-rule match count={s.count(old)}')
          s=s.replace(old,new)
          old2="save();setFields();bind();sync();const r=root();if(r){r.dataset.controller='v15.19-instant-apply';r.dataset.controllerReady='1';r.dataset.controlsInteractive='1';r.dataset.operationContract='instant-first-frame-apply-no-blocking-history';r.dataset.firstScreenTarget=String(FIRST_SCREEN);r.dataset.numericAutoApply='0';r.dataset.inputWaitMs='0';r.dataset.noBlankFrame='1';r.dataset.wicksImmediate='1'}window.RWARenkoV15MethodProfiles="
          new2="save();setFields();bind();sync();const r=root();if(r){r.dataset.controller='v15.19-instant-apply';r.dataset.controllerReady='1';r.dataset.controlsInteractive='1';r.dataset.operationContract='instant-first-frame-apply-no-blocking-history';r.dataset.firstScreenTarget=String(FIRST_SCREEN);r.dataset.numericAutoApply='0';r.dataset.inputWaitMs='0';r.dataset.noBlankFrame='1';r.dataset.wicksImmediate='1'}if(METHODS.includes(String(engine.settings.method||'')))await apply(String(engine.settings.method),false);window.RWARenkoV15MethodProfiles="
          if s.count(old2)!=1: raise SystemExit(f'controller boot match count={s.count(old2)}')
          s=s.replace(old2,new2)
          p.write_text(s)

          p=Path('tools/renko-production-report.mjs')
          s=p.read_text()
          repl=[
            ("const snap=async(method,wallMs=null,seedRequired=false)=>page.evaluate(({method,wallMs,target,limit,seedRequired})=>{","const snap=async(method,wallMs=null,seedMode='none')=>page.evaluate(({method,wallMs,target,limit,seedMode})=>{"),
            ("const notLoading=!/loading|history|queued/i.test(`${activeState} ${liveLabel}`),sourceOk=!seedRequired||(instantSource==='deploy-seed'&&card?.dataset.seedExactBox==='1'&&exactHistory==='1');","const notLoading=!/loading|history|queued/i.test(`${activeState} ${liveLabel}`),sourceOk=seedMode==='exact'?(instantSource==='deploy-seed'&&card?.dataset.seedExactBox==='1'&&exactHistory==='1'):seedMode==='seed'?instantSource==='deploy-seed':true;"),
            ("return {method,wallMs,bricks:data.length,visible,box:Number(window.RWARenkoV15?.state?.box),atrValue:","return {method,wallMs,bricks:data.length,visible,box:Number(window.RWARenkoV15?.state?.box),tickSize:Number(window.RWARenkoV15?.state?.tickSize),atrValue:"),
            ("},{method,wallMs,target:TARGET_VISIBLE,limit:FIRST_FRAME_LIMIT_MS,seedRequired});","},{method,wallMs,target:TARGET_VISIBLE,limit:FIRST_FRAME_LIMIT_MS,seedMode});"),
            ("const atr14Wall=await apply('atr','#v15AtrLength','14'),atr14=await snap('atr-14',atr14Wall,false);","const atr14Wall=await apply('atr','#v15AtrLength','14'),atr14=await snap('atr-14',atr14Wall,'none');"),
            ("const atr140Wall=await apply('atr','#v15AtrLength','140'),atr140=await snap('atr-140',atr140Wall,false);","const atr140Wall=await apply('atr','#v15AtrLength','140'),atr140=await snap('atr-140',atr140Wall,'none');"),
            ("const traditionalWall=await apply('traditional','#v15TraditionalBox','1'),traditional=await snap('traditional-1',traditionalWall,true);","const traditionalWall=await apply('traditional','#v15TraditionalBox','1'),traditional=await snap('traditional-1',traditionalWall,'exact');"),
            ("const percentageWall=await apply('percentage','#v15Percentage','10'),percentage=await snap('percentage-10',percentageWall,true);","const percentageWall=await apply('percentage','#v15Percentage','10'),percentage=await snap('percentage-10',percentageWall,'seed');"),
            ("const row={label,viewport,url,boot,atr14,atr140,atrChanged,traditional,percentage,pass:atrChanged&&traditional.passImmediateScreen&&percentage.passImmediateScreen};","const pctExpected=Math.round((Math.abs(percentage.ltp)*.10)/percentage.tickSize)*percentage.tickSize,percentageFormulaOk=Math.abs(percentage.box-pctExpected)<=Math.max(percentage.tickSize*.51,Math.abs(pctExpected)*1e-9,1e-10);\n  const row={label,viewport,url,boot,atr14,atr140,atrChanged,traditional,wicks,percentage,percentageFormulaOk,pass:boot.passImmediateScreen&&atrChanged&&traditional.passImmediateScreen&&wicks.pass&&percentage.passImmediateScreen&&percentageFormulaOk};"),
            ("requiredExactSeedFor:['traditional','percentage'],requiredNoOverlap:true,requiredNoLoadingAfterApply:true","requiredExactSeedFor:['traditional'],requiredPercentageLtpRule:'LTP x percentage rounded only to nearest exchange minimum tick',requiredPercentageFirstFrameSource:'deploy-tick-seed; preview allowed while exact background is non-blocking',requiredWicksToggle:true,requiredNoOverlap:true,requiredNoLoadingAfterApply:true"),
          ]
          for old,new in repl:
              if s.count(old)!=1: raise SystemExit(f'report replacement match count={s.count(old)} for {old[:80]!r}')
              s=s.replace(old,new)

          marker="  async function apply(method,selector,value){return page.evaluate(({method,selector,value})=>new Promise((resolve,reject)=>{const input=document.querySelector(selector),button=document.querySelector(`[data-v15-apply=\"${method}\"]`);if(!input||!button)return reject(new Error(`missing ${method} controls`));const start=performance.now(),timer=setTimeout(()=>{window.removeEventListener('renko:v15-method-applied',on);reject(new Error(`${method} apply timeout`))},3000);const on=e=>{if(e.detail?.method!==method)return;clearTimeout(timer);window.removeEventListener('renko:v15-method-applied',on);resolve(performance.now()-start)};window.addEventListener('renko:v15-method-applied',on);input.focus();input.value=value;input.dispatchEvent(new Event('input',{bubbles:true}));button.click()}),{method,selector,value})}\n"
          helper=marker+"\n  async function setWicks(method,selector,checked){return page.evaluate(({method,selector,checked})=>new Promise((resolve,reject)=>{const input=document.querySelector(selector);if(!input)return reject(new Error(`missing ${method} wicks control`));const start=performance.now(),timer=setTimeout(()=>{window.removeEventListener('renko:v15-method-applied',on);reject(new Error(`${method} wicks timeout`))},3000);const on=e=>{if(e.detail?.method!==method)return;clearTimeout(timer);window.removeEventListener('renko:v15-method-applied',on);resolve(performance.now()-start)};window.addEventListener('renko:v15-method-applied',on);input.checked=checked;input.dispatchEvent(new Event('change',{bubbles:true}))}),{method,selector,checked})}\n  const wickExcursions=()=>page.evaluate(()=>{const a=window.RWARenkoV15?.state?.data||[];return a.filter(x=>Number(x.high)>Math.max(Number(x.open),Number(x.close))+1e-10||Number(x.low)<Math.min(Number(x.open),Number(x.close))-1e-10).length});\n"
          if s.count(marker)!=1: raise SystemExit('apply helper insertion point missing')
          s=s.replace(marker,helper)

          marker2="  const traditionalWall=await apply('traditional','#v15TraditionalBox','1'),traditional=await snap('traditional-1',traditionalWall,'exact');await page.screenshot({path:path.join(OUT,`${label}-traditional-1.png`),fullPage:true});\n"
          block=marker2+"  const wicksOnExcursions=await wickExcursions(),wicksOffWall=await setWicks('traditional','#v15TraditionalWicks',false),wicksOffExcursions=await wickExcursions();await page.screenshot({path:path.join(OUT,`${label}-traditional-wicks-off.png`),fullPage:true});\n  const wicksOnWall=await setWicks('traditional','#v15TraditionalWicks',true),wicksRestoredExcursions=await wickExcursions();await page.screenshot({path:path.join(OUT,`${label}-traditional-wicks-on.png`),fullPage:true});\n  const wicks={onExcursions:wicksOnExcursions,offExcursions:wicksOffExcursions,restoredExcursions:wicksRestoredExcursions,offWallMs:wicksOffWall,onWallMs:wicksOnWall,pass:wicksOnExcursions>0&&wicksOffExcursions===0&&wicksRestoredExcursions>0};\n"
          if s.count(marker2)!=1: raise SystemExit('traditional insertion point missing')
          s=s.replace(marker2,block)
          p.write_text(s)
          PY
          node --check renko/renko-v15-method-controller-v186.js
          node --check tools/renko-production-report.mjs
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "copytolive-renko-audit"
          git config user.email "copytolive@gmail.com"
          git add renko/renko-v15-method-controller-v186.js tools/renko-production-report.mjs
          git commit -m "fix(renko): complete official Percentage and browser proof alignment"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
