name: Superapp Mobile Legacy Test Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/superapp-mobile-legacy-test-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Remove obsolete mobile commerce assertion from explicit markets route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/superapp-v5-browser.mjs')
          s=p.read_text()
          old="assert.equal(await page.locator('[data-v5-mobile]').count(),0,'legacy mobile navigation resurfaced');assert.ok(await page.locator('#rwaShopScreen').count(),'target commerce shell missing on mobile');"
          new="assert.equal(await page.locator('[data-v5-mobile]').count(),0,'legacy mobile navigation resurfaced');"
          if old not in s: raise SystemExit('obsolete mobile commerce assertion not found')
          s=s.replace(old,new,1)
          s=s.replace("result.mobile={pathname:'/rwa/',bottomNav:true,assetSheet:true,tradeInternal:true,noOverflow:true}","result.mobile={pathname:'/rwa/',legacyBottomNavAbsent:true,assetSheet:true,tradeInternal:true,noOverflow:true}",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/superapp-v5-browser.mjs
          git commit -m 'test: stop requiring commerce shell on explicit markets route'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
