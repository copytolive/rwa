name: Superapp Mobile Legacy Test Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/superapp-mobile-legacy-test-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Reject legacy mobile nav while preserving router checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/superapp-v5-browser.mjs')
          s=p.read_text()
          old="for(const key of ['markets','search','trade','social','portfolio'])assert.ok(await page.locator(`[data-v5-mobile=\"${key}\"]`).count(),`mobile ${key} missing`);"
          new="assert.equal(await page.locator('[data-v5-mobile]').count(),0,'legacy mobile navigation resurfaced');assert.ok(await page.locator('#rwaShopScreen').count(),'target commerce shell missing on mobile');"
          if old not in s: raise SystemExit('legacy mobile nav assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/superapp-v5-browser.mjs
          git commit -m 'test: reject legacy mobile nav in Super App regression'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
