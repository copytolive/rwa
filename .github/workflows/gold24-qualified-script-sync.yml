name: GOLD24 Qualified Script Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold24-qualified-script-sync.yml'
      - 'backtest/gold24/qualified_scripts/sync_qualified_scripts.py'
      - 'backtest/gold24/qualified_scripts/family_codes.py'
      - 'backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv'
      - 'backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv'

permissions:
  contents: write

concurrency:
  group: gold24-qualified-script-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GOLD24 dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Synchronize exact selected Python/MT5 wrapper pairs
        run: |
          set -euo pipefail
          python backtest/gold24/qualified_scripts/sync_qualified_scripts.py
          test -s backtest/gold24/qualified_scripts/selected_manifest.json
          python - <<'PY'
          import csv,json,pathlib
          q=pathlib.Path('backtest/gold24/qualified_scripts')
          x=json.loads((q/'selected_manifest.json').read_text())
          strict=list(csv.DictReader(open('backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv')))
          multi=list(csv.DictReader(open('backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv')))
          expected=len(strict)+len(multi)
          assert x['status']=='PASS'
          assert x['total_method_pairs']==expected,(x['total_method_pairs'],expected)
          assert x['strict_count']==len(strict)
          assert x['multi_count']==len(multi)
          assert len(x['methods'])==expected
          assert all((q/m['python']).is_file() and (q/m['mt5']).is_file() for m in x['methods'])
          print(json.dumps({'status':'PASS','strict':len(strict),'multi':len(multi),'pairs':expected,'created':len(x['created']),'reused':len(x['reused'])},indent=2))
          PY
      - name: Publish wrapper synchronization race-safe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/gold24/qualified_scripts
          if git diff --cached --quiet; then
            echo "Qualified wrapper set already synchronized"
            exit 0
          fi
          git commit -m "chore(gold10b): sync exact selected Python/MT5 wrapper set"
          for TRY in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((TRY*2))
          done
          exit 1
