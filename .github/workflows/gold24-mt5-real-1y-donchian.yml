name: GOLD24 MT5 Real 1Y DONCHIAN Validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-mt5-real-1y-donchian.yml'
      - 'backtest/gold24/mt5_real_1y/**'

permissions:
  contents: read

env:
  MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
  MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
  MT5_SERVER: ${{ secrets.MT5_SERVER }}

jobs:
  mt5-real-1y:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify credential context
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:MT5_LOGIN) -or [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:MT5_SERVER)){throw 'MT5_ACCOUNT_CONTEXT_MISSING'}
          Write-Host 'MT5_ACCOUNT_CONTEXT=PRESENT'

      - name: Install Exness MT5 and Python bridge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5 beautifulsoup4
          $setup=Join-Path $env:RUNNER_TEMP 'exness5setup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 12
          $c=@()
          foreach($r in @('C:\Program Files','C:\Program Files (x86)',"$env:LOCALAPPDATA\Programs")){
            if(Test-Path $r){$c+=Get-ChildItem $r -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue}
          }
          $terminal=($c|Sort-Object LastWriteTime -Descending|Select-Object -First 1).FullName
          if([string]::IsNullOrWhiteSpace($terminal)){throw 'TERMINAL_NOT_FOUND'}
          $meta=Join-Path (Split-Path $terminal) 'metaeditor64.exe'
          if(!(Test-Path $meta)){throw 'METAEDITOR_NOT_FOUND'}
          "MT5_TERMINAL=$terminal"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_METAEDITOR=$meta"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'EXNESS_MT5_INSTALL=PASS'

      - name: Authenticate and detect broker-native XAUUSD history
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $probe=Join-Path $env:RUNNER_TEMP 'probe_mt5.py'
          @'
          import json, os
          from datetime import datetime, timezone
          import MetaTrader5 as mt5

          terminal=os.environ['MT5_TERMINAL']
          login=int(os.environ['MT5_LOGIN'])
          password=os.environ['MT5_PASSWORD']
          server=os.environ['MT5_SERVER']
          if not mt5.initialize(path=terminal, login=login, password=password, server=server, timeout=60000):
              raise SystemExit(f'MT5_INITIALIZE_FAIL {mt5.last_error()}')
          account=mt5.account_info()
          if account is None:
              raise SystemExit(f'MT5_ACCOUNT_INFO_FAIL {mt5.last_error()}')
          names=[s.name for s in (mt5.symbols_get() or []) if 'XAUUSD' in s.name.upper()]
          if not names:
              names=[s.name for s in (mt5.symbols_get() or []) if ('XAU' in s.name.upper() or 'GOLD' in s.name.upper())]
          if not names:
              raise SystemExit('NO_GOLD_SYMBOL_FOUND')
          symbol='XAUUSD' if 'XAUUSD' in names else sorted(names, key=lambda x:(len(x),x))[0]
          if not mt5.symbol_select(symbol, True):
              raise SystemExit(f'SYMBOL_SELECT_FAIL {symbol} {mt5.last_error()}')
          start=datetime(2025,9,2,tzinfo=timezone.utc)
          end=datetime(2026,9,2,23,59,59,tzinfo=timezone.utc)
          rates=mt5.copy_rates_range(symbol, mt5.TIMEFRAME_D1, start, end)
          if rates is None or len(rates) < 200:
              raise SystemExit(f'BROKER_D1_HISTORY_INSUFFICIENT symbol={symbol} rows={0 if rates is None else len(rates)} err={mt5.last_error()}')
          payload={
              'status':'PASS','symbol':symbol,'candidate_symbols':names[:30],
              'period_from':'2025-09-02','period_to':'2026-09-02',
              'd1_rows':int(len(rates)),
              'first_d1_utc':datetime.fromtimestamp(int(rates[0]['time']),timezone.utc).isoformat(),
              'last_d1_utc':datetime.fromtimestamp(int(rates[-1]['time']),timezone.utc).isoformat(),
              'account_currency':account.currency,
              'account_leverage':int(account.leverage),
              'company':account.company,
          }
          out=os.path.join(os.environ['RUNNER_TEMP'],'broker_probe.json')
          open(out,'w',encoding='utf-8').write(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          mt5.shutdown()
          '@ | Set-Content $probe -Encoding UTF8
          python $probe
          if($LASTEXITCODE -ne 0){throw "BROKER_PROBE_FAIL exit=$LASTEXITCODE"}
          $p=Get-Content (Join-Path $env:RUNNER_TEMP 'broker_probe.json') -Raw|ConvertFrom-Json
          "BROKER_SYMBOL=$($p.symbol)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BROKER_NATIVE_HISTORY=PASS symbol=$($p.symbol) d1_rows=$($p.d1_rows)"

      - name: Locate MT5 data directory and compile exact EA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process $env:MT5_TERMINAL -PassThru
          Start-Sleep -Seconds 15
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          $base=Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $data=Get-ChildItem $base -Directory -ErrorAction Stop|Where-Object {Test-Path (Join-Path $_.FullName 'MQL5')}|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if($null -eq $data){throw 'MT5_DATA_DIR_MISSING'}
          $expert=Join-Path $data.FullName 'MQL5\Experts\Gold24Real1Y'
          New-Item -ItemType Directory -Force $expert|Out-Null
          Copy-Item 'backtest/gold24/qualified_scripts/multi_rank01_donchian_f3_s89_off4_75_exp3.mq5' $expert -Force
          Copy-Item 'backtest/gold24/qualified_scripts/multimethod_engine.mqh' $expert -Force
          Copy-Item 'backtest/gold24/qualified_scripts/qualified_engine.mqh' $expert -Force
          $engine=Join-Path $expert 'qualified_engine.mqh'
          $txt=Get-Content $engine -Raw
          $txt=$txt.Replace('input string InpSignalSymbol = "XAUUSD";', 'input string InpSignalSymbol = "'+$env:BROKER_SYMBOL+'";')
          $txt=$txt.Replace('input string InpTradeSymbol  = "XAUUSD";', 'input string InpTradeSymbol  = "'+$env:BROKER_SYMBOL+'";')
          Set-Content $engine $txt -Encoding UTF8
          $ea=Join-Path $expert 'multi_rank01_donchian_f3_s89_off4_75_exp3.mq5'
          $log=Join-Path $env:RUNNER_TEMP 'compile.log'
          Remove-Item ([IO.Path]::ChangeExtension($ea,'.ex5')) -Force -ErrorAction SilentlyContinue
          $q=Start-Process $env:MT5_METAEDITOR -ArgumentList @("/compile:$ea","/log:$log") -PassThru
          if(-not $q.WaitForExit(120000)){Stop-Process -Id $q.Id -Force;throw 'COMPILE_TIMEOUT'}
          Start-Sleep -Seconds 2
          if(!(Test-Path ([IO.Path]::ChangeExtension($ea,'.ex5')))){throw 'EX5_MISSING'}
          if(Test-Path $log){$ct=Get-Content $log -Raw; if($ct -notmatch '0 errors, 0 warnings'){throw "COMPILE_NOT_CLEAN`n$ct"}}
          "MT5_DATA=$($data.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MT5_EXPERT_DIR=$expert"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'NATIVE_METAEDITOR_COMPILE=PASS'

      - name: Persist authenticated terminal account context
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ini=Join-Path $env:RUNNER_TEMP 'auth.ini'
          @(
            '[Common]',
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_PASSWORD",
            "Server=$env:MT5_SERVER",
            'NewsEnable=0',
            '[Experts]',
            'Enabled=0',
            'AllowLiveTrading=0',
            'AllowDllImport=0'
          )|Set-Content $ini -Encoding ASCII
          $p=Start-Process $env:MT5_TERMINAL -ArgumentList "/config:$ini" -PassThru
          Start-Sleep -Seconds 30
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'AUTHENTICATED_ACCOUNT_CONTEXT=PASS'

      - name: Run MT5 Strategy Tester on real broker ticks for one year
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mt5-real-1y';New-Item -ItemType Directory -Force $out|Out-Null
          $report=Join-Path $out 'mt5_real_1y_report.htm'
          $common=Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files\Gold24Qualified'
          New-Item -ItemType Directory -Force $common|Out-Null
          $receipt=Join-Path $common 'receipt_24090201.txt';Remove-Item $receipt -Force -ErrorAction SilentlyContinue
          $ini=Join-Path $env:RUNNER_TEMP 'tester-real-1y.ini'
          @(
            '[Common]',
            "Login=$env:MT5_LOGIN",
            "Password=$env:MT5_PASSWORD",
            "Server=$env:MT5_SERVER",
            'NewsEnable=0',
            '[Tester]',
            'Expert=Gold24Real1Y\multi_rank01_donchian_f3_s89_off4_75_exp3.ex5',
            "Symbol=$env:BROKER_SYMBOL",
            'Period=D1',
            'Model=4',
            'Optimization=0',
            'FromDate=2025.09.02',
            'ToDate=2026.09.02',
            'ForwardMode=0',
            'Deposit=100000',
            'Currency=USD',
            'Leverage=100',
            'Visual=0',
            "Report=$report",
            'ReplaceReport=1',
            'ShutdownTerminal=1'
          )|Set-Content $ini -Encoding ASCII
          $p=Start-Process $env:MT5_TERMINAL -ArgumentList "/config:$ini" -PassThru
          if(-not $p.WaitForExit(900000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue;throw 'STRATEGY_TESTER_TIMEOUT'}
          Start-Sleep -Seconds 5
          if(!(Test-Path $report)){throw 'MT5_REPORT_MISSING'}
          if(!(Test-Path $receipt)){throw 'EA_RECEIPT_MISSING'}
          Copy-Item $receipt $out -Force
          $rt=Get-Content $receipt -Raw
          if($rt -notmatch '(?m)^status=PASS'){throw "EA_RECEIPT_NOT_PASS`n$rt"}
          Write-Host 'MT5_REAL_TICKS_1Y_TESTER=PASS'

      - name: Parse native MT5 report and deal history
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mt5-real-1y'
          python backtest/gold24/mt5_real_1y/parse_mt5_report.py --report (Join-Path $out 'mt5_real_1y_report.htm') --out-dir $out
          if($LASTEXITCODE -ne 0){throw "REPORT_PARSE_FAIL exit=$LASTEXITCODE"}
          Copy-Item (Join-Path $env:RUNNER_TEMP 'broker_probe.json') $out -Force
          $s=Get-Content (Join-Path $out 'mt5_summary.json') -Raw|ConvertFrom-Json
          if($s.status -ne 'PASS'){throw 'MT5_SUMMARY_NOT_PASS'}
          Write-Host "MT5_REPORT_PARSE=PASS deals_rows=$($s.deals_rows) orders_rows=$($s.orders_rows)"

      - name: Upload MT5 real 1Y evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gold24-mt5-real-1y-${{ github.run_id }}
          path: ${{ runner.temp }}/mt5-real-1y
          if-no-files-found: warn
          retention-days: 90
