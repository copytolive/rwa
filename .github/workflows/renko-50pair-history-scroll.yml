name: RENKO 50 Pair History Scroll Continuity
on:
  push:
    branches:
      - main
      - fix/renko-50pair-history-scroll-zero-20260829
    paths:
      - 'renko/**'
      - 'tools/renko-50pair-history-scroll-report.mjs'
      - '.github/workflows/renko-50pair-history-scroll.yml'
  pull_request:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-50pair-history-scroll-report.mjs'
      - '.github/workflows/renko-50pair-history-scroll.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static history continuity contract
        run: |
          set -euo pipefail
          node --check renko/renko-tv-switch-fast.js
          node --check tools/renko-50pair-history-scroll-report.mjs
          grep -q "version:'1.2.0-history-scroll'" renko/renko-tv-switch-fast.js
          grep -q 'launch-pair-session-history-cache-merge-plus-o1-wheel-ack-two-frame-continuity' renko/renko-tv-switch-fast.js
          grep -q 'renko-tv-switch-fast.js?v=3' renko/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-history-scroll-site
          mkdir -p /tmp/renko-history-scroll-site/rwa
          cp -a . /tmp/renko-history-scroll-site/rwa/
          cd /tmp/renko-history-scroll-site
          python3 -m http.server 8080 >/tmp/renko-history-scroll-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko-history-scroll-http.log
          exit 1
      - name: EXACT 50 pairs — settled far-history screenshots + switch/revisit + wheel gate
        run: |
          set -euo pipefail
          RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_HISTORY_SCROLL_OUT=artifacts/exact-history-scroll node tools/renko-50pair-history-scroll-report.mjs
      - name: Enforce exact 50/50 + screenshots + strict <=1ms
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/exact-history-scroll/report.json','utf8'));
          const s=r.summary||{};
          if(r.status!=='PASS'||s.pairs!==50||s.firstPassPass!==50||s.revisitPass!==50||s.screenshotCount!==50||Number(s.firstFrameMaxMs)>1||Number(s.scrollAckMaxMs)>1||Number(s.scrollLosses)!==0)throw new Error(JSON.stringify(s));
          console.log(`EXACT_HISTORY_SCROLL_PASS pairs=50 screenshots=50 firstFrameMaxMs=${s.firstFrameMaxMs} scrollAckMaxMs=${s.scrollAckMaxMs} minHistoryBars=${s.minHistoryBars}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-50pair-history-scroll-exact-${{ github.sha }}
          path: artifacts/exact-history-scroll
          retention-days: 30
  public-production:
    if: github.ref == 'refs/heads/main'
    needs: exact-browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for public switch-history runtime
        run: |
          set -euo pipefail
          index='https://copytolive.github.io/rwa/renko/'
          script='https://copytolive.github.io/rwa/renko/renko-tv-switch-fast.js'
          for i in $(seq 1 90); do
            ts=$(date +%s%N)
            html=$(curl -fsS "$index?ts=$ts" 2>/dev/null || true)
            js=$(curl -fsS "$script?ts=$ts" 2>/dev/null || true)
            if grep -q 'renko-tv-switch-fast.js?v=3' <<<"$html" && grep -q "version:'1.2.0-history-scroll'" <<<"$js"; then
              echo PUBLIC_RENKO_HISTORY_SCROLL_RUNTIME_READY
              exit 0
            fi
            sleep 5
          done
          echo 'Public RENKO runtime did not reach switch-fast v1.2.0-history-scroll'
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: PUBLIC 50 pairs — settled far-history screenshots + switch/revisit + wheel gate
        run: |
          set -euo pipefail
          RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_HISTORY_SCROLL_OUT=artifacts/public-history-scroll node tools/renko-50pair-history-scroll-report.mjs
      - name: Enforce public 50/50 + screenshots + strict <=1ms
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/public-history-scroll/report.json','utf8'));
          const s=r.summary||{};
          if(r.status!=='PASS'||s.pairs!==50||s.firstPassPass!==50||s.revisitPass!==50||s.screenshotCount!==50||Number(s.firstFrameMaxMs)>1||Number(s.scrollAckMaxMs)>1||Number(s.scrollLosses)!==0)throw new Error(JSON.stringify(s));
          console.log(`PUBLIC_HISTORY_SCROLL_PASS pairs=50 screenshots=50 firstFrameMaxMs=${s.firstFrameMaxMs} scrollAckMaxMs=${s.scrollAckMaxMs} minHistoryBars=${s.minHistoryBars}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-50pair-history-scroll-public-${{ github.sha }}
          path: artifacts/public-history-scroll
          retention-days: 30
