name: MT5 XAUUSD Native Validation

on:
  workflow_dispatch:
  push:
    branches: [mt5-ci-smoke]
    paths:
      - .github/workflows/mt5-xauusd-native-validation.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mt5-xauusd-native-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Prepare folders
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\mt5val\out | Out-Null
          New-Item -ItemType Directory -Force C:\mt5val\downloads | Out-Null

      - name: Download public validation inputs
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://drive.usercontent.google.com/download?id=1_TuvWqYsct8v9o0_HVYWrZPjz2lXN0n-&export=download&confirm=t' -OutFile C:\mt5val\downloads\SmokeEA.mq5
          Invoke-WebRequest 'https://drive.usercontent.google.com/download?id=1s9OP9HyLqMDGPQCO1QtRzv6YOSbklo1c&export=download&confirm=t' -OutFile C:\mt5val\downloads\XAUUSD_M1.csv
          if ((Get-Item C:\mt5val\downloads\XAUUSD_M1.csv).Length -lt 20000000) { throw 'Dataset download is incomplete' }
          Get-FileHash C:\mt5val\downloads\SmokeEA.mq5 -Algorithm SHA256 | Format-List | Out-File C:\mt5val\out\input_hashes.txt
          Get-FileHash C:\mt5val\downloads\XAUUSD_M1.csv -Algorithm SHA256 | Format-List | Out-File C:\mt5val\out\input_hashes.txt -Append

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile C:\mt5val\mt5setup.exe
          $installer = Start-Process C:\mt5val\mt5setup.exe -ArgumentList '/auto' -PassThru
          $terminal = $null
          for($i=0; $i -lt 72 -and -not $terminal; $i++) {
            Start-Sleep 5
            $terminal = Get-ChildItem 'C:\Program Files' -Filter terminal64.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          Get-Process terminal64,metaeditor64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if($installer -and -not $installer.HasExited) { $installer.Kill() }
          if (-not $terminal) { throw 'terminal64.exe not installed after 6 minutes' }
          $root = 'C:\mt5val\terminal'
          Copy-Item -Recurse -Force $terminal.Directory.FullName $root
          $bootstrap = Start-Process "$root\terminal64.exe" -ArgumentList '/portable' -PassThru
          for($i=0; $i -lt 30 -and !(Test-Path "$root\MQL5\Include\Trade\Trade.mqh"); $i++) { Start-Sleep 3 }
          if($bootstrap -and -not $bootstrap.HasExited) { $bootstrap.Kill() }
          if(!(Test-Path "$root\MQL5\Include\Trade\Trade.mqh")) {
            $tradeLib = Get-ChildItem "$env:APPDATA\MetaQuotes" -Filter Trade.mqh -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if($tradeLib) { Copy-Item -Recurse -Force $tradeLib.Directory.Parent.FullName "$root\MQL5\Include" }
          }
          if(!(Test-Path "$root\MQL5\Include\Trade\Trade.mqh")) { throw 'MT5 standard library bootstrap failed' }
          "MT5_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force "$root\MQL5\Experts\AutoValidation" | Out-Null
          New-Item -ItemType Directory -Force "$root\MQL5\Scripts\AutoValidation" | Out-Null
          New-Item -ItemType Directory -Force "$root\MQL5\Files" | Out-Null
          Copy-Item C:\mt5val\downloads\SmokeEA.mq5 "$root\MQL5\Experts\AutoValidation\SmokeEA.mq5"
          $eaPath = "$root\MQL5\Experts\AutoValidation\SmokeEA.mq5"
          $eaText = Get-Content $eaPath -Raw
          $eaText = $eaText.Replace('<Trade/Trade.mqh>','<Trade\Trade.mqh>')
          $oldStopBlock = @'
   bool ok=trade.PositionModify(ticket,sl,tp);
'@
          $newStopBlock = @'
   double current_sl=PositionGetDouble(POSITION_SL);
   double current_tp=PositionGetDouble(POSITION_TP);
   if(MathAbs(current_sl-sl)<=_Point*0.5 && MathAbs(current_tp-tp)<=_Point*0.5)
      return true;

   bool ok=trade.PositionModify(ticket,sl,tp);
'@
          if(-not $eaText.Contains($oldStopBlock)) { throw 'Expected stop reconciliation block not found' }
          $eaText = $eaText.Replace($oldStopBlock,$newStopBlock)
          Set-Content $eaPath -Value $eaText -Encoding ASCII
          'Staging patches: include separator normalized; skip redundant exact-stop modification when entry already has requested SL/TP.' | Out-File C:\mt5val\out\staging_patch.txt
          Copy-Item C:\mt5val\downloads\XAUUSD_M1.csv "$root\MQL5\Files\XAUUSD_M1.csv"

      - name: Build custom-symbol importer
        shell: powershell
        run: |
          @'
          #property script_show_inputs
          input string InpFile="XAUUSD_M1.csv";
          input string InpSymbol="XAUUSD-test";
          void OnStart()
          {
             ResetLastError();
             if(!CustomSymbolCreate(InpSymbol,"Validation"))
             {
                int e=GetLastError();
                if(e!=5304) { Print("CustomSymbolCreate failed ",e); ExpertRemove(); return; }
             }
             CustomSymbolSetString(InpSymbol,SYMBOL_DESCRIPTION,"XAUUSD validation dataset");
             CustomSymbolSetString(InpSymbol,SYMBOL_CURRENCY_BASE,"XAU");
             CustomSymbolSetString(InpSymbol,SYMBOL_CURRENCY_PROFIT,"USD");
             CustomSymbolSetString(InpSymbol,SYMBOL_CURRENCY_MARGIN,"USD");
             CustomSymbolSetInteger(InpSymbol,SYMBOL_DIGITS,2);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_POINT,0.01);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_TRADE_TICK_SIZE,0.01);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_TRADE_TICK_VALUE,1.0);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_TRADE_CONTRACT_SIZE,100.0);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_MARGIN_INITIAL,1.0);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_MARGIN_MAINTENANCE,1.0);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_VOLUME_MIN,0.01);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_VOLUME_MAX,100.0);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_VOLUME_STEP,0.01);
             CustomSymbolSetDouble(InpSymbol,SYMBOL_VOLUME_LIMIT,100.0);
             CustomSymbolSetInteger(InpSymbol,SYMBOL_TRADE_CALC_MODE,SYMBOL_CALC_MODE_CFD);
             CustomSymbolSetInteger(InpSymbol,SYMBOL_TRADE_STOPS_LEVEL,0);
             CustomSymbolSetInteger(InpSymbol,SYMBOL_TRADE_FREEZE_LEVEL,0);
             CustomSymbolSetInteger(InpSymbol,SYMBOL_TRADE_MODE,SYMBOL_TRADE_MODE_FULL);
             int h=FileOpen(InpFile,FILE_READ|FILE_CSV|FILE_ANSI,'\t');
             if(h==INVALID_HANDLE) { Print("FileOpen failed ",GetLastError()); ExpertRemove(); return; }
             string d,t;
             long tv,vol;
             double o,hi,lo,c;
             int spread;
             d=FileReadString(h); t=FileReadString(h);
             o=FileReadNumber(h); hi=FileReadNumber(h); lo=FileReadNumber(h); c=FileReadNumber(h);
             tv=(long)FileReadNumber(h); vol=(long)FileReadNumber(h); spread=(int)FileReadNumber(h);
             MqlRates rates[];
             ArrayResize(rates,0,50000);
             while(!FileIsEnding(h))
             {
                d=FileReadString(h); if(FileIsEnding(h) && d=="") break;
                t=FileReadString(h);
                o=FileReadNumber(h); hi=FileReadNumber(h); lo=FileReadNumber(h); c=FileReadNumber(h);
                tv=(long)FileReadNumber(h); vol=(long)FileReadNumber(h); spread=(int)FileReadNumber(h);
                datetime tm=StringToTime(d+" "+t);
                if(tm<=0) continue;
                int n=ArraySize(rates);
                ArrayResize(rates,n+1,50000);
                rates[n].time=tm; rates[n].open=o; rates[n].high=hi; rates[n].low=lo; rates[n].close=c;
                rates[n].tick_volume=tv; rates[n].real_volume=vol; rates[n].spread=spread;
             }
             FileClose(h);
             int total=ArraySize(rates);
             if(total<1000) { Print("Too few rates ",total); ExpertRemove(); return; }
             int written=CustomRatesReplace(InpSymbol,0,LONG_MAX,rates);
             Print("IMPORT_RESULT total=",total," written=",written," error=",GetLastError());
             int out=FileOpen("import_result.txt",FILE_WRITE|FILE_TXT|FILE_ANSI);
             if(out!=INVALID_HANDLE) { FileWrite(out,"total=",total," written=",written," error=",GetLastError()); FileClose(out); }
             ExpertRemove();
          }
          '@ | Set-Content "$env:MT5_ROOT\MQL5\Scripts\AutoValidation\ImportXAUUSD.mq5" -Encoding ASCII

      - name: Compile importer and EA
        shell: powershell
        run: |
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $importSrc = "$env:MT5_ROOT\MQL5\Scripts\AutoValidation\ImportXAUUSD.mq5"
          $eaSrc = "$env:MT5_ROOT\MQL5\Experts\AutoValidation\SmokeEA.mq5"
          Start-Process $meta -ArgumentList "/compile:`"$importSrc`"",'/log','/portable' -Wait
          Start-Process $meta -ArgumentList "/compile:`"$eaSrc`"",'/log','/portable' -Wait
          $importLog = [IO.Path]::ChangeExtension($importSrc,'.log')
          $eaLog = [IO.Path]::ChangeExtension($eaSrc,'.log')
          Copy-Item $importLog C:\mt5val\out\compile_importer.log
          Copy-Item $eaLog C:\mt5val\out\compile_ea.log
          Get-Content $importLog
          Get-Content $eaLog
          if ((Get-Content $importLog -Raw) -notmatch '0 errors') { throw 'Importer compile errors' }
          if ((Get-Content $eaLog -Raw) -notmatch '0 errors') { throw 'EA compile errors' }
          if (!(Test-Path "$env:MT5_ROOT\MQL5\Scripts\AutoValidation\ImportXAUUSD.ex5")) { throw 'Importer EX5 missing' }
          if (!(Test-Path "$env:MT5_ROOT\MQL5\Experts\AutoValidation\SmokeEA.ex5")) { throw 'EA EX5 missing' }

      - name: Import dataset into MT5
        shell: powershell
        run: |
          @"
          [StartUp]
          Script=AutoValidation\ImportXAUUSD
          Symbol=EURUSD
          Period=M1
          ShutdownTerminal=1
          "@ | Set-Content C:\mt5val\import.ini -Encoding ASCII
          $p=Start-Process "$env:MT5_ROOT\terminal64.exe" -ArgumentList '/portable','/config:C:\mt5val\import.ini' -PassThru
          if(-not $p.WaitForExit(600000)) { $p.Kill(); throw 'Import timed out' }
          Copy-Item "$env:MT5_ROOT\MQL5\Files\import_result.txt" C:\mt5val\out\ -ErrorAction SilentlyContinue
          Get-ChildItem "$env:MT5_ROOT\logs" -Filter *.log | Copy-Item -Destination C:\mt5val\out\ -ErrorAction SilentlyContinue
          if (!(Test-Path C:\mt5val\out\import_result.txt)) { throw 'Import result missing' }
          Get-Content C:\mt5val\out\import_result.txt

      - name: Run MT5 Strategy Tester
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          if([string]::IsNullOrWhiteSpace($env:MT5_LOGIN) -or [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:MT5_SERVER)) { throw 'MT5 repository secrets are missing' }
          @"
          [Common]
          Login=$env:MT5_LOGIN
          Password=$env:MT5_PASSWORD
          Server=$env:MT5_SERVER
          [Tester]
          Expert=AutoValidation\SmokeEA
          Symbol=XAUUSD-test
          Period=H1
          Model=1
          ExecutionMode=0
          Optimization=0
          FromDate=2024.01.01
          ToDate=2025.01.01
          ForwardMode=0
          Deposit=10000
          Currency=USD
          Leverage=100
          Login=$env:MT5_LOGIN
          UseLocal=1
          UseRemote=0
          UseCloud=0
          Report=mt5_report
          ReplaceReport=1
          ShutdownTerminal=1
          Visual=0
          "@ | Set-Content C:\mt5val\tester.ini -Encoding Unicode
          @"
          [Common]
          Login=<GITHUB_SECRET>
          Password=<GITHUB_SECRET>
          Server=$env:MT5_SERVER
          [Tester]
          Expert=AutoValidation\SmokeEA
          Symbol=XAUUSD-test
          Period=H1
          Model=1
          FromDate=2024.01.01
          ToDate=2025.01.01
          "@ | Set-Content C:\mt5val\out\tester_config_SANITIZED.ini -Encoding UTF8
          $p=Start-Process "$env:MT5_ROOT\terminal64.exe" -ArgumentList '/portable','/config:C:\mt5val\tester.ini' -PassThru
          if(-not $p.WaitForExit(1200000)) { $p.Kill(); throw 'Tester timed out' }
          Get-ChildItem "$env:MT5_ROOT\Tester\logs" -Filter *.log -Recurse | Copy-Item -Destination C:\mt5val\out\ -ErrorAction SilentlyContinue
          $reportRoots = @($env:MT5_ROOT, "$env:APPDATA\MetaQuotes")
          foreach($reportRoot in $reportRoots) {
            Get-ChildItem $reportRoot -Filter 'mt5_report*' -File -Recurse -ErrorAction SilentlyContinue |
              Copy-Item -Destination C:\mt5val\out\ -Force -ErrorAction SilentlyContinue
          }
          $testerLogs = Get-ChildItem C:\mt5val\out -Filter *.log -File
          $logText = ($testerLogs | ForEach-Object { Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
          $testPassed = $logText -match 'Test passed'
          $entries = ([regex]::Matches($logText,'ENTRY OK week=')).Count
          $tpCloses = ([regex]::Matches($logText,'take profit triggered')).Count
          $slCloses = ([regex]::Matches($logText,'stop loss triggered')).Count
          $locks = ([regex]::Matches($logText,'LOCK ARMED')).Count
          $invalidStopModify = ([regex]::Matches($logText,'PositionModify exact SL/TP failed')).Count
          $weeks = (([datetime]'2025-01-01') - ([datetime]'2024-01-01')).TotalDays / 7
          $fullTpWr = if($entries -gt 0) { [math]::Round(100*$tpCloses/$entries,4) } else { 0 }
          $fillsPerWeek = [math]::Round($entries/$weeks,4)
          $targetPassed = $testPassed -and $fullTpWr -ge 60 -and $fillsPerWeek -ge 2 -and $invalidStopModify -eq 0
          [ordered]@{
            test_passed=$testPassed; entries=$entries; full_tp_closes=$tpCloses; stop_loss_closes=$slCloses;
            profit_locks=$locks; invalid_stop_modifications=$invalidStopModify; full_tp_win_rate_pct=$fullTpWr;
            fills_per_week=$fillsPerWeek; target_full_tp_win_rate_pct=60; target_fills_per_week=2;
            target_passed=$targetPassed; verdict=$(if($targetPassed){'TRADABLE_TARGET_PASS'}else{'NOT_TRADABLE_TARGET_FAIL'})
          } | ConvertTo-Json | Set-Content C:\mt5val\out\native_summary.json -Encoding UTF8
          Get-Content C:\mt5val\out\native_summary.json
          Get-ChildItem C:\mt5val\out -Recurse | Select-Object FullName,Length | Format-Table | Out-File C:\mt5val\out\manifest.txt
          if(-not $testPassed) { throw 'MT5 Strategy Tester did not report Test passed' }

      - name: Upload native MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-xauusd-native-evidence
          path: C:\mt5val\out
          if-no-files-found: error
