name: Deploy RWA to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "tools/renko*"
      - ".github/workflows/renko*"
      - ".github/workflows/renko-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: renko-canonical-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact RENKO release SHA
        uses: actions/checkout@v4
      - name: Validate RENKO production payload
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            renko/index.html \
            renko/renko-tv.css \
            renko/renko-tv-engine.js \
            renko/renko-tv-app.js \
            renko/renko-tv-fixed-1s.js \
            renko/renko-tv-atr-control.js \
            renko/renko-tv-atr-fixed1s.js \
            renko/renko-tv-atr-ui-sync.js \
            renko/renko-tv-traditional-control.js \
            renko/renko-tv-locale-guard.js \
            renko/renko-tv-total-history.js \
            renko/renko-gold-origin-pack.js \
            renko/history/renko-gold-xauusd-origin.json.gz \
            renko/xaut-okx-1s-pack.csv.gz \
            renko/xaut-okx-1s-pack.meta.json; do
            test -s "$f"
          done
          for f in \
            renko/renko-tv-engine.js \
            renko/renko-tv-app.js \
            renko/renko-tv-fixed-1s.js \
            renko/renko-tv-atr-control.js \
            renko/renko-tv-atr-fixed1s.js \
            renko/renko-tv-atr-ui-sync.js \
            renko/renko-tv-traditional-control.js \
            renko/renko-tv-locale-guard.js \
            renko/renko-tv-total-history.js \
            renko/renko-gold-origin-pack.js; do
            node --check "$f"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('renko/xaut-okx-1s-pack.meta.json').read_text())
          p=m.get('provenance') or {}
          assert m['schema']=='renko-xaut-okx-1s-pack-v2',m
          assert m['provider']=='OKX Spot' and m['instrument']=='XAUT-USDT',m
          assert m['interval']=='1s' and m['intervalMs']==1000,m
          assert m['rows']==1_005_000,m
          assert p.get('sourceBar')=='1s' and p.get('sourceIntervalMs')==1000,p
          assert p.get('upsampled') is False and p.get('synthetic1s') is False,p
          print('RENKO_PAGES_PAYLOAD_PASS')
          PY

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
      - name: Wait for system Pages workflow for exact SHA to finish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=10"
          state='missing'
          conclusion=''
          for i in $(seq 1 180); do
            payload="$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            read -r state conclusion < <(PAYLOAD="$payload" EXPECTED="$GITHUB_SHA" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['PAYLOAD'])
          expected=os.environ['EXPECTED']
          runs=[r for r in data.get('workflow_runs',[]) if r.get('head_sha') == expected]
          if not runs:
              print('missing -')
          else:
              run=max(runs,key=lambda r:r.get('run_number',0))
              print(run.get('status') or 'unknown', run.get('conclusion') or '-')
          PY
            )
            echo "system-pages attempt=$i status=$state conclusion=$conclusion sha=$GITHUB_SHA"
            if [ "$state" = 'completed' ]; then
              echo "SYSTEM_PAGES_TERMINAL_FOR_EXACT_SHA status=$state conclusion=$conclusion sha=$GITHUB_SHA"
              break
            fi
            sleep 5
          done
          test "$state" = 'completed'
      - name: Stamp exact deployed SHA
        run: |
          printf '%s\n' "$GITHUB_SHA" > deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/renko-deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
