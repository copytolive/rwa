name: Renko V8 Smooth Gate

on:
  pull_request:
    paths:
      - 'renko/**'
      - 'tools/renko-v8-browser-smoke.mjs'
      - 'tools/renko-v8-live-smoke.mjs'
      - '.github/workflows/renko-v8-smooth.yml'
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-v8-browser-smoke.mjs'
      - 'tools/renko-v8-live-smoke.mjs'
      - '.github/workflows/renko-v8-smooth.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V8 source
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v5.js
          node --check renko/renko-v8-worker.js
          node --check renko/renko-v8-smooth.js
          node --check tools/renko-v8-browser-smoke.mjs
          node --check tools/renko-v8-live-smoke.mjs
          grep -Fq "version:'8.0.0'" renko/renko-v8-smooth.js
          grep -Fq "mode:'smooth-tv-interaction'" renko/renko-v8-smooth.js
          grep -Fq "traditional:{continuationBoxes:1,reversalBoxes:2}" renko/renko-v8-smooth.js
          grep -Fq "historicalSource:'binance-1m-close-background-worker'" renko/renko-v8-smooth.js
          grep -Fq "liveSource:'binance-individual-@trade'" renko/renko-v8-smooth.js
          grep -Fq 'renko-v8-smooth.js?v=80' renko/index.html
          grep -Fq 'renko-v8-smooth.css?v=80' renko/index.html
          grep -Fq 'renko-v8-worker.js?v=80' renko/renko-v8-smooth.js
          grep -Fq '@trade' renko/renko-v3.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko-v8.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/renko-v8.log
          exit 1
      - name: Chromium interaction contract
        run: node tools/renko-v8-browser-smoke.mjs

  public-e2e:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: local-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages V8
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            q="${GITHUB_RUN_ID}-${i}"
            h="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            v="$(curl -fsSL --max-time 12 "https://narzulalistiqlal.github.io/rwa/renko/renko-v8-smooth.js?v=$q" || true)"
            if grep -Fq 'renko-v8-smooth.js?v=80' <<<"$h" && grep -Fq "version:'8.0.0'" <<<"$v"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify public Renko V8
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-v8-live-smoke.mjs
      - name: Publish Renko V8 success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-v8-e2e' -f description='Renko V8 smooth 50-brick view, wheel/pinch/drag, lazy history and live @trade PASS'
