# trigger: v2
name: Harden Realtime Browser
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/harden-realtime-browser.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add frozen socket watchdog and fresh CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('realtime-core.js'); s=p.read_text()
          s=s.replace('let detailAttempt=0,allAttempt=0,detailRetry=0,allRetry=0,lastDetailMessage=0;','let detailAttempt=0,allAttempt=0,detailRetry=0,allRetry=0,lastDetailMessage=0,lastAllMessage=0;')
          old="ws.onmessage=e=>{try{const arr=JSON.parse(e.data);if(!Array.isArray(arr))return;"
          new="ws.onmessage=e=>{lastAllMessage=Date.now();try{const arr=JSON.parse(e.data);if(!Array.isArray(arr))return;"
          if old not in s: raise SystemExit('all ticker handler contract changed')
          s=s.replace(old,new,1)
          marker='setInterval(persistUniverse,3000);'
          watchdog='''setInterval(()=>{try{const now=Date.now();if(S.detailWS&&S.detailWS.readyState===1&&lastDetailMessage&&now-lastDetailMessage>4500){S.detailWS.__rwaManual=false;try{S.detailWS.close()}catch(_){}}if(S.marketWS&&S.marketWS.readyState===1&&lastAllMessage&&now-lastAllMessage>7000){S.marketWS.__rwaManual=false;try{S.marketWS.close()}catch(_){}}}catch(_){}},2200);
async function restHeartbeat(){if(Date.now()-lastDetailMessage<5500)return;const sym=S.selected;for(const base of ['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com']){const c=new AbortController(),tm=setTimeout(()=>c.abort(),1800);try{const r=await fetch(`${base}/api/v3/ticker/24hr?symbol=${encodeURIComponent(sym)}`,{cache:'no-store',signal:c.signal});clearTimeout(tm);if(!r.ok)continue;const m=await r.json(),x=ensurePair(sym);x.price=n(m.lastPrice);x.change=n(m.priceChangePercent);x.high=n(m.highPrice);x.low=n(m.lowPrice);x.vol=n(m.quoteVolume);renderHeader(x);updatePairDOM(x,null);live('LIVE · REST fallback');lastDetailMessage=Date.now();return}catch(_){clearTimeout(tm)}}}
setInterval(restHeartbeat,5000);'''
          if marker not in s: raise SystemExit('persist marker missing')
          s=s.replace(marker,marker+'\n'+watchdog,1)
          p.write_text(s)
          p=Path('index.html'); s=p.read_text()
          s=s.replace('styles.css?v=6','styles.css?v=7').replace('mobile.css?v=5','mobile.css?v=6').replace('realtime-core.js?v=1','realtime-core.js?v=2')
          p.write_text(s)
          PY
          node --check realtime-core.js
          node --check mobile.js
          node --check app.js
          grep -Fq 'realtime-core.js?v=2' index.html
          grep -Fq 'styles.css?v=7' index.html
          grep -Fq 'mobile.css?v=6' index.html
          grep -Fq 'REST fallback' realtime-core.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/harden-realtime-browser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add realtime-core.js index.html .github/workflows/harden-realtime-browser.yml
          git commit -m 'fix: recover frozen realtime sockets and stale browser CSS'
          git push
