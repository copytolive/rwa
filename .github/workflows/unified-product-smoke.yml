name: Unified Product Smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'market-performance.js'
      - 'persistent-market-operability-patch-v1.css'
      - 'product-os-v3.js'
      - 'product-os-mobile-contract-v3.js'
      - 'unified-design-v3.css'
      - 'trade/config.js'
      - 'trader/**'
      - 'asset/**'
      - '.github/workflows/unified-product-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'market-performance.js'
      - 'persistent-market-operability-patch-v1.css'
      - 'product-os-v3.js'
      - 'product-os-mobile-contract-v3.js'
      - 'unified-design-v3.css'
      - 'trade/config.js'
      - 'trader/**'
      - 'asset/**'
      - '.github/workflows/unified-product-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check realtime-core.js
          node --check chart-core.js
          node --check market-performance.js
          node --check mobile.js
          node --check superapp-v5.js
          node --check product-os-v3.js
          node --check product-os-mobile-contract-v3.js
          node --input-type=module --check < trade/config.js
      - name: Modern root shell is activated
        run: |
          test "$(grep -o '<script src=' index.html | wc -l | tr -d ' ')" = "6"
          grep -q 'stable-shell.css?v=3' index.html
          grep -q 'market-performance.js?v=9' index.html
          grep -q 'superapp-v5.js?v=17' index.html
          grep -q 'persistent-market-operability-patch-v1.css?v=9' market-performance.js
          ! grep -q '<script[^>]*product-os-v3.js' index.html
          ! grep -q '<script[^>]*product-os-mobile-contract-v3.js' index.html
          ! grep -q '<link[^>]*unified-design-v3.css' index.html
          grep -q "persistent_market_workspaces='css-core-router-v3'" market-performance.js
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))!important' persistent-market-operability-patch-v1.css
          grep -q 'padding:0!important' persistent-market-operability-patch-v1.css
      - name: Product modules and surfaces remain available
        run: |
          test -f trader/index.html
          test -f asset/index.html
          test -f product-os-v3.js
          test -f product-os-mobile-contract-v3.js
          test -f unified-design-v3.css
          grep -q 'data-mobile-nav="trade"' product-os-v3.js
          grep -q 'market-drawer-open' product-os-mobile-contract-v3.js
          grep -q 'Canonical root contract' product-os-mobile-contract-v3.js
          grep -q 'rwa-home-dashboard' unified-design-v3.css
          grep -q 'Risk Engine' product-os-v3.js
      - name: Typography floors and touch targets remain defined
        run: |
          grep -q -- '--rwa-text-2xs:9px' unified-design-v3.css
          grep -q -- '--rwa-control-lg:44px' unified-design-v3.css
          grep -q 'mobile-tabs a>small{font-size:10px' unified-design-v3.css
          grep -q 'suite-field input.*font-size:13px' unified-design-v3.css
      - name: Current root audits
        run: |
          node tools/superapp-v5-audit.mjs
      - name: Safety invariants preserved
        run: |
          grep -q "mainnetEnabled" trade/config.js
          grep -q "canMainnet" trade/config.js
          grep -q "defaultTestnet:true" trade/config.js
          ! grep -R --line-number -E 'private[_ -]?key|seed phrase|withdraw.*automatic' product-os-v3.js trader/index.html asset/index.html unified-design-v3.css
