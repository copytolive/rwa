name: Unified Product Smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'suite-nav.js'
      - 'human-operability-v1.css'
      - 'rwa-8-engines/**'
      - 'tools/human-operability-browser.mjs'
      - 'trade/config.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/unified-product-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'superapp-v5.js'
      - 'superapp-v5.css'
      - 'suite-nav.js'
      - 'human-operability-v1.css'
      - 'rwa-8-engines/**'
      - 'tools/human-operability-browser.mjs'
      - 'trade/config.js'
      - '.github/workflows/pages.yml'
      - '.github/workflows/unified-product-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check superapp-v5.js
          node --check suite-nav.js
          node --check rwa-8-engines/app.js
          node --check rwa-8-engines/engine.js
          node --check tools/human-operability-browser.mjs
          node --input-type=module --check < trade/config.js
      - name: Current product shell is activated
        run: |
          set -euo pipefail
          grep -Fq 'superapp-v5.css' index.html
          ! grep -Fq 'unified-design-v3.css' index.html
          ! grep -Fq 'product-os-v3.js' index.html
          ! grep -Fq 'product-os-mobile-contract-v3.js' index.html
          grep -Fq 'human-operability-v1.css?v=1' suite-nav.js
          grep -Fq 'human-operability.css?v=1' rwa-8-engines/app.js
          grep -Fq 'RWA Factory' suite-nav.js
          grep -Fq 'Create My RWA' suite-nav.js
      - name: Global RWA Factory surfaces exist
        run: |
          set -euo pipefail
          test -s rwa-8-engines/index.html
          test -s rwa-8-engines/engine.js
          test -s rwa-8-engines/config.json
          test -s rwa-8-engines/jurisdictions.json
          grep -Fq 'RWA Passport' rwa-8-engines/app.js
          grep -Fq 'Asset Registry' rwa-8-engines/app.js
          grep -Fq 'Proof Engine' rwa-8-engines/app.js
          grep -Fq 'Valuation' rwa-8-engines/app.js
          grep -Fq 'Compliance' rwa-8-engines/app.js
          grep -Fq 'Marketplace' rwa-8-engines/app.js
          grep -Fq 'REGISTERED' rwa-8-engines/app.js
          grep -Fq 'TRADABLE' rwa-8-engines/app.js
      - name: Human typography and touch contracts
        run: |
          set -euo pipefail
          grep -Fq -- '--rwa-human-small:11px' human-operability-v1.css
          grep -Fq -- '--rwa-human-touch:44px' human-operability-v1.css
          grep -Fq 'min-height:44px' human-operability-v1.css
          grep -Fq 'max-width:1199px' human-operability-v1.css
          grep -Fq 'min-width:681px' human-operability-v1.css
          grep -Fq 'max-width:680px' human-operability-v1.css
          grep -Fq '100dvh' human-operability-v1.css
          grep -Fq -- '--human-touch:44px' rwa-8-engines/human-operability.css
      - name: Pages deployment contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pages.yml').read_text()
          required=[
            'realtime-core.js?v=3',
            'market-performance.js?v=2',
            'human-operability-v1.css',
            'human-operability-browser.mjs',
            'renko-v15-controller-bootstrap.js?v=171',
            "renkoController:'171'",
            "version:'1.7.1'",
          ]
          missing=[x for x in required if x not in p]
          if missing:
            raise SystemExit('Pages contract missing: '+', '.join(missing))
          print('PAGES_RUNTIME_MARKERS=PASS')
          PY
      - name: Safety invariants preserved
        run: |
          set -euo pipefail
          grep -Fq "mainnetEnabled" trade/config.js
          grep -Fq "canMainnet" trade/config.js
          grep -Fq "defaultTestnet:true" trade/config.js
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          node tools/security-gate.mjs
