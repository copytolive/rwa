name: Unified Product Smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'superapp-v5.js'
      - 'product-os-v3.js'
      - 'product-os-mobile-contract-v3.js'
      - 'unified-design-v3.css'
      - 'trade/config.js'
      - 'trader/**'
      - 'asset/**'
      - 'apps/realworldasset/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/live-browser-smoke.yml'
      - '.github/workflows/unified-product-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'superapp-v5.js'
      - 'product-os-v3.js'
      - 'product-os-mobile-contract-v3.js'
      - 'unified-design-v3.css'
      - 'trade/config.js'
      - 'trader/**'
      - 'asset/**'
      - 'apps/realworldasset/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/live-browser-smoke.yml'
      - '.github/workflows/unified-product-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check superapp-v5.js
          node --check product-os-v3.js
          node --check product-os-mobile-contract-v3.js
          node --input-type=module --check < trade/config.js
      - name: Legacy root compatibility shell remains fail-closed and lazy
        run: |
          test "$(grep -o '<script src=' index.html | wc -l | tr -d ' ')" = "14"
          ! grep -Fq 'unified-design-v3.css' index.html
          ! grep -Fq 'product-os-v3.js' index.html
          ! grep -Fq 'product-os-mobile-contract-v3.js' index.html
          ! grep -Fq 'rwa-fundamentals.js' index.html
          ! grep -Fq 'rwa-fundamentals.css' index.html
          grep -Eq 'market-performance\.js\?v=[0-9]+' index.html
          grep -Eq 'superapp-v5\.js\?v=[0-9]+' index.html
          grep -Fq 'ensureTrade()' superapp-v5.js
          grep -Fq 'ensureFundamentals()' superapp-v5.js
          grep -Fq "loadStyleOnce('rwa-fundamentals.css?v=1'" superapp-v5.js
          grep -Fq "loadScriptOnce('rwa-fundamentals.js?v=1'" superapp-v5.js
          grep -q "product-os-v3.js" trade/config.js
          grep -q "unified-design-v3.css" trade/config.js
      - name: 1-22 legacy product surfaces remain available
        run: |
          test -f trader/index.html
          test -f asset/index.html
          grep -q 'data-mobile-nav="trade"' product-os-v3.js
          grep -q 'market-drawer-open' product-os-mobile-contract-v3.js
          grep -q 'Canonical root contract' product-os-mobile-contract-v3.js
          grep -q "localStorage.setItem('rwa_default_landing_v3','markets')" product-os-mobile-contract-v3.js
          grep -q "hash&&hash!='markets'\|hash&&hash!=='markets'" product-os-mobile-contract-v3.js
          grep -q 'rwa-home-dashboard' unified-design-v3.css
          grep -q 'tabular-nums' unified-design-v3.css
          grep -q 'Risk Engine' product-os-v3.js
          grep -Fq 'data-v5-mobile="trade"' superapp-v5.js
          grep -Fq "if(name==='asset')" superapp-v5.js
      - name: Typography floors and touch targets
        run: |
          grep -q -- '--rwa-text-2xs:9px' unified-design-v3.css
          grep -q -- '--rwa-control-lg:44px' unified-design-v3.css
          grep -q 'mobile-tabs a>small{font-size:10px' unified-design-v3.css
          grep -q 'suite-field input.*font-size:13px' unified-design-v3.css
      - name: Pages deployment follows single canonical Next UI
        run: |
          test -s apps/realworldasset/package.json
          test -s apps/realworldasset/src/app/page.tsx
          grep -Fq 'working-directory: apps/realworldasset' .github/workflows/pages.yml
          grep -Fq 'test ! -e ui/realworldasset' .github/workflows/pages.yml
          grep -Fq 'O=apps/realworldasset/out' .github/workflows/pages.yml
          grep -Fq 'cp -a renko "$O/renko"' .github/workflows/pages.yml
          grep -Fq 'echo "$GITHUB_SHA" > "$O/deployment-sha.txt"' .github/workflows/pages.yml
          grep -Fq 'path: apps/realworldasset/out' .github/workflows/pages.yml
          grep -Fq 'PUBLIC_CHROMIUM_REALWORLDASSET_PASS' .github/workflows/pages.yml
      - name: Safety invariants preserved
        run: |
          grep -q "mainnetEnabled" trade/config.js
          grep -q "canMainnet" trade/config.js
          grep -q "defaultTestnet:true" trade/config.js
          grep -Fq 'BACKEND_CONNECTED = false' apps/realworldasset/src/components/app/AppShell.tsx
          ! grep -R --line-number -E 'private[_ -]?key|seed phrase|withdraw.*automatic' product-os-v3.js trader/index.html asset/index.html unified-design-v3.css
