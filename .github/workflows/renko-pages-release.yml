name: RENKO Verified Pages Release

on:
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-total-history-report.mjs'
      - '.github/workflows/renko-pages-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: renko-pages-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate current RENKO release payload
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            renko/index.html \
            renko/renko-tv-engine.js \
            renko/renko-tv-app.js \
            renko/renko-tv-stable-chart-v2.js \
            renko/renko-tv-switch-fast.js \
            renko/renko-tv-total-history.js \
            renko/renko-gold-origin-pack.js \
            renko/renko-tv-atr-fixed1s.js \
            renko/renko-scroll-blocking-observer.js \
            renko/renko-tv-scroll-zero-lock.js \
            renko/history/renko-gold-xauusd-origin.json.gz; do test -s "$f"; done
          for f in \
            renko/renko-tv-engine.js \
            renko/renko-tv-app.js \
            renko/renko-tv-stable-chart-v2.js \
            renko/renko-tv-switch-fast.js \
            renko/renko-tv-total-history.js \
            renko/renko-gold-origin-pack.js \
            renko/renko-tv-atr-fixed1s.js \
            renko/renko-scroll-blocking-observer.js \
            renko/renko-tv-scroll-zero-lock.js; do node --check "$f"; done
          grep -Fq 'renko-tv-stable-chart-v2.js?v=185' renko/index.html
          grep -Fq 'renko-tv-total-history.js?v=3' renko/index.html
          grep -Fq 'renko-gold-origin-pack.js?v=3' renko/index.html
          grep -Fq 'renko-tv-atr-fixed1s.js?v=7' renko/index.html
          grep -Fq "version:'2.2.0'" renko/renko-tv-stable-chart-v2.js
          grep -Fq 'cross-domain-series-reset' renko/renko-tv-stable-chart-v2.js
          grep -Fq 'authoritative-earliest-fixed-1s-rest' renko/renko-tv-total-history.js
          grep -Fq 'dukascopy-verified-fixed-s1-same-origin-gzip-transport' renko/renko-gold-origin-pack.js
          grep -Fq "version:'1.1.0'" renko/renko-gold-origin-pack.js
          grep -Fq "renko-xaut-okx-1s-pack-v2" renko/renko-tv-atr-fixed1s.js
          echo RENKO_RELEASE_PAYLOAD_PASS

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp exact RENKO release SHA
        run: |
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-browser:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact public bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          ok=0
          for i in $(seq 1 60); do
            got="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE/renko-deployment-sha.txt?sha=$GITHUB_SHA&n=$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for f in renko/index.html renko/renko-tv-stable-chart-v2.js renko/renko-tv-total-history.js renko/renko-gold-origin-pack.js renko/history/renko-gold-xauusd-origin.json.gz; do
            local_sha="$(sha256sum "$f" | awk '{print $1}')"
            remote_sha="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE/$f?sha=$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            test "$local_sha" = "$remote_sha"
            echo "BYTE_PARITY $f $local_sha"
          done
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium public desktop + mobile + GOLD + ZEC
        shell: bash
        run: |
          mkdir -p artifacts/renko-public
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://copytolive.github.io/rwa/renko/';
          const rows=[];
          for(const mode of [{name:'desktop',width:1900,height:1000},{name:'mobile',width:430,height:932}]){
            const page=await browser.newPage({viewport:{width:mode.width,height:mode.height}});
            const errors=[],httpErrors=[],requestFailures=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error'&&!/WebSocket connection .* failed: (Ping|Close) received after close/i.test(m.text()))errors.push(m.text())});
            page.on('response',r=>{if(r.status()>=400)httpErrors.push(`${r.status()} ${r.url()}`)});
            page.on('requestfailed',r=>requestFailures.push(`${r.failure()?.errorText||'FAILED'} ${r.url()}`));
            await page.addInitScript(()=>localStorage.setItem('rwa_renko_tradingview_settings_v1',JSON.stringify({source:'close',method:'traditional',boxSize:1,atrLength:14,wicks:true})));
            const resp=await page.goto(base+'?symbol=ZEC&publicRelease=1&ts='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()<200||resp.status()>=400)throw Error(mode.name+' HTTP '+(resp?.status()||0));
            await page.waitForFunction(()=>window.RWARenkoTV?.state?.status==='live'&&window.RWARenkoTotalHistory?.jumpOrigin&&window.RWARenkoStableChart?.version==='2.2.0'&&window.RWARenkoGoldOriginPack?.version==='1.1.0',null,{timeout:90000});
            await page.evaluate(()=>window.RWARenkoGoldOriginPack.attach('public-gate-before-zec'));
            await page.evaluate(()=>window.RWARenkoTotalHistory.jumpOrigin('ZECUSDT'));
            await page.waitForFunction(()=>window.RWARenkoTV.state.symbol==='ZECUSDT'&&window.RWARenkoTV.state.status==='history-origin',null,{timeout:45000});
            const zec=await page.evaluate(()=>({bars:RWARenkoTV.state.closedBars.length,provider:RWARenkoTV.state.historyMeta?.provider,interval:RWARenkoTV.state.historyMeta?.interval,dropped:Number(document.documentElement.dataset.renkoStableDataRowsDropped||0),domainResets:Number(document.documentElement.dataset.renkoStableDomainResets||0),recoveries:Number(document.documentElement.dataset.renkoStableWriteRecoveries||0),canvas:document.querySelectorAll('#chartHost canvas').length}));
            if(zec.bars<900||zec.provider!=='Binance Spot'||zec.interval!=='1s'||zec.dropped!==0||zec.canvas<1)throw Error(mode.name+' ZEC '+JSON.stringify(zec));
            await page.evaluate(()=>window.RWARenkoGoldOriginPack.attach('public-gate-before-gold'));
            await page.evaluate(()=>window.RWARenkoTotalHistory.jumpOrigin('XAUUSD'));
            await page.waitForFunction(()=>window.RWARenkoTV.state.symbol==='XAUUSD'&&window.RWARenkoTV.state.status==='history-origin',null,{timeout:45000});
            const gold=await page.evaluate(()=>({bars:RWARenkoTV.state.closedBars.length,provider:RWARenkoTV.state.historyMeta?.provider,instrument:RWARenkoTV.state.historyMeta?.instrumentCode,interval:RWARenkoTV.state.historyMeta?.interval,earliest:Number(RWARenkoTV.state.historyMeta?.earliestAvailableMs),documented:Number(RWARenkoTV.state.historyMeta?.documentedEarliestS1Ms),transport:document.documentElement.dataset.renkoGoldOriginTransport||'',packLoads:Number(window.RWARenkoGoldOriginPack?.stats?.loads||0),packFailures:Number(window.RWARenkoGoldOriginPack?.stats?.failures||0),packLastError:String(window.RWARenkoGoldOriginPack?.stats?.lastError||''),packAttachments:Number(window.RWARenkoGoldOriginPack?.stats?.attachments||0),packCompressed:Number(window.RWARenkoGoldOriginPack?.stats?.compressedLoads||0),packPredecoded:Number(window.RWARenkoGoldOriginPack?.stats?.predecodedLoads||0),dropped:Number(document.documentElement.dataset.renkoStableDataRowsDropped||0),domainResets:Number(document.documentElement.dataset.renkoStableDomainResets||0),recoveries:Number(document.documentElement.dataset.renkoStableWriteRecoveries||0),canvas:document.querySelectorAll('#chartHost canvas').length}));
            if(gold.bars<100||gold.provider!=='Dukascopy'||gold.instrument!=='XAU-USD'||gold.interval!=='1s'||gold.documented!==Date.UTC(2003,4,5,0,1,3,421)||gold.earliest>Date.UTC(2003,4,5,0,5)||gold.transport!=='same-origin-gzip-pack'||gold.packLoads<1||gold.packFailures!==0||gold.dropped!==0||gold.canvas<1)throw Error(mode.name+' GOLD '+JSON.stringify(gold));
            if(errors.length)throw Error(mode.name+' browser errors '+JSON.stringify(errors.slice(0,10))+' HTTP '+JSON.stringify(httpErrors.slice(0,20))+' REQUEST_FAILED '+JSON.stringify(requestFailures.slice(0,20)));
            const shot=`artifacts/renko-public/${mode.name}-gold-2003.png`;
            await page.screenshot({path:shot,fullPage:true});
            rows.push({mode:mode.name,http:resp.status(),zec,gold,httpErrors,requestFailures,screenshot:shot,pass:true});
            await page.close();
          }
          const receipt={schema:'renko-public-release-v1',sha:process.env.GITHUB_SHA,url:base,generatedAt:new Date().toISOString(),rows,status:'PASS'};
          fs.writeFileSync('artifacts/renko-public/receipt.json',JSON.stringify(receipt,null,2));
          console.log('RENKO_PUBLIC_BROWSER_PASS',JSON.stringify(receipt));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renko-public-release-${{ github.sha }}
          path: artifacts/renko-public/
          retention-days: 30
