name: AI7 GOLD Production Read-Only Diagnostic

on:
  workflow_call:
    secrets:
      COPYTOLIVE_SSH_KEY:
        required: true

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve AI7 request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai7-gold-diag-requests/.*\.json$' | tail -n 1 || true)"
          if [ -z "$FILE" ]; then
            FILE="$(find ai7-gold-diag-requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1 || true)"
          fi
          test -n "$FILE"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id","ai7-gold-diag"))' "$FILE")"
          SAFE_ID="$(printf '%s' "$ID" | tr -cs 'A-Za-z0-9._-' '-')"
          echo "id=$SAFE_ID" >> "$GITHUB_OUTPUT"

      - name: Run read-only VPS replays
        shell: bash
        env:
          SSH_HOST: 109.123.239.76
          SSH_USER: root
          SSH_PORT: "22"
          SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
        run: |
          set +e
          ID="${{ steps.req.outputs.id }}"
          OUT="ai7-gold-diag-responses"
          mkdir -p "$OUT" "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "${SSH_KEY:-}" ]; then
            printf '%s\n' '{"ok":false,"error":"MISSING_SSH_KEY"}' > "$OUT/$ID-status.json"
            exit 0
          fi

          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai7_gold_diag"
          chmod 600 "$HOME/.ssh/ai7_gold_diag"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          REMOTE="/tmp/ai7-gold-diag-${GITHUB_RUN_ID}"

          ssh -i "$HOME/.ssh/ai7_gold_diag" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE'" >"$OUT/$ID-ssh-mkdir.log" 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            printf '{"ok":false,"stage":"ssh_mkdir","exit_code":%s}\n' "$RC" > "$OUT/$ID-status.json"
            rm -f "$HOME/.ssh/ai7_gold_diag"
            exit 0
          fi

          scp -q -i "$HOME/.ssh/ai7_gold_diag" -P "$SSH_PORT" server-control/handler.py "$SSH_USER@$SSH_HOST:$REMOTE/handler.py" >"$OUT/$ID-scp-handler.log" 2>&1
          RC=$?
          if [ "$RC" -ne 0 ]; then
            printf '{"ok":false,"stage":"scp_handler","exit_code":%s}\n' "$RC" > "$OUT/$ID-status.json"
            ssh -i "$HOME/.ssh/ai7_gold_diag" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -rf '$REMOTE'" >/dev/null 2>&1
            rm -f "$HOME/.ssh/ai7_gold_diag"
            exit 0
          fi

          printf '%s\n' '{"id":"ai7-replay-linreg","op":"gold_h1_diag","strategy_id":"ND_MTF_LINREG_SLP_f21s55_GOLD_H1_SL0.025_TP2.5"}' > req1.json
          printf '%s\n' '{"id":"ai7-replay-obv","op":"gold_h1_diag","strategy_id":"ND_ALL_OBV_CROSS_f13s34_GOLD_H1_SL0.02_TP2.0"}' > req2.json
          printf '%s\n' '{"id":"ai7-replay-engulf","op":"gold_h1_diag","strategy_id":"ND_ALL_ENGULF_f21s55_GOLD_H1_SL0.025_TP2.5"}' > req3.json

          OVERALL=0
          for N in 1 2 3; do
            scp -q -i "$HOME/.ssh/ai7_gold_diag" -P "$SSH_PORT" "req${N}.json" "$SSH_USER@$SSH_HOST:$REMOTE/req${N}.json" >"$OUT/$ID-scp-${N}.log" 2>&1
            RC=$?
            if [ "$RC" -ne 0 ]; then
              OVERALL=$RC
              printf '{"ok":false,"stage":"scp_req","n":%s,"exit_code":%s}\n' "$N" "$RC" > "$OUT/$ID-diag-${N}.json"
              continue
            fi
            ssh -i "$HOME/.ssh/ai7_gold_diag" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST"               "cd '$REMOTE' && python3 handler.py req${N}.json" > "$OUT/$ID-diag-${N}.json" 2>"$OUT/$ID-ssh-${N}.err"
            RC=$?
            if [ "$RC" -ne 0 ]; then OVERALL=$RC; fi
          done

          ssh -i "$HOME/.ssh/ai7_gold_diag" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -rf '$REMOTE'" >/dev/null 2>&1
          rm -f "$HOME/.ssh/ai7_gold_diag"
          printf '{"ok":%s,"stage":"remote_replays","exit_code":%s}\n' "$([ "$OVERALL" -eq 0 ] && echo true || echo false)" "$OVERALL" > "$OUT/$ID-status.json"
          exit 0

      - name: Commit diagnostic response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ID="${{ steps.req.outputs.id }}"
          git config user.name "CopyToLive AI7 Diagnostic"
          git config user.email "copytolive-ai7@local.invalid"
          git add "ai7-gold-diag-responses/$ID-"*
          git commit -m "ai7: respond GOLD production diagnostic $ID" || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$attempt"; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
