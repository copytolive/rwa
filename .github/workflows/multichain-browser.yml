name: Legacy RWA Multi Chain Browser (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  local-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate legacy Multi Chain V2 static contract
        run: |
          node --check rwa-multichain.js
          node --check rwa-multichain-engine.js
          node tools/multichain-contract.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact legacy source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rwa-multichain-site/rwa
          cp -a . /tmp/rwa-multichain-site/rwa/
          cd /tmp/rwa-multichain-site
          python -m http.server 4173 >/tmp/rwa-multichain-http.log 2>&1 &
          echo $! >/tmp/rwa-multichain-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null; then break; fi
            sleep 1
          done
      - name: Run legacy desktop and mobile acceptance
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
          RWA_PROOF_DIR: proof/multichain-v2-local
        run: node tools/multichain-browser.mjs
      - name: Upload legacy Multi Chain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-multichain-v2-local
          path: proof/multichain-v2-local
          retention-days: 7
          if-no-files-found: warn
      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/rwa-multichain-http.pid)" 2>/dev/null || true
