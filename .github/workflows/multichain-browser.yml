name: RWA Multi Chain Browser

on:
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "rwa-multichain.js"
      - "rwa-multichain-registry.json"
      - "tools/multichain-contract.mjs"
      - "tools/multichain-browser.mjs"
      - ".github/workflows/multichain-browser.yml"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Deploy RWA to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-multichain-browser-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  local-proof:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Multi Chain static contract
        run: node tools/multichain-contract.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rwa-multichain-site/rwa
          cp -a . /tmp/rwa-multichain-site/rwa/
          cd /tmp/rwa-multichain-site
          python -m http.server 4173 >/tmp/rwa-multichain-http.log 2>&1 &
          echo $! >/tmp/rwa-multichain-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && break; sleep 1; done
      - name: Run desktop and mobile Multi Chain acceptance
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/rwa/
          RWA_PROOF_DIR: proof/multichain-v1-local
        run: node tools/multichain-browser.mjs
      - name: Upload local Multi Chain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multichain-v1-local
          path: proof/multichain-v1-local
          retention-days: 7
          if-no-files-found: warn
      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/rwa-multichain-http.pid)" 2>/dev/null || true

  live-proof:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      RWA_TEST_URL: https://copytolive.github.io/rwa/
      RWA_PROOF_DIR: proof/multichain-v1-live
    steps:
      - name: Checkout exact deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Pages SHA and Multi Chain payload
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/deployment-sha.txt?v=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          curl --connect-timeout 5 --max-time 20 -fsSL "https://copytolive.github.io/rwa/?v=${GITHUB_RUN_ID}" -o /tmp/rwa-root.html
          curl --connect-timeout 5 --max-time 20 -fsSL "https://copytolive.github.io/rwa/rwa-multichain.js?v=${GITHUB_RUN_ID}" -o /tmp/rwa-multichain.js
          curl --connect-timeout 5 --max-time 20 -fsSL "https://copytolive.github.io/rwa/rwa-multichain-registry.json?v=${GITHUB_RUN_ID}" -o /tmp/rwa-multichain.json
          grep -Fq 'rwa-multichain.js?v=1' /tmp/rwa-root.html
          grep -Fq "POLICY='chain-abstraction-fail-closed-v1'" /tmp/rwa-multichain.js
          grep -Fq '"policy": "chain-abstraction-fail-closed-v1"' /tmp/rwa-multichain.json
          echo "MULTICHAIN_EXACT_SHA=PASS:$EXPECTED_SHA"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run production desktop and mobile Multi Chain acceptance
        run: node tools/multichain-browser.mjs
      - name: Upload live Multi Chain proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multichain-v1-live-${{ env.EXPECTED_SHA }}
          path: proof/multichain-v1-live
          retention-days: 7
          if-no-files-found: warn
      - name: Publish Multi Chain success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" -f state=success -f context='rwa/multichain' -f description='MULTI CHAIN desktop/mobile proof passed with fail-closed adapters'
      - name: Publish Multi Chain failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_SHA}" -f state=failure -f context='rwa/multichain' -f description='MULTI CHAIN production proof failed; inspect artifact and logs'
