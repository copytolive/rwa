name: RWA Root Market Stability

on:
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-terminal-v5.js"
      - "rwa-terminal-v5.css"
      - "rwa-live-home-v1.css"
      - "rwa-target-dashboard-v2.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - "wallet-core.js"
      - "tools/root-market-browser-stability.mjs"
      - ".github/workflows/root-market-stability.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-terminal-v5.js"
      - "rwa-terminal-v5.css"
      - "rwa-live-home-v1.css"
      - "rwa-target-dashboard-v2.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - "wallet-core.js"
      - "tools/root-market-browser-stability.mjs"
      - ".github/workflows/root-market-stability.yml"

concurrency:
  group: rwa-root-market-stability-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate V4 trading-only source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check chart-core.js
          node --check rwa-live-home-v1.js
          node --check rwa-terminal-v5.js
          node --check rwa-terminal-service.js
          node --check tools/root-market-browser-stability.mjs
          grep -Fq '<strong>Real World Asset</strong>' index.html
          grep -Fq 'app.js?v=20' index.html
          grep -Fq 'id="bookPrecision"' index.html
          grep -Fq 'id="bookMenu"' index.html
          grep -Fq 'id="liveRail"' index.html
          ! grep -Fq 'data-rwa-target-nav="portfolio"' index.html
          grep -Fq 'live-rail-section-nav' rwa-live-home-v1.js
          grep -Fq "RWAMarketRuntime={version:'1.4.3'" app.js
          grep -Fq "/api/v3/depth?symbol=" app.js
          grep -Fq "limit=100" app.js
          grep -Fq "limit=innerWidth<681?70:140" app.js
          grep -Fq "recentTrades" app.js
          grep -Fq "bookLevels:9" app.js
          grep -Fq "bindBookControls" app.js
          grep -Fq "VERSION='5.0.0'" rwa-live-home-v1.js
          grep -Fq "renderLiveRail" rwa-live-home-v1.js
          grep -Fq "keepMarketRoute" rwa-live-home-v1.js
          grep -Fq "RWATerminalV5" rwa-live-home-v1.js
          grep -Fq "rwa-terminal-v5.js?v=1.0.24" chart-core.js
          grep -Fq "rwa-terminal-v5.css?v=1.0.14" chart-core.js
          grep -Fq "data-v5-nav=\"discover\"" rwa-terminal-v5.js
          grep -Fq 'data-v5-global="trade"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="discover"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="portfolio"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="analytics"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="rewards"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="more"' rwa-terminal-v5.js
          grep -Fq 'rwa-v5-market-nav' rwa-terminal-v5.js
          ! grep -Fq 'data-mobile-nav="portfolio"' index.html
          ! grep -Fq 'data-mobile-nav="social"' index.html
          ! grep -Fq 'data-mobile-nav="hub"' index.html
          grep -Fq "data-v5-bottom=\"positions\"" rwa-terminal-v5.js
          grep -Fq "data-v5-mobile-mode=\"book\"" rwa-terminal-v5.js
          grep -Fq "openPortfolio" rwa-live-home-v1.js
          grep -Fq "openOrders" rwa-live-home-v1.js
          grep -Fq "openRewards" rwa-live-home-v1.js
          grep -Fq "workspaceOpen('analytics'" rwa-live-home-v1.js
          grep -Fq "rwa-live-home-v1.js?v=5.0.2" chart-core.js
          grep -Fq "rwa-live-home-v1.css?v=5.0.0" chart-core.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v2'" rwa-multichain.js
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          ! grep -Fq '/rwa/_next/' index.html
          echo RWA_ROOT_V4_FINAL_SOURCE_PASS

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start deterministic local site
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rwa-http.log 2>&1 &
          echo $! >/tmp/rwa-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rwa-http.log
          exit 1

      - name: Stress V4 desktop and mobile market UI
        env:
          RWA_TEST_URL: http://127.0.0.1:4173/
        run: node tools/root-market-browser-stability.mjs
