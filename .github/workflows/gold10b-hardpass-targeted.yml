name: GOLD10B Targeted HARD PASS Search

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold10b-hardpass-targeted.yml'
      - 'backtest/gold24/hardpass_targeted_search.py'
      - 'backtest/gold24/HARDPASS_TARGETED_KICK'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold10b-hardpass-targeted
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '33667987913'
  STATE_ARTIFACT: gold24-canonical-v11-state

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Refuse stale targeted generation before expensive discovery
        run: |
          set -euo pipefail
          git fetch origin main
          CURRENT=0
          if git cat-file -e origin/main:backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json 2>/dev/null; then
            git show origin/main:backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json > "$RUNNER_TEMP/current-targeted.json"
            CURRENT=$(python - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/current-targeted.json'
          x=json.load(open(p))
          print(int(x.get('cumulative_targeted_evaluated_unique',x.get('targeted_evaluated_unique',0)) or 0))
          PY
          )
          fi
          echo "CURRENT_TARGETED_UNIQUE=$CURRENT"
          if [ "$CURRENT" -ge 200000 ]; then
            echo "SKIP_TARGETED=true" >> "$GITHUB_ENV"
            echo "Monotonic guard: current main already has >=200000 targeted unique; stale 50k lane will not overwrite it."
          else
            echo "SKIP_TARGETED=false" >> "$GITHUB_ENV"
          fi
      - name: Restore authoritative canonical D1
        if: env.SKIP_TARGETED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .hardpass-state
          mkdir -p .hardpass-state
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$STATE_ARTIFACT" -D .hardpass-state
          test -s .hardpass-state/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
          test -s .hardpass-state/gate_a/gate_a_receipt.json
      - name: Run targeted hard-pass discovery without threshold relaxation
        if: env.SKIP_TARGETED != 'true'
        run: |
          set -euo pipefail
          python -u backtest/gold24/hardpass_targeted_search.py \
            --state-dir .hardpass-state \
            --prior-json backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json \
            --out backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json \
            --candidate-count 50000 \
            --workers 8 \
            --seed 2026090311
          python - <<'PY'
          import json
          p='backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json'
          x=json.load(open(p))
          assert x['status']=='PASS'
          assert x['targeted_evaluated_unique']==50000
          assert x['candidate_gate']=={'entry_min':100,'net_profit_usd_min':20000.0,'corr_max':0.5}
          assert x['hard_pass_gate']['entry_min']==300
          assert x['hard_pass_gate']['pf_min']==1.2
          assert x['hard_pass_gate']['max_dd_pct_max']==25.0
          assert x['hard_pass_gate']['oos_pf_min']==1.0
          assert x['hard_pass_gate']['positive_year_pct_min']==60.0
          assert x['hard_pass_gate']['corr_max']==0.5
          print(json.dumps({
            'combined_candidate_evaluated':x['combined_candidate_evaluated'],
            'prefilter_survivors':x['prefilter_survivors'],
            'full_pre_corr_survivors':x['full_pre_corr_survivors'],
            'hard_pass_count':x['hard_pass_count'],
            'hard_pass_new_count':x['hard_pass_new_count'],
          },indent=2))
          PY
      - name: Publish targeted evidence race-safe
        if: env.SKIP_TARGETED != 'true'
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/latest_hardpass_targeted.json"
          cp backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json "$PAYLOAD"
          git config user.name "gold10b-bot"
          git config user.email "gold10b-bot@users.noreply.github.com"
          for TRY in 1 2 3 4 5; do
            git fetch origin main
            if git cat-file -e origin/main:backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json 2>/dev/null; then
              git show origin/main:backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json > "$RUNNER_TEMP/main-targeted.json"
              python - <<'PY'
          import json,os
          a=json.load(open(os.environ['RUNNER_TEMP']+'/main-targeted.json'))
          b=json.load(open(os.environ['RUNNER_TEMP']+'/latest_hardpass_targeted.json'))
          ma=int(a.get('cumulative_targeted_evaluated_unique',a.get('targeted_evaluated_unique',0)) or 0)
          mb=int(b.get('cumulative_targeted_evaluated_unique',b.get('targeted_evaluated_unique',0)) or 0)
          if mb < ma:
              raise SystemExit(f'REFUSE_STALE_TARGETED candidate={mb} current_main={ma}')
          print(f'monotonic targeted publish PASS candidate={mb} current_main={ma}')
          PY
            fi
            git reset --hard origin/main
            git clean -fd
            mkdir -p backtest/gold24/runtime_hardpass_targeted
            cp "$PAYLOAD" backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json
            git add backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(gold10b): publish targeted hard-pass evidence [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((TRY*2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: env.SKIP_TARGETED != 'true'
        with:
          name: gold10b-hardpass-targeted-${{ github.run_id }}
          path: backtest/gold24/runtime_hardpass_targeted/latest_hardpass_targeted.json
          if-no-files-found: error
          retention-days: 90
