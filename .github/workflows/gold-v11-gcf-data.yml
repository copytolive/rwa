name: GOLD v11 GC=F Primary Data
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-gcf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download yfinance GC=F through current date
        run: |
          python -m pip install --quiet yfinance pandas
          cat > /tmp/fetch_gcf.py <<'PY'
          import yfinance as yf, pandas as pd, hashlib, json
          from pathlib import Path
          df = yf.download('GC=F', start='2002-01-01', end='2026-08-28', interval='1d', auto_adjust=False, progress=False, actions=False)
          if df.empty:
              raise SystemExit('GC=F download returned zero rows')
          if isinstance(df.columns, pd.MultiIndex):
              df.columns = [c[0] for c in df.columns]
          need=['Open','High','Low','Close','Volume']
          missing=[c for c in need if c not in df.columns]
          if missing: raise SystemExit(f'missing columns: {missing}')
          out=df[need].copy().reset_index()
          datecol=out.columns[0]
          out.rename(columns={datecol:'Date'}, inplace=True)
          out['Date']=pd.to_datetime(out['Date'], utc=True)
          out.to_csv('GC_F_YFINANCE_D1_2002_2026_RAW.csv', index=False)
          nan_mask=out[['Open','High','Low','Close']].isna().any(axis=1)
          ohlc_ok=(out['High'] >= out[['Open','Close','Low']].max(axis=1)) & (out['Low'] <= out[['Open','Close','High']].min(axis=1))
          bad=out[nan_mask | (~ohlc_ok)].copy()
          bad.to_csv('GC_F_YFINANCE_D1_2002_2026_ANOMALIES.csv', index=False)
          b=Path('GC_F_YFINANCE_D1_2002_2026_RAW.csv').read_bytes()
          receipt={
            'symbol':'GC=F','source':'yfinance','interval':'D1','rows':int(len(out)),
            'start_utc':str(out['Date'].min()),'end_utc':str(out['Date'].max()),
            'nan_ohlc_rows':int(nan_mask.sum()),'ohlc_inconsistent_rows':int((~ohlc_ok).sum()),
            'zero_volume_rows':int((out['Volume'].fillna(0)==0).sum()),
            'sha256':hashlib.sha256(b).hexdigest(),
            'classification':'PRIMARY_RAW_MATERIALIZED_GATE_A_BLOCKED_PENDING_INTEGRITY_AND_CROSSCHECK',
            'gate_a_pass':False
          }
          Path('GC_F_YFINANCE_D1_2002_2026.receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
          python /tmp/fetch_gcf.py
      - uses: actions/upload-artifact@v4
        with:
          name: gold-v11-gcf-primary
          path: |
            GC_F_YFINANCE_D1_2002_2026_RAW.csv
            GC_F_YFINANCE_D1_2002_2026_ANOMALIES.csv
            GC_F_YFINANCE_D1_2002_2026.receipt.json
          if-no-files-found: error
          retention-days: 7
