name: RWA Exchange Core Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "exchange-core.js"
      - "exchange-ui.js"
      - "exchange-actions.js"
      - "testnet-e2e.js"
      - "wallet-core.js"
      - "walletconnect.js"
      - "execution-api.js"
      - "execution-ops-bridge.js"
      - "index.html"
      - "token/**"
      - ".github/workflows/exchange-smoke.yml"
permissions:
  contents: read
  statuses: write
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contracts
        run: |
          node --check wallet-core.js
          node --check walletconnect.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check exchange-ui.js
          node --check exchange-actions.js
          node --check testnet-e2e.js
          node --check token/deploy-guard.mjs
          python -m json.tool token/config.json >/dev/null
          test -s token/contracts/RWAToken.sol
          test -s token/contracts/RWAVestingVault.sol
          test -s token/deploy-guard.mjs
          grep -Fq 'walletconnect.js?v=4' index.html
          grep -Fq 'wallet-core.js?v=3' index.html
          ! grep -Fq 'wallet-seamless.js' index.html
          grep -Fq 'exchange-core.js?v=1' index.html
          grep -Fq 'exchange-ui.js?v=1' index.html
          grep -Fq 'testnet-e2e.js?v=1' index.html
          grep -Fq "exchange-actions.js?v=1" testnet-e2e.js
          grep -Fq "version:'4.0.0'" walletconnect.js
          grep -Fq "version:'3.0.0'" wallet-core.js
          grep -Fq 'Wallet account switched' wallet-core.js
          grep -Fq "version:'1.0.0'" exchange-core.js
          grep -Fq 'Run Testnet E2E Preflight' exchange-ui.js
          grep -Fq 'Enable API Wallet' exchange-ui.js
          grep -Fq 'BALANCE' exchange-ui.js
          grep -Fq 'OPEN POSITIONS' exchange-ui.js
          grep -Fq 'OPEN ORDERS' exchange-ui.js
          grep -Fq 'Trade History' exchange-ui.js
          grep -Fq 'Get Testnet USDC' exchange-actions.js
          grep -Fq 'data-ex-modify' exchange-actions.js
          grep -Fq 'app.hyperliquid-testnet.xyz/drip' exchange-actions.js
          grep -Fq 'REAL E2E RESULT' testnet-e2e.js
          grep -Fq 'Unlock Mainnet after PASS' testnet-e2e.js
          grep -Fq "const required=['wallet','collateral','entry','position','tpsl','modify','cancel','close','history','pnl']" testnet-e2e.js
          grep -Fq 'tgeEnabled' token/config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          grep -Fq 'No private key is accepted or stored' token/deploy-guard.mjs
          if node token/deploy-guard.mjs --network=testnet >/tmp/token-testnet.log 2>&1; then echo 'Token testnet guard unexpectedly allowed incomplete config'; cat /tmp/token-testnet.log; exit 1; else echo 'Token testnet guard correctly BLOCKED incomplete config'; fi
          if node token/deploy-guard.mjs --network=mainnet >/tmp/token-mainnet.log 2>&1; then echo 'Token mainnet guard unexpectedly allowed deployment'; cat /tmp/token-mainnet.log; exit 1; else echo 'Token mainnet guard correctly BLOCKED'; fi
      - name: Publish source status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/exchange-source' -f description='Wallet, exchange, E2E and PRE-TGE token guardrails verified'
      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            core="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-core.js?v=$q" || true)"
            ui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-ui.js?v=$q" || true)"
            actions="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-actions.js?v=$q" || true)"
            wallet="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/wallet-core.js?v=$q" || true)"
            wc="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/walletconnect.js?v=$q" || true)"
            e2e="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/testnet-e2e.js?v=$q" || true)"
            if grep -Fq 'walletconnect.js?v=4' <<<"$html" && grep -Fq 'wallet-core.js?v=3' <<<"$html" && ! grep -Fq 'wallet-seamless.js' <<<"$html" && grep -Fq 'exchange-core.js?v=1' <<<"$html" && grep -Fq 'exchange-ui.js?v=1' <<<"$html" && grep -Fq 'testnet-e2e.js?v=1' <<<"$html" && grep -Fq "version:'4.0.0'" <<<"$wc" && grep -Fq "version:'3.0.0'" <<<"$wallet" && grep -Fq 'Wallet account switched' <<<"$wallet" && grep -Fq "version:'1.0.0'" <<<"$core" && grep -Fq 'RWA EXCHANGE CORE' <<<"$ui" && grep -Fq 'Get Testnet USDC' <<<"$actions" && grep -Fq 'data-ex-modify' <<<"$actions" && grep -Fq 'REAL E2E RESULT' <<<"$e2e"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/exchange-live' -f description='Live one-screen exchange + real testnet E2E gate verified'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/exchange-live' -f description='Exchange core live verification failed'