name: RWA Exchange Core Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "exchange-core.js"
      - "exchange-ui.js"
      - "wallet-core.js"
      - "wallet-seamless.js"
      - "execution-api.js"
      - "execution-ops-bridge.js"
      - "index.html"
      - "token/**"
      - ".github/workflows/exchange-smoke.yml"
permissions:
  contents: read
  statuses: write
jobs:
  exchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contracts
        run: |
          node --check wallet-core.js
          node --check wallet-seamless.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check exchange-ui.js
          python -m json.tool token/config.json >/dev/null
          grep -Fq 'wallet-core.js?v=2' index.html
          grep -Fq 'wallet-seamless.js?v=1' index.html
          grep -Fq 'exchange-core.js?v=1' index.html
          grep -Fq 'exchange-ui.js?v=1' index.html
          grep -Fq "version:'1.0.0'" exchange-core.js
          grep -Fq 'Run Testnet E2E Preflight' exchange-ui.js
          grep -Fq 'Enable API Wallet' exchange-ui.js
          grep -Fq 'accountsChanged' wallet-seamless.js
          grep -Fq 'tgeEnabled' token/config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
      - name: Publish source status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/exchange-source' -f description='Wallet, account, trade, execution and token guardrails verified'
      - name: Verify GitHub Pages bundle
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            core="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-core.js?v=$q" || true)"
            ui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-ui.js?v=$q" || true)"
            seamless="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/wallet-seamless.js?v=$q" || true)"
            if grep -Fq 'wallet-core.js?v=2' <<<"$html" && grep -Fq 'wallet-seamless.js?v=1' <<<"$html" && grep -Fq 'exchange-core.js?v=1' <<<"$html" && grep -Fq 'exchange-ui.js?v=1' <<<"$html" && grep -Fq "version:'1.0.0'" <<<"$core" && grep -Fq 'RWA EXCHANGE CORE' <<<"$ui" && grep -Fq 'accountsChanged' <<<"$seamless"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/exchange-live' -f description='Live one-screen exchange core verified on GitHub Pages'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/exchange-live' -f description='Exchange core live verification failed'