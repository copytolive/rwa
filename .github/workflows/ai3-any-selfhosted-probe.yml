name: AI3 Any Selfhosted Bridge Probe

on:
  push:
    branches: [main]
    paths:
      - "ai3-any-selfhosted-probe/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-any-selfhosted-probe/.*\\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Probe runner and existing SSH access
        shell: bash
        run: |
          set +e
          mkdir -p ai3-any-selfhosted-results
          OUT="ai3-any-selfhosted-results/${{ steps.req.outputs.id }}.json"
          HOSTNAME_NOW="$(hostname 2>/dev/null || true)"
          UNAME_NOW="$(uname -a 2>/dev/null || true)"
          MAC_WS=false; [ -d /Users/Shared/WorkspaceBersama ] && MAC_WS=true
          VPS_WEB=false; [ -d /var/www/copytolive ] && VPS_WEB=true
          SSH_OUT="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 root@109.123.239.76 'printf AI3_SSH_OK' 2>&1)"
          SSH_RC=$?
          python3 - "$OUT" "$HOSTNAME_NOW" "$UNAME_NOW" "$MAC_WS" "$VPS_WEB" "$SSH_RC" "$SSH_OUT" <<'PY'
          import json,sys,pathlib
          out,host,uname,macws,vpsweb,rc,sshout=sys.argv[1:]
          pathlib.Path(out).write_text(json.dumps({
            "ok":True,
            "hostname":host,
            "uname":uname,
            "mac_workspace":macws=="true",
            "local_vps_webroot":vpsweb=="true",
            "ssh_rc":int(rc),
            "ssh_ok":int(rc)==0 and "AI3_SSH_OK" in sshout,
            "ssh_output":sshout[-1200:]
          },indent=2)+"\\n")
          PY
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CopyToLive AI3 Any Runner"
          git config user.email "copytolive-ai3-anyrunner@local.invalid"
          git add ai3-any-selfhosted-results
          git commit -m "ai3 any selfhosted probe: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
