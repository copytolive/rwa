name: AI2 Public Control Bridge Probe

on:
  push:
    branches: [main]
    paths:
      - "ai2-public-control-requests/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai2-public-control-requests/.*\.json$' | tail -n1)"
          test -n "$FILE"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "resp=ai2-public-control-responses/$ID.json" >> "$GITHUB_OUTPUT"

      - name: Probe secret and VPS
        shell: bash
        env:
          SSH_HOST: 109.123.239.76
          SSH_USER: root
          SSH_PORT: "22"
          SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
          ID: ${{ steps.req.outputs.id }}
          RESP: ${{ steps.req.outputs.resp }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESP")"
          present=false
          connected=false
          remote=""
          if [ -n "$SSH_KEY" ]; then
            present=true
            mkdir -p "$HOME/.ssh"
            chmod 700 "$HOME/.ssh"
            printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/ai2_control"
            chmod 600 "$HOME/.ssh/ai2_control"
            ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            set +e
            remote="$(ssh -i "$HOME/.ssh/ai2_control" -p "$SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" 'hostname; test -d /var/www/copytolive && echo WEB_ROOT_OK; test -d /home/opentrue-platform/backend && echo BACKEND_ROOT_OK' 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then connected=true; fi
            rm -f "$HOME/.ssh/ai2_control"
          fi
          python3 - "$RESP" "$ID" "$present" "$connected" "$remote" <<'PY'
import json,sys,pathlib
resp,aid,present,connected,remote=sys.argv[1:]
pathlib.Path(resp).write_text(json.dumps({
  "id":aid,
  "secret_present":present=="true",
  "ssh_connected":connected=="true",
  "remote_output":remote[-4000:],
},indent=2)+"\n")
PY

      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESP="${{ steps.req.outputs.resp }}"
          test -s "$RESP"
          git config user.name "AI2 Public Control Bridge"
          git config user.email "ai2-public-control@local.invalid"
          git add "$RESP"
          git commit -m "ai2 public control: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            git push origin HEAD:main && exit 0
            sleep "$n"
          done
          exit 1
