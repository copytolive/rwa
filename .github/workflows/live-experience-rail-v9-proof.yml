name: RWA Live Experience Rail V9 Proof

on:
  push:
    branches:
      - fix/experience-rail-cache-bust-v9-20260827
    paths:
      - '.github/workflows/live-experience-rail-v9-proof.yml'
      - 'tools/experience-rail-visual-parity-v9.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify production cache chain
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 15 -fsSL "https://copytolive.github.io/rwa/?v=$q" || true)"
            perf="$(curl --connect-timeout 5 --max-time 15 -fsSL "https://copytolive.github.io/rwa/market-performance.js?v=9&proof=$q" || true)"
            css="$(curl --connect-timeout 5 --max-time 15 -fsSL "https://copytolive.github.io/rwa/persistent-market-operability-patch-v1.css?v=9&proof=$q" || true)"
            if grep -Fq 'market-performance.js?v=9' <<<"$html" \
              && grep -Fq 'persistent-market-operability-patch-v1.css?v=9' <<<"$perf" \
              && grep -Fq 'padding:0!important' <<<"$css" \
              && grep -Fq 'gap:0!important' <<<"$css" \
              && grep -Fq 'outline:0!important' <<<"$css"; then
              echo 'LIVE_V9_CACHE_CHAIN=PASS'
              exit 0
            fi
            sleep 3
          done
          echo 'Production V9 cache chain not ready'
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate live 2048px and 1600px visual parity
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa/
          RWA_PROOF_DIR: proof/live-experience-rail-v9
        run: node tools/experience-rail-visual-parity-v9.mjs
      - name: Upload live screenshots
        uses: actions/upload-artifact@v4
        with:
          name: live-experience-rail-v9-proof
          path: proof/live-experience-rail-v9
          retention-days: 30
