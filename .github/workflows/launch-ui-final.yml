name: Real World Asset V4 UI Final

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "rwa-live-orderbook-v1.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - ".github/workflows/launch-ui-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate trading-only UI
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check chart-core.js
          node --check rwa-live-home-v1.js
          node --check rwa-multichain.js
          node --check rwa-multichain-engine.js
          grep -Fq '<strong>Real World Asset</strong>' index.html
          grep -Fq 'Markets</button>' index.html
          grep -Fq 'Trade</button>' index.html
          grep -Fq 'Portfolio</button>' index.html
          grep -Fq 'Orders</button>' index.html
          grep -Fq 'Analytics</button>' index.html
          grep -Fq 'Rewards</button>' index.html
          grep -Fq 'rwaMultiChainLazyBootstrap' index.html
          grep -Fq 'Hyperliquid Testnet' rwa-live-home-v1.js
          grep -Fq 'Mainnet locked' rwa-live-home-v1.js
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          test ! -e commerce-service
          test ! -e rwa-commerce-config.json
          echo RWA_TARGET_V4_UI_FINAL_PASS
