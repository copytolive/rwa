name: Real World Asset V4 UI Final

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-terminal-v5.js"
      - "rwa-terminal-v5.css"
      - "rwa-live-home-v1.css"
      - "rwa-live-orderbook-v1.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - ".github/workflows/launch-ui-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-final:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate trading-only UI
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check chart-core.js
          node --check rwa-live-home-v1.js
          node --check rwa-terminal-v5.js
          node --check rwa-terminal-service.js
          node --check rwa-multichain.js
          node --check rwa-multichain-engine.js
          grep -Fq '<strong>Real World Asset</strong>' index.html
          grep -Fq 'Markets</button>' index.html
          grep -Fq 'rwa-terminal-v5.css?v=1.0.14' index.html
          ! grep -Fq 'id="rwaV5FirstPaintShell"' index.html
          grep -Fq 'html.rwa-target-prepaint body>.app{visibility:hidden' index.html
          grep -Fq 'data-v5-nav="trade"' rwa-terminal-v5.js
          grep -Fq 'data-v5-nav="discover"' rwa-terminal-v5.js
          grep -Fq 'data-v5-nav="portfolio"' rwa-terminal-v5.js
          grep -Fq 'data-v5-nav="analytics"' rwa-terminal-v5.js
          grep -Fq 'data-v5-nav="rewards"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="trade"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="discover"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="portfolio"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="analytics"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="rewards"' rwa-terminal-v5.js
          grep -Fq 'data-v5-global="more"' rwa-terminal-v5.js
          grep -Fq 'rwa-v5-market-nav' rwa-terminal-v5.js
          ! grep -Fq 'data-v5-mobile-nav="portfolio"' index.html
          ! grep -Fq 'data-mobile-nav="portfolio"' index.html
          ! grep -Fq 'data-mobile-nav="social"' index.html
          ! grep -Fq 'data-mobile-nav="hub"' index.html
          grep -Fq 'data-v5-bottom="positions"' rwa-terminal-v5.js
          grep -Fq 'data-v5-mobile-mode="chart"' rwa-terminal-v5.js
          grep -Fq 'data-v5-mobile-mode="book"' rwa-terminal-v5.js
          grep -Fq 'data-v5-mobile-mode="trade"' rwa-terminal-v5.js
          grep -Fq 'rwaMultiChainLazyBootstrap' index.html
          grep -Fq 'Hyperliquid Testnet' rwa-live-home-v1.js
          grep -Fq 'Mainnet locked' rwa-live-home-v1.js
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          test ! -e commerce-service
          test ! -e rwa-commerce-config.json
          echo RWA_TARGET_V4_UI_FINAL_PASS
