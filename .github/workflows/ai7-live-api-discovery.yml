name: AI7 Live CopyToLive API Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "coordination/ai7-live-api-discovery/KICK"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live shell and same-origin JS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/assets
          python - <<'PY'
          import hashlib,json,pathlib,re,urllib.parse,urllib.request
          base="https://copytolive.com/"
          out=pathlib.Path("out")
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read()
          html=get(base)
          (out/"index.html").write_bytes(html)
          text=html.decode("utf-8","replace")
          urls=[]
          urls += re.findall(r'<script[^>]+src=["\\x27]([^"\\x27]+)["\\x27]',text,re.I)
          urls += re.findall(r'<link[^>]+href=["\\x27]([^"\\x27]+)["\\x27]',text,re.I)
          rows=[]
          for u in urls:
              full=urllib.parse.urljoin(base,u)
              p=urllib.parse.urlparse(full)
              if p.netloc!="copytolive.com": continue
              if not (p.path.endswith(".js") or p.path.endswith(".css")): continue
              try:
                  b=get(full)
                  name=p.path.strip("/").replace("/","__") or "root"
                  (out/"assets"/name).write_bytes(b)
                  rows.append({"url":full,"file":name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              except Exception as e:
                  rows.append({"url":full,"error":repr(e)})
          (out/"assets.json").write_text(json.dumps(rows,indent=2)+"\\n")
          PY

      - name: Scan API and OHLCV references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("out")
          keys=("ohlcv","candles","candle","market-data","market_data","history","historical","bars","timeframe","GOLD_H1","GOLD_D1","/api/")
          hits=[]
          files=[root/"index.html"]+sorted((root/"assets").glob("*"))
          for p in files:
              if not p.is_file(): continue
              txt=p.read_text("utf-8",errors="ignore")
              lower=txt.lower()
              for k in keys:
                  pos=0
                  while True:
                      i=lower.find(k.lower(),pos)
                      if i<0: break
                      hits.append({"file":p.name,"key":k,"text":txt[max(0,i-700):i+1500]})
                      pos=i+len(k)
                      if len(hits)>=5000: break
                  if len(hits)>=5000: break
              if len(hits)>=5000: break
          seen=set(); uniq=[]
          for h in hits:
              s=json.dumps(h,sort_keys=True)
              if s in seen: continue
              seen.add(s); uniq.append(h)
          (root/"discovery.json").write_text(json.dumps(uniq,indent=2)+"\\n")
          print(json.dumps(uniq[:250],indent=2))
          PY

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai7-live-api-discovery-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 7
