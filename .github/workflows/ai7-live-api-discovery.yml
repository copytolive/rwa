name: AI7 Live CopyToLive API Discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "coordination/ai7-live-api-discovery/KICK"
      - ".github/workflows/ai7-live-api-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live shell and recursive same-origin assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/assets
          python - <<'PY'
          import hashlib,json,pathlib,re,urllib.parse,urllib.request
          from html.parser import HTMLParser
          base="https://copytolive.com/"
          out=pathlib.Path("out")
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return r.read()
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="script" and a.get("src"): self.urls.append(a["src"])
                  if tag=="link" and a.get("href"): self.urls.append(a["href"])
          html=get(base); (out/"index.html").write_bytes(html)
          p=P(); p.feed(html.decode("utf-8","replace"))
          queue=list(p.urls)
          seen=set(); rows=[]
          while queue and len(seen)<150:
              u=queue.pop(0)
              full=urllib.parse.urljoin(base,u)
              q=urllib.parse.urlparse(full)
              clean=urllib.parse.urlunparse((q.scheme,q.netloc,q.path,"","",""))
              if clean in seen or q.netloc!="copytolive.com": continue
              if not (q.path.endswith(".js") or q.path.endswith(".css")): continue
              seen.add(clean)
              try:
                  b=get(full)
                  name=q.path.strip("/").replace("/","__") or "root"
                  fp=out/"assets"/name
                  fp.write_bytes(b)
                  rows.append({"url":full,"file":name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
                  if q.path.endswith(".js"):
                      txt=b.decode("utf-8","ignore")
                      refs=set(re.findall(r'["\x27](/assets/[^"\x27]+?\.(?:js|css))(?:\?[^"\x27]*)?["\x27]',txt))
                      refs.update(re.findall(r'from["\x27](/assets/[^"\x27]+?\.js)["\x27]',txt))
                      queue.extend(sorted(refs))
              except Exception as e:
                  rows.append({"url":full,"error":repr(e)})
          (out/"assets.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY

      - name: Scan API and OHLCV references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,re
          root=pathlib.Path("out")
          keys=("ohlcv","candles","candle","market-data","market_data","history","historical","bars","timeframe","GOLD_H1","GOLD_D1","/api/","renko")
          hits=[]; endpoints=set()
          files=[root/"index.html"]+sorted((root/"assets").glob("*"))
          for p in files:
              if not p.is_file(): continue
              txt=p.read_text("utf-8",errors="ignore")
              lower=txt.lower()
              for m in re.finditer(r'/api/[A-Za-z0-9_./?=&{}:$%+\-]+',txt):
                  if len(m.group(0))<500: endpoints.add(m.group(0))
              for k in keys:
                  pos=0
                  while True:
                      i=lower.find(k.lower(),pos)
                      if i<0: break
                      hits.append({"file":p.name,"key":k,"text":txt[max(0,i-800):i+1800]})
                      pos=i+len(k)
                      if len(hits)>=10000: break
                  if len(hits)>=10000: break
              if len(hits)>=10000: break
          seen=set(); uniq=[]
          for h in hits:
              s=json.dumps(h,sort_keys=True)
              if s in seen: continue
              seen.add(s); uniq.append(h)
          (root/"discovery.json").write_text(json.dumps(uniq,indent=2)+"\n")
          (root/"endpoints.json").write_text(json.dumps(sorted(endpoints),indent=2)+"\n")
          print(json.dumps({"endpoints":sorted(endpoints),"hit_count":len(uniq),"asset_count":len(files)-1},indent=2))
          PY

      - name: Upload discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai7-live-api-discovery-${{ github.run_id }}
          path: out
          if-no-files-found: error
          retention-days: 7
