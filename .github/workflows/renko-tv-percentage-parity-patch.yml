name: RENKO TradingView Percentage Parity Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/renko-tv-percentage-parity-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Percentage LTP to official TradingView min-tick rule
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              Path('renko/renko-v15-worker.js'): [
                  ("return roundTick(roundSig1(raw),tick)", "return roundTick(raw,tick)"),
              ],
              Path('renko/renko-v15.js'): [
                  ("return roundTick(roundSig1(Math.abs(Number(S.ltpSnapshot))*C.percentage),S.tickSize)", "return roundTick(Math.abs(Number(S.ltpSnapshot))*C.percentage,S.tickSize)"),
              ],
              Path('renko/renko-v15-first-frame-preload.js'): [
                  ("return roundTick(roundSig1(ltp*pct),tick)", "return roundTick(ltp*pct,tick)"),
              ],
              Path('renko/index.html'): [
                  ("Percentage assigns one fixed box from the symbol-load LTP snapshot, including significant rounding and exchange minimum tick.", "Percentage assigns one fixed box from the symbol-load LTP snapshot, rounded to the nearest exchange minimum tick and then applied consistently across all bars for that build."),
              ],
          }

          for path, replacements in changes.items():
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15.js
          node --check renko/renko-v15-first-frame-preload.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const box=s.RenkoV15Engine.boxFor({method:'percentage',percentage:.01,ltpSnapshot:216,tickSize:.01},216);
          if(Math.abs(box-2.16)>1e-9) throw Error(`expected 2.16, got ${box}`);
          console.log('TRADINGVIEW_PERCENTAGE_LTP_ROUNDING_PASS',box);
          NODE
          git diff --check

      - name: Commit parity patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "copytolive-renko-audit"
          git config user.email "copytolive@gmail.com"
          git add renko/renko-v15-worker.js renko/renko-v15.js renko/renko-v15-first-frame-preload.js renko/index.html
          git commit -m "fix(renko): match TradingView Percentage LTP rounding"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
