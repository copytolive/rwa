name: RWA Target V4 Browser Gate

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-terminal-v5.js"
      - "rwa-terminal-v5.css"
      - "rwa-live-home-v1.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - "wallet-core.js"
      - "walletconnect.js"
      - "tools/live-no-mock-home-browser.mjs"
      - ".github/workflows/live-no-mock-home.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve local RWA
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/rwa-target-v4.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-target-v4.log; exit 1
      - name: Certify Real World Asset target V4
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/target-v4-local
        run: node tools/live-no-mock-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-v4-local-${{ github.sha }}
          path: proof/target-v4-local/
          if-no-files-found: error
          retention-days: 30

  public-browser:
    needs: local-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wait for current public target markers
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          for i in $(seq 1 90); do
            LIVE_SHA="$(curl -fsSL --max-time 15 "$BASE/deployment-sha.txt?v=$i" 2>/dev/null | tr -d '\r\n' || true)"
            Q="${LIVE_SHA:-none}-$i"
            ROOT="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/?v=$Q" 2>/dev/null || true)"
            CORE="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/chart-core.js?v=$Q" 2>/dev/null || true)"
            if printf '%s' "$ROOT" | grep -Fq 'id="bookPrecision"' \
              && printf '%s' "$ROOT" | grep -Fq 'id="watchAdd"' \
              && printf '%s' "$ROOT" | grep -Fq 'app.js?v=19' \
              && printf '%s' "$CORE" | grep -Fq 'rwa-terminal-v5.js?v=1.0.3'; then
              echo "Public target markers live at deployment $LIVE_SHA"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify public target V4
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/target-v4-public
        run: node tools/live-no-mock-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-v4-public-${{ github.sha }}
          path: proof/target-v4-public/
          if-no-files-found: error
          retention-days: 30
