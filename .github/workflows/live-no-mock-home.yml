name: RWA Trading + MULTI CHAIN Browser Gate
# FINAL_TRADING_NO_ECOMMERCE_CERT
# MULTICHAIN_VISIBLE_V202

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "rwa-live-orderbook-v1.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
      - "wallet-core.js"
      - "walletconnect.js"
      - "tools/live-no-mock-home-browser.mjs"
      - ".github/workflows/live-no-mock-home.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve local RWA
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/rwa-trading.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rwa-trading.log
          exit 1
      - name: Certify trading-only HOME and MULTI CHAIN
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/trading-multichain-local
        run: node tools/live-no-mock-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-multichain-local-${{ github.sha }}
          path: proof/trading-multichain-local/
          if-no-files-found: error
          retention-days: 30

  public-browser:
    needs: local-browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          URL='https://copytolive.github.io/rwa/deployment-sha.txt'
          for i in $(seq 1 60); do
            LIVE="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$URL?v=$GITHUB_SHA-$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Certify public trading-only HOME and MULTI CHAIN
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/trading-multichain-public
        run: node tools/live-no-mock-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-multichain-public-${{ github.sha }}
          path: proof/trading-multichain-public/
          if-no-files-found: error
          retention-days: 30
