name: RWA Live No-Mock HOME
on:
  push:
    branches: ["main"]
    paths: ["index.html","app.js","chart-core.js","rwa-live-home-v1.js","rwa-storefront.js","rwa-commerce-registry.json","tools/live-no-mock-home-browser.mjs",".github/workflows/live-no-mock-home.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --directory .. >/tmp/rwa-live.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/live-no-mock-local
        run: node tools/live-no-mock-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-no-mock-local-${{ github.sha }}
          path: proof/live-no-mock-local/
          if-no-files-found: error
