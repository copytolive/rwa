name: RWA Terminal V5 Syntax Hotfix

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/rwa-terminal-v5-syntax-hotfix.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rwa-terminal-v5-syntax-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair reward ternary syntax and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rwa-terminal-v5.js')
          s=p.read_text()
          old="<span>INACTIVE</span></div>';return}catch(e){serverServiceError=String(e?.message||e)}}"
          new="<span>INACTIVE</span></div>');return}catch(e){serverServiceError=String(e?.message||e)}}"
          if old not in s:
              raise SystemExit('expected broken reward syntax not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check rwa-terminal-v5.js
          rm .github/workflows/rwa-terminal-v5-syntax-hotfix.yml
          git config user.name "rwa-terminal-v5-hotfix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rwa-terminal-v5.js .github/workflows/rwa-terminal-v5-syntax-hotfix.yml
          git commit -m "fix(ui): repair backend rewards terminal syntax"
          for i in $(seq 1 8); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*3))
          done
          exit 1
