name: Realworldasset UI Total Audit

on:
  push:
    branches:
      - main
      - 'fix/ui-backend-total-audit-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realworldasset-ui-total-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  total-ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/realworldasset/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/realworldasset
        run: npm ci --no-audit --no-fund

      - name: Verify live-only source and interaction contracts
        working-directory: apps/realworldasset
        run: |
          set -euo pipefail
          npm run verify:interactions
          npm run typecheck

      - name: Build canonical /rwa UI
        working-directory: apps/realworldasset
        env:
          RWA_BASE_PATH: /rwa
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Compose actual public route set
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rwa-ui-site every-page-live-proof
          mkdir -p /tmp/rwa-ui-site/rwa
          cp -a apps/realworldasset/out/. /tmp/rwa-ui-site/rwa/
          test -s /tmp/rwa-ui-site/rwa/index.html
          COUNT="$(find /tmp/rwa-ui-site/rwa -name index.html -type f | wc -l | tr -d ' ')"
          test "$COUNT" -ge 30
          if grep -R -n -E '["'"'"'(]/realworldasset/' /tmp/rwa-ui-site/rwa --include='*.html' --include='*.js' --include='*.css'; then
            echo 'STALE_PUBLIC_ROOT_FOUND' >&2
            exit 1
          fi
          if grep -R -n -Ei 'UI DEMO|Alex Morgan|Level 3[[:space:]]*[·-][[:space:]]*Demo|Connected Account \(Preview\)|POS-DEMO|ORD-DEMO' /tmp/rwa-ui-site/rwa --include='*.html'; then
            echo 'SYNTHETIC_VISIBLE_MARKER_FOUND' >&2
            exit 1
          fi
          echo "ACTUAL_EXPORTED_ROUTES=$COUNT" | tee /tmp/actual-route-count.txt

      - name: Probe authoritative public venue
        shell: bash
        run: |
          set +e
          curl --fail --silent --show-error --max-time 12 \
            -H 'content-type: application/json' \
            -d '{"type":"metaAndAssetCtxs"}' \
            https://api.hyperliquid.xyz/info > /tmp/hl.json
          CURL_RC=$?
          if [ "$CURL_RC" -eq 0 ]; then
            python3 - <<'PY'
          import json
          p=json.load(open('/tmp/hl.json'))
          assert isinstance(p,list) and len(p)>=2 and isinstance(p[1],list) and len(p[1])>0
          print('PUBLIC_VENUE_PROBE=PASS')
          PY
            if [ "$?" -eq 0 ]; then echo 'EXPECT_PUBLIC_FEED=1' >> "$GITHUB_ENV"; else echo 'EXPECT_PUBLIC_FEED=0' >> "$GITHUB_ENV"; fi
          else
            echo 'PUBLIC_VENUE_PROBE=UNAVAILABLE'
            echo 'EXPECT_PUBLIC_FEED=0' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Install Chromium and image analysis runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0 pillow
          python3 -m playwright install --with-deps chromium

      - name: Start local static production
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/rwa-ui-site > /tmp/rwa-ui-server.log 2>&1 &
          echo $! > /tmp/rwa-ui-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rwa-ui-server.log
          exit 1

      - name: Screenshot and analyze every exported page desktop and mobile
        env:
          EXPECT_PUBLIC_FEED: ${{ env.EXPECT_PUBLIC_FEED }}
        run: |
          python3 apps/realworldasset/scripts/every-page-live-proof.py \
            --out apps/realworldasset/out \
            --base http://127.0.0.1:4173/rwa \
            --evidence every-page-live-proof

      - name: Stop local production
        if: always()
        run: kill "$(cat /tmp/rwa-ui-server.pid)" 2>/dev/null || true

      - name: Upload total every-page audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworldasset-every-page-live-proof-${{ github.sha }}
          path: every-page-live-proof/
          retention-days: 14
          if-no-files-found: error
          compression-level: 6
