name: RENKO GOLD Total History Visible

on:
  push:
    branches:
      - main
      - fix/renko-gold-prepend-before-pan-20260902
    paths:
      - 'renko/**'
      - 'scripts/renko_gold_total_visible_proof.mjs'
      - '.github/workflows/renko-gold-total-visible.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static total-history visible guard
        run: |
          set -euo pipefail
          node --check renko/renko-gold-total-visible.js
          node --check scripts/renko_gold_total_visible_proof.mjs
          grep -Fq 'renko-gold-total-visible.js?v=1' renko/index.html
          grep -Fq "1.0.1-total-visible-autoload-proof-isolated" renko/renko-gold-total-visible.js
          grep -Fq 'BOOT_BLOCK_BARS=65000' renko/renko-gold-total-visible.js
          grep -Fq 'MAX_SOURCE_BARS=140000' renko/renko-gold-total-visible.js
          grep -Fq 'proofSuppressed' renko/renko-gold-total-visible.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve branch at production-equivalent path
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-total-visible-site
          mkdir -p /tmp/renko-total-visible-site/rwa
          ln -s "$GITHUB_WORKSPACE/renko" /tmp/renko-total-visible-site/rwa/renko
          cd /tmp/renko-total-visible-site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko-total-visible-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/rwa/renko/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/renko-total-visible-http.log
          exit 1
      - name: Total history appears without scroll
        env:
          RENKO_BASE_URL: http://127.0.0.1:4173/rwa/renko/
          RENKO_OUTPUT_DIR: artifacts/renko-total-visible
        run: node scripts/renko_gold_total_visible_proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-gold-total-visible-${{ github.sha }}
          path: artifacts/renko-total-visible
          if-no-files-found: warn

  public-production:
    if: github.ref == 'refs/heads/main'
    needs: branch-local
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact Pages total-history runtime
        run: |
          set -euo pipefail
          for i in {1..240}; do
            js="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/renko-gold-total-visible.js?total=$RANDOM" 2>/dev/null || true)"
            sha="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?total=$RANDOM" 2>/dev/null | tr -d '\r\n' || true)"
            if printf '%s' "$js" | grep -Fq '1.0.1-total-visible-autoload-proof-isolated' && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && [ "$sha" = "$GITHUB_SHA" ]; then echo "RENKO_GOLD_TOTAL_VISIBLE_PUBLIC_EXACT_SHA_PASS $sha"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Public total history appears without scroll
        env:
          RENKO_BASE_URL: https://copytolive.github.io/rwa/renko/
          RENKO_OUTPUT_DIR: artifacts/renko-total-visible-public
        run: node scripts/renko_gold_total_visible_proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-gold-total-visible-public-${{ github.sha }}
          path: artifacts/renko-total-visible-public
          if-no-files-found: warn