name: RENKO Total Available History 50 + GOLD
on:
  push:
    branches:
      - main
      - fix/renko-total-history-origin-20260829
    paths:
      - 'renko/**'
      - 'tools/renko-total-history-report.mjs'
      - '.github/workflows/renko-total-history.yml'
  pull_request:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-total-history-report.mjs'
      - '.github/workflows/renko-total-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static total-history contract
        run: |
          set -euo pipefail
          node --check renko/renko-tv-total-history.js
          node --check renko/renko-tv-switch-fast.js
          node --check renko/renko-tv-scroll-zero-lock.js
          node --check renko/renko-scroll-blocking-observer.js
          node --check tools/renko-total-history-report.mjs
          grep -Eq "version:'2\.[0-9]+\.[0-9]+-origin-chunks'" renko/renko-tv-total-history.js
          grep -q 'authoritative-earliest-fixed-1s-rest' renko/renko-tv-total-history.js
          grep -q "version:'1.3.0-total-history'" renko/renko-tv-switch-fast.js
          grep -q "version:'1.1.0-total-history'" renko/renko-tv-scroll-zero-lock.js
          grep -q 'renko-tv-total-history.js' renko/index.html
          grep -q 'renko-scroll-blocking-observer.js' renko/index.html
          ! grep -q 'renko-tv-history-ladder.js' renko/index.html
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-total-site
          mkdir -p /tmp/renko-total-site/rwa
          cp -a . /tmp/renko-total-site/rwa/
          cd /tmp/renko-total-site
          python3 -m http.server 8080 >/tmp/renko-total-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko-total-http.log; exit 1
      - name: EXACT desktop + mobile 50 origins + GOLD 2003 + scroll gate
        run: |
          set -euo pipefail
          RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_TOTAL_HISTORY_OUT=artifacts/exact-total-history node tools/renko-total-history-report.mjs
      - name: Enforce exact closure
        run: |
          node - <<'NODE'
          const r=require('./artifacts/exact-total-history/report.json'),s=r.summary;
          if(r.status!=='PASS'||s.pairs!==50||s.desktopPass!==50||s.mobilePass!==50||s.revisitContinuityPass!==50||s.screenshotCount<101||!s.goldPass||s.goldCoverageYears<23||s.firstFrameMaxMs>1||s.scrollAckMaxMs>1||s.scrollBlockingMeasured!==true||s.scrollBlockingMaxMs!==0||s.scrollLosses!==0)throw Error(JSON.stringify(s));
          console.log('EXACT_TOTAL_HISTORY_PASS '+JSON.stringify(s));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-total-history-exact-${{ github.sha }}
          path: artifacts/exact-total-history
          retention-days: 30
  public-production:
    if: github.ref == 'refs/heads/main'
    needs: exact-browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact GitHub Pages bytes
        run: |
          set -euo pipefail
          index='https://copytolive.github.io/rwa/renko/'
          total='https://copytolive.github.io/rwa/renko/renko-tv-total-history.js'
          for i in $(seq 1 120); do
            ts=$(date +%s%N)
            rm -f /tmp/public-renko-index.html /tmp/public-renko-total.js
            curl -fsS "$index?ts=$ts" -o /tmp/public-renko-index.html 2>/dev/null || true
            curl -fsS "$total?ts=$ts" -o /tmp/public-renko-total.js 2>/dev/null || true
            if [ -s /tmp/public-renko-index.html ] && [ -s /tmp/public-renko-total.js ] && cmp -s renko/index.html /tmp/public-renko-index.html && cmp -s renko/renko-tv-total-history.js /tmp/public-renko-total.js; then
              echo "PUBLIC_EXACT_BYTES_READY sha=${GITHUB_SHA}"
              exit 0
            fi
            sleep 5
          done
          echo 'GitHub Pages did not reach exact merged RENKO bytes'; exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: PUBLIC desktop + mobile 50 origins + GOLD 2003 + scroll gate
        run: |
          set -euo pipefail
          RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_TOTAL_HISTORY_OUT=artifacts/public-total-history node tools/renko-total-history-report.mjs
      - name: Enforce public closure
        run: |
          node - <<'NODE'
          const r=require('./artifacts/public-total-history/report.json'),s=r.summary;
          if(r.status!=='PASS'||s.pairs!==50||s.desktopPass!==50||s.mobilePass!==50||s.revisitContinuityPass!==50||s.screenshotCount<101||!s.goldPass||s.goldCoverageYears<23||s.firstFrameMaxMs>1||s.scrollAckMaxMs>1||s.scrollBlockingMeasured!==true||s.scrollBlockingMaxMs!==0||s.scrollLosses!==0)throw Error(JSON.stringify(s));
          console.log('PUBLIC_TOTAL_HISTORY_PASS '+JSON.stringify(s));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-total-history-public-${{ github.sha }}
          path: artifacts/public-total-history
          retention-days: 30
