name: Verify Full RWA Operations Stack

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[QA-OPS]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source stack
        run: |
          node --check suite-nav.js
          node --check ops-suite.js
          node --check risk-hardening.js
          node --check walletconnect.js
          node --check walletconnect-auth-patch.js
          node --check provider-failover.js
          node --check monitor-client.js
          node --check monitor-config-client.js
          node --check social-safety-patch.js
          node --check audit-hooks.js
          node --check rwa-verify-client.js
          node --check suite-execution-patch.js
          node --check tools/rwa-verify.mjs
          node --check tools/monitor-config.mjs
          python -m py_compile monitor/monitor.py
          python -m json.tool rwa-assets.json >/dev/null
          python -m json.tool rwa-reviewers.json >/dev/null
          python -m json.tool moderation.json >/dev/null
          python -m json.tool monitor/config.json >/dev/null
          python -m json.tool monitor/status.json >/dev/null
          python -m json.tool monitor/admin-wallets.json >/dev/null
          grep -Fq 'risk-hardening.js' suite-nav.js
          grep -Fq 'monitor-config-client.js' suite-nav.js
          grep -Fq 'rwa-verify-client.js' suite-nav.js
          grep -Fq 'RWARiskHardening' risk-hardening.js
          grep -Fq 'RWAFailoverV2' provider-failover.js
          grep -Fq 'RWASocialSafetyV2' social-safety-patch.js
          grep -Fq 'RWAAuditHooks' audit-hooks.js
          grep -Fq 'RWAVerifyClient' rwa-verify-client.js
          grep -Fq 'wallet-signature-required' monitor/config.json
          grep -Fq "cron: '*/5" .github/workflows/monitor.yml

      - name: Report source pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "RWA OPS SOURCE PASS. Order management, global risk + kill switch, wallet-scoped audit, WalletConnect, RWA reviewer approval, social safety, provider failover, and 24/7 monitor sources all passed syntax/contract checks."

      - name: Verify production bundle and monitor
        run: |
          ok=0
          for i in {1..30}; do
            q="${GITHUB_RUN_ID}-${i}"
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/suite-nav.js?v=$q" | grep -Fq 'risk-hardening.js' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/ops-suite.js?v=$q" | grep -Fq 'Order management' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/risk-hardening.js?v=$q" | grep -Fq 'RWARiskHardening' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/walletconnect.js?v=$q" | grep -Fq 'RWAWalletConnect' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/provider-failover.js?v=$q" | grep -Fq 'RWAFailoverV2' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/audit-hooks.js?v=$q" | grep -Fq 'RWAAuditHooks' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/social-safety-patch.js?v=$q" | grep -Fq 'RWASocialSafetyV2' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-verify-client.js?v=$q" | grep -Fq 'RWAVerifyClient' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/monitor-config-client.js?v=$q" | grep -Fq 'RWA 24X7 CONFIG' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/monitor/status.json?v=$q" > /tmp/status.json && \
               python - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          assert 'active_alerts' in s and 'copy_signals' in s
          assert s.get('market_data_provider')
          p=s.get('providers',{})
          assert p.get('hyperliquid',{}).get('ok') is True
          assert p.get('coinbase',{}).get('ok') is True
          assert p.get('kraken',{}).get('ok') is True
          assert 'wallet-signature-required' in s.get('note','')
          PY
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"

      - name: Report production success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "RWA OPS PRODUCTION SUCCESS. All 8 requested systems are wired on GitHub Pages. The 24/7 worker is live with Binance Vision plus Coinbase/Kraken backup health and Hyperliquid monitoring; execution remains wallet-signature-only with no private key in GitHub."
