name: History Exact V51 Public Acceptance

on:
  push:
    branches: [main]
    paths:
      - "history-exact-v51-public-acceptance-requests/**"

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^history-exact-v51-public-acceptance-requests/.*\.json$' | tail -n 1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "response=history-exact-v51-public-acceptance-responses/$ID.json" >> "$GITHUB_OUTPUT"

      - name: Browser acceptance
        shell: bash
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
          RESP: ${{ steps.req.outputs.response }}
        run: |
          set -euo pipefail
          mkdir -p history-exact-v51-public-acceptance-responses
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 about:blank >/tmp/hv51.chrome.out 2>/tmp/hv51.chrome.err &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9222/json/list >/tmp/hv51-pages.json && break; sleep .5; done

          cat >/tmp/hv51.mjs <<'NODE'
          import fs from 'node:fs';
          const OUT=process.env.RESP, ID=process.env.ACCEPT_ID;
          const result={ok:false,id:ID,acceptance:'FAIL',checks:{},consoleErrors:[],exceptions:[],failed:[],httpErrors:[]};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let ws=null,seq=0;const pending=new Map(),reqUrls=new Map();
          try{
            const pages=JSON.parse(fs.readFileSync('/tmp/hv51-pages.json','utf8'));
            const target=pages.find(x=>x.type==='page');
            if(!target?.webSocketDebuggerUrl) throw Error('NO_CDP_PAGE');
            ws=new WebSocket(target.webSocketDebuggerUrl);
            const send=(method,params={})=>new Promise((resolve,reject)=>{
              const id=++seq,t=setTimeout(()=>{pending.delete(id);reject(Error('CDP_TIMEOUT '+method));},20000);
              pending.set(id,{resolve:v=>{clearTimeout(t);resolve(v)},reject:e=>{clearTimeout(t);reject(e)}});
              ws.send(JSON.stringify({id,method,params}));
            });
            ws.onmessage=e=>{
              const m=JSON.parse(e.data);
              if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(Error(JSON.stringify(m.error))):p.resolve(m.result);return;}
              if(m.method==='Runtime.exceptionThrown') result.exceptions.push(String(m.params?.exceptionDetails?.exception?.description||m.params?.exceptionDetails?.text||'exception'));
              if(m.method==='Runtime.consoleAPICalled'&&m.params?.type==='error') result.consoleErrors.push((m.params.args||[]).map(a=>String(a.value??a.description??'')).join(' '));
              if(m.method==='Network.requestWillBeSent') reqUrls.set(m.params.requestId,m.params?.request?.url||'');
              if(m.method==='Network.loadingFailed'&&!m.params?.canceled) result.failed.push((reqUrls.get(m.params.requestId)||'')+' :: '+(m.params.errorText||''));
              if(m.method==='Network.responseReceived'){const r=m.params?.response;if(r&&Number(r.status)>=400)result.httpErrors.push({status:Number(r.status),url:r.url||''});}
            };
            await new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(Error('CDP_OPEN_TIMEOUT')),10000);ws.onopen=()=>{clearTimeout(t);resolve()};ws.onerror=reject;});
            await send('Runtime.enable');await send('Network.enable');await send('Page.enable');
            const ev=async expression=>{const r=await send('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.exception?.description||r.exceptionDetails.text||'EVAL');return r.result.value;};
            const j=async expression=>{const v=await ev(expression);return typeof v==='string'?JSON.parse(v):v;};
            async function wait(expr,timeout=35000){const end=Date.now()+timeout;while(Date.now()<end){try{if(await ev(expr))return true}catch{}await sleep(250)}return false;}

            await send('Page.navigate',{url:'https://copytolive.com/dashboard/index.html?accept='+encodeURIComponent(ID)});
            const ready=await wait("document.readyState==='complete'&&window.__CTL_NATIVE_FILTER_V51__?.ready&&window.__CTL_HISTORY_STABLE__?.render?.__ctlV51===true&&window.__CTL_HL_LEDGER_V32__?.version>=33",45000);
            if(!ready) throw Error('V51_NOT_READY');

            result.checks.resources=await j("JSON.stringify(performance.getEntriesByType('resource').map(x=>x.name).filter(x=>x.includes('/assets/history/history_')))");
            if(!result.checks.resources.some(x=>x.includes('history_real_filters_v36.js?v=20260903-exact-history-v51'))) throw Error('V36_CACHE_BUST_MISSING');
            if(!result.checks.resources.some(x=>x.includes('history_filter_native_v43.js?v=20260903-exact-history-v51'))) throw Error('V43_CACHE_BUST_MISSING');
            if(!result.checks.resources.some(x=>x.includes('history_hl_ledger_v32.js?v=20260903-exact-history-v51'))) throw Error('LEDGER_CACHE_BUST_MISSING '+JSON.stringify(result.checks.resources));

            result.checks.source=await j(`Promise.all([
              fetch('/assets/history/history_hl_ledger_v32.js?accept=${encodeURIComponent(ID)}',{cache:'no-store'}).then(r=>r.text()),
              fetch('/assets/history/history_real_filters_v36.js?accept=${encodeURIComponent(ID)}',{cache:'no-store'}).then(r=>r.text()),
              fetch('/assets/history/history_filter_native_v43.js?accept=${encodeURIComponent(ID)}',{cache:'no-store'}).then(r=>r.text())
            ]).then(([l,v,n])=>JSON.stringify({
              ledgerVersion:l.includes('VERSION=33'),
              ledgerRawRecent:l.includes("userFills',user:a,aggregateByTime:false"),
              ledgerRawDeep:l.includes("userFillsByTime")&&l.includes("aggregateByTime:false"),
              ledgerRawPnl:l.includes("pnl:cls==='ENTRY'?null:cp"),
              ledgerSingleAccount:l.includes("slice(0,1)")&&l.includes("resolveAccounts"),
              ledgerTidKey:l.includes("_hlTid||x.trade_id"),
              v36Raw:v.includes("userFills',user:a,aggregateByTime:false"),
              v36Single:v.includes("var accounts=[active]"),
              v36RawPnl:v.includes("pnl:cls==='ENTRY'?null:cp"),
              v36Delegates:v.includes("finalRender.__ctlV51===true"),
              native51:n.includes("__ctlV51=true")&&n.includes("__CTL_NATIVE_FILTER_V51__"),
              nativeHash:n.includes("htmlKey=String(st.mode||'all')+'|'+html"),
              nativeLegacyFence:n.includes("window.fetchHistoryFromData=function(){requestAnimationFrame(render)")
            }))`);
            if(Object.values(result.checks.source).some(v=>v!==true)) throw Error('SOURCE_INVARIANT_FAIL '+JSON.stringify(result.checks.source));

            result.checks.synthetic=await j(`(()=> {
              const st=window.__CTL_HISTORY_STABLE__, led=window.__CTL_HL_LEDGER_V32__, v=window.__CTL_REAL_FILTERS_V36__, nat=window.__CTL_NATIVE_FILTER_V51__;
              try{if(led.timer)clearInterval(led.timer);}catch{};try{v.stop&&v.stop();}catch{};
              st.mode='all';
              const base=Date.UTC(2026,8,2,8,52,45);
              led.ready=true;led.version=33;led.parentPending={};led.coverage={};
              led.fills=[
                {trade_id:'T4',_hlTid:'T4',time:base+1000,timestamp:new Date(base+1000).toISOString(),symbol:'BTC/USD',side:'BUY',type:'BUY',volume:.001,price:50000,pnl:1,_hlClosedPnl:1,_hlFeeUsd:.1,is_entry:false,_fillClass:'CLOSE',_hlAccount:'0x0000000000000000000000000000000000000001'},
                {trade_id:'T3',_hlTid:'T3',time:base,timestamp:new Date(base).toISOString(),symbol:'GOLD/USD',side:'SELL',type:'SELL',volume:.0024,price:4298.5,pnl:null,is_entry:true,_fillClass:'ENTRY',_hlAccount:'0x0000000000000000000000000000000000000001'},
                {trade_id:'T2',_hlTid:'T2',time:base,timestamp:new Date(base).toISOString(),symbol:'GOLD/USD',side:'SELL',type:'SELL',volume:.0024,price:4298.5,pnl:null,is_entry:true,_fillClass:'ENTRY',_hlAccount:'0x0000000000000000000000000000000000000001'},
                {trade_id:'T1',_hlTid:'T1',time:base,timestamp:new Date(base).toISOString(),symbol:'GOLD/USD',side:'SELL',type:'SELL',volume:.0004,price:4298.6,pnl:null,is_entry:true,_fillClass:'ENTRY',_hlAccount:'0x0000000000000000000000000000000000000001'}
              ];
              nat.lastHtml='';st.render();
              const filters=document.getElementById('historyTypeFilters'),tbody=document.getElementById('historyTableBody'),first=tbody.firstElementChild;
              let fm=0,tm=0;const fo=new MutationObserver(x=>fm+=x.length),to=new MutationObserver(x=>tm+=x.length);fo.observe(filters,{subtree:true,childList:true,attributes:true,characterData:true});to.observe(tbody,{subtree:true,childList:true,attributes:true,characterData:true});
              window.__hv51={filters,tbody,first,fo,to,get:()=>({fm,tm})};
              return JSON.stringify({rows:[...tbody.rows].map(r=>[...r.cells].map(c=>c.textContent.trim())),count:document.getElementById('historyCount')?.textContent||'',owner:nat.source,render51:!!st.render.__ctlV51,buttonStyles:[...filters.querySelectorAll('[data-history-type]')].map(b=>{const cs=getComputedStyle(b);return{t:b.textContent.trim(),animationName:cs.animationName,animationDuration:cs.animationDuration,transitionProperty:cs.transitionProperty,transitionDuration:cs.transitionDuration}})});
            })()`);
            if(result.checks.synthetic.rows.length!==4) throw Error('RAW_FILL_COUNT_FAIL '+JSON.stringify(result.checks.synthetic));
            if(result.checks.synthetic.rows[0][7]!=='+$1.0000') throw Error('CLOSED_PNL_NOT_RAW '+JSON.stringify(result.checks.synthetic.rows[0]));
            if(result.checks.synthetic.rows.filter(r=>r[0]==='2026.09.02 08:52:45').length!==3) throw Error('SAME_SECOND_FILLS_COLLAPSED '+JSON.stringify(result.checks.synthetic.rows));
            if(result.checks.synthetic.buttonStyles.some(x=>x.animationName!=='none'||(x.transitionProperty!=='none'&&x.transitionDuration!=='0s'))) throw Error('FILTER_ANIMATION_NOT_DISABLED '+JSON.stringify(result.checks.synthetic.buttonStyles));

            await ev("for(let i=0;i<6;i++){window.__CTL_HISTORY_STABLE__.render();window.dispatchEvent(new CustomEvent('ctl-real-filters-v36'));window.dispatchEvent(new CustomEvent('ctl-hl-ledger-v32'));}true");
            await sleep(1200);
            result.checks.stability=await j("(()=>{const x=window.__hv51,g=x.get();x.fo.disconnect();x.to.disconnect();return JSON.stringify({filterMutations:g.fm,tableMutations:g.tm,sameFilter:x.filters===document.getElementById('historyTypeFilters'),sameFirst:x.first===document.getElementById('historyTableBody').firstElementChild,mode:window.__CTL_HISTORY_STABLE__.mode,active:[...document.querySelectorAll('#historyTypeFilters [data-history-type].active')].map(x=>x.dataset.historyType)})})()");
            if(result.checks.stability.filterMutations!==0||result.checks.stability.tableMutations!==0||!result.checks.stability.sameFilter||!result.checks.stability.sameFirst) throw Error('FLICKER_MUTATION_FAIL '+JSON.stringify(result.checks.stability));

            result.checks.tabs=await j(`(async()=>{const st=window.__CTL_HISTORY_STABLE__,sleep=ms=>new Promise(r=>setTimeout(r,ms));const out={};for(const mode of ['pending','direct','all']){st.setMode(mode);await sleep(80);out[mode]={mode:st.mode,title:(document.querySelector('#backtestHistoryPanel')?.firstElementChild?.firstElementChild?.textContent||''),active:[...document.querySelectorAll('#historyTypeFilters [data-history-type].active')].map(x=>x.dataset.historyType),rootSame:window.__hv51.filters===document.getElementById('historyTypeFilters')}}return JSON.stringify(out)})()`);
            for(const m of ['pending','direct','all']){if(result.checks.tabs[m].mode!==m||result.checks.tabs[m].active[0]!==m||!result.checks.tabs[m].rootSame)throw Error('TAB_FAIL '+m+' '+JSON.stringify(result.checks.tabs[m]));}

            result.consoleErrors=[...new Set(result.consoleErrors)].filter(Boolean).slice(0,50);
            result.exceptions=[...new Set(result.exceptions)].filter(Boolean).slice(0,50);
            result.failed=[...new Set(result.failed)].filter(x=>x&&!/ERR_ABORTED|favicon/i.test(x)).slice(0,50);
            result.httpErrors=[...new Map(result.httpErrors.map(x=>[x.status+'|'+x.url,x])).values()].filter(x=>x.status!==401&&!/favicon/i.test(x.url)).slice(0,70);
            const seriousConsole=result.consoleErrors.concat(result.exceptions).filter(x=>/SyntaxError|already been declared|Uncaught/i.test(x));
            if(seriousConsole.length) throw Error('JS_ERRORS '+JSON.stringify(seriousConsole));
            if(result.failed.length) throw Error('NETWORK_FAILURES '+JSON.stringify(result.failed));
            const seriousHttp=result.httpErrors.filter(x=>!((x.status===429&&/hyperliquid/i.test(x.url))||(/googleapis|gstatic/i.test(x.url)&&[403,404,429].includes(x.status))));
            if(seriousHttp.length) throw Error('HTTP_ERRORS '+JSON.stringify(seriousHttp));
            result.ok=true;result.acceptance='PASS';
          }catch(e){result.ok=false;result.acceptance='FAIL';result.error=String(e?.stack||e);}
          finally{try{ws?.close()}catch{}fs.writeFileSync(OUT,JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));}
          NODE
          node /tmp/hv51.mjs || true
          test -s "$RESP"

      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RESP="${{ steps.req.outputs.response }}"
          git config user.name "CopyToLive History V51 Public Acceptance"
          git config user.email "copytolive-history-v51-public@local.invalid"
          git add "$RESP"
          git commit -m "history v51 acceptance: ${{ steps.req.outputs.id }}" || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$attempt"; continue; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Enforce
        if: always()
        shell: bash
        run: python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("ok") else 1)' "${{ steps.req.outputs.response }}"
