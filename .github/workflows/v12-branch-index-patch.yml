name: V12 Branch Index Patch

on:
  push:
    branches:
      - 'fix/top-company-ui-pair-stability-v12-20260827'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-company-ui-pair-stability-v12-20260827
          fetch-depth: 0
      - name: Apply exact V12 index replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no','width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5',1)
          s=s.replace('market-performance.js?v=10','market-performance.js?v=12',1)
          p.write_text(s)
          assert 'user-scalable=no' not in s
          assert 'market-performance.js?v=12' in s
          assert s.count('<script src=') == 6, s.count('<script src=')
          PY
      - name: Commit branch-only patch when needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'Index already V12'
            exit 0
          fi
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git add index.html
          git commit -m 'chore(ui): apply V12 index cache key'
          git push origin HEAD:fix/top-company-ui-pair-stability-v12-20260827
