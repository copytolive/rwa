name: V12 Branch Index Patch

on:
  push:
    branches:
      - fix/top-company-ui-pair-stability-v12-20260827

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ui): apply V12 index cache key') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/top-company-ui-pair-stability-v12-20260827
          fetch-depth: 0
      - name: Apply exact V12 index replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_view='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'
          new_view='width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5'
          old_js='market-performance.js?v=10'
          new_js='market-performance.js?v=12'
          if old_view in s:
              s=s.replace(old_view,new_view,1)
          if old_js in s:
              s=s.replace(old_js,new_js,1)
          p.write_text(s)
          assert 'user-scalable=no' not in s
          assert new_js in s
          assert s.count('<script src=') == 6, s.count('<script src=')
          PY
      - name: Commit branch-only patch
        run: |
          if git diff --quiet -- index.html; then
            echo 'Index already V12'
            exit 0
          fi
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git add index.html
          git commit -m 'chore(ui): apply V12 index cache key'
          git push origin HEAD:fix/top-company-ui-pair-stability-v12-20260827
