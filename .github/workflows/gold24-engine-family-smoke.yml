name: GOLD24 48-Family Real Engine Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backtest/gold24/core.py'
      - 'backtest/gold24/MASTER_METHOD_UNIVERSE.json'
      - 'backtest/gold24/multimethod_v1_discovery.py'
      - 'backtest/gold24/engine_family_smoke.py'
      - '.github/workflows/gold24-engine-family-smoke.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-engine-family-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_DIR: ${{ github.workspace }}/.gold24-smoke-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Restore authoritative canonical Batch310 state
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          gh run download 33667987913 --repo "$GITHUB_REPOSITORY" -n gold24-canonical-v11-state -D "$STATE_DIR"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"
      - name: Execute all implemented families + causality prefix checks
        run: |
          set -euo pipefail
          python backtest/gold24/engine_family_smoke.py             --state-dir "$STATE_DIR"             --out backtest/gold24/runtime_screening_gpt/engine_family_smoke.json
          python - <<'PY'
          import json
          p='backtest/gold24/runtime_screening_gpt/engine_family_smoke.json'
          x=json.load(open(p))
          assert x['status']=='PASS'
          assert x['implemented_family_count']==48
          assert x['tested_family_count']==48
          assert x['all_implemented_families_executed'] is True
          assert len(x['data_blocked_native_mtf'])==2
          print('48 implemented real D1 families execution/causality PASS; 2 native MTF DATA_BLOCKED')
          PY
      - name: Publish smoke evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/gold24/runtime_screening_gpt/engine_family_smoke.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(gold24): publish 46-family smoke evidence [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: gold24-48-family-real-engine-smoke
          path: backtest/gold24/runtime_screening_gpt/engine_family_smoke.json
          if-no-files-found: error
          retention-days: 90
