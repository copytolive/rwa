name: RENKO TradingView Official Contract Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "tools/renko-tradingview-official-report.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "renko-tradingview-official-pages"
  cancel-in-progress: true

jobs:
  verify-renko-official-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static TradingView documented-contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-tv-engine.js
          node --check renko/renko-tv-app.js
          node --check renko/renko-tv-atr-control.js
          node --check renko/renko-tv-atr-fixed1s.js
          node --check renko/renko-tv-stable-chart-v2.js
          node --check renko/renko-tv-ultrafast-ui.js
          node --check tools/renko-tradingview-official-report.mjs
          grep -Fq 'Fixed 1s TradingView Observable Model' renko/index.html
          grep -Fq '1s Fixed Source' renko/index.html
          grep -Fq 'PROJECTION' renko/index.html
          grep -Fq 'PERCENTAGE (LTP)' renko/index.html
          grep -Fq 'renko-tv-app.js?v=187' renko/index.html
          grep -Fq 'renko-tv-stable-chart-v2.js?v=183' renko/index.html
          grep -Fq 'renko-tv-ultrafast-ui.js?v=171' renko/index.html
          grep -Fq 'renko-tv-atr-control.js?v=2' renko/index.html
          grep -Fq 'renko-tv-atr-fixed1s.js?v=4' renko/index.html
          ! grep -Fq 'id="intervalSelect"' renko/index.html
          ! grep -Fq 'renko-v12.js?v=' renko/index.html
          ! grep -Fq 'renko-v12-worker.js?v=' renko/index.html
          ! grep -Fq 'renko-tv-atr-1s-million-cache.js?v=' renko/index.html
          grep -Fq "FIXED_INTERVAL='1s'" renko/renko-tv-app.js
          grep -Fq "formationSource:'fixed-1s-close-or-ohlc'" renko/renko-tv-app.js
          grep -Fq "confirmationRule:'fixed-1s-close'" renko/renko-tv-app.js
          grep -Fq "contract:'tradingview-public-documentation-compatible-fixed-1s'" renko/renko-tv-engine.js
          grep -Fq "version:'1.4.0-fixed-1s'" renko/renko-tv-engine.js
          grep -Fq '_exactBox' renko/renko-tv-engine.js
          grep -Fq "rule:'render-only-on-renko-geometry-change-any-source-interval'" renko/renko-tv-stable-chart-v2.js
          grep -Fq "rule:'xaut-deep-matrix-other-pairs-local-fixed1s-atr-snapshot-box-stable-between-closes-runtime-only-single-owner-display'" renko/renko-tv-atr-control.js
          grep -Fq "rule:'fixed-1s-okx-deep-wilder-matrix-on-demand'" renko/renko-tv-atr-fixed1s.js
          grep -Fq "version:'1.1.1'" renko/renko-tv-ultrafast-ui.js
          grep -Fq "rule:'search-only-universe-plus-fast50-launch-list-plus-manual-zoom-lock'" renko/renko-tv-ultrafast-ui.js
          ! grep -Eqi 'every trade locks|tick-native chart' renko/index.html
          git diff --check

      - name: Official Renko rule unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          require('./renko/renko-tv-engine.js');
          const E=global.RWARenkoTVEngine;
          if(E.version!=='1.4.0-fixed-1s'||E.contract!=='tradingview-public-documentation-compatible-fixed-1s')throw Error('fixed-1s engine identity contract failed');
          const bars=closes=>closes.map((c,i)=>({open:c,high:c,low:c,close:c,openTime:i*1000,closeTime:(i+1)*1000-1}));
          let r=E.build(bars([100,110,120,100,90]),{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          if(r.bricks.length!==4||r.bricks[2].open!==110||r.bricks[2].close!==100||!r.bricks[2].isReversal)throw Error('Traditional 1x/2x contract failed');
          const pctRaw=104.05*.1,pctTick=E.roundTick(pctRaw,.01),pct=E.computeBox([{open:100,high:110,low:90,close:104.05}],{method:'percentage',percentage:.1},.01);
          if(Math.abs(pctTick-10.41)>1e-12||Math.abs(pct-10)>1e-12)throw Error('Percentage LTP min-tick then stability-round contract failed');
          const atrBars=[{open:10,high:10.017,low:10,close:10.011},{open:10.011,high:10.028,low:10.006,close:10.02},{open:10.02,high:10.039,low:10.014,close:10.03}];
          const atr=E.latestAtr(atrBars,3,.01),atrBox=E.computeBox(atrBars,{method:'atr',atrLength:3},.01);
          if(!(atr>0)||Math.abs(atrBox-atr)>1e-15||Math.abs(atrBox-E.roundTick(atrBox,.01))<1e-9)throw Error('ATR was rounded to minimum tick instead of using raw Wilder value');
          const override=.01759154004858781,exact=E.computeBox(atrBars,{method:'atr',atrLength:3,_exactBox:override},.01);
          if(Math.abs(exact-override)>1e-15)throw Error('ATR exact-box override was rounded');
          const base=E.build(bars([100,110]),{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          const far=E.project(base,{open:110,high:130,low:110,close:130,openTime:2000,closeTime:2999},{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          const back=E.project(base,{open:110,high:130,low:105,close:105,openTime:2000,closeTime:2999},{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          if(base.bricks.length!==1||far.length!==2||back.length!==0)throw Error('Projection rebuild contract failed');
          const on=E.build(bars([100,99,110]),{method:'traditional',boxSize:10,source:'close',wicks:true},1),off=E.build(bars([100,99,110]),{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          if(on.bricks[0].low!==99||off.bricks[0].low!==100)throw Error('Close-source wick contract failed');
          console.log('RENKO TRADINGVIEW PUBLIC-DOC UNIT MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium

      - name: Fresh local browser validation — canonical fixed 1s desktop and mobile
        env:
          RWA_TEST_URL: http://127.0.0.1:8080/rwa/
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-tv-site
          mkdir -p /tmp/renko-tv-site/rwa
          cp -a . /tmp/renko-tv-site/rwa/
          cd /tmp/renko-tv-site
          python3 -m http.server 8080 >/tmp/renko-tv-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/renko-tradingview-official-report.mjs

      - name: Remove test-only dependencies
        run: rm -rf node_modules package-lock.json

      - name: Stamp exact deployed SHA
        run: printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Upload local parity screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-tv-local-${{ github.sha }}
          path: artifacts/renko-tv-official-report
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: verify-renko-official-contract
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified canonical fixed-1s Renko
        id: deployment
        uses: actions/deploy-pages@v4

  production-browser-report:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Wait for exact Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/renko-deployment-sha.txt?v=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          echo "RENKO_LIVE_EXACT_SHA=PASS:$GITHUB_SHA"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: Open live production — canonical fixed 1s desktop/mobile gate
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa/
        run: node tools/renko-tradingview-official-report.mjs
      - name: Upload production screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-tv-production-${{ github.sha }}
          path: artifacts/renko-tv-official-report
          if-no-files-found: warn
          retention-days: 7
