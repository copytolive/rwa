name: RENKO TradingView Official Contract Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "tools/renko-observable-parity-gate.mjs"
      - "tools/renko-observable-browser-report.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-renko-official-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static TradingView observable-contract checks
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-tv-engine.js
          node --check renko/renko-tv-app.js
          node --check renko/renko-tv-atr-parity.js
          node --check renko/renko-tv-stable-chart-v2.js
          node --check renko/renko-tv-history-ladder.js
          node --check renko/renko-tv-percentage-ltp-runtime.js
          node --check renko/renko-tv-parity-fixture.js
          node --check tools/renko-observable-parity-gate.mjs
          node --check tools/renko-observable-browser-report.mjs
          grep -Fq 'RENKO — TradingView Observable Model' renko/index.html
          grep -Fq 'RENKO_PARITY_PROFILE' renko/index.html
          grep -Fq 'id="sourceSelect"' renko/index.html
          grep -Fq 'id="intervalSelect"' renko/index.html
          grep -Fq 'PROJECTION' renko/index.html
          grep -Fq 'PERCENTAGE (LTP)' renko/index.html
          grep -Fq 'renko-tv-stable-chart-v2.js?v=183' renko/index.html
          grep -Fq 'renko-tv-history-ladder.js?v=181' renko/index.html
          grep -Fq 'renko-tv-percentage-ltp-runtime.js?v=182' renko/index.html
          grep -Fq 'renko-tv-parity-fixture.js?v=182' renko/index.html
          grep -Fq "contract:'tradingview-public-documentation-compatible'" renko/renko-tv-engine.js
          grep -Fq 'percentageLtpStableRound' renko/renko-tv-engine.js
          grep -Fq 'selected-finest-then-higher-timeframes-on-history-exhaustion' renko/renko-tv-history-ladder.js
          ! grep -Fq 'renko-v12.js' renko/index.html
          git diff --check
          node tools/renko-observable-parity-gate.mjs

      - name: Observable Renko unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          require('./renko/renko-tv-engine.js');
          const E=global.RWARenkoTVEngine;
          const bars=closes=>closes.map((c,i)=>({open:c,high:c,low:c,close:c,openTime:i*1000,closeTime:(i+1)*1000-1}));
          let r=E.build(bars([100,110,120,100,90]),{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          if(r.bricks.length!==4||r.bricks[2].open!==110||r.bricks[2].close!==100||!r.bricks[2].isReversal)throw Error('Traditional 1x/2x contract failed');
          const pct=E.computeBox([{open:216,high:216,low:216,close:216,openTime:0,closeTime:999}],{method:'percentage',percentage:.01},.01);
          if(Math.abs(pct-2)>1e-12)throw Error(`Percentage LTP official example failed: ${pct}`);
          const atrBars=[{open:10,high:10.017,low:10,close:10.011},{open:10.011,high:10.028,low:10.006,close:10.02},{open:10.02,high:10.039,low:10.014,close:10.03}];
          const atr=E.latestAtr(atrBars,3,.01),atrBox=E.computeBox(atrBars,{method:'atr',atrLength:3},.01);
          if(!(atr>0)||Math.abs(atrBox-atr)>1e-15)throw Error('ATR must use raw positive Wilder value');
          const base=E.build(bars([100,110]),{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          const far=E.project(base,{open:110,high:130,low:110,close:130,openTime:2000,closeTime:2999},{method:'traditional',boxSize:10,source:'close',wicks:false},1);
          if(base.bricks.length!==1||far.length!==2||!far.every(x=>x.projection))throw Error('Projection contract failed');
          const closeWick=E.build([{open:100,high:100,low:100,close:100,openTime:0,closeTime:999},{open:100,high:120,low:95,close:110,openTime:1000,closeTime:1999}],{method:'traditional',boxSize:10,source:'close',wicks:true},1);
          if(closeWick.bricks.length!==1)throw Error('Close source unit failed');
          const ohlc=E.build([{open:100,high:100,low:100,close:100,openTime:0,closeTime:999},{open:100,high:120,low:95,close:110,openTime:1000,closeTime:1999}],{method:'traditional',boxSize:10,source:'ohlc',wicks:true},1);
          if(!ohlc.bricks.length)throw Error('OHLC source unit failed');
          console.log('RENKO TRADINGVIEW OBSERVABLE UNIT MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium

      - name: Fresh local browser validation — desktop/mobile + GOLD 20Y
        env:
          RWA_TEST_URL: http://127.0.0.1:8080/rwa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-tv-site
          mkdir -p /tmp/renko-tv-site/rwa
          cp -a . /tmp/renko-tv-site/rwa/
          cd /tmp/renko-tv-site
          python3 -m http.server 8080 >/tmp/renko-tv-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/renko-observable-browser-report.mjs

      - name: Upload local parity screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-tv-observable-local-${{ github.sha }}
          path: artifacts/renko-observable-parity
          if-no-files-found: warn
          retention-days: 14

  production-browser-report:
    needs: verify-renko-official-contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Wait for exact Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 120); do
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/renko-deployment-sha.txt?v=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          echo "RENKO_LIVE_EXACT_SHA=PASS:$GITHUB_SHA"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium

      - name: Open live production — Observable Model desktop/mobile + GOLD 20Y
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa
        run: node tools/renko-observable-browser-report.mjs

      - name: Upload production screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-tv-observable-production-${{ github.sha }}
          path: artifacts/renko-observable-parity
          if-no-files-found: warn
          retention-days: 14
