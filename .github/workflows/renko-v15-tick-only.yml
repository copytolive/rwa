name: RENKO Tick-Only Production Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "legacy-canonical.js"
      - "rwa-sw-v5.js"
      - "tools/renko-v15-standalone-methods.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "renko-tick-only-pages"
  cancel-in-progress: true

jobs:
  verify-renko-tick-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin V171 history-fill controller in deploy artifact
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/renko-v15-controller-bootstrap\.js\?v=(154|158|170|171)/renko-v15-controller-bootstrap.js?v=171/g' renko/index.html
          grep -Fq 'renko-v15-controller-bootstrap.js?v=171' renko/index.html
          ! grep -Eq 'renko-v15-controller-bootstrap\.js\?v=(154|158|170)' renko/index.html

      - name: Static tick-only and full-history method contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v15.js
          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15-method-controller-v170.js
          node --check renko/renko-v15-controller-bootstrap.js
          node --check tools/renko-v15-standalone-methods.mjs
          node --check legacy-canonical.js
          node --check rwa-sw-v5.js
          grep -Fq 'RENKO V15.1' renko/index.html
          grep -Fq 'renko-v15-controller-bootstrap.js?v=171' renko/index.html
          ! grep -Eqi 'id="[^"]*(resolution|timeframe)|>RESOLUTION<|1 minute</option>|3 minutes</option>|5 minutes</option>|15 minutes</option>|30 minutes</option>|1 hour</option>|4 hours</option>|1 day</option>' renko/index.html
          ! grep -Fq '/api/v3/klines?' renko/renko-v15.js
          grep -Fq "formationSource:'trade-events-only'" renko/renko-v15.js
          grep -Fq "confirmationRule:'every-trade-immediate'" renko/renko-v15.js
          grep -Fq "timeframeControl:false" renko/renko-v15.js
          grep -Fq "historySource:'binance-aggregate-trade-events-no-candles'" renko/renko-v15.js
          grep -Fq "version:'1.7.1'" renko/renko-v15-method-controller-v170.js
          grep -Fq 'const TARGET_BRICKS=60' renko/renko-v15-method-controller-v170.js
          grep -Fq 'BACKFILL_PAGES=96' renko/renko-v15-method-controller-v170.js
          grep -Fq 'BACKFILL_ROUNDS=24' renko/renko-v15-method-controller-v170.js
          grep -Fq "setupContract:'atr-traditional-percentage-all-operable'" renko/renko-v15-method-controller-v170.js
          grep -Fq "historyContract:'active-method-retries-backfill-until-one-screen-or-source-exhausted'" renko/renko-v15-method-controller-v170.js
          grep -Fq "zeroBrickContract:'method-activates-immediately-then-backfills'" renko/renko-v15-method-controller-v170.js
          grep -Fq "interactionContract:'all-three-method-panels-remain-interactive-during-deep-history'" renko/renko-v15-method-controller-v170.js
          grep -Fq 'engine.loadOlder(Math.max(20,TARGET_BRICKS-bricks),BACKFILL_PAGES)' renko/renko-v15-method-controller-v170.js
          grep -Fq "dataset.renkoMethodBootstrap='171'" renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-method-controller-v170.js?v=171' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'v15.11-fill-active-history' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'z-index:40!important' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'Never serve the cached V14 source/resolution UI' rwa-sw-v5.js
          git diff --check

      - name: Tick formation unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV15Engine,ticks=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,150])});
          if(r.bricks.length!==5||r.bricks.at(-1).close!==150)throw Error('single trade must lock five bricks immediately');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,110,120,100,90])});
          if(r.bricks.length!==4||!r.bricks[2].isReversal||r.bricks[2].open!==110||r.bricks[2].close!==100)throw Error('2-box reversal failed');
          r=E.buildTicks({method:'percentage',percentage:.01,ltpSnapshot:100000,tickSize:1,wicks:true,ticks:ticks([100000,100100])});
          if(r.box!==1000||r.audit?.ok!==true)throw Error('percentage box assignment failed');
          console.log('RENKO TICK-ONLY MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance - SOL Traditional and Percentage fill one screen
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/renko-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || true; sleep 1; done
          RENKO_TEST_BASE='http://127.0.0.1:8080/' node tools/renko-v15-standalone-methods.mjs

      - name: Remove test-only dependencies
        run: rm -rf node_modules package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: verify-renko-tick-only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO tick-only Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4