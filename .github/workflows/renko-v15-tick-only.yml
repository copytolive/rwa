name: RENKO Tick-Only Production Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "legacy-canonical.js"
      - "rwa-sw-v5.js"
      - "tools/renko-v15-standalone-methods.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "renko-tick-only-pages"
  cancel-in-progress: true

jobs:
  verify-renko-tick-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static tick-only and abortable-control contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v15.js
          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15-method-controller.js
          node --check renko/renko-v15-controller-bootstrap.js
          node --check tools/renko-v15-standalone-methods.mjs
          node --check legacy-canonical.js
          node --check rwa-sw-v5.js
          grep -Fq 'RENKO V15.1' renko/index.html
          ! grep -Fq 'renko-v15-method-profiles.js?v=151' renko/index.html
          ! grep -Eqi 'id="[^"]*(resolution|timeframe)|>RESOLUTION<|1 minute</option>|3 minutes</option>|5 minutes</option>|15 minutes</option>|30 minutes</option>|1 hour</option>|4 hours</option>|1 day</option>' renko/index.html
          ! grep -Fq '/api/v3/klines?' renko/renko-v15.js
          grep -Fq "formationSource:'trade-events-only'" renko/renko-v15.js
          grep -Fq "confirmationRule:'every-trade-immediate'" renko/renko-v15.js
          grep -Fq "timeframeControl:false" renko/renko-v15.js
          grep -Fq "historySource:'binance-aggregate-trade-events-no-candles'" renko/renko-v15.js
          grep -Fq "version:'1.6.0'" renko/renko-v15-method-controller.js
          grep -Fq "switchContract:'abortable-latest-interaction-wins'" renko/renko-v15-method-controller.js
          grep -Fq "interactionContract:'all-inputs-selects-checkboxes-and-apply-remain-interactive-during-history'" renko/renko-v15-method-controller.js
          grep -Fq "chartImpactContract:'recent-tick-fast-commit-deep-history-abortable'" renko/renko-v15-method-controller.js
          grep -Fq "renderContract:'keep-current-chart-while-target-history-loads'" renko/renko-v15-method-controller.js
          grep -Fq "startupContract:'no-auto-apply'" renko/renko-v15-method-controller.js
          grep -Fq "controller.abort(reason)" renko/renko-v15-method-controller.js
          grep -Fq "signal});" renko/renko-v15-method-controller.js
          grep -Fq "dataset.controller='v15.7-abortable-controls'" renko/renko-v15-controller-bootstrap.js
          grep -Fq "renko-v15-method-controller.js?v=157" renko/renko-v15-controller-bootstrap.js
          grep -Fq "z-index:20!important" renko/renko-v15-controller-bootstrap.js
          grep -Fq "renko-v15-controller-bootstrap.js?v=157" legacy-canonical.js
          grep -Fq "Never serve the cached V14 source/resolution UI" rwa-sw-v5.js
          git diff --check

      - name: Tick formation unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV15Engine,ticks=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,150])});
          if(r.bricks.length!==5||r.bricks.at(-1).close!==150)throw Error('single trade must lock five bricks immediately');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,110,120,100,90])});
          if(r.bricks.length!==4||!r.bricks[2].isReversal||r.bricks[2].open!==110||r.bricks[2].close!==100)throw Error('2-box reversal failed');
          if(!r.audit?.ok)throw Error('uniform brick audit failed');
          console.log('RENKO TICK-ONLY MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance - edit and Apply while history is loading
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/renko-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || true; sleep 1; done
          RENKO_TEST_BASE='http://127.0.0.1:8080/' node tools/renko-v15-standalone-methods.mjs

      - name: Remove test-only dependencies
        run: rm -rf node_modules package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: verify-renko-tick-only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO tick-only Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
