name: RENKO V15.16 Zero-Wait Hot Replay Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "legacy-canonical.js"
      - "rwa-sw-v5.js"
      - "tools/renko-v15-methods-v181.mjs"
      - "tools/renko-production-report.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "renko-tick-only-pages"
  cancel-in-progress: true

jobs:
  verify-renko-tick-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin V184 zero-wait hot-replay controller
        shell: bash
        run: |
          set -euo pipefail
          sed -i -E 's/renko-v15-controller-bootstrap\.js\?v=(154|158|170|171|180|181|182|183|184)/renko-v15-controller-bootstrap.js?v=184/g' renko/index.html
          grep -Fq 'renko-v15-controller-bootstrap.js?v=184' renko/index.html

      - name: Static tick-only zero-wait contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v15.js
          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15-deep-history-worker-v181.js
          node --check renko/renko-v15-method-controller-v181.js
          node --check renko/renko-v15-controller-bootstrap.js
          node --check tools/renko-v15-methods-v181.mjs
          node --check tools/renko-production-report.mjs
          node --check legacy-canonical.js
          node --check rwa-sw-v5.js
          grep -Fq 'RENKO V15.1' renko/index.html
          grep -Fq 'renko-v15-controller-bootstrap.js?v=184' renko/index.html
          ! grep -Eqi 'id="[^"]*(resolution|timeframe)|>RESOLUTION<|1 minute</option>|3 minutes</option>|5 minutes</option>|15 minutes</option>|30 minutes</option>|1 hour</option>|4 hours</option>|1 day</option>' renko/index.html
          ! grep -Fq '/api/v3/klines?' renko/renko-v15.js
          grep -Fq "formationSource:'trade-events-only'" renko/renko-v15.js
          grep -Fq "confirmationRule:'every-trade-immediate'" renko/renko-v15.js
          grep -Fq "historySource:'binance-aggregate-trade-events-no-candles'" renko/renko-v15.js
          grep -Fq "version:'1.8.4'" renko/renko-v15-method-controller-v181.js
          grep -Fq 'TARGET=60' renko/renko-v15-method-controller-v181.js
          grep -Fq 'APPLY_DEBOUNCE=0' renko/renko-v15-method-controller-v181.js
          grep -Fq 'DAY_WINDOWS=[3,7,14,30]' renko/renko-v15-method-controller-v181.js
          grep -Fq "historyContract:'daily-binance-vision-aggTrades-fill-at-least-60-confirmed-when-mathematically-available'" renko/renko-v15-method-controller-v181.js
          grep -Fq "interactionContract:'active-number-edit-never-waits-for-network-before-local-render'" renko/renko-v15-method-controller-v181.js
          grep -Fq "latencyContract:'zero-artificial-input-wait-local-hot-replay-then-exact-background'" renko/renko-v15-method-controller-v181.js
          grep -Fq "new Worker('renko-v15-deep-history-worker-v181.js?v=184')" renko/renko-v15-method-controller-v181.js
          grep -Fq 'hotReplayCache=new Map()' renko/renko-v15-method-controller-v181.js
          grep -Fq "r.dataset.inputWaitMs='0'" renko/renko-v15-method-controller-v181.js
          grep -Fq 'r.dataset.noBlankFrame=' renko/renko-v15-method-controller-v181.js
          grep -Fq 'data/spot/daily/aggTrades' renko/renko-v15-deep-history-worker-v181.js
          grep -Fq 'CONCURRENCY=4' renko/renko-v15-deep-history-worker-v181.js
          grep -Fq 'Always retain excursions' renko/renko-v15-deep-history-worker-v181.js
          ! grep -Fq '/api/v3/klines?' renko/renko-v15-deep-history-worker-v181.js
          grep -Fq 'const isWorker=' renko/renko-v15-worker.js
          grep -Fq "dataset.renkoMethodBootstrap='184'" renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-method-controller-v181.js?v=184' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'v15.16-zero-wait-hot-replay' renko/renko-v15-controller-bootstrap.js
          grep -Fq "renkoController:'184'" legacy-canonical.js
          grep -Fq 'Never serve the cached V14 source/resolution UI' rwa-sw-v5.js
          grep -Fq 'TARGET_VISIBLE=46' tools/renko-production-report.mjs
          git diff --check

      - name: Tick formation and WICKS unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV15Engine,ticks=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,150])});
          if(r.bricks.length!==5||r.bricks.at(-1).close!==150)throw Error('single trade must lock five bricks immediately');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,110,120,100,90])});
          if(r.bricks.length!==4||!r.bricks[2].isReversal||r.bricks[2].open!==110||r.bricks[2].close!==100)throw Error('2-box reversal failed');
          r=E.buildTicks({method:'percentage',percentage:.01,ltpSnapshot:100,tickSize:.01,wicks:true,ticks:ticks([100,101,102,99,98])});
          if(Math.abs(r.box-1)>.001||r.audit?.ok!==true)throw Error('SOL-like percentage box assignment failed');
          const on=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,99,110])});
          const off=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,99,110])});
          if(!(on.bricks[0].low<Math.min(on.bricks[0].open,on.bricks[0].close)))throw Error('WICKS ON failed to retain excursion');
          if(off.bricks[0].low!==Math.min(off.bricks[0].open,off.bricks[0].close))throw Error('WICKS OFF failed to remove excursion');
          console.log('RENKO TICK + WICKS MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance - zero-wait edits, SOL methods and WICKS
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/renko-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || true; sleep 1; done
          RENKO_TEST_BASE='http://127.0.0.1:8080/' node tools/renko-v15-methods-v181.mjs

      - name: Remove test-only dependencies
        run: rm -rf node_modules package-lock.json

      - name: Stamp RENKO exact deployed SHA
        run: printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: verify-renko-tick-only
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO V15.16 Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  production-browser-report:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Wait for exact RENKO Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/renko-deployment-sha.txt?v=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          echo "RENKO_LIVE_EXACT_SHA=PASS:$GITHUB_SHA"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open live production, screenshot desktop/mobile, and gate immediate first screen
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa/
        run: node tools/renko-production-report.mjs

      - name: Upload production screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-production-report-${{ github.sha }}
          path: artifacts/renko-production-report
          if-no-files-found: warn
          retention-days: 7
