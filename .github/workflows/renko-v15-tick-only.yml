name: RENKO V15.19 All Methods Instant Apply Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "legacy-canonical.js"
      - "tools/build-renko-first-frame-preload.mjs"
      - "tools/renko-production-report.mjs"
      - ".github/workflows/renko-v15-tick-only.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RENKO_SEED_CACHE_KEY: renko-sol-v185-seed-20260827

concurrency:
  group: "renko-tick-only-pages"
  cancel-in-progress: true

jobs:
  verify-renko-first-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin V186 instant Apply runtime
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'renko-v15-controller-bootstrap.js?v=186' renko/index.html
          grep -Fq 'renko-v15-mobile-first-frame.css?v=186' renko/index.html

      - name: Static tick-only and all-method instant contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v15.js
          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15-first-frame-preload.js
          node --check renko/renko-v15-method-controller-v186.js
          node --check renko/renko-v15-controller-bootstrap.js
          node --check tools/build-renko-first-frame-preload.mjs
          node --check tools/renko-production-report.mjs
          node --check legacy-canonical.js
          test -s renko/renko-v15-mobile-first-frame.css
          ! grep -Eqi 'id="[^"]*(resolution|timeframe)|>RESOLUTION<|1 minute</option>|3 minutes</option>|5 minutes</option>|15 minutes</option>|30 minutes</option>|1 hour</option>|4 hours</option>|1 day</option>' renko/index.html
          ! grep -Fq '/api/v3/klines?' renko/renko-v15.js
          grep -Fq "formationSource:'trade-events-only'" renko/renko-v15.js
          grep -Fq "confirmationRule:'every-trade-immediate'" renko/renko-v15.js
          grep -Fq "dataset.renkoMethodBootstrap='186'" renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-method-controller-v186.js?v=186' renko/renko-v15-controller-bootstrap.js
          grep -Fq 'renko-v15-first-frame-preload.js?v=186' renko/renko-v15-controller-bootstrap.js
          grep -Fq "renkoController:'186'" legacy-canonical.js
          grep -Fq 'renko-v15-mobile-first-frame.css?v=186' legacy-canonical.js
          grep -Fq "version:'1.9.0'" renko/renko-v15-method-controller-v186.js
          grep -Fq "FIRST_SCREEN=46" renko/renko-v15-method-controller-v186.js
          grep -Fq "APPLY_DEBOUNCE=0" renko/renko-v15-method-controller-v186.js
          grep -Fq 'instant-first-frame-apply-no-blocking-history' renko/renko-v15-method-controller-v186.js
          grep -Fq 'TARGET_VISIBLE=46' tools/renko-production-report.mjs
          grep -Fq "requiredNoLoadingAfterApply:true" tools/renko-production-report.mjs
          git diff --check

      - name: Tick formation and WICKS unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV15Engine,ticks=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,150])});
          if(r.bricks.length!==5||r.bricks.at(-1).close!==150)throw Error('single trade multi-brick failed');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,110,120,100,90])});
          if(r.bricks.length!==4||!r.bricks[2].isReversal)throw Error('2-box reversal failed');
          const on=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,99,110])});
          const off=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,99,110])});
          if(!(on.bricks[0].low<Math.min(on.bricks[0].open,on.bricks[0].close)))throw Error('WICKS ON failed');
          if(off.bricks[0].low!==Math.min(off.bricks[0].open,off.bricks[0].close))throw Error('WICKS OFF failed');
          console.log('RENKO TICK + WICKS MATRIX PASS');
          NODE

      - name: Restore SOL first-frame seed cache
        id: seed-cache
        uses: actions/cache@v4
        with:
          path: renko/preload/SOLUSDT.json
          key: ${{ env.RENKO_SEED_CACHE_KEY }}

      - name: Restore previously verified SOL seed
        if: steps.seed-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/renko-seed-zip /tmp/renko-seed-site renko/preload
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9638529318/zip" -o /tmp/renko-seed.zip || true
          if [ -s /tmp/renko-seed.zip ]; then
            unzip -q /tmp/renko-seed.zip -d /tmp/renko-seed-zip
            tar -xf /tmp/renko-seed-zip/artifact.tar -C /tmp/renko-seed-site
            cp /tmp/renko-seed-site/renko/preload/SOLUSDT.json renko/preload/SOLUSDT.json
          fi

      - name: Build or validate SOL deploy-time tick seed
        env:
          RENKO_PRELOAD_SYMBOL: SOLUSDT
          RENKO_PRELOAD_DAYS: 30
          RENKO_PRELOAD_KEEP: 140
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s renko/preload/SOLUSDT.json ]; then node tools/build-renko-first-frame-preload.mjs; fi
          node - <<'NODE'
          const p=require('./renko/preload/SOLUSDT.json');
          const one=p.seeds.find(x=>Math.abs(x.box-1)<.02),ten=p.seeds.find(x=>Math.abs(x.box-10)<.2);
          if(!one||one.bricks<46||!ten||ten.bricks<46)throw Error('SOL box 1/10 first-screen seed missing');
          console.log('FIRST_FRAME_SEEDS',{one:[one.box,one.bricks,one.ticks.length],ten:[ten.box,ten.bricks,ten.ticks.length]});
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fresh local screenshots — ATR Traditional Percentage must all be instant
        env:
          RWA_TEST_URL: http://127.0.0.1:8080/rwa/
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-first-frame
          mkdir -p /tmp/renko-first-frame/rwa
          cp -a . /tmp/renko-first-frame/rwa/
          cd /tmp/renko-first-frame
          python3 -m http.server 8080 >/tmp/renko-first-frame-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE"
          node tools/renko-production-report.mjs

      - name: Remove test-only dependencies
        run: rm -rf node_modules package-lock.json

      - name: Stamp RENKO exact deployed SHA
        run: printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Upload local screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-local-all-methods-${{ github.sha }}
          path: artifacts/renko-production-report
          if-no-files-found: warn
          retention-days: 7

  deploy:
    needs: verify-renko-first-frame
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO V15.19 Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  production-browser-report:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Wait for exact RENKO Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/renko-deployment-sha.txt?v=${GITHUB_RUN_ID}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          echo "RENKO_LIVE_EXACT_SHA=PASS:$GITHUB_SHA"

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Open live production — gate all three methods desktop/mobile
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa/
        run: node tools/renko-production-report.mjs

      - name: Upload production screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renko-production-all-methods-${{ github.sha }}
          path: artifacts/renko-production-report
          if-no-files-found: warn
          retention-days: 7
