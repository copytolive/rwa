name: Renko Universe Consistency Public Probe

on:
  push:
    branches: [main]
    paths:
      - "renko-universe-probe-requests/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^renko-universe-probe-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=renko-universe-probe-responses/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Controlled universe probe
        env:
          ID: ${{ steps.req.outputs.id }}
          OUT: ${{ steps.req.outputs.out }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renko-universe-probe-responses
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BASE="https://copytolive.com/api/charting/hyperliquid"
          rid=os.environ["ID"]; out=os.environ["OUT"]
          def get_json(url, timeout=30):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 CopyToLive-AI2-Probe","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return getattr(r,"status",200), json.load(r)
          st,u=get_json(BASE+"/renko-universe",30)
          pairs=u.get("pairs") or []
          syms=[p.get("symbol") for p in pairs if p.get("symbol")]

          def check(sym):
              url=f"{BASE}/renko/{urllib.parse.quote(sym)}?limit=2&smaPeriod=10&sma=10"
              attempts=[]
              for n in range(1,4):
                  t=time.time()
                  try:
                      status,data=get_json(url,30)
                      returned=len(data.get("candles") or [])
                      attempts.append({"n":n,"status":status,"returned":returned,"seconds":round(time.time()-t,3),"error":data.get("error","")})
                      if status==200 and returned>0:
                          return {"symbol":sym,"ok":True,"status":status,"returned":returned,"attempts":attempts}
                      if status==404:
                          return {"symbol":sym,"ok":False,"status":status,"returned":returned,"error":data.get("error",""),"attempts":attempts}
                  except urllib.error.HTTPError as e:
                      try: body=e.read().decode("utf-8","replace"); data=json.loads(body)
                      except Exception: data={}
                      attempts.append({"n":n,"status":e.code,"returned":len(data.get("candles") or []),"seconds":round(time.time()-t,3),"error":data.get("error","") or str(e)})
                      if e.code==404:
                          return {"symbol":sym,"ok":False,"status":404,"returned":0,"error":data.get("error","") or str(e),"attempts":attempts}
                  except Exception as e:
                      attempts.append({"n":n,"status":0,"returned":0,"seconds":round(time.time()-t,3),"error":str(e)})
                  time.sleep(0.7*n)
              last=attempts[-1]
              return {"symbol":sym,"ok":False,"status":last["status"],"returned":last["returned"],"error":last["error"],"attempts":attempts}

          results=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs=[ex.submit(check,s) for s in syms]
              for f in as_completed(futs): results.append(f.result())
          results.sort(key=lambda x: syms.index(x["symbol"]))
          failed=[x for x in results if not x["ok"]]
          persistent404=[x for x in failed if x["status"]==404]
          transient=[x for x in failed if x["status"]!=404]
          cats={}
          for p in pairs: cats[p.get("category","unknown")]=cats.get(p.get("category","unknown"),0)+1
          doc={
            "ok": len(failed)==0,
            "id":rid,
            "universeStatus":st,
            "universeTotal":len(syms),
            "categories":cats,
            "success":len(results)-len(failed),
            "failedCount":len(failed),
            "persistent404Count":len(persistent404),
            "transientFailureCount":len(transient),
            "persistent404":persistent404,
            "transientFailures":transient,
            "results":results
          }
          with open(out,"w") as fp: json.dump(doc,fp,indent=2)
          print(json.dumps({k:doc[k] for k in ["universeTotal","success","failedCount","persistent404Count","transientFailureCount"]},indent=2))
          print("PERSISTENT_404="+json.dumps([x["symbol"] for x in persistent404]))
          print("TRANSIENT_FAILURES="+json.dumps([{"symbol":x["symbol"],"status":x["status"]} for x in transient]))
          PY
      - name: Commit response
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          test -s "$OUT"
          git config user.name "CopyToLive Renko Universe Probe"
          git config user.email "copytolive-renko-universe-probe@local.invalid"
          git add "$OUT"
          git commit -m "renko universe probe: ${{ steps.req.outputs.id }}" || true
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
