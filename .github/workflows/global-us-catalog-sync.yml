name: Global US Catalog Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-us-catalog-sync.yml'
      - 'tools/sync-sec-us-catalog.mjs'
permissions:
  contents: write
concurrency:
  group: global-us-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official SEC ticker/exchange associations
        run: |
          mkdir -p tmp/sec
          curl --fail --location --retry 4 --retry-delay 2 \
            -A 'RWA-Global-Asset-Terminal/1.0 (+https://github.com/narzulalistiqlal/rwa)' \
            -o tmp/sec/company_tickers_exchange.json \
            https://www.sec.gov/files/company_tickers_exchange.json
      - name: Normalize US issuer catalog
        run: node tools/sync-sec-us-catalog.mjs tmp/sec/company_tickers_exchange.json
      - name: Accuracy and provenance gate
        run: node tools/global-data-audit.mjs
      - name: Commit official-source catalog update
        run: |
          if git diff --quiet -- data/global/security-master.json; then
            echo 'No catalog change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/global/security-master.json
          git commit -m 'data: sync official SEC US issuer catalog'
          git push
