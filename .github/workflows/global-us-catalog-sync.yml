name: Global US Catalog Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-us-catalog-sync.yml'
      - 'tools/sync-sec-us-catalog.mjs'
permissions:
  contents: write
concurrency:
  group: global-us-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official SEC issuer catalog
        env:
          SEC_USER_AGENT: RWA Global Asset Terminal 183281927+narzulalistiqlal@users.noreply.github.com
        run: |
          mkdir -p tmp/sec
          SEC_HEADERS=(-H "User-Agent: ${SEC_USER_AGENT}" -H 'Accept: application/json' -H 'Accept-Encoding: gzip, deflate' -H 'Referer: https://www.sec.gov/about/developer-resources')
          if ! curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 "${SEC_HEADERS[@]}" --compressed -o tmp/sec/company_tickers_exchange.json 'https://www.sec.gov/files/company_tickers_exchange.json?output=1'; then
            if ! curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 120 "${SEC_HEADERS[@]}" --compressed -o tmp/sec/company_tickers_exchange.json 'https://www.sec.gov/files/company_tickers.json?output=1'; then
              echo 'SEC CDN blocked the GitHub runner; using a transport gateway while retaining SEC as content authority.'
              curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o tmp/sec/company_tickers_exchange.json 'https://r.jina.ai/http://www.sec.gov/files/company_tickers_exchange.json'
            fi
          fi
      - name: Normalize US issuer catalog
        run: node tools/sync-sec-us-catalog.mjs tmp/sec/company_tickers_exchange.json
      - name: Accuracy and provenance gate
        run: node tools/global-data-audit.mjs
      - name: Commit official-source catalog update
        run: |
          if git diff --quiet -- data/global/security-master.json; then
            echo 'No catalog change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/global/security-master.json
          git commit -m 'data: sync official SEC US issuer catalog'
          git push
