name: RENKO GOLD Total History Transport Smoke

on:
  push:
    branches:
      - feat/renko-gold-total-history-2003-2026
    paths:
      - '.github/workflows/renko-gold-total-history-transport-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  month-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build August 2026 canonical month with bounded RAM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          python3 - <<'PY'
          import datetime as dt, importlib.util, json, pathlib
          p='scripts/renko_gold_full_backfill.py'
          spec=importlib.util.spec_from_file_location('gold',p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          info=m.build_month(2026,8,pathlib.Path('smoke'),'bid',dt.datetime(2026,8,1,tzinfo=dt.timezone.utc),dt.datetime(2026,8,28,23,59,59,tzinfo=dt.timezone.utc),12)
          assert info and info['barCount']>100000 and info['assetSha256']
          pathlib.Path('smoke/info.json').write_text(json.dumps(info,indent=2)+'\n')
          print('GOLD_MONTH_TRANSPORT_BUILD_PASS',json.dumps(info,separators=(',',':')))
          PY
      - name: Upload month to lightweight Release store
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload renko-gold-history-v1 smoke/xauusd-s1-2026-08.csv.gz --clobber
      - name: Verify Release bytes and gzip locally
        shell: bash
        run: |
          set -euo pipefail
          URL='https://github.com/copytolive/rwa/releases/download/renko-gold-history-v1/xauusd-s1-2026-08.csv.gz'
          curl -fL --retry 5 --retry-delay 2 "$URL" -o /tmp/public.csv.gz
          test "$(sha256sum /tmp/public.csv.gz | awk '{print $1}')" = "$(python3 -c 'import json;print(json.load(open("smoke/info.json"))["assetSha256"])')"
          gzip -t /tmp/public.csv.gz
          echo "GOLD_RELEASE_BYTE_PASS $(stat -c%s /tmp/public.csv.gz) bytes"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser-origin CORS transport candidate proof
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();
          page.on('console',m=>console.log('BROWSER_CONSOLE',m.type(),m.text()));
          await page.goto('https://copytolive.github.io/rwa/renko/?goldTransportSmoke=3',{waitUntil:'domcontentloaded',timeout:60000});
          const result=await page.evaluate(async()=>{
            const release=await fetch('https://api.github.com/repos/copytolive/rwa/releases/tags/renko-gold-history-v1',{cache:'no-store'});
            if(!release.ok)throw new Error(`release metadata ${release.status}`);
            const meta=await release.json();
            const asset=(meta.assets||[]).find(a=>a.name==='xauusd-s1-2026-08.csv.gz');
            if(!asset?.browser_download_url)throw new Error('release asset missing');
            const candidates=[
              {name:'browser_download_url',url:asset.browser_download_url},
              {name:'release_direct',url:'https://github.com/copytolive/rwa/releases/download/renko-gold-history-v1/xauusd-s1-2026-08.csv.gz'},
              {name:'asset_api_no_accept',url:asset.url}
            ];
            const diagnostics=[];
            for(const c of candidates){
              try{
                const r=await fetch(c.url,{cache:'no-store',redirect:'follow'});
                const ab=await r.arrayBuffer();
                const bytes=new Uint8Array(ab);
                diagnostics.push({name:c.name,ok:r.ok,status:r.status,type:r.type,url:r.url,bytes:bytes.length,contentType:r.headers.get('content-type'),acao:r.headers.get('access-control-allow-origin'),b0:bytes[0],b1:bytes[1]});
                if(r.ok&&bytes.length>1000&&bytes[0]===0x1f&&bytes[1]===0x8b){
                  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
                  const text=await new Response(stream).text();
                  const lines=text.trim().split('\n');
                  return {winner:c.name,assetId:asset.id,status:r.status,bytes:bytes.length,rows:lines.length-1,header:lines[0],first:lines[1],last:lines.at(-1),diagnostics};
                }
              }catch(e){diagnostics.push({name:c.name,error:String(e)});}
            }
            throw new Error('NO_BROWSER_CORS_TRANSPORT '+JSON.stringify(diagnostics));
          });
          if(result.header!=='unix_second,open_tick,high_tick,low_tick,close_tick'||result.rows<100000)throw new Error(JSON.stringify(result));
          console.log('GOLD_BROWSER_TRANSPORT_FETCH_PASS',JSON.stringify(result));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-total-history-transport-smoke
          path: smoke/info.json
          retention-days: 30
