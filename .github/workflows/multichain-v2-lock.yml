name: MULTI CHAIN V3 Lock

on:
  push:
    branches:
      - main
      - fix/multichain-tuntas-v3-20260828
      - feat/multichain-real-execution-fees-v3-20260828
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify certified MULTI CHAIN V3 semantic lock
        shell: bash
        run: |
          set -euxo pipefail
          for f in \
            rwa-multichain.js rwa-multichain-engine.js rwa-multichain-registry.json \
            rwa-multichain-revenue.json rwa-multichain-funding.json \
            launch/multichain-receipts.json launch/multichain-readiness.json \
            tools/multichain-contract.mjs tools/multichain-revenue-contract.mjs \
            tools/multichain-receipt-matrix.mjs tools/multichain-mainnet-gate.mjs \
            tools/multichain-browser.mjs tools/multichain-tuntas-browser.mjs \
            .github/multichain-v2.lock; do test -s "$f"; done

          node --check rwa-multichain.js
          node --check rwa-multichain-engine.js
          node --check tools/multichain-contract.mjs
          node --check tools/multichain-revenue-contract.mjs
          node --check tools/multichain-receipt-matrix.mjs
          node --check tools/multichain-mainnet-gate.mjs
          node --check tools/multichain-browser.mjs
          node --check tools/multichain-tuntas-browser.mjs
          python -m json.tool rwa-multichain-registry.json >/dev/null
          python -m json.tool rwa-multichain-revenue.json >/dev/null
          python -m json.tool rwa-multichain-funding.json >/dev/null
          python -m json.tool launch/multichain-receipts.json >/dev/null
          python -m json.tool launch/multichain-readiness.json >/dev/null

          grep -Fq 'MULTICHAIN_V3_LOCK=1' .github/multichain-v2.lock
          grep -Fq 'revision=3.0.0-tuntas' .github/multichain-v2.lock
          grep -Fq 'policy=chain-abstraction-fail-closed-v2' .github/multichain-v2.lock
          grep -Fq 'receipt_matrix=real-receipts-required-v1' .github/multichain-v2.lock
          grep -Fq 'mainnet_gate=global-and-multichain' .github/multichain-v2.lock
          grep -Fq 'provider_fees=approval-required' .github/multichain-v2.lock
          grep -Fq 'hyperliquid_funding=provider-validation-required' .github/multichain-v2.lock
          grep -Fq 'first_paint_external_scripts=6' .github/multichain-v2.lock
          grep -Fq 'no_second_exchange_write_path=1' .github/multichain-v2.lock

          grep -Fq "REVISION='3.0.0-tuntas'" rwa-multichain.js
          grep -Fq "const REVISION='3.0.0-tuntas'" rwa-multichain-engine.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v2'" rwa-multichain.js
          grep -Fq 'rwa_multichain_lifecycle_v3' rwa-multichain-engine.js
          grep -Fq 'simulateTransaction' rwa-multichain-engine.js
          grep -Fq 'eth_getTransactionReceipt' rwa-multichain-engine.js
          grep -Fq 'prepareHyperliquidFunding' rwa-multichain-engine.js
          ! grep -Fq 'ExchangeClient' rwa-multichain-engine.js
          ! grep -Eq "api\.hyperliquid(?:-testnet)?\.xyz/exchange|['\"]\/exchange['\"]" rwa-multichain-engine.js

          node tools/multichain-contract.mjs
          node tools/multichain-revenue-contract.mjs
          node tools/multichain-receipt-matrix.mjs
          node tools/multichain-mainnet-gate.mjs --write

          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('launch/multichain-readiness.json','utf8'));
          if(r.ready!==false||r.status!=='BLOCKED')throw Error('real provider/receipt gates must remain fail-closed until evidence is supplied');
          if(!Array.isArray(r.blockers)||r.blockers.length<1)throw Error('blocked readiness must explain real blockers');
          console.log('MULTICHAIN_V3_LOCK=PASS');
          console.log('External receipt/provider gates remain truthfully BLOCKED');
          NODE
