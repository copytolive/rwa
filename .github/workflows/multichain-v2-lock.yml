name: MULTI CHAIN V4 Lock

on:
  push:
    branches: ["main"]
    paths:
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "launch/multichain-readiness.json"
      - "launch/multichain-receipts.json"
      - "launch/readiness.json"
      - ".github/multichain-v2.lock"
      - ".github/workflows/multichain-v2-lock.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify MULTI CHAIN runtime and truthful mainnet lock
        shell: bash
        run: |
          set -euo pipefail
          for f in rwa-multichain.js rwa-multichain-engine.js rwa-multichain-registry.json launch/readiness.json .github/multichain-v2.lock; do test -s "$f"; done
          node --check rwa-multichain.js
          node --check rwa-multichain-engine.js
          python -m json.tool rwa-multichain-registry.json >/dev/null
          python -m json.tool launch/readiness.json >/dev/null

          grep -Fq 'MULTICHAIN_V4_LOCK=1' .github/multichain-v2.lock
          grep -Fq 'revision=3.0.0-tuntas' .github/multichain-v2.lock
          grep -Fq 'policy=chain-abstraction-fail-closed-v2' .github/multichain-v2.lock
          grep -Fq 'receipt_matrix=real-receipts-required-v1' .github/multichain-v2.lock
          grep -Fq 'mainnet_gate=global-and-multichain' .github/multichain-v2.lock
          grep -Fq 'no_second_exchange_write_path=1' .github/multichain-v2.lock

          grep -Fq "REVISION='3.0.0-tuntas'" rwa-multichain.js
          grep -Fq "const REVISION='3.0.0-tuntas'" rwa-multichain-engine.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v2'" rwa-multichain.js
          grep -Fq 'rwa_multichain_lifecycle_v3' rwa-multichain-engine.js
          grep -Fq 'simulateTransaction' rwa-multichain-engine.js
          grep -Fq 'eth_getTransactionReceipt' rwa-multichain-engine.js
          ! grep -Fq 'ExchangeClient' rwa-multichain-engine.js

          node - <<'NODE'
          const fs=require('fs');
          const reg=JSON.parse(fs.readFileSync('rwa-multichain-registry.json','utf8'));
          if(reg.policy!=='chain-abstraction-fail-closed-v2') throw Error('policy mismatch');
          if(!Array.isArray(reg.networks)||reg.networks.length!==9) throw Error('expected 9 networks');
          const ids=reg.networks.map(x=>x.id);
          for(const id of ['hyperliquid','arbitrum','ethereum','base','solana','bnb','polygon','avalanche','monad']) if(!ids.includes(id)) throw Error('missing '+id);
          const launch=JSON.parse(fs.readFileSync('launch/readiness.json','utf8'));
          if(launch.mainnet_ready!==false||launch.status!=='BLOCKED') throw Error('unrestricted mainnet must remain locked');
          if(launch.multichain?.ready!==false||launch.multichain?.status!=='BLOCKED') throw Error('MULTI CHAIN mainnet readiness must remain blocked');
          console.log('MULTICHAIN_V4_LOCK_PASS');
          console.log('Runtime certified on 9 networks; unrestricted mainnet remains evidence-gated');
          NODE
