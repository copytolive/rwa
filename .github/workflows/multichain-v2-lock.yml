name: MULTI CHAIN V2 Lock

on:
  push:
    branches:
      - main
      - lock/multichain-v2-final-20260828
      - feat/multichain-real-execution-fees-v3-20260828
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify certified MULTI CHAIN files and isolated index bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          expected={
            'rwa-multichain.js':'da22864a22fcad143dae4a903c46538e5557c50b5adb3bea01312e97d33e0185',
            'rwa-multichain-engine.js':'95459fe655787a27c7e4ffbbcaf4c952574fa8f1a8c2cf0c9c1c53e182ced40a',
            'rwa-multichain-registry.json':'f1c0b179dd8d4f5ae75e28c48ea5a6aa61f663208c257da4b4ffc79cf20c8962',
            'tools/multichain-browser.mjs':'068c54ca1d8131b4a872a9fe8f626637af4c5b544790d1700ff151199b45bd7e',
            '.github/workflows/multichain-browser.yml':'8a67ce65300c69b2db1bd56820ec5bfa3d94e69f0f254233a32ac96681c32b7d',
            'rwa-multichain-revenue.json':'57456ee7a8f6b735797cb59441359832cdd69da6fe84ef9f1f6812fcd1778882',
            'tools/multichain-revenue-contract.mjs':'f1857c42cc1eb08a928af7a4920b3133e3cce733be9abc5d34c1a386d18c24c1',
            '.github/workflows/multichain-revenue-gate.yml':'f18ef8780b1c4e07a4216f8e9d0153f6558361b65cb75e51d84317a3bdf3ad90',
          }
          bad=[]
          for p,want in expected.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              if got!=want: bad.append(f'{p}: {got} != {want}')
          ix=Path('index.html').read_text()
          m=re.search(r'(<style id="rwaMultiChainLauncherBootstrapStyle">.*?<script id="rwaMultiChainLazyBootstrap">.*?</script>)',ix,re.S)
          if not m:
              bad.append('index.html: MULTI CHAIN bootstrap block missing')
          else:
              got=hashlib.sha256(m.group(1).encode()).hexdigest()
              want='b1b990af7e3db7454963cee21c5ae322fe96fa34779dd8bb315eb77598c1a2a6'
              if got!=want: bad.append(f'index MULTI CHAIN bootstrap: {got} != {want}')
          lock=Path('.github/multichain-v2.lock').read_text()
          required=('MULTICHAIN_V2_LOCK=1','MULTICHAIN_REVENUE_V3_LOCK=1','policy=chain-abstraction-fail-closed-v2','revenue_policy=provider-confirmed-visible-fee-fail-closed-v1')
          for marker in required:
              if marker not in lock: bad.append(f'.github/multichain-v2.lock: missing {marker}')
          if bad:
              raise SystemExit('MULTICHAIN_V2_LOCK=FAIL\n'+'\n'.join(bad))
          print('MULTICHAIN_V2_LOCK=PASS')
          print('MULTICHAIN_REVENUE_V3_LOCK=PASS')
          print('Protected paths: runtime, engine, registry, browser proof, production workflow, revenue config/contract/gate, isolated index bootstrap')
          PY
