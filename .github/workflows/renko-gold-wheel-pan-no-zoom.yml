# Exact-SHA regression for physical/mixed-trackpad GOLD back-scroll plus intentional zoom.
name: RENKO GOLD Pan Lock + Explicit Zoom

on:
  push:
    branches:
      - main
      - fix/renko-gold-prepend-before-pan-20260902
    paths:
      - 'renko/**'
      - 'scripts/renko_gold_wheel_pan_no_zoom_proof.mjs'
      - '.github/workflows/renko-gold-wheel-pan-no-zoom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static pan-lock and explicit-zoom guard
        run: |
          set -euo pipefail
          node --check renko/renko-gold-wheel-pan-lock.js
          node --check renko/renko-gold-explicit-zoom.js
          node --check renko/renko-gold-manual-viewport-lock.js
          node --check scripts/renko_gold_wheel_pan_no_zoom_proof.mjs
          grep -Fq 'renko-gold-explicit-zoom.js?v=1' renko/index.html
          grep -Fq 'renko-gold-wheel-pan-lock.js?v=1' renko/index.html
          grep -Fq "version:'1.0.0-explicit-zoom'" renko/renko-gold-explicit-zoom.js
          grep -Fq "implementation:'1.1.0-controller-owned-zoom'" renko/renko-gold-explicit-zoom.js
          grep -Fq 'Ctrl/Meta pinch zoom' renko/renko-gold-explicit-zoom.js
          grep -Fq '4.3.0-pan-spacing-authority' renko/renko-gold-manual-viewport-lock.js
          grep -Fq 'mouseWheel:false' renko/renko-gold-wheel-pan-lock.js
          grep -Fq 'handleScroll:{mouseWheel:false}' renko/renko-gold-wheel-pan-lock.js
          grep -Fq 'passive:false' renko/renko-gold-wheel-pan-lock.js
          grep -Fq 'stopImmediatePropagation' renko/renko-gold-wheel-pan-lock.js
          grep -Fq '2.1.0-dense-fixed-width-logical-pan' renko/renko-gold-wheel-pan-lock.js
          grep -Fq 'setVisibleLogicalRange' renko/renko-gold-wheel-pan-lock.js
          ! grep -Fq 'scrollToPosition' renko/renko-gold-wheel-pan-lock.js
          grep -Fq "version:'1.3.0-full-prepend-size-lock'" renko/renko-gold-wheel-pan-lock.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve branch at production-equivalent path
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-wheel-site
          mkdir -p /tmp/renko-wheel-site/rwa
          ln -s "$GITHUB_WORKSPACE/renko" /tmp/renko-wheel-site/rwa/renko
          cd /tmp/renko-wheel-site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/renko-wheel-http.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/rwa/renko/ >/dev/null && exit 0; sleep .25; done
          cat /tmp/renko-wheel-http.log
          exit 1
      - name: Traditional 10 pan stays locked while zoom remains functional
        env:
          RENKO_BASE_URL: http://127.0.0.1:4173/rwa/renko/
          RENKO_OUTPUT_DIR: artifacts/branch-pan-and-zoom
        run: node scripts/renko_gold_wheel_pan_no_zoom_proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-gold-pan-and-zoom-branch-${{ github.sha }}
          path: artifacts/branch-pan-and-zoom
          if-no-files-found: warn

  public-production:
    if: github.ref == 'refs/heads/main'
    needs: branch-local
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait until Pages contains exact zoom-fix SHA
        run: |
          set -euo pipefail
          for i in {1..180}; do
            zoomjs="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/renko-gold-explicit-zoom.js?zoom=$RANDOM" 2>/dev/null || true)"
            panjs="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/renko-gold-wheel-pan-lock.js?pan=$RANDOM" 2>/dev/null || true)"
            sha="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?zoom=$RANDOM" 2>/dev/null | tr -d '\r\n' || true)"
            if printf '%s' "$zoomjs" | grep -Fq "1.1.0-controller-owned-zoom" && printf '%s' "$panjs" | grep -Fq "2.1.0-dense-fixed-width-logical-pan" && [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && [ "$sha" = "$GITHUB_SHA" ]; then echo "RENKO_GOLD_PAN_ZOOM_PUBLIC_EXACT_SHA_PASS $sha"; exit 0; fi
            sleep 5
          done
          echo "Pages did not publish exact pan+zoom SHA $GITHUB_SHA"
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Public Traditional 10 pan locked and zoom functional
        env:
          RENKO_BASE_URL: https://copytolive.github.io/rwa/renko/
          RENKO_EXPECTED_SHA: ${{ github.sha }}
          RENKO_OUTPUT_DIR: artifacts/public-pan-and-zoom
        run: node scripts/renko_gold_wheel_pan_no_zoom_proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-gold-pan-and-zoom-public-${{ github.sha }}
          path: artifacts/public-pan-and-zoom
          if-no-files-found: warn
