name: AI3 Nav DOM Diagnostic
on:
  push:
    branches: [main]
    paths: ["ai3-nav-dom-diag-requests/**"]
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          F="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-nav-dom-diag-requests/.*json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$F")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - name: Run DOM diagnostic
        env:
          OUT: ai3-nav-dom-diag-results/${{ steps.req.outputs.id }}.json
        shell: bash
        run: |
          pip install --quiet websocket-client
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9781 --remote-allow-origins=* about:blank >/tmp/diag.out 2>/tmp/diag.err &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          python3 tools/ai3_nav_dom_diag.py
      - name: Commit
        shell: bash
        run: |
          git config user.name "AI3 DOM Diag";git config user.email "ai3@local.invalid"
          git add ai3-nav-dom-diag-results
          git commit -m "ai3 nav dom diag: ${{ steps.req.outputs.id }}"
          for i in 1 2 3 4 5; do git fetch origin main; git rebase origin/main || { git rebase --abort || true;sleep $i;continue; }; git push origin HEAD:main && exit 0;sleep $i;done;exit 1
