name: VectorForge Tick Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build upstream tick-file catalog
        run: python backtest/scripts/build_tick_manifest.py
      - name: Commit catalog if changed
        run: |
          git config user.name "vectorforge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/data/tick_manifest.json
          if git diff --cached --quiet; then echo "Catalog unchanged."; else git commit -m "VectorForge: refresh tick catalog" && git push; fi
