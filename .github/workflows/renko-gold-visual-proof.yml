name: RENKO GOLD Visual Proof

on:
  push:
    branches:
      - main
    paths:
      - 'renko/.visual-proof-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            got="$(curl -fsS --max-time 10 "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then echo "VISUAL_PROOF_PUBLIC_SHA_PASS $got"; exit 0; fi
            sleep 5
          done
          echo 'Production SHA did not converge'; exit 1
      - name: Verify backtester uses public canonical dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/renko-proof /tmp/gold-reader-cache
          python3 - <<'PY'
          import datetime as dt,json,pathlib,sys,urllib.request
          sys.path.insert(0,'scripts')
          from renko_gold_canonical_reader import CanonicalGoldReader,WilderATRState
          url='https://copytolive.github.io/rwa/renko/history/gold/full-manifest.json'
          reader=CanonicalGoldReader.from_path_or_url(url,pathlib.Path('/tmp/gold-reader-cache'))
          with urllib.request.urlopen(url,timeout=60) as q: manifest=json.load(q)
          ident=reader.reproducibility_identity()
          assert manifest['backfillComplete'] is True
          assert ident['dataVersion']==manifest['dataVersion']
          assert ident['versionSha256']==manifest['versionSha256']
          assert len(ident['assets'])==len(manifest['months'])==281
          assert [x['assetSha256'] for x in ident['assets']]==[x['assetSha256'] for x in manifest['months']]
          state=WilderATRState(14); count=0; first=last=None; cross=None; prev_year=None
          for bar in reader.iter_bars(1735603200,1735862400):
              atr=state.update(bar)
              year=dt.datetime.fromtimestamp(bar.unix_second,dt.timezone.utc).year
              if first is None: first=bar.unix_second
              if prev_year is not None and year!=prev_year and cross is None:
                  cross={'second':bar.unix_second,'atrTicks':atr,'stateCount':state.count}
              prev_year=year; last=bar.unix_second; count+=1
          assert count>10000 and cross and cross['atrTicks'] is not None
          proof={
            'status':'PASS',
            'barsStreamed':count,
            'first':first,
            'last':last,
            'crossYear':cross,
            'dataVersion':ident['dataVersion'],
            'versionSha256':ident['versionSha256'],
            'assets':len(ident['assets'])
          }
          pathlib.Path('/tmp/renko-proof/backtest-proof.json').write_text(json.dumps(proof,separators=(',',':')))
          print('GOLD_VISUAL_BACKTEST_PROOF_PASS',json.dumps(proof,separators=(',',':')))
          PY
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Capture live production visual proof
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium,devices } from 'playwright';
          const backtest=JSON.parse(fs.readFileSync('/tmp/renko-proof/backtest-proof.json','utf8'));
          const browser=await chromium.launch({headless:true});
          async function capture(contextOptions,label,file){
            const page=await browser.newPage(contextOptions); const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`https://copytolive.github.io/rwa/renko/?gold=1&visualProof=1&v=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.RENKO_GOLD_ONLY===true&&document.documentElement.dataset.renkoGoldRecent==='true'&&window.RWARenkoTV?.state?.symbol==='XAUUSD'&&document.querySelector('#chartHost canvas'),{timeout:60000});
            const runtime=await page.evaluate(async()=>{
              const H=window.RWARenkoGoldTotalHistory,T=window.RWARenkoTV,m=await H.loadManifest(true);
              const origin=await H.decodeMonth(m.months[0]);
              await document.querySelector('#traditionalBox')?.focus();
              const traditionalInput=document.querySelector('#traditionalBox'); if(traditionalInput){traditionalInput.value='1';traditionalInput.dispatchEvent(new Event('input',{bubbles:true}));}
              document.querySelector('[data-apply-method="traditional"]')?.click();
              await new Promise(r=>setTimeout(r,250));
              const traditional={method:T.settings.method,box:Number(T.state.box),bars:T.state.closedBars.length};
              const atrInput=document.querySelector('#atrLength'); if(atrInput){atrInput.value='14';atrInput.dispatchEvent(new Event('input',{bubbles:true}));}
              document.querySelector('[data-apply-method="atr"]')?.click();
              await new Promise(r=>setTimeout(r,350));
              const atr={method:T.settings.method,box:Number(T.state.box),atrLength:Number(T.settings.atrLength),bars:T.state.closedBars.length};
              return {provider:m.provider,instrument:m.instrumentCode,symbol:m.symbol,interval:m.interval,side:m.priceSide,complete:m.backfillComplete,months:m.months.length,dataVersion:m.dataVersion,versionSha256:m.versionSha256,originSecond:origin.sec[0],latestSecond:m.months.at(-1).latestSecond,traditional,atr};
            });
            if(errors.length||!runtime.complete||runtime.months!==281||runtime.originSecond!==1052092863||runtime.traditional.method!=='traditional'||runtime.atr.method!=='atr'||backtest.status!=='PASS'||backtest.versionSha256!==runtime.versionSha256) throw new Error(JSON.stringify({label,runtime,backtest,errors}));
            await page.evaluate(({runtime,backtest,sha,label})=>{
              const old=document.getElementById('gold-proof-card'); if(old) old.remove();
              const d=new Date(runtime.originSecond*1000).toISOString(); const latest=new Date(runtime.latestSecond*1000).toISOString();
              const card=document.createElement('div'); card.id='gold-proof-card';
              card.style.cssText='position:fixed;z-index:2147483647;top:14px;right:14px;width:min(560px,calc(100vw - 28px));background:rgba(5,10,18,.96);color:#f4f7fb;border:1px solid #2d435a;border-radius:12px;padding:14px 16px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 10px 35px rgba(0,0,0,.45);white-space:normal';
              card.innerHTML=`<div style="font:700 15px/1.2 system-ui;margin-bottom:8px">RENKO GOLD — LIVE PRODUCTION PROOF (${label})</div><div>PUBLIC SHA: <b>${sha}</b></div><div>CANONICAL: <b>${runtime.provider} ${runtime.instrument} · ${runtime.interval} ${runtime.side}</b></div><div>FULL HISTORY: <b>${runtime.complete?'PASS':'FAIL'} · ${runtime.months} monthly packs</b></div><div>ORIGIN: <b>${d}</b> · latest ${latest}</div><div>DATA SHA256: <b>${runtime.versionSha256}</b></div><hr style="border:0;border-top:1px solid #24384b;margin:8px 0"><div>TRADITIONAL: <b>${runtime.traditional.method} · box ${runtime.traditional.box} · ${runtime.traditional.bars} loaded bars</b></div><div>ATR: <b>${runtime.atr.method} · len ${runtime.atr.atrLength} · box ${runtime.atr.box} · ${runtime.atr.bars} loaded bars</b></div><div>BACKTEST READER: <b>PASS · ${backtest.barsStreamed} streamed bars · ${backtest.assets} assets · SAME DATA SHA</b></div><div style="margin-top:8px;color:#9fd3ff">History is lazy/bounded in browser; backtester streams the same canonical monthly packs.</div>`;
              document.body.appendChild(card);
            },{runtime,backtest,sha:process.env.EXPECTED_SHA,label});
            await page.screenshot({path:file,fullPage:true});
            console.log('VISUAL_SCREENSHOT_PASS',label,file,JSON.stringify({runtime,backtest}));
            await page.close();
          }
          await capture({viewport:{width:1672,height:941}},'desktop','/tmp/renko-proof/renko-gold-production-desktop.png');
          await capture({...devices['iPhone 13']},'mobile','/tmp/renko-proof/renko-gold-production-mobile.png');
          await browser.close();
          NODE
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: renko-gold-visual-proof
          path: /tmp/renko-proof
          if-no-files-found: error
          retention-days: 7
