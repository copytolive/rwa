name: Import realworldasset total

on:
  push:
    branches:
      - chore/migrate-realworldasset-total-20260831
    paths:
      - .github/workflows/import-realworldasset-total.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical RWA branch
        uses: actions/checkout@v4
        with:
          ref: chore/migrate-realworldasset-total-20260831
          fetch-depth: 0

      - name: Clone source repository
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/copytolive/realworldasset.git "$RUNNER_TEMP/realworldasset"
          git -C "$RUNNER_TEMP/realworldasset" rev-parse HEAD | tee "$RUNNER_TEMP/source_sha"
          git -C "$RUNNER_TEMP/realworldasset" rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/source_tree_sha"

      - name: Import complete source tree
        run: |
          set -euo pipefail
          rm -rf apps/realworldasset
          mkdir -p apps/realworldasset
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/realworldasset/" apps/realworldasset/

      - name: Write migration manifest
        run: |
          set -euo pipefail
          SOURCE_SHA="$(cat "$RUNNER_TEMP/source_sha")"
          SOURCE_TREE_SHA="$(cat "$RUNNER_TEMP/source_tree_sha")"
          FILE_COUNT="$(find apps/realworldasset -type f | wc -l | tr -d ' ')"
          TOTAL_BYTES="$(find apps/realworldasset -type f -printf '%s\n' | awk '{s+=$1} END {print s+0}')"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('apps/realworldasset')
          rows = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              data = p.read_bytes()
              rows.append({
                  'path': p.relative_to(root).as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          digest = hashlib.sha256('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows).encode()).hexdigest()
          payload = {
              'sourceRepo': 'copytolive/realworldasset',
              'sourceSha': Path(os.environ['RUNNER_TEMP']).joinpath('source_sha').read_text().strip(),
              'sourceTreeSha': Path(os.environ['RUNNER_TEMP']).joinpath('source_tree_sha').read_text().strip(),
              'destinationRepo': 'copytolive/rwa',
              'destinationPath': 'apps/realworldasset',
              'canonicalPublicUrl': 'https://copytolive.github.io/rwa/',
              'fileCount': len(rows),
              'totalBytes': sum(r['bytes'] for r in rows),
              'aggregateSha256': digest,
              'files': rows,
          }
          Path('REALWORLDASSET_MIGRATION_MANIFEST.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
          cat > REALWORLDASSET_MERGE.md <<EOF
          # realworldasset → rwa canonical merge

          Canonical repository: \`copytolive/rwa\`
          Canonical public URL: \`https://copytolive.github.io/rwa/\`
          Legacy source repository: \`copytolive/realworldasset\`
          Imported source snapshot: \`${SOURCE_SHA}\`
          Imported source tree: \`${SOURCE_TREE_SHA}\`
          Imported path: \`apps/realworldasset\`
          Imported files: \`${FILE_COUNT}\`
          Imported bytes: \`${TOTAL_BYTES}\`

          The complete current source tree from \`copytolive/realworldasset\` is copied into \`apps/realworldasset\` as normal Git files (not a submodule), excluding only the source repository's internal \`.git\` directory. This preserves source code, public image assets, QA material, scripts, docs, configuration, and nested workflow files as repository content.

          Public production remains canonical only at \`/rwa/\`. The imported nested application is source material and is not wired as an independent GitHub Pages surface.
          EOF

      - name: Verify imported source is byte-identical
        run: |
          set -euo pipefail
          diff -qr --exclude='.git' "$RUNNER_TEMP/realworldasset" apps/realworldasset
          test -f apps/realworldasset/public/chat01/category-sprite.jpg
          test -f apps/realworldasset/public/chat01/landing-dashboard.jpg
          test -f apps/realworldasset/public/chat07/marina-bay-property.jpg
          test -f apps/realworldasset/src/app/page.tsx
          test -f apps/realworldasset/package.json
          echo "REALWORLDASSET_TOTAL_IMPORT=PASS"

      - name: Commit imported snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/realworldasset REALWORLDASSET_MERGE.md REALWORLDASSET_MIGRATION_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No import changes required"
            exit 0
          fi
          SOURCE_SHA="$(cat "$RUNNER_TEMP/source_sha")"
          git commit -m "migrate: import realworldasset total ${SOURCE_SHA}"
          git push origin HEAD:chore/migrate-realworldasset-total-20260831
