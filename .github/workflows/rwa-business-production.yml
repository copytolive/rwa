name: RWA Business Service Boundary
on:
  push:
    branches: ["main"]
    paths:
      - "business-service/**"
      - "index.html"
      - "chart-core.js"
      - ".github/workflows/rwa-business-production.yml"
  pull_request:
    paths:
      - "business-service/**"
      - "index.html"
      - "chart-core.js"
      - ".github/workflows/rwa-business-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify business service remains isolated from trading HOME
        shell: bash
        run: |
          set -euo pipefail
          test -d business-service
          ! test -e rwa-commerce-config.json
          ! test -e rwa-seablueprint-commerce-bridge.js
          ! test -e commerce-service
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          ! grep -Fq 'rwaSeablueprintCommerceLaunch' index.html
          ! grep -Fq 'rwa-seablueprint-commerce-bridge.js' chart-core.js
          grep -Fq 'id="liveRail"' index.html
          grep -Fq 'rwaMultiChainLazyBootstrap' index.html
          echo RWA_TRADING_ONLY_BUSINESS_BOUNDARY_PASS

      - name: Business service internal checks
        working-directory: business-service
        run: npm run check

      - name: Build isolated business service image
        run: docker build -f business-service/Dockerfile -t rwa-business:${GITHUB_SHA} business-service
