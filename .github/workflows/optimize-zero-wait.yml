name: Apply Zero-Wait Critical Boot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/optimize-zero-wait.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch critical startup path
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          idx=Path('index.html').read_text()
          # Remove non-critical startup competition.
          idx=idx.replace('<link rel="preconnect" href="https://esm.sh" crossorigin>\n','')
          for line in [
            '<link rel="preload" href="suite-ui.js?v=1" as="script">\n',
            '<link rel="preload" href="suite.js?v=1" as="script">\n',
            '<link rel="preload" href="suite-nav.js?v=1" as="script">\n',
            '<link rel="preload" href="suite.css?v=1" as="style">\n']:
            idx=idx.replace(line,'')
          if 'data-stream.binance.vision' not in idx:
            idx=idx.replace('<link rel="preconnect" href="https://data-api.binance.vision" crossorigin>','<link rel="preconnect" href="https://data-api.binance.vision" crossorigin>\n<link rel="preconnect" href="https://data-stream.binance.vision" crossorigin>')
          idx=idx.replace('app.js?v=6','app.js?v=7').replace('mobile.js?v=7','mobile.js?v=8')

          old='<div class="chart-wrap"><div class="chart-watermark">RWA</div><div class="chart-loading">Loading professional market chart…</div><canvas id="fallbackChart" class="fallback-chart"></canvas><div id="tvHost" class="tv-host"></div></div>'
          tv='''<div class="chart-wrap"><div class="chart-watermark">RWA</div><canvas id="fallbackChart" class="fallback-chart"></canvas><div id="tvHost" class="tv-host"><div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div><script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>{"autosize":true,"symbol":"BINANCE:BTCUSDT","interval":"15","timezone":"Asia/Jakarta","theme":"dark","style":"1","locale":"en","backgroundColor":"rgba(9,9,13,1)","gridColor":"rgba(36,36,46,.55)","hide_top_toolbar":false,"hide_legend":false,"allow_symbol_change":false,"save_image":false,"calendar":false,"support_host":"https://www.tradingview.com"}</script></div></div></div><script>(function(){var c=document.getElementById('fallbackChart');if(!c)return;var r=c.getBoundingClientRect(),d=window.devicePixelRatio||1,w=Math.max(1,r.width),h=Math.max(1,r.height),x=c.getContext('2d');c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#09090d';x.fillRect(0,0,w,h);var data=null;try{var o=JSON.parse(localStorage.getItem('rwa_chart_cache_v2:BTCUSDT:15')||'null');if(o&&Array.isArray(o.data)&&o.data.length&&Date.now()-Number(o.ts||0)<21600000)data=o.data}catch(e){}if(data){var p={l:10,r:58,t:18,b:28},cw=w-p.l-p.r,ch=h-p.t-p.b,lo=Math.min.apply(null,data.map(function(k){return k.l})),hi=Math.max.apply(null,data.map(function(k){return k.h})),rg=hi-lo||1,st=cw/data.length,bw=Math.max(1,st*.62),yy=function(v){return p.t+(hi-v)/rg*ch};data.forEach(function(k,i){var xx=p.l+i*st+st/2,up=k.c>=k.o,col=up?'#38d996':'#ff6677';x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(xx,yy(k.h));x.lineTo(xx,yy(k.l));x.stroke();var y1=yy(Math.max(k.o,k.c)),y2=yy(Math.min(k.o,k.c));x.fillRect(xx-bw/2,y1,bw,Math.max(1,y2-y1))})}else{x.strokeStyle='#18181f';x.lineWidth=1;for(var i=1;i<6;i++){var y=h*i/6;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}for(var j=1;j<8;j++){var z=w*j/8;x.beginPath();x.moveTo(z,0);x.lineTo(z,h);x.stroke()}}})();</script>'''
          if old not in idx:
            raise SystemExit('chart-wrap source contract changed')
          idx=idx.replace(old,tv)
          idx=idx.replace('<nav class="mobile-tabs" aria-label="Mobile navigation"><a href="#markets" data-mobile-nav="markets"><span>⌕</span><small>Markets</small></a><a class="active" href="#terminal" data-mobile-nav="chart"><span>⌁</span><small>Chart</small></a><a href="#social" data-mobile-nav="social"><span>◎</span><small>Social</small></a><a href="#depth" data-mobile-nav="depth"><span>≋</span><small>Depth</small></a></nav>',
            '<nav class="mobile-tabs" aria-label="Mobile navigation"><a href="#markets" data-mobile-nav="markets"><span>⌕</span><small>Markets</small></a><a class="active" href="#terminal" data-mobile-nav="chart"><span>⌁</span><small>Chart</small></a><a href="#social" data-mobile-nav="social"><span>◎</span><small>Social</small></a><a href="#suite" data-mobile-nav="hub"><span>◇</span><small>Hub</small></a><a href="#suite" data-mobile-nav="portfolio"><span>▣</span><small>Portfolio</small></a></nav>')
          Path('index.html').write_text(idx)

          mob=Path('mobile.js').read_text()
          # Keep startup network strictly chart/market critical. No suite preloads or esm.sh preconnect.
          mob=re.sub(r"function warmConnections\(\)\{.*?\n  \}\n  function chartCacheKey", "function warmConnections(){\n    for(const href of ['https://s3.tradingview.com','https://www.tradingview.com','https://data-api.binance.vision','https://data-stream.binance.vision']){\n      if(document.querySelector(`link[data-rwa-preconnect=\\\"${href}\\\"]`))continue;const l=document.createElement('link');l.rel='preconnect';l.href=href;l.crossOrigin='anonymous';l.dataset.rwaPreconnect=href;document.head.appendChild(l)\n    }\n  }\n  function chartCacheKey", mob, count=1, flags=re.S)
          mob=mob.replace("ctx.fillText('BTC / USDT · connecting live chart…',14,22)","ctx.fillText('BTC / USDT',14,22)")
          mob=mob.replace("const originalTV=loadTradingView;let lastKey='';", "const originalTV=loadTradingView;let lastKey=$('tvHost')?.children.length?`${S.selected}:${S.interval}`:'';")
          mob=mob.replace("if(target==='hub'||target==='portfolio')return;", "if(target==='hub'||target==='portfolio'){loadSuite().then(()=>window.RWASuite?.open(target==='portfolio'?'portfolio':'profile'));return;}")
          # Do not eagerly boot the heavy suite at page start.
          mob=re.sub(r';loadSuite\(\);\s*\n\}\)\(\);\s*$', ';\n})();\n', mob, count=1)
          # First desktop click on suite destinations lazy-loads and opens the requested module.
          marker="  function loadSuite(){"
          if marker not in mob: raise SystemExit('loadSuite marker missing')
          lazy="""  document.addEventListener('click',e=>{const b=e.target.closest?.('.signin,.institutional,.topnav button,.product-nav button');if(!b)return;const t=(b.textContent||'').trim().toLowerCase();let tab='';if(b.matches('.signin')||t==='company')tab='profile';else if(b.matches('.institutional')||t.includes('asset'))tab='rwa';else if(t.includes('intelligence')||t.includes('rwa index'))tab='intel';else if(t.includes('research'))tab='feed';if(!tab)return;e.preventDefault();e.stopImmediatePropagation();loadSuite().then(()=>window.RWASuite?.open(tab));},true);\n"""
          mob=mob.replace(marker,lazy+marker,1)
          Path('mobile.js').write_text(mob)

          app=Path('app.js').read_text()
          app2=re.sub(r'loadMarkets\(\);\s*$', "setTimeout(loadMarkets,450);", app, count=1)
          if app2==app: raise SystemExit('app boot call not patched')
          Path('app.js').write_text(app2)
          PY

      - name: Validate optimized sources
        run: |
          node --check app.js
          node --check mobile.js
          grep -Fq 'mobile.js?v=8' index.html
          grep -Fq 'external-embedding/embed-widget-advanced-chart.js' index.html
          ! grep -Fq 'preload" href="suite-ui.js' index.html
          ! grep -Fq 'preload" href="suite.js' index.html
          ! grep -Fq 'preload" href="suite-nav.js' index.html
          grep -Fq 'setTimeout(loadMarkets,450)' app.js
          grep -Fq "target==='hub'||target==='portfolio'" mobile.js

      - name: Commit optimization and remove one-shot workflow
        run: |
          rm .github/workflows/optimize-zero-wait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js mobile.js .github/workflows/optimize-zero-wait.yml
          git commit -m 'perf: zero-wait chart shell and lazy feature hydration'
          git push
