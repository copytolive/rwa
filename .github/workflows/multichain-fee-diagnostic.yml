name: MULTI CHAIN Fee Diagnostic

on:
  push:
    branches: [feat/multichain-real-execution-fees-v3-20260828]
    paths:
      - .github/workflows/multichain-fee-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fee-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe LI.FI quote with CopyToLive fee
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --connect-timeout 5 --max-time 30 --get -sS -o /tmp/q.json -w '%{http_code}' 'https://li.quest/v1/quote' \
            --data-urlencode 'fromChain=8453' \
            --data-urlencode 'toChain=1151111081099710' \
            --data-urlencode 'fromToken=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913' \
            --data-urlencode 'toToken=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v' \
            --data-urlencode 'fromAmount=10000000' \
            --data-urlencode 'fromAddress=0x1111111111111111111111111111111111111111' \
            --data-urlencode 'toAddress=11111111111111111111111111111111' \
            --data-urlencode 'slippage=0.005' \
            --data-urlencode 'integrator=copytolive-rwa' \
            --data-urlencode 'fee=0.002')"
          echo "HTTP=$code"
          cat /tmp/q.json
          echo
          test "$code" = "200"
          python - <<'PY'
          import json
          q=json.load(open('/tmp/q.json'))
          assert q.get('transactionRequest'), q
          assert int((q.get('estimate') or {}).get('toAmountMin') or 0)>0, q
          fees=(q.get('estimate') or {}).get('feeCosts') or []
          print('QUOTE_TOOL='+str(q.get('tool')))
          print('FEE_COSTS='+json.dumps(fees,separators=(',',':')))
          print('MULTICHAIN_LIFI_FEE_QUOTE=PASS')
          PY
