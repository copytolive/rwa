name: RWA Launch Gate

on:
  push:
    branches: ["main"]
    paths:
      - "execution-api.js"
      - "exchange-core.js"
      - "testnet-e2e.js"
      - "agent-worker/**"
      - "rwa-reviewers.json"
      - "rwa-assets.json"
      - "rwa-execution-config.json"
      - "launch/**"
      - "tools/launch-gate.mjs"
      - "tools/beta-proof.mjs"
      - ".github/workflows/beta-proof-review.yml"
      - ".github/workflows/launch-gate.yml"
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

concurrency:
  group: rwa-launch-readiness
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Evaluate and write launch gates
        run: |
          node tools/launch-gate.mjs --write > /tmp/rwa-launch.json
          cat /tmp/rwa-launch.json
          python -m json.tool launch/readiness.json >/dev/null
          python -m json.tool launch/e2e-registry.json >/dev/null
          python -m json.tool launch/beta-registry.json >/dev/null
      - name: Publish readiness file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launch/readiness.json
          if ! git diff --cached --quiet; then
            git commit -m 'launch: refresh machine evaluated readiness [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish launch status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          READY="$(node -e "const x=require('/tmp/rwa-launch.json');process.stdout.write(String(x.mainnet_ready))")"
          STATUS="$(node -e "const x=require('/tmp/rwa-launch.json');process.stdout.write(String(x.status))")"
          BLOCKERS="$(node -e "const x=require('/tmp/rwa-launch.json');process.stdout.write(x.blockers.map(b=>b.gate).slice(0,4).join(','))")"
          if [ "$READY" = "true" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/launch-gate' -f description='RWA READY_FOR_MAINNET: all external + beta gates PASS'
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='rwa/launch-gate' -f description="${STATUS}: ${BLOCKERS:-awaiting explicit mainnet control}"
          fi
