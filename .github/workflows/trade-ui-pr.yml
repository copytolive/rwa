name: RWA Trade UI Pull Request Gate

on:
  pull_request:
    paths:
      - 'trade/**'
      - 'execution-api.js'
      - 'tools/trade-ui-contract.mjs'
      - '.github/workflows/trade-ui-pr.yml'

permissions:
  contents: read

jobs:
  ui-operability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate launch trading surface
        run: |
          set -euo pipefail
          node --check trade/app.js
          node --check trade/hyperliquid.js
          node --check trade/terminal-pro.js
          node --check trade/provider-runtime.js
          node --check trade/margin-runtime.js
          node --check trade/chart-overlays.js
          node --check trade/release-runtime.js
          node --check trade/config.js
          node --check execution-api.js
          node --check tools/trade-ui-contract.mjs
          node tools/trade-ui-contract.mjs
