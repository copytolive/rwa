name: Layout Close Wait Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/layout-close-wait-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Serialize commerce close before asset route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui-layout-integrity-v15-browser.mjs')
          s=p.read_text()
          old="async function transitionParity(p,label){\n  await p.evaluate(()=>{try{window.RWASeablueprintCommerceBridge?.close?.({restore:false})}catch{};document.querySelector('#rwaShopScreen')?.classList.remove('open');document.body.classList.remove('rwa-shop-open','rwa-seablueprint-commerce-open');window.RWASuperApp.navigate('asset/PENDLE')});\n  await p.waitForFunction(()=>document.body.classList.contains('rwa-super-asset-workspace')&&!document.querySelector('#rwaSuperWorkspace')?.hidden);"
          new="async function transitionParity(p,label){\n  await p.evaluate(()=>{try{window.RWASeablueprintCommerceBridge?.close?.({restore:false})}catch{};document.querySelector('#rwaShopScreen')?.classList.remove('open');document.body.classList.remove('rwa-shop-open','rwa-seablueprint-commerce-open')});\n  await p.waitForFunction(()=>!document.querySelector('#rwaShopScreen')?.classList.contains('open')&&!document.body.classList.contains('rwa-seablueprint-commerce-open'));\n  await p.waitForTimeout(150);\n  await p.evaluate(()=>window.RWASuperApp.navigate('asset/PENDLE'));\n  await p.waitForFunction(()=>document.body.classList.contains('rwa-super-asset-workspace')&&!document.querySelector('#rwaSuperWorkspace')?.hidden);"
          if old not in s: raise SystemExit('serialized transition block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ui-layout-integrity-v15-browser.mjs
          git commit -m 'test: serialize root commerce close before asset parity'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
