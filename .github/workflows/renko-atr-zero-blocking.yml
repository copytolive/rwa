name: RENKO ATR Zero Blocking Gate
on:
  push:
    branches: [main]
    paths:
      - 'renko/**'
      - 'tools/renko-atr-zero-blocking-report.mjs'
      - 'tools/renko-deep-v3-runtime-proof.mjs'
      - 'tools/binance-1s-range-integrity.mjs'
      - '.github/workflows/renko-atr-zero-blocking.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-zero-blocking:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Static deep ATR and stable-chart checks
        run: |
          set -euo pipefail
          node --check renko/renko-tv-engine.js
          node --check renko/renko-tv-stable-chart.js
          node --check renko/renko-tv-atr-1s-million-cache-v3.js
          node --check renko/renko-tv-atr-1s-million-cache.js
          node --check tools/binance-1s-range-integrity.mjs
          node --check tools/renko-deep-v3-runtime-proof.mjs
          node --check tools/renko-atr-zero-blocking-report.mjs
          grep -Fq 'renko-tv-atr-1s-million-cache-v3.js?v=180' renko/index.html
          grep -Fq 'unique-nonoverlap-1s-history' renko/renko-tv-atr-1s-million-cache-v3.js
          grep -Fq "_exactBox" renko/renko-tv-engine.js
          grep -Fq "rule:'render-only-on-renko-geometry-change-fixed-1s-close'" renko/renko-tv-stable-chart.js
          grep -Fq 'rawBoxPass' tools/renko-atr-zero-blocking-report.mjs
          grep -Fq 'livePersistence' tools/renko-atr-zero-blocking-report.mjs
      - name: Probe Binance fixed 1s historical window semantics
        run: node tools/binance-1s-range-integrity.mjs
      - name: Wait for exact deployed Pages SHA
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            live="$(curl -fsSL --max-time 8 "https://copytolive.github.io/rwa/renko-deployment-sha.txt?ts=$(date +%s)" || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 4
          done
          echo "Expected $GITHUB_SHA but production did not reach that exact SHA" >&2
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove unique-window v3 worker is the production runtime
        run: RWA_TEST_URL=https://copytolive.github.io/rwa node tools/renko-deep-v3-runtime-proof.mjs
      - name: Capture seven raw-Wilder ATR 0ms plus live 1s no-heartbeat persistence proof
        run: RWA_TEST_URL=https://copytolive.github.io/rwa node tools/renko-atr-zero-blocking-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-atr-zero-blocking-${{ github.sha }}
          path: artifacts/renko-atr-zero-blocking
          retention-days: 7
