name: Recover Production Index Wiring

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.production-index-recovery-trigger'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire canonical production runtime and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="superapp-v5.js?v=17"></script>'
          block='''<script src="superapp-v5.js?v=17"></script>\n<script src="rwa-target-dashboard-v2.js?v=2.2.1"></script>\n<script src="rwa-seablueprint-commerce-bridge.js?v=1.6.0"></script>\n<script src="rwa-ecommerce-target-controller-v1.js?v=2.3.0"></script>\n<script src="rwa-ecommerce-target-hardening-v1.js?v=1.1.1"></script>\n<script src="rwa-ecommerce-production-visual-v1.js?v=1.8.1"></script>\n<script src="rwa-ecommerce-parity-finish-v2.js?v=2.3.0"></script>\n<script src="rwa-target-topbar-cleanup-v1.js?v=1.6.0"></script>\n<script src="rwa-target-dashboard-v2-hardening.js?v=2.1.0"></script>'''
          required=['rwa-target-dashboard-v2.js','rwa-seablueprint-commerce-bridge.js','rwa-ecommerce-target-controller-v1.js','rwa-ecommerce-target-hardening-v1.js','rwa-ecommerce-production-visual-v1.js','rwa-ecommerce-parity-finish-v2.js','rwa-target-topbar-cleanup-v1.js','rwa-target-dashboard-v2-hardening.js']
          if all(x in s for x in required):
              print('CANONICAL_INDEX_ALREADY_WIRED')
          else:
              if marker not in s:
                  raise SystemExit('superapp marker missing; refusing unsafe edit')
              s=s.replace(marker,block,1)
              if not all(x in s for x in required):
                  raise SystemExit('canonical wiring incomplete')
              p.write_text(s)
              print('CANONICAL_INDEX_WIRING_APPLIED')
          PY
          node --check rwa-target-dashboard-v2.js
          node --check rwa-seablueprint-commerce-bridge.js
          node --check rwa-ecommerce-target-controller-v1.js
          node --check rwa-ecommerce-target-hardening-v1.js
          node --check rwa-ecommerce-production-visual-v1.js
          node --check rwa-ecommerce-parity-finish-v2.js
          node --check rwa-target-topbar-cleanup-v1.js
          node --check rwa-target-dashboard-v2-hardening.js
          grep -Fq 'rwa-target-dashboard-v2.js' index.html
          grep -Fq 'rwa-ecommerce-target-controller-v1.js' index.html
          if git diff --quiet -- index.html; then
            echo 'No index change required.'
            exit 0
          fi
          git add index.html
          git commit -m 'fix(pages): wire canonical Seablueprint runtime in index'
          for n in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
