# trigger: v2
name: Finalize Execution Cache Contract
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/finalize-execution-cache.yml"]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align all execution asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          reps={
            'index.html':[
              ('mobile.js?v=12','mobile.js?v=13'),
              ('execution-api.js?v=1','execution-api.js?v=2'),
              ('execution-ops-bridge.js?v=1','execution-ops-bridge.js?v=2'),
              ('execution-ui.js?v=1','execution-ui.js?v=3'),
              ('suite-execution-patch.js?v=5','suite-execution-patch.js?v=6')],
            'mobile.js': [('suite-nav.js?v=1','suite-nav.js?v=3')],
            'realtime-core.js':[
              ('suite-nav.js?v=1','suite-nav.js?v=3'),
              ('execution-api.js?v=1','execution-api.js?v=2'),
              ('execution-ops-bridge.js?v=1','execution-ops-bridge.js?v=2'),
              ('execution-ui.js?v=1','execution-ui.js?v=3'),
              ('suite-execution-patch.js?v=4','suite-execution-patch.js?v=6'),
              ('suite-execution-patch.js?v=5','suite-execution-patch.js?v=6')],
            '.github/workflows/pages.yml':[
              ('execution-ui.js?v=2','execution-ui.js?v=3'),
              ('suite-execution-patch.js?v=5','suite-execution-patch.js?v=6')],
            '.github/workflows/live-browser-smoke.yml':[
              ('execution-ui.js?v=2','execution-ui.js?v=3'),
              ('suite-execution-patch.js?v=5','suite-execution-patch.js?v=6')]
          }
          for fn,pairs in reps.items():
            p=Path(fn); s=p.read_text()
            for a,b in pairs: s=s.replace(a,b)
            p.write_text(s)
          PY
          node --check app.js
          node --check mobile.js
          node --check realtime-core.js
          node --check suite-nav.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check execution-ui.js
          node --check suite-execution-patch.js
          grep -Fq 'execution-api.js?v=2' index.html
          grep -Fq 'execution-ops-bridge.js?v=2' index.html
          grep -Fq 'execution-ui.js?v=3' index.html
          grep -Fq 'suite-execution-patch.js?v=6' index.html
          grep -Fq 'mobile.js?v=13' index.html
          grep -Fq 'suite-nav.js?v=3' mobile.js
      - name: Commit and remove finalizer
        run: |
          rm .github/workflows/finalize-execution-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.js realtime-core.js .github/workflows/pages.yml .github/workflows/live-browser-smoke.yml .github/workflows/finalize-execution-cache.yml
          git commit -m 'chore: finalize execution API cache versions'
          git push
