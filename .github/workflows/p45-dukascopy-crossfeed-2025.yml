name: P45 Dukascopy Crossfeed 2025

on:
  pull_request:
    paths:
      - 'research/p45-live-cert/p45_dukascopy_crossfeed_2025.py'
      - 'research/p45-live-cert/download_dukascopy_crossfeed.js'
      - '.github/workflows/p45-dukascopy-crossfeed-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossfeed:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          npm install --no-save dukascopy-node@1.50.0
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Download independent Dukascopy BID/ASK M1
        run: node research/p45-live-cert/download_dukascopy_crossfeed.js

      - name: Run frozen P45 cross-feed evaluation
        id: eval
        continue-on-error: true
        run: |
          python research/p45-live-cert/p45_dukascopy_crossfeed_2025.py \
            --bid crossfeed_data/dukascopy_bid.csv \
            --ask crossfeed_data/dukascopy_ask.csv \
            --output p45_dukascopy_crossfeed_2025_result.json \
            2>&1 | tee p45_dukascopy_crossfeed_2025.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload cross-feed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-dukascopy-crossfeed-2025
          path: |
            p45_dukascopy_crossfeed_2025_result.json
            p45_dukascopy_crossfeed_2025.log
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce cross-feed gate
        if: always()
        run: |
          test "${{ steps.eval.outputs.exit_code }}" = "0"
