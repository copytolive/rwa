name: RWA Verified Growth Suite Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "suite.js"
      - "suite-v2.js"
      - "suite-ui.js"
      - "suite.css"
      - "suite-v2.css"
      - "social-trade-monitor.js"
      - "social-trading-pro.js"
      - "index.html"
      - "rwa-assets.json"
      - "rwa-execution-config.json"
      - ".github/workflows/growth-suite-smoke.yml"
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-growth-suite-smoke
  cancel-in-progress: true
jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate verified growth suite source
        run: |
          node --check suite.js
          node --check suite-v2.js
          node --check suite-ui.js
          node --check social-trade-monitor.js
          node --check social-trading-pro.js
          test -s suite-v2.css
          python -m json.tool rwa-assets.json >/dev/null
          python -m json.tool rwa-execution-config.json >/dev/null
          grep -Fq "suite-v2.js?v=2" suite.js
          grep -Fq "suite-v2.css?v=1" suite.js
          grep -Fq "social-trade-monitor.js?v=1" suite.js
          grep -Fq "version:'2.0.0'" suite-v2.js
          grep -Fq "verified-growth-suite-v2" suite-v2.js
          grep -Fq "VERIFIED BY HYPERLIQUID" suite-v2.js
          grep -Fq "userFillsByTime" suite-v2.js
          grep -Fq "orders.market" suite-v2.js
          grep -Fq "COPY ACTIVE" suite-v2.js
          grep -Fq "rwa:market-trade" suite-v2.js
          grep -Fq "rwa-wallet-link-v2" suite-v2.js
          grep -Fq "rwa_verify_v1:" suite-v2.js
          grep -Fq "RWAFollowedTradeMonitor" social-trade-monitor.js
          grep -Fq "rwa:followed-trader-position" social-trade-monitor.js
          grep -Fq "clearinghouseState" social-trade-monitor.js
          grep -Fq "verifyMessage" social-trade-monitor.js
          grep -Fq "Notification.requestPermission" social-trade-monitor.js
          grep -Fq "venue-backed-social-feed-v1" social-trading-pro.js
          grep -Fq "userFillsByTime" social-trading-pro.js
          grep -Fq "data-rwa-feed-trade" social-trading-pro.js
          grep -Fq "Following trades" social-trading-pro.js
          grep -Fq "Top-trader activity" social-trading-pro.js
          grep -Fq "Trending market alerts" social-trading-pro.js
          grep -Fq "New follower alerts" social-trading-pro.js
          grep -Fq "social-trading-pro.js?v=1" index.html
          ! grep -Fq "ExchangeClient" social-trade-monitor.js
          ! grep -Fq "ExchangeClient" social-trading-pro.js
          grep -Fq "Revenue OFF" suite-ui.js
          grep -Fq "Copy trader" suite-ui.js
          grep -Fq "Verified portfolio & P&L" suite-ui.js
          grep -Fq "SMART-MONEY PROXY" suite-ui.js
          ! grep -Fq "ExchangeClient" suite-v2.js
          ! grep -Fq "ExchangeClient" suite.js
          grep -Fq '"enabled": false' rwa-execution-config.json
      - name: Publish source status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/growth-suite-source' -f description='Portfolio, leaderboard, copy, venue social feed, notifications and RWA source verified'
      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            loader="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite.js?v=$q" || true)"
            core="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-v2.js?v=$q" || true)"
            social="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/social-trade-monitor.js?v=$q" || true)"
            socialpro="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/social-trading-pro.js?v=$q" || true)"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            ui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-ui.js?v=$q" || true)"
            css="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-v2.css?v=$q" || true)"
            cfg="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-execution-config.json?v=$q" || true)"
            if grep -Fq "suite-v2.js?v=2" <<<"$loader" \
              && grep -Fq "social-trade-monitor.js?v=1" <<<"$loader" \
              && grep -Fq "version:'2.0.0'" <<<"$core" \
              && grep -Fq "verified-growth-suite-v2" <<<"$core" \
              && grep -Fq "orders.market" <<<"$core" \
              && ! grep -Fq "ExchangeClient" <<<"$core" \
              && grep -Fq "RWAFollowedTradeMonitor" <<<"$social" \
              && grep -Fq "rwa:followed-trader-position" <<<"$social" \
              && ! grep -Fq "ExchangeClient" <<<"$social" \
              && grep -Fq "venue-backed-social-feed-v1" <<<"$socialpro" \
              && grep -Fq "data-rwa-feed-trade" <<<"$socialpro" \
              && ! grep -Fq "ExchangeClient" <<<"$socialpro" \
              && grep -Fq "social-trading-pro.js?v=1" <<<"$html" \
              && grep -Fq "Verified portfolio & P&L" <<<"$ui" \
              && grep -Fq "leader-wallet-search" <<<"$css" \
              && grep -Fq '"enabled": false' <<<"$cfg"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/growth-suite-live' -f description='Verified growth suite + venue social trader activity are live on GitHub Pages'
      - name: Publish failure statuses
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/growth-suite-source' -f description='Verified growth suite source/live validation failed'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/growth-suite-live' -f description='Verified growth suite failed live validation'
