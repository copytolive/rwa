name: RWA Release Candidate Gate
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-release-candidate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical source
        run: |
          node --check execution-api.js
          node --check exchange-core.js
          node --check suite-v2.js
          node --check social-trade-monitor.js
          node --check social-notification-defaults.js
          node --check social-trading-pro.js
          node --check rwa-storefront.js
          node --check rwa-storefront-safety-patch.js
          node --check rwa-store-draft-ui.js
          node --check rwa-home-commerce.js
          node --check rwa-market-labels.js
          node --check rwa-store-detail.js
          node --check rwa-checkout-ui.js
          node --check quick-actions.js
          node --check rwa-multichain.js
          node --check tools/launch-gate-current.mjs
          node --check trade/app.js
          node --check trade/hyperliquid.js
          node --check trade/terminal-pro.js
          node --check trade/provider-runtime.js
          node --check trade/margin-runtime.js
          node --check trade/chart-overlays.js
          node --check trade/release-runtime.js
          node --check trade/ui-polish.js
          node --check trade/e2e.js
          node --check trade/e2e-resilience.js
          node --check trade/config.js
          node --check agent-worker/worker.mjs
          node --check agent-worker/execution.mjs
          node --check agent-worker/copy-engine.mjs
          python -m json.tool rwa-commerce-registry.json >/dev/null
          python -m json.tool rwa-multichain-registry.json >/dev/null
          test -s rwa-store-detail.css
          test -s rwa-checkout-ui.css
          node tools/trade-ui-contract.mjs
          node tools/product-parity-contract.mjs
          node tools/multichain-contract.mjs
          node tools/storefront-ui-contract.mjs
          node tools/security-gate.mjs
          node tools/launch-gate-current.mjs --require-engineering
      - name: Validate immutable safety, lazy runtime and commerce markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "hardening:'single-write-path-v1'" execution-api.js
          grep -Fq "riskSigner:'agent-only-fail-closed-v1'" execution-api.js
          grep -Fq "grouping:'normalTpsl'" execution-api.js
          grep -Fq "WORKER_SINGLE_WRITE_PATH='RWAWorkerExecutionAPI'" agent-worker/execution.mjs
          ! grep -Eq '(withdraw3|usdClassTransfer|spotSend|sendAsset)' agent-worker/execution.mjs agent-worker/worker.mjs
          grep -Fq "version:'1.5.0'" trade/config.js
          grep -Fq "status==='READY_FOR_MAINNET'" trade/config.js
          grep -Fq "import './ui-polish.js?v=2'" trade/config.js
          grep -Fq "runtime:'stable-no-observer-v2'" trade/ui-polish.js
          ! grep -Fq 'MutationObserver' trade/ui-polish.js
          grep -Fq "loadScriptOnce('quick-actions.js?v=1','quick-actions')" superapp-v5.js
          grep -Fq "loadScriptOnce('social-notification-defaults.js?v=1','social-defaults')" superapp-v5.js
          grep -Fq "loadScriptOnce('social-trading-pro.js?v=1','social-pro')" superapp-v5.js
          ! grep -Fq 'quick-actions.js?v=1' index.html
          ! grep -Fq 'social-notification-defaults.js?v=1' index.html
          ! grep -Fq 'social-trading-pro.js?v=1' index.html
          grep -Fq 'rwa-multichain.js?v=1' index.html
          grep -Fq "POLICY='chain-abstraction-fail-closed-v1'" rwa-multichain.js
          grep -Fq '"policy": "chain-abstraction-fail-closed-v1"' rwa-multichain-registry.json
          ! grep -Fq 'ExchangeClient' rwa-multichain.js
          grep -Fq "policy:'explicit-opt-in-v1'" social-notification-defaults.js
          grep -Fq "venue-backed-social-feed-v1" social-trading-pro.js
          grep -Fq "ONE_TOKEN_ONE_PHYSICAL_STORE_V1" rwa-storefront.js
          grep -Fq "preview-no-fake-price-trade-v1" rwa-storefront-safety-patch.js
          grep -Fq "UNVERIFIED_LOCAL_DRAFT" rwa-store-draft-ui.js
          grep -Fq "landing-commerce-surface-v1" rwa-home-commerce.js
          grep -Fq "public-rwa-linked-vs-store-token-v1" rwa-market-labels.js
          grep -Fq "physical-store-evidence-detail-v1" rwa-store-detail.js
          grep -Fq "backend-gated-checkout-preview-v1" rwa-checkout-ui.js
          grep -Fq "Place order after backend verification" rwa-checkout-ui.js
          grep -Fq '"one_token_one_physical_store": true' rwa-commerce-registry.json
          grep -Fq 'verifiedStore(s)&&verifiedAsset(s.token)' rwa-storefront.js
          grep -Fq 'social-trade-monitor.js?v=1' suite.js
          grep -Fq 'RWAMarginRuntime' trade/margin-runtime.js
          grep -Fq 'RWAChartTradeOverlay' trade/chart-overlays.js
          ! grep -Fq 'ExchangeClient' trade/margin-runtime.js trade/chart-overlays.js quick-actions.js social-trade-monitor.js social-trading-pro.js rwa-storefront.js rwa-storefront-safety-patch.js rwa-store-draft-ui.js rwa-home-commerce.js rwa-market-labels.js rwa-store-detail.js rwa-checkout-ui.js trade/ui-polish.js
      - name: Verify exact canonical GitHub Pages release surfaces
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          base='https://copytolive.github.io/rwa'
          ok=0
          for i in $(seq 1 120); do
            q="${GITHUB_RUN_ID}-${i}"
            live_sha="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/deployment-sha.txt?v=$q" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$live_sha" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          q="${GITHUB_RUN_ID}-release"
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/?v=$q" -o /tmp/rwa-root.html
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/superapp-v5.js?v=$q" -o /tmp/rwa-superapp.js
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/rwa-multichain.js?v=$q" -o /tmp/rwa-multichain.js
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/rwa-multichain-registry.json?v=$q" -o /tmp/rwa-multichain.json
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/trade/?v=$q" -o /tmp/rwa-trade.html
          curl --connect-timeout 5 --max-time 20 -fsSL "$base/trade/config.js?v=$q" -o /tmp/rwa-trade-config.js
          grep -Fq 'market-performance.js?v=12' /tmp/rwa-root.html
          grep -Fq 'superapp-v5.js?v=17' /tmp/rwa-root.html
          grep -Fq 'rwa-multichain.js?v=1' /tmp/rwa-root.html
          grep -Fq "loadScriptOnce('social-notification-defaults.js?v=1','social-defaults')" /tmp/rwa-superapp.js
          grep -Fq "loadScriptOnce('social-trading-pro.js?v=1','social-pro')" /tmp/rwa-superapp.js
          grep -Fq "loadScriptOnce('quick-actions.js?v=1','quick-actions')" /tmp/rwa-superapp.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v1'" /tmp/rwa-multichain.js
          grep -Fq 'window.RWAMultiChain' /tmp/rwa-multichain.js
          grep -Fq '"policy": "chain-abstraction-fail-closed-v1"' /tmp/rwa-multichain.json
          grep -Fq '"id": "solana"' /tmp/rwa-multichain.json
          grep -Fq '"id": "base"' /tmp/rwa-multichain.json
          grep -Fq 'id="priceChart"' /tmp/rwa-trade.html
          grep -Fq "version:'1.5.0'" /tmp/rwa-trade-config.js
          grep -Fq "status==='READY_FOR_MAINNET'" /tmp/rwa-trade-config.js
          echo "RELEASE_EXACT_SHA=PASS:$GITHUB_SHA"
      - name: Publish release candidate status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/release-candidate' -f description='Lazy social + safety + commerce + MULTI CHAIN release contract verified'
      - name: Publish release candidate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/release-candidate' -f description='Release candidate validation failed; inspect source/live gate logs'