name: RWA Trading Release Candidate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate trading and MULTI CHAIN source
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html app.js chart-core.js rwa-live-home-v1.js quick-actions.js walletconnect.js wallet-core.js execution-api.js exchange-core.js rwa-multichain.js rwa-multichain-engine.js; do test -s "$f"; done
          for f in app.js chart-core.js rwa-live-home-v1.js quick-actions.js walletconnect.js wallet-core.js execution-api.js exchange-core.js rwa-multichain.js rwa-multichain-engine.js; do node --check "$f"; done
          python -m json.tool rwa-multichain-registry.json >/dev/null
          python -m json.tool launch/readiness.json >/dev/null
          python -m json.tool launch/e2e-registry.json >/dev/null
          grep -Fq '<strong>RWA</strong>' index.html
          grep -Fq 'rwaMultiChainLazyBootstrap' index.html
          grep -Fq 'id="fallbackChart"' index.html
          grep -Fq 'id="tvHost"' index.html
          grep -Fq "hardening:'single-write-path-v1'" execution-api.js
          grep -Fq "riskGate:'mandatory-internal-v1'" execution-api.js
          grep -Fq "bracket:'atomic-normal-tpsl-v1'" execution-api.js
          grep -Fq "const state={env:'testnet'" exchange-core.js
          grep -Fq "localE2EVerified()&&globalMainnetReady()" exchange-core.js
          grep -Fq "POLICY='chain-abstraction-fail-closed-v2'" rwa-multichain.js
          grep -Fq "REVISION='3.0.0-tuntas'" rwa-multichain.js
          grep -Fq "const REVISION='3.0.0-tuntas'" rwa-multichain-engine.js
          ! grep -Eiq 'seablueprint|ecommerce|in-page commerce' index.html
          ! grep -Eq 'rwa-(commerce|ecommerce|storefront|checkout-ui|home-commerce|store-detail|store-draft)' quick-actions.js
          test ! -e rwa-seablueprint-commerce-bridge.js
          test ! -e rwa-commerce-config.json
          test ! -e commerce-service
          test ! -e apps/realworldasset
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('launch/readiness.json','utf8'));
          if(r.engineering_ready!==true) throw Error('engineering_ready must stay true');
          if(r.mainnet_ready!==false) throw Error('mainnet must remain fail-closed');
          if(r.status!=='BLOCKED') throw Error('current launch status must remain BLOCKED');
          const m=JSON.parse(fs.readFileSync('rwa-multichain-registry.json','utf8'));
          if(m.policy!=='chain-abstraction-fail-closed-v2') throw Error('multi-chain policy mismatch');
          if(!Array.isArray(m.networks)||m.networks.length!==9) throw Error('expected 9 network contexts');
          console.log('RWA_TRADING_RELEASE_SOURCE_PASS');
          NODE
      - name: Publish release status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/release-candidate' -f description='Trading + MULTI CHAIN engineering verified; mainnet remains fail-closed'
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/release-candidate' -f description='Trading release candidate validation failed'
