name: RWA Release Candidate Gate
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-release-candidate
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate critical source
        run: |
          node --check execution-api.js
          node --check exchange-core.js
          node --check suite-v2.js
          node --check social-trade-monitor.js
          node --check social-notification-defaults.js
          node --check social-trading-pro.js
          node --check rwa-storefront.js
          node --check rwa-storefront-safety-patch.js
          node --check rwa-store-draft-ui.js
          node --check rwa-home-commerce.js
          node --check rwa-market-labels.js
          node --check quick-actions.js
          node --check trade/app.js
          node --check trade/hyperliquid.js
          node --check trade/terminal-pro.js
          node --check trade/provider-runtime.js
          node --check trade/margin-runtime.js
          node --check trade/chart-overlays.js
          node --check trade/release-runtime.js
          node --check trade/ui-polish.js
          node --check trade/e2e.js
          node --check trade/e2e-resilience.js
          node --check trade/config.js
          node --check agent-worker/worker.mjs
          node --check agent-worker/execution.mjs
          node --check agent-worker/copy-engine.mjs
          python -m json.tool rwa-commerce-registry.json >/dev/null
          node tools/trade-ui-contract.mjs
          node tools/product-parity-contract.mjs
          node tools/storefront-ui-contract.mjs
          node tools/security-gate.mjs
          node tools/launch-gate.mjs --require-engineering
      - name: Validate immutable safety and commerce markers
        run: |
          grep -Fq "hardening:'single-write-path-v1'" execution-api.js
          grep -Fq "riskSigner:'agent-only-fail-closed-v1'" execution-api.js
          grep -Fq "grouping:'normalTpsl'" execution-api.js
          grep -Fq "WORKER_SINGLE_WRITE_PATH='RWAWorkerExecutionAPI'" agent-worker/execution.mjs
          ! grep -Eq '(withdraw3|usdClassTransfer|spotSend|sendAsset)' agent-worker/execution.mjs agent-worker/worker.mjs
          grep -Fq "version:'1.5.0'" trade/config.js
          grep -Fq "status==='READY_FOR_MAINNET'" trade/config.js
          grep -Fq "import './ui-polish.js?v=1'" trade/config.js
          grep -Fq 'quick-actions.js?v=1' index.html
          grep -Fq 'social-notification-defaults.js?v=1' index.html
          grep -Fq 'social-trading-pro.js?v=1' index.html
          grep -Fq "policy:'explicit-opt-in-v1'" social-notification-defaults.js
          grep -Fq "venue-backed-social-feed-v1" social-trading-pro.js
          grep -Fq "ONE_TOKEN_ONE_PHYSICAL_STORE_V1" rwa-storefront.js
          grep -Fq "preview-no-fake-price-trade-v1" rwa-storefront-safety-patch.js
          grep -Fq "UNVERIFIED_LOCAL_DRAFT" rwa-store-draft-ui.js
          grep -Fq "landing-commerce-surface-v1" rwa-home-commerce.js
          grep -Fq "public-rwa-linked-vs-store-token-v1" rwa-market-labels.js
          grep -Fq '"one_token_one_physical_store": true' rwa-commerce-registry.json
          grep -Fq 'verifiedStore(s)&&verifiedAsset(s.token)' rwa-storefront.js
          grep -Fq 'social-trade-monitor.js?v=1' suite.js
          grep -Fq 'RWAMarginRuntime' trade/margin-runtime.js
          grep -Fq 'RWAChartTradeOverlay' trade/chart-overlays.js
          ! grep -Fq 'ExchangeClient' trade/margin-runtime.js trade/chart-overlays.js quick-actions.js social-trade-monitor.js social-trading-pro.js rwa-storefront.js rwa-storefront-safety-patch.js rwa-store-draft-ui.js rwa-home-commerce.js rwa-market-labels.js trade/ui-polish.js
      - name: Verify public GitHub Pages release surfaces
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            root="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            trade="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/?v=$q" || true)"
            cfg="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/config.js?v=$q" || true)"
            margin="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/margin-runtime.js?v=$q" || true)"
            overlay="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/chart-overlays.js?v=$q" || true)"
            tradeui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/ui-polish.js?v=$q" || true)"
            quick="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/quick-actions.js?v=$q" || true)"
            storefront="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-storefront.js?v=$q" || true)"
            safety="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-storefront-safety-patch.js?v=$q" || true)"
            draft="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-store-draft-ui.js?v=$q" || true)"
            home="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-home-commerce.js?v=$q" || true)"
            labels="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-market-labels.js?v=$q" || true)"
            commerce="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-commerce-registry.json?v=$q" || true)"
            defaults="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/social-notification-defaults.js?v=$q" || true)"
            socialpro="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/social-trading-pro.js?v=$q" || true)"
            suite="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-v2.js?v=$q" || true)"
            social="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/social-trade-monitor.js?v=$q" || true)"
            if grep -Fq 'quick-actions.js?v=1' <<<"$root" \
              && grep -Fq 'social-notification-defaults.js?v=1' <<<"$root" \
              && grep -Fq 'social-trading-pro.js?v=1' <<<"$root" \
              && grep -Fq 'id="priceChart"' <<<"$trade" \
              && grep -Fq "version:'1.5.0'" <<<"$cfg" \
              && grep -Fq "import './ui-polish.js?v=1'" <<<"$cfg" \
              && grep -Fq 'RWAMarginRuntime' <<<"$margin" \
              && grep -Fq 'RWAChartTradeOverlay' <<<"$overlay" \
              && grep -Fq 'desktop-mobile-commerce-polish-v1' <<<"$tradeui" \
              && grep -Fq 'premium-shell-storefront-v1' <<<"$quick" \
              && grep -Fq 'rwa-storefront-safety-patch.js?v=1' <<<"$quick" \
              && grep -Fq 'rwa-store-draft-ui.js?v=1' <<<"$quick" \
              && grep -Fq 'rwa-home-commerce.js?v=1' <<<"$quick" \
              && grep -Fq 'rwa-market-labels.js?v=1' <<<"$quick" \
              && grep -Fq 'ONE_TOKEN_ONE_PHYSICAL_STORE_V1' <<<"$storefront" \
              && grep -Fq 'preview-no-fake-price-trade-v1' <<<"$safety" \
              && grep -Fq 'UNVERIFIED_LOCAL_DRAFT' <<<"$draft" \
              && grep -Fq 'landing-commerce-surface-v1' <<<"$home" \
              && grep -Fq 'public-rwa-linked-vs-store-token-v1' <<<"$labels" \
              && grep -Fq '"one_token_one_physical_store": true' <<<"$commerce" \
              && grep -Fq "policy:'explicit-opt-in-v1'" <<<"$defaults" \
              && grep -Fq "venue-backed-social-feed-v1" <<<"$socialpro" \
              && grep -Fq "version:'2.0.0'" <<<"$suite" \
              && grep -Fq 'RWAFollowedTradeMonitor' <<<"$social"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish release candidate status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/release-candidate' -f description='Trading, social, RWA-linked markets and physical-store ecommerce UI live surfaces verified'
      - name: Publish release candidate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/release-candidate' -f description='Release candidate validation failed'
