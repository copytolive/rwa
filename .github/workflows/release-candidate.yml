name: RWA Release Candidate Gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-release-candidate
  cancel-in-progress: true

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate current launch source
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            index.html superapp-v5.js superapp-v5.css suite-nav.js market-performance.js \
            human-operability-v1.css human-operability-patch-v1.css \
            rwa-8-engines/app.js rwa-8-engines/engine.js rwa-8-engines/human-operability.css \
            execution-api.js execution-ops-bridge.js exchange-core.js trade/config.js \
            tools/superapp-v5-audit.mjs tools/superapp-p16-p20-audit.mjs \
            tools/rwa-8-engines-audit.mjs tools/security-gate.mjs tools/launch-gate.mjs; do test -s "$f"; done

          node --check superapp-v5.js
          node --check suite-nav.js
          node --check market-performance.js
          node --check rwa-8-engines/app.js
          node --check rwa-8-engines/engine.js
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check trade/config.js
          node --check agent-worker/worker.mjs
          node --check agent-worker/execution.mjs
          node --check agent-worker/copy-engine.mjs

          node tools/trade-ui-contract.mjs
          node tools/storefront-ui-contract.mjs
          node tools/superapp-v5-audit.mjs
          node tools/superapp-p16-p20-audit.mjs
          node tools/rwa-8-engines-audit.mjs
          node tools/security-gate.mjs
          node tools/launch-gate.mjs --require-engineering

      - name: Validate immutable launch safety markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "hardening:'single-write-path-v1'" execution-api.js
          grep -Fq "riskSigner:'agent-only-fail-closed-v1'" execution-api.js
          grep -Fq "grouping:'normalTpsl'" execution-api.js
          grep -Fq "WORKER_SINGLE_WRITE_PATH='RWAWorkerExecutionAPI'" agent-worker/execution.mjs
          ! grep -Eq '(withdraw3|usdClassTransfer|spotSend|sendAsset)' agent-worker/execution.mjs agent-worker/worker.mjs
          grep -Fq '"enabled": false' rwa-execution-config.json
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          grep -Fq "policy:'explicit-opt-in-v1'" social-notification-defaults.js
          ! grep -Fq 'product-os-v3.js' index.html
          ! grep -Fq 'product-os-mobile-contract-v3.js' index.html
          grep -Fq 'human-operability-v1.css?v=1' market-performance.js
          grep -Fq 'human-operability-patch-v1.css?v=1' market-performance.js
          grep -Fq 'human-operability.css?v=1' rwa-8-engines/app.js
          grep -Fq "canonical:'https://copytolive.github.io/rwa/'" legacy-canonical.js

      - name: Verify exact GitHub Pages release surfaces
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..180}; do
            q="${GITHUB_RUN_ID}-${i}"
            base="https://copytolive.github.io/rwa"
            deployed="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/deployment-sha.txt?v=$q" 2>/dev/null | tr -d '\r\n' || true)"
            root="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/?v=$q" 2>/dev/null || true)"
            trade="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/trade/?v=$q" 2>/dev/null || true)"
            factory="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/rwa-8-engines/?v=$q" 2>/dev/null || true)"
            renko="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/renko/?v=$q" 2>/dev/null || true)"
            human="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/human-operability-v1.css?v=$q" 2>/dev/null || true)"
            patch="$(curl --connect-timeout 5 --max-time 12 -fsSL "$base/human-operability-patch-v1.css?v=$q" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ] \
              && grep -Fq 'RWA Markets' <<<"$root" \
              && grep -Fq 'id="priceChart"' <<<"$trade" \
              && grep -Fq 'RWA Passport' <<<"$factory" \
              && grep -Fq 'RENKO V15.1' <<<"$renko" \
              && grep -Fq 'RWA HUMAN OPERABILITY V1' <<<"$human" \
              && grep -Fq '.topnav{display:none!important}' <<<"$patch"; then
              ok=1
              echo "EXACT_DEPLOYED_SHA=$deployed"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Publish release candidate status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/release-candidate' -f description='Exact-SHA Super App + RWA Factory + RENKO launch surfaces verified'

      - name: Publish release candidate failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/release-candidate' -f description='Release candidate validation failed'