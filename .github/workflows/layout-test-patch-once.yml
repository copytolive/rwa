name: Layout Legacy Marketplace Test Patch Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/layout-test-patch-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Route through canonical assets without legacy Marketplace chrome
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui-layout-integrity-v15-browser.mjs')
          s=p.read_text()
          s=s.replace("await p.waitForSelector('#rwaMarketplaceLaunch',{state:'visible'});return{p,pageErrors}","return{p,pageErrors}",1)
          old="const desktop=await open({width:1536,height:1000});await desktop.p.locator('#rwaMarketplaceLaunch').click();await desktop.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('assets'));"
          new="const desktop=await open({width:1536,height:1000});if(await desktop.p.locator('#rwaMarketplaceLaunch:visible').count())throw Error('legacy desktop Marketplace launcher resurfaced');await desktop.p.evaluate(()=>window.RWASuperApp.navigate('assets'));await desktop.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('assets'));"
          if old not in s: raise SystemExit('desktop marketplace block not found')
          s=s.replace(old,new,1)
          old2="const mobile=await open({width:390,height:844});const mb=mobile.p.locator('#rwaMarketplaceLaunch');if(!await mb.isVisible())throw Error('mobile marketplace launcher not visible');await audit(mobile.p,'mobile initial');await mobile.p.screenshot({path:`${proof}/06-mobile-marketplace-visible.png`,fullPage:true});await mb.click();await mobile.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('assets'));"
          new2="const mobile=await open({width:390,height:844});if(await mobile.p.locator('#rwaMarketplaceLaunch:visible').count())throw Error('legacy mobile Marketplace launcher resurfaced');await audit(mobile.p,'mobile initial');await mobile.p.screenshot({path:`${proof}/06-mobile-target-root.png`,fullPage:true});await mobile.p.evaluate(()=>window.RWASuperApp.navigate('assets'));await mobile.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('assets'));"
          if old2 not in s: raise SystemExit('mobile marketplace block not found')
          s=s.replace(old2,new2,1)
          s=s.replace("marketplaceProminent:true","legacyMarketplaceLauncherAbsent:true",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ui-layout-integrity-v15-browser.mjs
          git commit -m 'test: validate layout without legacy Marketplace launcher'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
