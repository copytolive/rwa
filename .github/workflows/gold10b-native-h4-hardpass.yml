name: GOLD10B Native H4 HARD PASS Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold10b-native-h4-hardpass.yml'
      - 'backtest/gold24/NATIVE_H4_HARDPASS_KICK'

permissions:
  contents: read
  actions: read

concurrency:
  group: gold10b-native-h4-hardpass
  cancel-in-progress: true

jobs:
  verify_published_native_h4:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify already-published direct native H4 evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('backtest/gold24/runtime_native_h4')
          h=json.loads((root/'latest_native_h4_hardpass.json').read_text())
          g=json.loads((root/'latest_native_h4_gate_a.json').read_text())
          assert h['status']=='PASS'
          assert h['dataset']['timeframe']=='H4'
          assert h['dataset']['construction']=='DIRECT_SOURCE_H4_BARS_NO_RESAMPLING'
          assert int(h['candidate_evaluated_unique'])==60000
          assert int(h['native_h4_hardpass_kept'])==0
          assert g['crosscheck_pass'] is True
          assert g['timeframe']=='H4'
          assert g['construction']=='DIRECT_SOURCE_H4_BARS_NO_RESAMPLING'
          assert g['no_resampling_attested'] is True
          print('PUBLISHED_NATIVE_H4_EVIDENCE_PASS')
          print(json.dumps({
            'rows':h['dataset']['rows'],
            'candidate_evaluated_unique':h['candidate_evaluated_unique'],
            'hardpass_kept':h['native_h4_hardpass_kept'],
            'dataset_sha256':h['dataset']['dataset_sha256']
          },indent=2))
          PY
