name: MULTI CHAIN V2 Finalize Once

on:
  push:
    branches:
      - lock/multichain-v2-final-20260828

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[multichain-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lock/multichain-v2-final-20260828
          fetch-depth: 1
      - name: Patch mobile launcher overlap and harden browser acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re

          index=Path('index.html')
          s=index.read_text()
          marker='</style>\n<script id="rwaMultiChainLazyBootstrap">'
          rule='@media(max-width:680px){body.rwa-multichain-open .rwa-multichain-launch{display:none!important}}'
          if rule not in s:
              assert marker in s, 'MULTI CHAIN bootstrap style marker missing'
              s=s.replace(marker,rule+marker,1)
              index.write_text(s)

          test=Path('tools/multichain-browser.mjs')
          t=test.read_text()
          old="  if(width<=680&&Math.abs(panelBox.width-width)>2)throw Error(`${label}: mobile panel ${panelBox.width}`);"
          new=old+"\n  if(width<=680&&await page.locator('#rwaMultiChainLaunch').isVisible())throw Error(`${label}: mobile launcher must be hidden while panel is open`);"
          if 'mobile launcher must be hidden while panel is open' not in t:
              assert old in t, 'mobile geometry assertion marker missing'
              t=t.replace(old,new,1)
          old2="  if(!closedChart)throw Error(`${label}: chart changed after close`);"
          new2=old2+"\n  if(width<=680&&!(await page.locator('#rwaMultiChainLaunch').isVisible()))throw Error(`${label}: mobile launcher must return after close`);"
          if 'mobile launcher must return after close' not in t:
              assert old2 in t, 'close assertion marker missing'
              t=t.replace(old2,new2,1)
          test.write_text(t)

          protected=[
            'rwa-multichain.js',
            'rwa-multichain-engine.js',
            'rwa-multichain-registry.json',
            'tools/multichain-browser.mjs',
            '.github/workflows/multichain-browser.yml',
          ]
          lines=['MULTICHAIN_V2_LOCK=1','policy=chain-abstraction-fail-closed-v2']
          for p in protected:
              b=Path(p).read_bytes()
              lines.append(f'{hashlib.sha256(b).hexdigest()}  {p}')
          ix=index.read_text()
          m=re.search(r'(<style id="rwaMultiChainLauncherBootstrapStyle">.*?<script id="rwaMultiChainLazyBootstrap">.*?</script>)',ix,re.S)
          assert m, 'MULTI CHAIN bootstrap block missing'
          lines.append('index_bootstrap_sha256='+hashlib.sha256(m.group(1).encode()).hexdigest())
          Path('.github/multichain-v2.lock').write_text('\n'.join(lines)+'\n')
          PY
      - name: Verify patch markers
        run: |
          grep -Fq 'body.rwa-multichain-open .rwa-multichain-launch{display:none!important}' index.html
          grep -Fq 'mobile launcher must be hidden while panel is open' tools/multichain-browser.mjs
          grep -Fq 'mobile launcher must return after close' tools/multichain-browser.mjs
          test -s .github/multichain-v2.lock
      - name: Commit isolated finalization
        run: |
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git add index.html tools/multichain-browser.mjs .github/multichain-v2.lock
          git diff --cached --quiet && exit 0
          git commit -m 'fix(multichain): remove mobile launcher overlap [multichain-finalized]'
          git push origin HEAD:lock/multichain-v2-final-20260828
