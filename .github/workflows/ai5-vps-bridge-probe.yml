name: AI5 VPS Bridge Probe
on:
  push:
    branches: [main]
    paths:
      - "ai5-vps-bridge-probe/**"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gold24-production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai5-vps-bridge-probe/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai5-vps-bridge-results/$ID.json" >> "$GITHUB_OUTPUT"
      - name: Probe existing SSH bridge read-only
        env:
          HOST: ${{ secrets.GOLD24_HOST }}
          USER: ${{ secrets.GOLD24_USER }}
          KEY: ${{ secrets.GOLD24_SSH_KEY }}
          OUT: ${{ steps.req.outputs.out }}
          ID: ${{ steps.req.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")" ~/.ssh
          test -n "$HOST" && test -n "$USER" && test -n "$KEY"
          printf '%s\n' "$KEY" > ~/.ssh/ai5bridge
          chmod 600 ~/.ssh/ai5bridge
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          HOST_EQ=false
          [ "$HOST" = "109.123.239.76" ] && HOST_EQ=true
          REMOTE="$(ssh -i ~/.ssh/ai5bridge "$USER@$HOST" 'set -e; printf "webroot="; test -d /var/www/copytolive && printf yes || printf no; printf "\nscanner="; test -f /var/www/copytolive/assets/js/MarketScanner-ai5HLPerf-v7.js && printf yes || printf no; printf "\nscanner_sha="; if test -f /var/www/copytolive/assets/js/MarketScanner-ai5HLPerf-v7.js; then sha256sum /var/www/copytolive/assets/js/MarketScanner-ai5HLPerf-v7.js | cut -d" " -f1; else printf none; fi; printf "\nindex="; test -f /var/www/copytolive/index.html && printf yes || printf no; printf "\n"')"
          python3 - "$OUT" "$ID" "$HOST_EQ" "$REMOTE" <<'PY'
          import json,sys
          out,id_,host_eq,remote=sys.argv[1:5]
          d={"id":id_,"host_matches_copytolive":host_eq=="true"}
          for line in remote.splitlines():
              if "=" in line:
                  k,v=line.split("=",1); d[k]=v
          d["ok"]=d.get("webroot")=="yes" and d.get("index")=="yes"
          open(out,"w").write(json.dumps(d,indent=2)+"\n")
          PY
      - name: Commit probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}"
          test -s "$OUT"
          git config user.name "CopyToLive AI5 Public Bridge"
          git config user.email "copytolive-ai5-bridge@local.invalid"
          git add "$OUT"
          git commit -m "ai5 vps bridge probe: ${{ steps.req.outputs.id }}" || true
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Enforce
        if: always()
        shell: bash
        run: |
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); raise SystemExit(0 if d.get("ok") else 1)' "${{ steps.req.outputs.out }}"
