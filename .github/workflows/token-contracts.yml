name: RWA Token + Product RWA Contracts
on:
  push:
    branches: ["main"]
    paths:
      - "token/**"
      - ".github/workflows/token-contracts.yml"
  pull_request:
    paths:
      - "token/**"
      - ".github/workflows/token-contracts.yml"
permissions:
  contents: read
  statuses: write
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned compiler and test dependencies
        run: npm install --prefix token --ignore-scripts --no-audit --no-fund
      - name: Publish dependency status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/token-deps' -f description='Pinned token compiler/test dependencies installed'
      - name: Validate contract test sources
        run: |
          node --check token/test/contracts.test.mjs
          node --check token/test/product-rwa.test.mjs
          node --check token/deploy-guard.mjs
          node --check token/product-rwa-deploy-guard.mjs
          python -m json.tool token/config.json >/dev/null
          python -m json.tool token/product-rwa-config.json >/dev/null
          grep -Fq 'fixed total supply mismatch' token/test/contracts.test.mjs
          grep -Fq 'vesting must be zero before cliff' token/test/contracts.test.mjs
          grep -Fq 'canonical additional mintable formula mismatch' token/test/product-rwa.test.mjs
          grep -Fq 'MVP holder transfer must stay disabled' token/test/product-rwa.test.mjs
          grep -Fq 'token must not burn before delivered state' token/test/product-rwa.test.mjs
          grep -Fq 'coverage/inventory shortage must block new mint' token/test/product-rwa.test.mjs
      - name: Publish token source status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/token-test-source' -f description='Platform token + Product RWA test sources verified'
      - name: Compile and unit test all token contracts
        run: |
          npm run --prefix token verify
          test -s token/build/contracts_RWAToken_sol_RWAToken.abi
          test -s token/build/contracts_RWAToken_sol_RWAToken.bin
          test -s token/build/contracts_RWAVestingVault_sol_RWAVestingVault.abi
          test -s token/build/contracts_RWAVestingVault_sol_RWAVestingVault.bin
          test -s token/build/contracts_ProductInventoryGate_sol_ProductInventoryGate.abi
          test -s token/build/contracts_ProductInventoryGate_sol_ProductInventoryGate.bin
          test -s token/build/contracts_ProductRWA1155_sol_ProductRWA1155.abi
          test -s token/build/contracts_ProductRWA1155_sol_ProductRWA1155.bin
          test -s token/build/contracts_RedemptionManager_sol_RedemptionManager.abi
          test -s token/build/contracts_RedemptionManager_sol_RedemptionManager.bin
          test -s token/build/contracts_interfaces_IRWATreasury_sol_IRWATreasury.abi
          test -s token/build/contracts_interfaces_IRWAVesting_sol_IRWAVesting.abi
          test -s token/build/contracts_interfaces_IRWARewards_sol_IRWARewards.abi
          test -s token/build/contracts_interfaces_IRWAGovernance_sol_IRWAGovernance.abi
      - name: Verify canonical Product RWA source controls
        run: |
          grep -Fq 'MAX(0, verified - non-token reserved - outstanding - required buffer)' token/contracts/ProductInventoryGate.sol
          grep -Fq 'CoverageBreach' token/contracts/ProductInventoryGate.sol
          grep -Fq 'TransfersDisabled' token/contracts/ProductRWA1155.sol
          grep -Fq 'inventoryGate.recordMint' token/contracts/ProductRWA1155.sol
          grep -Fq 'SegregationOfDuties' token/contracts/ProductRWA1155.sol
          grep -Fq 'productRWA.burnForRedemption' token/contracts/RedemptionManager.sol
          grep -Fq 'State.Delivered' token/contracts/RedemptionManager.sol
          grep -Fq '"transfer_enabled": false' token/product-rwa-config.json
          grep -Fq '"secondary_market_enabled": false' token/product-rwa-config.json
      - name: Verify deployment guardrails remain fail closed
        run: |
          grep -Fq '"tgeEnabled": false' token/config.json
          grep -Fq '"mainnetDeploymentEnabled": false' token/config.json
          grep -Fq '"testnet_deployment_allowed": false' token/product-rwa-config.json
          grep -Fq '"mainnet_deployment_allowed": false' token/product-rwa-config.json
          if node token/deploy-guard.mjs --network=testnet >/tmp/testnet.log 2>&1; then cat /tmp/testnet.log; echo 'Incomplete platform-token config must stay blocked'; exit 1; else echo 'Incomplete platform-token testnet deployment correctly blocked'; fi
          if node token/deploy-guard.mjs --network=mainnet >/tmp/mainnet.log 2>&1; then cat /tmp/mainnet.log; echo 'Platform token mainnet must stay blocked'; exit 1; else echo 'Platform token mainnet deployment correctly blocked'; fi
          if node token/product-rwa-deploy-guard.mjs --network=testnet >/tmp/product-testnet.log 2>&1; then cat /tmp/product-testnet.log; echo 'Product RWA testnet must stay blocked until explicitly approved'; exit 1; else echo 'Product RWA testnet deployment correctly blocked'; fi
          if node token/product-rwa-deploy-guard.mjs --network=mainnet >/tmp/product-mainnet.log 2>&1; then cat /tmp/product-mainnet.log; echo 'Product RWA mainnet must stay blocked'; exit 1; else echo 'Product RWA mainnet deployment correctly blocked'; fi
      - name: Publish Product RWA contract status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/product-rwa-contracts' -f description='Canonical Product RWA mint/redeem/coverage/SoD contracts and tests pass; deployment remains OFF'
      - name: Publish token contract status
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/token-contracts' -f description='Platform PRE-TGE + Product RWA compile/tests pass; TGE/mainnet remain OFF'
      - name: Publish token failure status
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/token-contracts' -f description='Token/Product RWA contract verification failed'
