name: GOLD24 CopyToLive Exact GOLD Replay

on:
  workflow_dispatch:
    inputs:
      mc_sims:
        description: Monte Carlo simulations per strategy
        required: false
        default: '1000'
      from_date:
        description: Dukascopy H1 start date
        required: false
        default: '2003-05-05'
      to_date:
        description: Dukascopy H1 end date (exclusive)
        required: false
        default: '2026-08-28'
  push:
    paths:
      - '.github/workflows/gold24-copytolive-exact-replay.yml'
      - 'backtest/copytolive_gold/COPYTOLIVE_EXACT_KICK'
      - 'backtest/copytolive_gold/active_gold_snapshot.json'
      - 'backtest/copytolive_gold/engine.py'
      - 'backtest/copytolive_gold/fetch_dukascopy_h1.cjs'

permissions:
  contents: write

concurrency:
  group: gold24-copytolive-exact-replay
  cancel-in-progress: true

jobs:
  replay:
    name: Replay 118 active GOLD strategies
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATA_PATH: ${{ runner.temp }}/GOLD_H1_DUKASCOPY.csv
      OUT_DIR: ${{ github.workspace }}/backtest/copytolive_gold/runtime
      MC_SIMS: ${{ github.event.inputs.mc_sims || '1000' }}
      FROM_DATE: ${{ github.event.inputs.from_date || '2003-05-05' }}
      TO_DATE: ${{ github.event.inputs.to_date || '2026-08-28' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python replay dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0,<3" "pandas>=2.2,<3" "TA-Lib>=0.6,<1"

      - name: Install hosted H1 fetch dependency
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock dukascopy-node

      - name: Validate production snapshot contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, base64, hashlib, pathlib
          p=pathlib.Path('backtest/copytolive_gold/active_gold_snapshot.json')
          x=json.loads(p.read_text())
          assert x['schema']=='copytolive.gold.active.v1'
          assert x['contract']['active_gold_count']==118
          assert x['contract']['deposit_usd']==10000
          assert x['contract']['risk_usd_per_trade']==200
          assert abs(float(x['contract']['fee_rate'])-0.0016)<1e-12
          assert x['contract']['entry']=='signal_bar_close'
          assert x['contract']['intrabar_order']=='SL_BEFORE_TP'
          assert x['contract']['walk_forward']=='70/30'
          rows=x['strategies']
          assert len(rows)==118
          assert len({r['id'] for r in rows})==118
          assert {r['timeframe'] for r in rows}=={'H1'}
          for r in rows:
              raw=base64.b64decode(r['script']['content_b64'])
              assert hashlib.sha256(raw).hexdigest()==r['script']['sha256']
          print('snapshot PASS strategies=118')
          PY

      - name: Fetch GOLD H1 on GitHub-hosted runner
        run: |
          set -euo pipefail
          node backtest/copytolive_gold/fetch_dukascopy_h1.cjs "$DATA_PATH" "$FROM_DATE" "$TO_DATE" | tee "$RUNNER_TEMP/dukascopy_receipt.json"
          test -s "$DATA_PATH"
          python - <<'PY'
          import csv, os
          p=os.environ['DATA_PATH']
          with open(p,newline='') as f:
              n=sum(1 for _ in f)-1
          assert n>=10000,n
          print(f'H1 data PASS rows={n}')
          PY

      - name: Replay all 118 active GOLD strategies
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python backtest/copytolive_gold/engine.py             --snapshot backtest/copytolive_gold/active_gold_snapshot.json             --data "$DATA_PATH"             --out-dir "$OUT_DIR"             --mc-sims "$MC_SIMS"
          test -s "$OUT_DIR/copytolive_gold_replay.json"
          test -s "$OUT_DIR/copytolive_gold_replay.csv"

      - name: Exact replay acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, pathlib
          out=pathlib.Path(os.environ['OUT_DIR'])
          x=json.loads((out/'copytolive_gold_replay.json').read_text())
          rows=list(csv.DictReader((out/'copytolive_gold_replay.csv').open()))
          assert x['status']=='PASS'
          assert x['profile']=='copytolive-gold-parity-v1'
          assert x['strategies_input']==118
          assert len(x['rows'])==118
          assert len(rows)==118
          assert x['dataset_rows']>=10000
          c=x['contract']
          assert c['deposit_usd']==10000
          assert c['risk_usd_per_trade']==200
          assert abs(float(c['fee_rate'])-0.0016)<1e-12
          assert c['entry']=='signal_bar_close'
          assert c['intrabar_priority']=='SL_BEFORE_TP'
          assert c['walk_forward']=='70/30'
          g=x['github_strict_gate']
          assert g['min_trades']==300
          assert g['min_net_profit_usd']==20000
          assert abs(float(g['corr_abs_max'])-0.50)<1e-12
          assert int(x['base_gate_pass'])>=0
          assert int(x['corr_kept'])>=0
          assert int(x['strict_final_pass'])>=0
          print(json.dumps({k:v for k,v in x.items() if k!='rows'},indent=2))
          PY

      - name: Publish exact replay evidence race-safe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             backtest/copytolive_gold/runtime/copytolive_gold_replay.json             backtest/copytolive_gold/runtime/copytolive_gold_replay.csv
          if git diff --cached --quiet; then
            echo "No exact replay delta"
            exit 0
          fi
          git commit -m "chore(backtest): publish CopyToLive exact GOLD replay [skip ci]"
          for TRY in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "publish PASS try=$TRY"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((TRY * 2))
          done
          exit 1

      - name: Upload exact replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-copytolive-exact-replay
          path: |
            backtest/copytolive_gold/runtime/copytolive_gold_replay.json
            backtest/copytolive_gold/runtime/copytolive_gold_replay.csv
            ${{ runner.temp }}/dukascopy_receipt.json
          if-no-files-found: error
          retention-days: 30
