name: Realworldasset Live Runtime Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/realworldasset/**'
      - 'execution-api.js'
      - 'rwa-execution-config.json'
      - 'rwa-commerce-config.json'
      - 'launch/readiness.json'
      - 'launch/e2e-registry.json'
      - 'launch/external-gates.json'
      - 'launch/product-rwa-testnet.json'
      - '.github/workflows/realworldasset-live-runtime-gate.yml'
  push:
    branches: [main]
    paths:
      - 'execution-api.js'
      - 'rwa-execution-config.json'
      - 'rwa-commerce-config.json'
      - 'launch/readiness.json'
      - 'launch/e2e-registry.json'
      - 'launch/external-gates.json'
      - 'launch/product-rwa-testnet.json'
      - '.github/workflows/realworldasset-live-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/realworldasset/package-lock.json
      - name: Install canonical UI dependencies
        working-directory: apps/realworldasset
        run: npm ci --no-audit --no-fund
      - name: Verify live auth commerce execution contracts
        working-directory: apps/realworldasset
        run: |
          set -euo pipefail
          npm run verify:live-runtime
          npm run verify:interactions
          npm run typecheck
      - name: Build exact static export with live runtime
        working-directory: apps/realworldasset
        env:
          RWA_BASE_PATH: /rwa
          GITHUB_ACTIONS: 'true'
        run: npm run build
      - name: Verify packaged write owners and gates
        working-directory: apps/realworldasset
        run: |
          set -euo pipefail
          O=out
          test -s "$O/execution-api.js"
          test -s "$O/rwa-execution-config.json"
          test -s "$O/rwa-commerce-config.json"
          test -s "$O/launch/readiness.json"
          test -s "$O/launch/e2e-registry.json"
          test -s "$O/live-runtime-manifest.json"
          grep -Fq "const CONFIG_URL='/rwa/rwa-execution-config.json';" "$O/execution-api.js"
          grep -Fq "new URL('/rwa/launch/'+name,location.origin).href" "$O/execution-api.js"
          node --check "$O/execution-api.js"
          node -e "const m=require('./out/live-runtime-manifest.json'); if(m.safety!=='candidate endpoints are probe-only; mainnet remains machine-gated') process.exit(1)"
          echo REALWORLDASSET_LIVE_RUNTIME_BUILD_PASS

  refresh-pages-on-live-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Pages build with refreshed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
