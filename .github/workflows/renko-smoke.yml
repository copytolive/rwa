name: RWA Renko Tick Traditional

on:
  pull_request:
    paths:
      - "renko/**"
      - "tools/renko-v5-browser-smoke.mjs"
      - "tools/renko-live-smoke.mjs"
      - ".github/workflows/renko-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "tools/renko-v5-browser-smoke.mjs"
      - "tools/renko-live-smoke.mjs"
      - ".github/workflows/renko-smoke.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-renko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renko:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Renko V5 raw-tick lifetime contract
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v5.js
          node --check renko/renko-v5-auto.js
          node --check renko/archive-worker-v5.js
          node --check tools/renko-v5-browser-smoke.mjs
          node --check tools/renko-live-smoke.mjs
          test -s renko/index.html
          test -s renko/renko-v5.css
          grep -Fq "version:'5.0.0'" renko/renko-v5.js
          grep -Fq "source:'raw-trade-ticks-only'" renko/renko-v5.js
          grep -Fq "history:'raw-tick-lifetime-archives'" renko/renko-v5.js
          grep -Fq "historyScope:'oldest-available-binance-vision-raw-trade-to-live'" renko/renko-v5.js
          grep -Fq "reversalBoxes:2" renko/renko-v5.js
          grep -Fq "mode:'auto-selected-market-lifetime-raw-tick'" renko/renko-v5-auto.js
          grep -Fq '/data/spot/monthly/trades/' renko/archive-worker-v5.js
          grep -Fq '/data/spot/daily/trades/' renko/archive-worker-v5.js
          grep -Fq 'renko-v5.js?v=5' renko/index.html
          grep -Fq 'renko-v5-auto.js?v=51' renko/index.html
          grep -Fq 'TOTAL TICK HISTORY · AUTO' renko/index.html
          grep -Fq 'ALL HISTORY' renko/index.html
          grep -Fq 'first 500' renko/index.html
          for f in renko/renko-v5.js renko/renko-v5-auto.js renko/archive-worker-v5.js; do
            ! grep -Fq '/klines' "$f"
            ! grep -Fq '@kline_' "$f"
            ! grep -Fq '@aggTrade' "$f"
            ! grep -Fq 'OHLC fallback' "$f"
          done

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rwa-renko-http.log 2>&1 &
          echo $! >/tmp/rwa-renko-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-renko-http.log
          exit 1

      - name: Test V5 top-500 UI, Traditional engine and archive worker
        run: node tools/renko-v5-browser-smoke.mjs

      - name: Wait for Renko V5 GitHub Pages bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            v5="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/renko-v5.js?v=$q" || true)"
            auto="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/renko-v5-auto.js?v=$q" || true)"
            worker="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/archive-worker-v5.js?v=$q" || true)"
            if grep -Fq 'TOTAL TICK HISTORY · AUTO' <<<"$html" \
              && grep -Fq 'renko-v5-auto.js?v=51' <<<"$html" \
              && grep -Fq "version:'5.0.0'" <<<"$v5" \
              && grep -Fq "history:'raw-tick-lifetime-archives'" <<<"$v5" \
              && grep -Fq "mode:'auto-selected-market-lifetime-raw-tick'" <<<"$auto" \
              && grep -Fq '/data/spot/monthly/trades/' <<<"$worker"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify live V5 moving ticks and real archive decoding
        if: github.event_name == 'push'
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-live-smoke.mjs

      - name: Publish Renko status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-live' -f description='LIVE V5: top-500 + moving raw ticks + auto lifetime archive path PASS'

      - name: Publish Renko failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/renko-live' -f description='Live Renko V5 raw-tick lifetime gate failed'
