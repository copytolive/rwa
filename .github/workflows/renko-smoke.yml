name: RWA Renko Tick Traditional

on:
  pull_request:
    paths:
      - "renko/**"
      - "tools/renko-browser-smoke.mjs"
      - "tools/renko-live-smoke.mjs"
      - ".github/workflows/renko-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - "tools/renko-browser-smoke.mjs"
      - "tools/renko-live-smoke.mjs"
      - ".github/workflows/renko-smoke.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-renko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renko:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Renko v2 source contract
        run: |
          node --check renko/renko-v2.js
          node --check tools/renko-browser-smoke.mjs
          node --check tools/renko-live-smoke.mjs
          test -s renko/index.html
          test -s renko/renko.css
          test -s renko/renko-v2.css
          grep -Fq "version:'2.0.0'" renko/renko-v2.js
          grep -Fq "source:'raw-trade-ticks-only'" renko/renko-v2.js
          grep -Fq "method:'traditional-fixed-box'" renko/renko-v2.js
          grep -Fq "reversalBoxes:2" renko/renko-v2.js
          grep -Fq "universe:'top-500-liquidity-plus-search-all'" renko/renko-v2.js
          grep -Fq 'RENDER_LIMIT=500' renko/renko-v2.js
          grep -Fq '/api/v3/trades?symbol=' renko/renko-v2.js
          grep -Fq '@trade' renko/renko-v2.js
          grep -Fq '/api/v3/ticker/24hr' renko/renko-v2.js
          ! grep -Fq '/api/v3/klines' renko/renko-v2.js
          ! grep -Fq '@kline_' renko/renko-v2.js
          ! grep -Fq '@aggTrade' renko/renko-v2.js
          ! grep -Fq 'ATR' renko/renko-v2.js
          grep -Fq 'renko-v2.js?v=2' renko/index.html
          grep -Fq 'renko-v2.css?v=2' renko/index.html
          grep -Fq 'RAW TICK · TRADITIONAL' renko/index.html
          grep -Fq '2-BRICK REVERSAL' renko/index.html
          grep -Fq 'first 500' renko/index.html
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rwa-renko-http.log 2>&1 &
          echo $! >/tmp/rwa-renko-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-renko-http.log
          exit 1
      - name: Test top-500 Traditional Renko engine and responsive UI
        run: node tools/renko-browser-smoke.mjs
      - name: Wait for Renko v2 GitHub Pages bundle
        if: github.event_name == 'push'
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            js="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/renko-v2.js?v=$q" || true)"
            if grep -Fq 'RWA Renko' <<<"$html" \
              && grep -Fq 'renko-v2.js?v=2' <<<"$html" \
              && grep -Fq "version:'2.0.0'" <<<"$js" \
              && grep -Fq "source:'raw-trade-ticks-only'" <<<"$js" \
              && grep -Fq "method:'traditional-fixed-box'" <<<"$js" \
              && grep -Fq "reversalBoxes:2" <<<"$js" \
              && grep -Fq 'RENDER_LIMIT=500' <<<"$js"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Verify live top-500 raw-tick Renko page and moving price
        if: github.event_name == 'push'
        env:
          RWA_RENKO_LIVE_URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: node tools/renko-live-smoke.mjs
      - name: Publish Renko status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-live' -f description='LIVE top-500 crypto Traditional Renko + moving raw ticks + desktop/mobile PASS'
      - name: Publish Renko failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/renko-live' -f description='Live Renko v2 top-500/moving-tick gate failed'
