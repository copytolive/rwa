name: RWA Renko Private Traditional

on:
  pull_request:
    paths:
      - "renko/**"
      - ".github/workflows/renko-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "renko/**"
      - ".github/workflows/renko-smoke.yml"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-renko-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renko:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Renko v4 source contract
        run: |
          set -euo pipefail
          node --check renko/renko-v4.js
          test -s renko/index.html
          test -s renko/renko-v3.css
          grep -Fq 'renko-v4.js?v=4' renko/index.html
          grep -Fq 'PRIVATE FULL HISTORY' renko/index.html
          grep -Fq 'ALL HISTORY' renko/index.html
          grep -Fq 'Traditional 2-brick' renko/index.html
          grep -Fq 'const TOP_VISIBLE=500' renko/renko-v4.js
          grep -Fq 'const PAGE=25000' renko/renko-v4.js
          grep -Fq 'offset:String(offset)' renko/renko-v4.js
          grep -Fq '/api/charting/hyperliquid/renko/' renko/renko-v4.js
          grep -Fq '/api/charting/hyperliquid/stream/' renko/renko-v4.js
          grep -Fq '@trade' renko/renko-v4.js
          ! grep -Fq '/api/v3/klines' renko/renko-v4.js
          ! grep -Fq '@aggTrade' renko/renko-v4.js

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 0.0.0.0 >/tmp/rwa-renko-http.log 2>&1 &
          echo $! >/tmp/rwa-renko-http.pid
          for i in {1..20}; do curl -fsS http://localhost:4173/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-renko-http.log
          exit 1

      - name: Test private full-history UI, top 500 and responsive navigation
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://localhost:4173/renko/',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.RWARenkoV4===true,null,{timeout:10000});
            await page.waitForFunction(()=>{
              const n=Number((document.querySelector('#brickCount')?.textContent||'0').replace(/[^0-9]/g,''));
              return n>5000 && (document.querySelector('#historyIntegrity')?.textContent||'').includes('REAL_MARKET_OBSERVATIONS');
            },null,{timeout:120000});
            const desktop=await page.evaluate(()=>({
              bricks:Number((document.querySelector('#brickCount').textContent||'0').replace(/[^0-9]/g,'')),
              pairs:document.querySelectorAll('#pairList .pair-row').length,
              mode:document.querySelector('#modePill')?.textContent,
              source:document.querySelector('#sourceText')?.textContent,
              integrity:document.querySelector('#historyIntegrity')?.textContent,
              coverage:document.querySelector('#historyCoverage')?.textContent,
              from:document.querySelector('#historyFrom')?.textContent,
              to:document.querySelector('#historyTo')?.textContent,
              width:document.documentElement.scrollWidth,inner:innerWidth,
              canvas:document.querySelector('#renkoCanvas')?.getBoundingClientRect().toJSON()
            }));
            if(desktop.bricks<=5000) throw Error('private full history missing');
            if(desktop.pairs!==500) throw Error('top 500 not rendered: '+desktop.pairs);
            if(!desktop.mode.includes('PRIVATE FULL HISTORY')) throw Error('private mode missing');
            if(!desktop.integrity.includes('REAL_MARKET_OBSERVATIONS')) throw Error('history integrity missing');
            if(!String(desktop.coverage).startsWith('ALL')) throw Error('ALL HISTORY is not default');
            if(desktop.from==='—'||desktop.to==='—') throw Error('history dates missing');
            if(desktop.width>desktop.inner+2) throw Error('desktop overflow');
            if(!(desktop.canvas?.width>600&&desktop.canvas?.height>250)) throw Error('canvas unusable');
            await page.click('#historyStart');
            await page.waitForFunction(()=>document.querySelector('#historyCoverage').textContent.startsWith('WINDOW'));
            await page.click('#historyLive');
            await page.click('#historyAll');
            await page.waitForFunction(()=>document.querySelector('#historyCoverage').textContent.startsWith('ALL'));
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(500);
            const mobile=await page.evaluate(()=>({width:document.documentElement.scrollWidth,inner:innerWidth,chart:document.querySelector('#chartWrap')?.getBoundingClientRect().width,pairs:getComputedStyle(document.querySelector('.markets')).display,button:getComputedStyle(document.querySelector('#openPairs')).display}));
            if(mobile.width>mobile.inner+2||mobile.chart>mobile.inner+2) throw Error('mobile overflow');
            if(mobile.button==='none') throw Error('mobile pair button hidden');
            if(errors.length) throw Error('page errors: '+errors.join(' | '));
            console.log('RENKO_V4_BROWSER_PASS',desktop,mobile);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Wait for Renko v4 GitHub Pages bundle
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 15 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/?v=$q" || true)"
            js="$(curl --connect-timeout 5 --max-time 15 -fsSL "https://narzulalistiqlal.github.io/rwa/renko/renko-v4.js?v=$q" || true)"
            if grep -Fq 'renko-v4.js?v=4' <<<"$html" \
              && grep -Fq 'PRIVATE FULL HISTORY' <<<"$html" \
              && grep -Fq 'const TOP_VISIBLE=500' <<<"$js" \
              && grep -Fq 'const PAGE=25000' <<<"$js"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"

      - name: Verify live GitHub Pages full history and moving venue price
        if: github.event_name == 'push'
        env:
          URL: https://narzulalistiqlal.github.io/rwa/renko/?v=${{ github.run_id }}
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1365,height:768}});
            const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(process.env.URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>window.RWARenkoV4===true,null,{timeout:15000});
            await page.waitForFunction(()=>Number((document.querySelector('#brickCount')?.textContent||'0').replace(/[^0-9]/g,''))>5000,null,{timeout:120000});
            await page.waitForFunction(()=>String(document.querySelector('#feedPill b')?.textContent||'').includes('LIVE'),null,{timeout:60000});
            const before=await page.evaluate(()=>({price:document.querySelector('#lastPrice')?.textContent,bricks:Number((document.querySelector('#brickCount')?.textContent||'0').replace(/[^0-9]/g,'')),integrity:document.querySelector('#historyIntegrity')?.textContent,pairs:document.querySelectorAll('#pairList .pair-row').length}));
            let moved=false;
            for(let i=0;i<30;i++){await page.waitForTimeout(1000);const p=await page.textContent('#lastPrice');if(p&&p!==before.price&&p!=='—'){moved=true;break}}
            const after=await page.evaluate(()=>({price:document.querySelector('#lastPrice')?.textContent,feed:document.querySelector('#feedPill b')?.textContent,health:document.querySelector('#tickHealth')?.textContent,width:document.documentElement.scrollWidth,inner:innerWidth}));
            if(before.bricks<=5000) throw Error('live full history absent');
            if(before.pairs!==500) throw Error('live top 500 absent');
            if(!String(before.integrity).includes('REAL_MARKET_OBSERVATIONS')) throw Error('live history source unverified');
            if(!moved) throw Error(`live venue price did not change in observation window: ${before.price}`);
            if(after.width>after.inner+2) throw Error('live horizontal overflow');
            if(errors.length) throw Error('live page errors: '+errors.join(' | '));
            console.log('RENKO_V4_LIVE_PASS',before,after);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Publish Renko status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/renko-live' -f description='Private full-history Traditional Renko + top 500 + moving live venue price PASS'

      - name: Publish Renko failure
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/renko-live' -f description='Renko private full-history/live gate failed'
