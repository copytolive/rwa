name: Renko V5.4 Public History Verification
on:
  pull_request:
    paths:
      - 'tools/renko-v54-public-history-verify.mjs'
      - '.github/workflows/renko-v54-public-history-verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify public V5.4 total history
        run: node tools/renko-v54-public-history-verify.mjs
