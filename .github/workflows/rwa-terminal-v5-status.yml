name: RWA Terminal V5 Status Export
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "app.js"
      - "chart-core.js"
      - "rwa-live-home-v1.js"
      - "rwa-live-home-v1.css"
      - "rwa-terminal-v5.js"
      - "rwa-terminal-v5.css"
      - "rwa-multichain.js"
      - "rwa-multichain-engine.js"
      - "rwa-multichain-registry.json"
      - "execution-api.js"
      - "exchange-core.js"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Deploy Real World Asset Target V4"
      - "RWA Target V4 Browser Gate"
      - "Real World Asset V4 Public Page-by-Page Audit"
      - "RWA Root Market Stability"
      - "Real World Asset V4 UI Final"
      - "RWA Security Gate"
      - "RWA Trading Release Candidate"
    types: [completed]

concurrency:
  group: rwa-terminal-v5-status
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      OUT: validation/terminal-v5-20260903/status.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait exact SHA
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          names='["Deploy Real World Asset Target V4","RWA Target V4 Browser Gate","Real World Asset V4 Public Page-by-Page Audit","RWA Root Market Stability","Real World Asset V4 UI Final","RWA Security Gate","RWA Trading Release Candidate"]'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100" > /tmp/runs.json
          jq --argjson names "$names" '{target_sha:env.TARGET_SHA,observed_at:(now|todateiso8601),workflows:[.workflow_runs[]|select(.name as $n|$names|index($n))|{name,id,status,conclusion,head_sha,html_url,created_at,updated_at}]}' /tmp/runs.json > "$OUT"
          count="$(jq '.workflows|map(.name)|unique|length' "$OUT")"
          pending="$(jq '[.workflows[]|select(.status!="completed")]|length' "$OUT")"
          echo "count=$count pending=$pending"
          jq '. + {complete:((.workflows|map(.name)|unique|length)>=7 and ([.workflows[]|select(.status!="completed")]|length)==0),all_success:((.workflows|map(.name)|unique|length)>=7 and ([.workflows[]|select(.conclusion!="success")]|length)==0)}' "$OUT" > "$OUT.tmp"
          mv "$OUT.tmp" "$OUT"
          cat "$OUT"
          if [ "$(jq -r '.all_success' "$OUT")" = "true" ]; then
            echo "publish_status=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_status=false" >> "$GITHUB_OUTPUT"
            echo "Exact SHA is not fully green; preserve the last published green certification receipt."
          fi
      - name: Publish
        if: steps.collect.outputs.publish_status == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name terminal-v5-cert-bot
          git config user.email actions@users.noreply.github.com
          git add "$OUT"
          git commit -m "chore(validation): publish terminal V5 status [skip ci]"
          for i in $(seq 1 8); do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((i*3))
          done
          exit 1
