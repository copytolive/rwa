name: RWA 24x7 Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    branches: ["main"]
    paths:
      - "monitor/config.json"
      - "monitor/monitor.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: rwa-monitor
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-data monitor
        run: python monitor/monitor.py
      - name: Validate monitor output
        run: |
          python -m json.tool monitor/config.json >/dev/null
          python -m json.tool monitor/status.json >/dev/null
          python - <<'PY'
          import json
          s=json.load(open('monitor/status.json'))
          assert 'providers' in s and 'alerts' in s and 'active_alerts' in s and 'copy_signals' in s
          assert 'private key' in s.get('note','').lower()
          assert 'hyperliquid' in s['providers'] and 'coinbase' in s['providers'] and 'kraken' in s['providers']
          assert s.get('market_data_provider')
          print('24x7 monitor PASS:', s.get('market_data_provider'))
          PY
      - name: Persist changed status
        run: |
          if git diff --quiet -- monitor/status.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor/status.json
          git commit -m 'chore: refresh 24x7 monitor status [skip ci]'
          git push

  instant-ui-qa:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[QA-INSTANT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate instant UI source
        run: |
          node --check app.js
          node --check mobile.js
          grep -Fq 'instantChartBoot' mobile.js
          grep -Fq 'warmConnections' mobile.js
          grep -Fq 'mobile.js?v=7' index.html
          grep -Fq 'rel="preload" href="mobile.js?v=7"' index.html
      - name: Report source pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "INSTANT UI SOURCE PASS. Syntax is valid; chart boot no longer waits for market-universe REST and feature assets are preloaded/warmed in parallel."
      - name: Verify GitHub Pages bundle
        run: |
          ok=0
          for i in {1..30}; do
            q="${GITHUB_RUN_ID}-${i}"
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" | grep -Fq 'mobile.js?v=7' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" | grep -Fq 'instantChartBoot' && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" | grep -Fq 'warmConnections'; then
              ok=1; break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report production success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "INSTANT UI PRODUCTION SUCCESS. GitHub Pages is serving mobile.js v7 with immediate fallback/cached chart paint, immediate TradingView start, duplicate chart reload suppression, and parallel feature warmup."
