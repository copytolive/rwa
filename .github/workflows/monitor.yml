name: RWA 24x7 Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "monitor/config.json"
      - "monitor/monitor.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: rwa-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RWA Execution API once
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(); s=re.sub(r'mobile\.js\?v=\d+','mobile.js?v=12',s)
          marker='<script src="realtime-core.js?v=2"></script>'
          block='''<script src="realtime-core.js?v=2"></script>\n<script src="execution-api.js?v=1"></script>\n<script src="execution-ops-bridge.js?v=1"></script>\n<script src="execution-ui.js?v=1"></script>\n<script src="suite-execution-patch.js?v=5"></script>'''
          if 'execution-api.js?v=1' not in s:
              if marker not in s: raise SystemExit('index realtime marker missing')
              s=s.replace(marker,block,1)
          p.write_text(s)
          p=Path('mobile.js'); s=p.read_text().replace("suite-nav.js?v=1","suite-nav.js?v=2"); p.write_text(s)
          p=Path('realtime-core.js'); s=p.read_text().replace("suite-nav.js?v=1","suite-nav.js?v=2").replace("suite-execution-patch.js?v=4","suite-execution-patch.js?v=5")
          if "execution-api.js?v=1" not in s:
              s=s.replace("'walletconnect.js?v=2'","'execution-api.js?v=1','execution-ops-bridge.js?v=1','execution-ui.js?v=1','walletconnect.js?v=2'",1)
          p.write_text(s)
          p=Path('suite-execution-patch.js'); s=p.read_text()
          if 'if(window.RWAExecutionBridge)return;' not in s:s=s.replace("'use strict';","'use strict';\nif(window.RWAExecutionBridge)return;",1)
          p.write_text(s)
          p=Path('.github/workflows/pages.yml'); s=p.read_text()
          if 'node --check execution-api.js' not in s:s=s.replace('          node --check mobile.js\n','          node --check mobile.js\n          node --check execution-api.js\n          node --check execution-ops-bridge.js\n          node --check execution-ui.js\n',1)
          if '          test -s execution-api.js\n' not in s:s=s.replace('          test -s mobile.css\n','          test -s mobile.css\n          test -s execution-api.js\n          test -s execution-ops-bridge.js\n          test -s execution-ui.js\n          test -s rwa-execution-config.json\n          test -s EXECUTION_API.md\n',1)
          if 'python -m json.tool rwa-execution-config.json' not in s:s=s.replace('          python -m json.tool rwa-assets.json >/dev/null\n','          python -m json.tool rwa-assets.json >/dev/null\n          python -m json.tool rwa-execution-config.json >/dev/null\n',1)
          if 'grep -Fq "approveAgent" execution-api.js' not in s:s=s.replace('          grep -Fq "suite-nav.js" mobile.js\n','          grep -Fq "RWAExecutionAPI" execution-api.js\n          grep -Fq "approveAgent" execution-api.js\n          grep -Fq "execution-api.js?v=1" index.html\n          grep -Fq "execution-ops-bridge.js?v=1" index.html\n          grep -Fq "suite-execution-patch.js?v=5" index.html\n          grep -Fq "execution-api.js?v=1" suite-nav.js\n          grep -Fq "execution-ops-bridge.js?v=1" suite-nav.js\n          grep -Fq "suite-nav.js" mobile.js\n',1)
          p.write_text(s)
          PY
          node --check execution-api.js
          node --check execution-ops-bridge.js
          node --check execution-ui.js
          node --check suite-execution-patch.js
          python -m json.tool rwa-execution-config.json >/dev/null
          grep -Fq 'execution-api.js?v=1' index.html
          grep -Fq 'suite-nav.js?v=2' mobile.js
          rm -f .github/workflows/install-execution-api.yml
          cat > .github/workflows/monitor.yml <<'YAML'
          name: RWA 24x7 Monitor

          on:
            schedule:
              - cron: '*/5 * * * *'
            workflow_dispatch:
            push:
              branches: ["main"]
              paths:
                - "monitor/config.json"
                - "monitor/monitor.py"
                - ".github/workflows/monitor.yml"

          permissions:
            contents: write

          concurrency:
            group: rwa-monitor
            cancel-in-progress: true

          jobs:
            monitor:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - name: Run public-data monitor
                  run: python monitor/monitor.py
                - name: Validate monitor output
                  run: |
                    python -m json.tool monitor/config.json >/dev/null
                    python -m json.tool monitor/status.json >/dev/null
                    python - <<'PY2'
                    import json
                    s=json.load(open('monitor/status.json'))
                    assert 'providers' in s and 'alerts' in s and 'active_alerts' in s and 'copy_signals' in s
                    assert 'private key' in s.get('note','').lower()
                    assert 'hyperliquid' in s['providers'] and 'coinbase' in s['providers'] and 'kraken' in s['providers']
                    assert s.get('market_data_provider')
                    print('24x7 monitor PASS:', s.get('market_data_provider'))
                    PY2
                - name: Persist changed status
                  run: |
                    if git diff --quiet -- monitor/status.json; then exit 0; fi
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add monitor/status.json
                    git commit -m 'chore: refresh 24x7 monitor status [skip ci]'
                    git push
          YAML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile.js realtime-core.js suite-execution-patch.js .github/workflows/pages.yml .github/workflows/monitor.yml .github/workflows/install-execution-api.yml
          git commit -m 'feat: install Hyperliquid-style execution API bootstrap'
          git push
      - name: Run public-data monitor
        run: python monitor/monitor.py
      - name: Validate monitor output
        run: |
          python -m json.tool monitor/config.json >/dev/null
          python -m json.tool monitor/status.json >/dev/null
          python - <<'PY'
          import json
          s=json.load(open('monitor/status.json'))
          assert 'providers' in s and 'alerts' in s and 'active_alerts' in s and 'copy_signals' in s
          assert 'private key' in s.get('note','').lower()
          assert 'hyperliquid' in s['providers'] and 'coinbase' in s['providers'] and 'kraken' in s['providers']
          assert s.get('market_data_provider')
          print('24x7 monitor PASS:', s.get('market_data_provider'))
          PY
      - name: Persist changed status
        run: |
          if git diff --quiet -- monitor/status.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor/status.json
          git commit -m 'chore: refresh 24x7 monitor status [skip ci]'
          git push
