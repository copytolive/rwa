name: RWA 24x7 Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "monitor/config.json"
      - "monitor/monitor.py"
      - ".github/workflows/monitor.yml"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: rwa-monitor-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-data monitor
        run: python monitor/monitor.py
      - name: Validate monitor output
        run: |
          python -m json.tool monitor/config.json >/dev/null
          python -m json.tool monitor/status.json >/dev/null
          python - <<'PY'
          import json
          s=json.load(open('monitor/status.json'))
          assert 'providers' in s and 'alerts' in s and 'active_alerts' in s and 'copy_signals' in s
          assert 'private key' in s.get('note','').lower()
          assert 'hyperliquid' in s['providers'] and 'coinbase' in s['providers'] and 'kraken' in s['providers']
          assert s.get('market_data_provider')
          print('24x7 monitor PASS:', s.get('market_data_provider'))
          PY
      - name: Persist changed status
        run: |
          if git diff --quiet -- monitor/status.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor/status.json
          git commit -m 'chore: refresh 24x7 monitor status [skip ci]'
          git push

  verify_zero_wait:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[QA-ZEROWAIT]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-wait source
        run: |
          node --check app.js
          node --check mobile.js
          grep -Fq 'app.js?v=8' index.html
          grep -Fq 'mobile.js?v=9' index.html
          grep -Fq 'external-embedding/embed-widget-advanced-chart.js' index.html
          grep -Fq 'setTimeout(loadMarkets,450)' app.js
          ! grep -Fq 'Loading live candlesticks' app.js
          ! grep -Fq 'Loading professional market chart' index.html
          ! grep -Fq 'preload" href="suite-ui.js' index.html
          ! grep -Fq 'preload" href="suite.js' index.html
          ! grep -Fq 'preload" href="suite-nav.js' index.html
      - name: Verify live GitHub Pages bundle
        run: |
          ok=0
          for i in {1..30}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            mob="$(curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" || true)"
            app="$(curl -fsSL "https://narzulalistiqlal.github.io/rwa/app.js?v=$q" || true)"
            if printf '%s' "$html" | grep -Fq 'mobile.js?v=9' && \
               printf '%s' "$html" | grep -Fq 'external-embedding/embed-widget-advanced-chart.js' && \
               ! printf '%s' "$html" | grep -Fq 'preload" href="suite-ui.js' && \
               printf '%s' "$mob" | grep -Fq 'rwaIdleSuiteWarm' && \
               printf '%s' "$app" | grep -Fq 'setTimeout(loadMarkets,450)' && \
               ! printf '%s' "$app" | grep -Fq 'Loading live candlesticks'; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "ZERO-WAIT PRODUCTION SUCCESS. GitHub Pages now starts TradingView directly from parsed HTML, paints cached/neutral canvas immediately, delays market-universe REST off the critical path, removes visible chart loading states, and lazy/idle-loads heavy Social/Hub/Wallet/Risk modules instead of competing with first paint."
