name: RWA 24x7 Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "monitor/config.json"
      - "monitor/monitor.py"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: rwa-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public-data monitor
        run: python monitor/monitor.py
      - name: Validate monitor output
        run: |
          python -m json.tool monitor/config.json >/dev/null
          python -m json.tool monitor/status.json >/dev/null
          python - <<'PY'
          import json
          s=json.load(open('monitor/status.json'))
          assert 'providers' in s and 'alerts' in s and 'active_alerts' in s and 'copy_signals' in s
          assert 'private key' in s.get('note','').lower()
          assert 'hyperliquid' in s['providers'] and 'coinbase' in s['providers'] and 'kraken' in s['providers']
          assert s.get('market_data_provider')
          print('24x7 monitor PASS:', s.get('market_data_provider'))
          PY
      - name: Persist material status changes only
        run: |
          if git diff --quiet -- monitor/status.json; then
            echo 'MONITOR_MATERIAL_CHANGE=false reason=identical-bytes'
            exit 0
          fi
          python - <<'PY'
          import copy, json, pathlib, subprocess

          path='monitor/status.json'
          try:
              old=json.loads(subprocess.check_output(['git','show',f'HEAD:{path}'], text=True))
          except Exception:
              old={}
          new=json.load(open(path))

          def normalize(value):
              x=copy.deepcopy(value)
              if not isinstance(x,dict):
                  return x
              x.pop('updated_at',None)
              providers=x.get('providers')
              if isinstance(providers,dict):
                  for p in providers.values():
                      if isinstance(p,dict):
                          p.pop('latency_ms',None)
                          p.pop('error',None)
              active=x.get('active_alerts')
              if isinstance(active,list):
                  for row in active:
                      if isinstance(row,dict):
                          row.pop('price',None)
                          row.pop('change',None)
                          row.pop('volume',None)
                          row.pop('observed_at',None)
                          row.pop('updated_at',None)
              copy_errors=x.get('copy_errors')
              if isinstance(copy_errors,list):
                  for row in copy_errors:
                      if isinstance(row,dict):
                          row.pop('error',None)
                          row.pop('message',None)
                          row.pop('observed_at',None)
              return x

          material = normalize(old) != normalize(new)
          pathlib.Path('/tmp/monitor-material-change').write_text('1' if material else '0')
          print(f'MONITOR_MATERIAL_CHANGE={str(material).lower()}')
          if not material:
              subprocess.run(['git','checkout','--',path],check=True)
          PY
          if [ "$(cat /tmp/monitor-material-change)" != "1" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add monitor/status.json
          git commit -m 'chore: refresh material 24x7 monitor state [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
