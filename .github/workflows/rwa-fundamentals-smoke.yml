name: RWA Income Fundamentals Smoke

on:
  pull_request:
    paths:
      - "index.html"
      - "superapp-v5.js"
      - "rwa-fundamentals.js"
      - "rwa-fundamentals.css"
      - "rwa-verify-client.js"
      - "product-os-mobile-contract-v3.js"
      - "tools/rwa-verify.mjs"
      - "tools/rwa-evidence-policy.mjs"
      - "tools/rwa-fundamentals-browser.mjs"
      - "rwa-assets.json"
      - ".github/workflows/rwa-fundamentals-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "superapp-v5.js"
      - "rwa-fundamentals.js"
      - "rwa-fundamentals.css"
      - "rwa-verify-client.js"
      - "product-os-mobile-contract-v3.js"
      - "tools/rwa-verify.mjs"
      - "tools/rwa-evidence-policy.mjs"
      - "tools/rwa-fundamentals-browser.mjs"
      - "rwa-assets.json"
      - ".github/workflows/rwa-fundamentals-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-income-fundamentals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source, lazy-load and verification contracts
        run: |
          node --check superapp-v5.js
          node --check rwa-fundamentals.js
          node --check rwa-verify-client.js
          node --check product-os-mobile-contract-v3.js
          node --check tools/rwa-verify.mjs
          node --check tools/rwa-evidence-policy.mjs
          node --check tools/rwa-fundamentals-browser.mjs
          python -m json.tool rwa-assets.json >/dev/null
          test "$(grep -o '<script src=' index.html | wc -l | tr -d ' ')" = "6"
          ! grep -Fq 'rwa-fundamentals.css' index.html
          ! grep -Fq 'rwa-fundamentals.js' index.html
          node <<'NODE'
          const fs=require('fs');
          const files={
            super:fs.readFileSync('superapp-v5.js','utf8'),
            fund:fs.readFileSync('rwa-fundamentals.js','utf8'),
            verify:fs.readFileSync('tools/rwa-verify.mjs','utf8'),
            policy:fs.readFileSync('tools/rwa-evidence-policy.mjs','utf8'),
            client:fs.readFileSync('rwa-verify-client.js','utf8'),
            contract:fs.readFileSync('product-os-mobile-contract-v3.js','utf8')
          };
          const required=[
            ['lazy loader function','super','ensureFundamentals()'],
            ['lazy CSS','super',"loadStyleOnce('rwa-fundamentals.css?v=1'"],
            ['lazy JS','super',"loadScriptOnce('rwa-fundamentals.js?v=1'"],
            ['asset fundamentals action','super','legacy-fundamentals'],
            ['runtime','fund',"runtime:'canonical-root-income-fundamentals-v1'"],
            ['tabs','fund',"['overview','income','financials','valuation','asset','holders','documents','calendar','audit']"],
            ['no fake income','fund','No verified income rights for this market'],
            ['draft label','fund','DRAFT · UNVERIFIED'],
            ['yield source','fund','Where does my yield come from?'],
            ['income evidence gate','verify','Income-bearing RWA requires public HTTPS income-right evidence'],
            ['supplemental probes','verify','fundamentals_evidence_probes'],
            ['public probe API','policy','probePublicEvidence'],
            ['reviewer UI income gate','client','INCOME EVIDENCE REQUIRED'],
            ['fundamentals payload capture','client','const fundamentals=d?.fundamentals'],
            ['fundamentals reviewer payload','client','fundamentals,reviewer:wallet()'],
            ['legacy asset command compatibility','contract',"tag==='ASSET'"]
          ];
          for(const [name,key,needle] of required){
            if(!files[key].includes(needle)){
              console.error(`MISSING CONTRACT: ${name} :: ${needle}`);
              process.exit(1);
            }
            console.log(`PASS ${name}`);
          }
          if(files.fund.includes('window.location.href'))throw Error('Fundamentals must not navigate away from canonical root');
          if(files.contract.includes("location.href='../asset"))throw Error('Product OS contract must not navigate to /asset');
          console.log('PASS lazy canonical-root no-navigation contract');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start deterministic canonical site
        run: |
          mkdir -p /tmp/rwa-fund-site/rwa
          cp -a . /tmp/rwa-fund-site/rwa/
          cd /tmp/rwa-fund-site
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rwa-fund-http.log 2>&1 &
          echo $! >/tmp/rwa-fund-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-fund-http.log
          exit 1

      - name: Browser proof desktop and mobile lazy integration
        env:
          RWA_BASE_URL: http://127.0.0.1:4173/rwa/
        run: node tools/rwa-fundamentals-browser.mjs

      - name: Publish source status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/fundamentals-source' -f description='Lazy Income + NAV + evidence workspace browser PASS'

      - name: Wait for Pages and verify live canonical root
        if: github.event_name == 'push'
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/?v=$q" || true)"
            super="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/superapp-v5.js?v=$q" || true)"
            js="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/rwa-fundamentals.js?v=$q" || true)"
            css="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://copytolive.github.io/rwa/rwa-fundamentals.css?v=$q" || true)"
            if ! grep -Fq 'rwa-fundamentals.js' <<<"$html" \
              && ! grep -Fq 'rwa-fundamentals.css' <<<"$html" \
              && grep -Fq 'ensureFundamentals()' <<<"$super" \
              && grep -Fq "loadScriptOnce('rwa-fundamentals.js?v=1'" <<<"$super" \
              && grep -Fq "runtime:'canonical-root-income-fundamentals-v1'" <<<"$js" \
              && grep -Fq 'Where does my yield come from?' <<<"$js" \
              && grep -Fq 'Integrated RWA Income & Fundamentals workspace' <<<"$css"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          RWA_BASE_URL='https://copytolive.github.io/rwa/' node tools/rwa-fundamentals-browser.mjs

      - name: Publish live status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/fundamentals-live' -f description='Live /rwa/ lazy Income Fundamentals desktop/mobile PASS'

      - name: Publish failure status
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/fundamentals-source' -f description='RWA fundamentals source/browser verification failed'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/fundamentals-live' -f description='RWA fundamentals live /rwa/ verification failed'
