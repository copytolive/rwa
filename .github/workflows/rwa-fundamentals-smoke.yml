name: RWA Income Fundamentals Smoke

on:
  pull_request:
    paths:
      - "rwa-fundamentals.js"
      - "rwa-fundamentals.css"
      - "rwa-verify-client.js"
      - "tools/rwa-verify.mjs"
      - "tools/rwa-evidence-policy.mjs"
      - "tools/rwa-fundamentals-lazy-browser.mjs"
      - "rwa-assets.json"
      - ".github/workflows/rwa-fundamentals-smoke.yml"
  push:
    branches: ["main"]
    paths:
      - "rwa-fundamentals.js"
      - "rwa-fundamentals.css"
      - "rwa-verify-client.js"
      - "tools/rwa-verify.mjs"
      - "tools/rwa-evidence-policy.mjs"
      - "tools/rwa-fundamentals-lazy-browser.mjs"
      - "rwa-assets.json"
      - ".github/workflows/rwa-fundamentals-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwa-income-fundamentals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate source and evidence contracts
        run: |
          node --check rwa-fundamentals.js
          node --check rwa-verify-client.js
          node --check tools/rwa-verify.mjs
          node --check tools/rwa-evidence-policy.mjs
          node --check tools/rwa-fundamentals-lazy-browser.mjs
          python -m json.tool rwa-assets.json >/dev/null
          node <<'NODE'
          const fs=require('fs');
          const files={
            index:fs.readFileSync('index.html','utf8'),
            fund:fs.readFileSync('rwa-fundamentals.js','utf8'),
            verify:fs.readFileSync('tools/rwa-verify.mjs','utf8'),
            policy:fs.readFileSync('tools/rwa-evidence-policy.mjs','utf8'),
            client:fs.readFileSync('rwa-verify-client.js','utf8')
          };
          const required=[
            ['runtime','fund',"runtime:'canonical-root-income-fundamentals-v1'"],
            ['tabs','fund',"['overview','income','financials','valuation','asset','holders','documents','calendar','audit']"],
            ['no fake income','fund','No verified income rights for this market'],
            ['draft label','fund','DRAFT · UNVERIFIED'],
            ['yield source','fund','Where does my yield come from?'],
            ['income evidence gate','verify','Income-bearing RWA requires public HTTPS income-right evidence'],
            ['supplemental probes','verify','fundamentals_evidence_probes'],
            ['public probe API','policy','probePublicEvidence'],
            ['reviewer UI income gate','client','INCOME EVIDENCE REQUIRED'],
            ['fundamentals payload capture','client','const fundamentals=d?.fundamentals'],
            ['fundamentals reviewer payload','client','fundamentals,reviewer:wallet()']
          ];
          for(const [name,key,needle] of required){
            if(!files[key].includes(needle))throw Error(`MISSING CONTRACT: ${name} :: ${needle}`);
            console.log(`PASS ${name}`);
          }
          if(files.fund.includes('window.location.href'))throw Error('Fundamentals must not navigate away from canonical root');
          if(files.index.includes('rwa-fundamentals.js?v=1')||files.index.includes('rwa-fundamentals.css?v=1'))throw Error('Fundamentals must remain lazy and must not expand the root startup payload');
          console.log('PASS lazy-root fundamentals contract');
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start deterministic root site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/rwa-fund-http.log 2>&1 &
          echo $! >/tmp/rwa-fund-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-fund-http.log
          exit 1
      - name: Browser proof lazy desktop and mobile
        env:
          RWA_BASE_URL: http://127.0.0.1:4173/
        run: node tools/rwa-fundamentals-lazy-browser.mjs
