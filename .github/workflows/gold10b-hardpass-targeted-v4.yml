name: GOLD10B Targeted HARD PASS Search v4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold10b-hardpass-targeted-v4.yml'

permissions:
  contents: read

concurrency:
  group: gold10b-hardpass-targeted-v4
  cancel-in-progress: true

jobs:
  deprecated_duplicate_lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop duplicate non-authoritative v4 lane
        run: |
          echo "DEPRECATED_DUPLICATE_V4=PASS"
          echo "Authoritative lane: GOLD10B HARD PASS Frequency v4"
