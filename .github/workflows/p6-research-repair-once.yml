name: P6 Research Repair Once
on:
  push:
    branches: ["fix/p6-research-embed-contract-20260827"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p6-research-repair-once
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p6-research-embed-contract-20260827
          fetch-depth: 0
      - name: Repair P6 and version-parity audits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('superapp-v5.js')
          s=p.read_text()
          old="const toolUrl=`${tab}/?embed=1&v=${tab==='renko'?'142':'1'}&symbol=${encodeURIComponent(sym)}`;"
          new="const toolUrl=`${tab}/?embed=1&symbol=${encodeURIComponent(sym)}&v=${tab==='renko'?'142':'1'}`;"
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Expected P6 toolUrl contract not found')

          p=Path('tools/superapp-v5-audit.mjs')
          s=p.read_text()
          old_cache='sw.includes("CACHE=\'rwa-superapp-v5-shell-13\'")'
          new_cache="/const CACHE='rwa-superapp-v5-shell-\\d+'/.test(sw)"
          if old_cache in s:
              s=s.replace(old_cache,new_cache,1)
          elif new_cache not in s:
              raise SystemExit('Expected stale SW cache assertion not found')
          old_assets="need(html.includes('superapp-v5.css?v=13')&&html.includes('superapp-v5.js?v=13')&&html.includes('manifest.webmanifest'),'index V6 assets missing');"
          new_assets="const superCssRef=html.match(/superapp-v5\\.css\\?v=\\d+/)?.[0],superJsRef=html.match(/superapp-v5\\.js\\?v=\\d+/)?.[0]; need(superCssRef&&superJsRef&&html.includes('manifest.webmanifest')&&sw.includes(`./${superCssRef}`)&&sw.includes(`./${superJsRef}`),'index V6 assets missing');"
          if old_assets in s:
              s=s.replace(old_assets,new_assets,1)
          elif new_assets not in s:
              raise SystemExit('Expected stale asset version assertion not found')
          old_p15="check(15,browser.includes(\"contract:'rwa-superapp-v5-browser'\")&&workflow.includes('Browser regression')&&workflow.includes('RWA_TEST_URL: http://127.0.0.1:4173/rwa/')&&pages.includes('Validate RWA Super App V5 single-page contract'),'browser regression');"
          new_p15="check(15,browser.includes(\"contract:'rwa-superapp-v5-browser'\")&&workflow.includes('RWA_TEST_URL: http://127.0.0.1:4173/rwa/')&&workflow.includes('node tools/superapp-v5-browser.mjs')&&pages.includes('node tools/superapp-v5-browser.mjs')&&pages.includes('node tools/superapp-p16-p20-browser.mjs'),'browser regression');"
          if old_p15 in s:
              s=s.replace(old_p15,new_p15,1)
          elif new_p15 not in s:
              raise SystemExit('Expected stale P15 workflow-label assertion not found')
          p.write_text(s)
          PY
          node --check superapp-v5.js
          node --check tools/superapp-v5-audit.mjs
          node tools/superapp-v5-audit.mjs
          node tools/superapp-p16-p20-audit.mjs
          node tools/security-gate.mjs
          grep -Fq '?embed=1&symbol=' superapp-v5.js
          grep -Fq '&v=${tab===' superapp-v5.js
          git diff --check
      - name: Commit repaired source to maintenance branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- superapp-v5.js tools/superapp-v5-audit.mjs; then exit 0; fi
          git config user.name copytolive
          git config user.email copytolive@gmail.com
          git add superapp-v5.js tools/superapp-v5-audit.mjs
          git commit -m 'fix: restore P6 and dynamic superapp regression gates'
          git push origin HEAD:fix/p6-research-embed-contract-20260827
