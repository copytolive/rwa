name: Realworldasset UI Repair

on:
  push:
    branches: [fix/ui-backend-total-audit-20260831]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'repair(ui):') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-backend-total-audit-20260831
          fetch-depth: 0
      - name: Repair audit link loop
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tools/realworldasset-total-ui-audit.py')
          s=p.read_text()
          replacement='''   links=page.locator('a:visible')
   for i in range(links.count()):
    try:
     href=links.nth(i).get_attribute('href') or ''
     if not href or href.startswith('javascript:'): broken_links.append({'vp':vpname,'route':route,'href':href,'reason':'empty-or-placeholder'}); continue
     if href.startswith('#'):
      target=href[1:]
      if not target or page.locator(f'[id="{target}"]').count()<1: broken_links.append({'vp':vpname,'route':route,'href':href,'reason':'missing-anchor-target'})
      continue
     absolute=page.evaluate('(h)=>new URL(h,location.href).href',href)
     nr=normalized_route_from_href(absolute)
     if nr and nr!='FILE' and nr not in route_set: broken_links.append({'vp':vpname,'route':route,'href':href,'normalized':nr,'reason':'missing-static-route'})
     if '/realworldasset/' in absolute: stale_paths.append({'vp':vpname,'route':route,'kind':'link','value':absolute})
    except Exception as e: broken_links.append({'vp':vpname,'route':route,'reason':str(e)})
   buttons=page.locator('button:visible')'''
          s,n=re.subn(r"   links=page\.locator\('a:visible'\).*?   buttons=page\.locator\('button:visible'\)",replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('link loop replacement failed')
          p.write_text(s)
          PY
          python -m py_compile tools/realworldasset-total-ui-audit.py
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/realworldasset-total-ui-audit.py
          git commit -m "repair(ui): fix total-audit link loop"
          git push origin HEAD:fix/ui-backend-total-audit-20260831
