name: RENKO V12 Tick Native Gate

on:
  push:
    branches: ["main"]
    paths:
      - "renko/index.html"
      - "renko/renko-v3.js"
      - "renko/renko-v12.js"
      - "renko/renko-v12-worker.js"
      - ".github/workflows/renko-v11.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v12:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v12.js
          node --check renko/renko-v12-worker.js
      - name: Tick-native DOM and runtime contract
        run: |
          set -euo pipefail
          test -s renko/index.html
          test -s renko/renko-v12.js
          test -s renko/renko-v12-worker.js
          grep -Fq 'RENKO V12' renko/index.html
          grep -Fq 'renko-v12.js?v=120' renko/index.html
          grep -Fq 'data-renko-method="atr"' renko/index.html
          grep -Fq 'data-renko-method="traditional"' renko/index.html
          grep -Fq 'data-renko-method="percentage"' renko/index.html
          ! grep -Fq 'id="v11Interval"' renko/index.html
          ! grep -Fq 'id="v11Source"' renko/index.html
          ! grep -Fq 'id="v11Projection"' renko/index.html
          grep -Fq 'Every trade' renko/index.html
          grep -Fq "formation:'tick-by-tick'" renko/renko-v12.js
          grep -Fq "lockRule:'every-trade-threshold'" renko/renko-v12.js
          grep -Fq "liveSource:'binance-individual-@trade'" renko/renko-v12.js
          grep -Fq "historicalSource:'binance-public-aggTrades'" renko/renko-v12.js
          python - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.append(d['id'])
          p=P(); p.feed(Path('renko/index.html').read_text())
          dup=[k for k,v in Counter(p.ids).items() if v>1]
          assert not dup, f'duplicate DOM ids: {dup}'
          required={'brickSize','v11AtrLength','v11Percent','v11Wicks','v11Confirm','v11Apply','signalAction','signalMarket','chartWrap','v12LtpSnapshot'}
          missing=sorted(required-set(p.ids)); assert not missing, f'missing V12 DOM ids: {missing}'
          forbidden={'v11Interval','v11Source','v11Projection'}
          assert not (forbidden & set(p.ids)), f'interval/source/projection controls still present: {forbidden & set(p.ids)}'
          print('RENKO V12 DOM contract PASS')
          PY
      - name: Every-trade formation, multi-brick and wick tests
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v12-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV12Engine;
          const ticks=a=>a.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,110,120,170])});
          if(r.bricks.length!==7)throw Error(`single tick multi-brick expected 7 total, got ${r.bricks.length}`);
          if(r.bricks.at(-1).close!==170)throw Error('single tick did not lock through final crossed threshold');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,110,120,100])});
          const rev=r.bricks.at(-1);if(r.bricks.length!==3||rev.direction!==-1||!rev.isReversal||rev.open!==110||rev.close!==100)throw Error('2-box reversal contract');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,95,110])});
          if(r.bricks.length!==1||r.bricks[0].low!==95||r.bricks[0].high!==110)throw Error('actual tick low wick contract');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks:ticks([100,110,120,125,100])});
          const d=r.bricks.at(-1);if(d.direction!==-1||d.high!==125||d.low!==100)throw Error('actual tick high wick contract');
          r=E.buildTicks({method:'percentage',percentage:.01,ltpSnapshot:100,tickSize:.1,wicks:true,ticks:ticks([100,101,102])});
          if(Math.abs(r.box-1)>1e-9)throw Error('Percentage LTP snapshot sizing');
          r=E.buildTicks({method:'atr',atrBox:7.3,tickSize:.1,wicks:false,ticks:ticks([100,107.3,114.6])});
          if(Math.abs(r.box-7.3)>1e-9)throw Error('ATR sizing-only snapshot');
          console.log('RENKO V12 tick-native engine tests PASS');
          NODE
