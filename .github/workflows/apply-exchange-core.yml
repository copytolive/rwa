# retrigger: exchange-core-v1
name: Apply Exchange Core
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-exchange-core.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet, bootstrap and gates
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('wallet-core.js'); s=p.read_text()
          old="if(window.ethereum?.on)window.ethereum.on('accountsChanged',a=>{const active=session()?.wallet?.toLowerCase(),next=String(a?.[0]||'').toLowerCase();if(active&&next&&active!==next){localStorage.removeItem(KEY);verified=false;labels();toast('Wallet account changed. Connect again.')}})"
          new="if(window.ethereum?.on){window.ethereum.on('accountsChanged',async a=>{const active=session()?.wallet?.toLowerCase(),next=String(a?.[0]||'').toLowerCase();if(!next){localStorage.removeItem(KEY);verified=false;current=null;labels();window.dispatchEvent(new CustomEvent('rwa:wallet-logout'));return}if(active!==next){localStorage.removeItem(KEY);verified=false;current=window.ethereum;labels();try{await signWith(window.ethereum);toast('Wallet account switched · '+short(next))}catch(e){toast(e?.message||'Sign the new account to continue')}}});window.ethereum.on('chainChanged',chain=>window.dispatchEvent(new CustomEvent('rwa:wallet-chain',{detail:{chain}})))}"
          if old in s: s=s.replace(old,new)
          assert "Wallet account switched" in s
          p.write_text(s)

          p=Path('index.html'); s=p.read_text()
          s=s.replace('wallet-core.js?v=2','wallet-core.js?v=3')
          if 'exchange-core.js?v=1' not in s:
              anchor='<script src="execution-ops-bridge.js?v=3"></script>'
              s=s.replace(anchor,anchor+'\n<script src="exchange-core.js?v=1"></script>\n<script src="exchange-ui.js?v=1"></script>')
          assert 'wallet-core.js?v=3' in s and 'exchange-core.js?v=1' in s and 'exchange-ui.js?v=1' in s
          p.write_text(s)

          p=Path('.github/workflows/live-browser-smoke.yml'); s=p.read_text().replace('wallet-core.js?v=2','wallet-core.js?v=3')
          p.write_text(s)

          p=Path('.github/workflows/pages.yml'); s=p.read_text()
          if 'node --check exchange-core.js' not in s:
              needle='node --check execution-ops-bridge.js'
              s=s.replace(needle,needle+'\n          node --check exchange-core.js\n          node --check exchange-ui.js')
          if "test -s exchange-core.js" not in s:
              needle='test -s execution-ops-bridge.js'
              if needle in s: s=s.replace(needle,needle+'\n          test -s exchange-core.js\n          test -s exchange-ui.js')
          if "grep -q 'exchange-core.js?v=1' index.html" not in s:
              needle="grep -q 'realtime-core.js?v=2' index.html"
              if needle in s: s=s.replace(needle,needle+"\n          grep -q 'wallet-core.js?v=3' index.html\n          grep -q 'exchange-core.js?v=1' index.html\n          grep -q 'exchange-ui.js?v=1' index.html")
          p.write_text(s)
          PY
          node --check wallet-core.js
          node --check exchange-core.js
          node --check exchange-ui.js
          grep -q 'wallet-core.js?v=3' index.html
          grep -q 'exchange-core.js?v=1' index.html
          grep -q 'Wallet account switched' wallet-core.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wallet-core.js index.html .github/workflows/live-browser-smoke.yml .github/workflows/pages.yml
          git commit -m 'feat: enable seamless wallet and one-screen exchange core' || exit 0
          git push