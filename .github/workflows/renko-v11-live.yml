# live-smoke-trigger: 2
name: RENKO V11 Public Live Smoke

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/renko-v11-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed RENKO V11 page and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://copytolive.github.io/rwa/renko"
          ok=0
          for i in $(seq 1 24); do
            echo "Public smoke attempt $i"
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/?v11-smoke=${GITHUB_RUN_ID}-${i}" -o /tmp/renko.html \
              && grep -Fq 'RENKO V11' /tmp/renko.html \
              && grep -Fq 'renko-v11.js?v=111' /tmp/renko.html \
              && grep -Fq 'data-renko-method="atr"' /tmp/renko.html \
              && grep -Fq 'data-renko-method="traditional"' /tmp/renko.html \
              && grep -Fq 'data-renko-method="percentage"' /tmp/renko.html; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/renko-v11.js?v=111&smoke=${GITHUB_RUN_ID}" -o /tmp/renko-v11.js
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/renko-v11-worker.js?v=111&smoke=${GITHUB_RUN_ID}" -o /tmp/renko-v11-worker.js
          curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${BASE}/renko-v11.css?v=111&smoke=${GITHUB_RUN_ID}" -o /tmp/renko-v11.css
          grep -Fq "version:'11.0.0'" /tmp/renko-v11.js
          grep -Fq "liveSource:'binance-individual-@trade-projection-only'" /tmp/renko-v11.js
          grep -Fq "signalRule:'locked-renko-only'" /tmp/renko-v11.js
          grep -Fq 'wilderAtrLatest' /tmp/renko-v11-worker.js
          grep -Fq 'v11-methods' /tmp/renko-v11.css
          echo "RENKO V11 PUBLIC LIVE PAGE PASS"
      - name: Verify public market-data bootstrap endpoints
        shell: bash
        run: |
          set -euo pipefail
          fetch_market () {
            local path="$1" out="$2"
            for root in 'https://data-api.binance.vision' 'https://api.binance.com'; do
              if curl -fsSL --max-time 20 "${root}${path}" -o "$out"; then return 0; fi
            done
            return 1
          }
          fetch_market '/api/v3/exchangeInfo?symbol=BTCUSDT' /tmp/exchange.json
          fetch_market '/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=2' /tmp/klines.json
          python - <<'PY'
          import json
          ex=json.load(open('/tmp/exchange.json'))
          kl=json.load(open('/tmp/klines.json'))
          s=ex.get('symbols',[{}])[0]
          pf=next((x for x in s.get('filters',[]) if x.get('filterType')=='PRICE_FILTER'),{})
          assert float(pf.get('tickSize',0))>0, 'missing Binance tickSize'
          assert isinstance(kl,list) and len(kl)>=1 and len(kl[0])>=7, 'invalid Binance kline bootstrap'
          print('RENKO V11 MARKET DATA BOOTSTRAP PASS')
          PY