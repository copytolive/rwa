name: Production History VPS Probe

on:
  push:
    branches: [main]
    paths:
      - "production-history-probe/**"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing production SSH secret
        shell: bash
        env:
          SSH_KEY: ${{ secrets.COPYTOLIVE_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/copytolive_history"
          chmod 600 "$HOME/.ssh/copytolive_history"
          ssh-keyscan -p 22 -H 109.123.239.76 >> "$HOME/.ssh/known_hosts" 2>/dev/null
          ssh -o BatchMode=yes -o ConnectTimeout=8 -i "$HOME/.ssh/copytolive_history" root@109.123.239.76 'python3 - <<'"'"'PY'"'"'
          import json,os
          print(json.dumps({"ok":True,"web_root":os.path.isdir("/var/www/copytolive"),"history_assets":os.path.isdir("/var/www/copytolive/assets/history")}))
          PY'
