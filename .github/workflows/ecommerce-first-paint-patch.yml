name: Ecommerce First Paint Patch

on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths:
      - '.github/workflows/ecommerce-first-paint-patch.yml'

permissions:
  contents: write

jobs:
  patch-first-paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Patch first paint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          anchor='<link rel="stylesheet" href="renko-shell-fullscreen.css?v=1">'
          boot="""<script id=\"rwaTargetFirstPaintBoot\">(()=>{const h=document.documentElement;h.classList.add('rwa-target-prepaint');if(location.hash==='#shop')h.classList.add('rwa-target-prepaint-shop')})();</script>\n<link rel=\"stylesheet\" href=\"rwa-target-dashboard-v2.css?v=2.0.0\" data-rwa-target-v2=\"1\">\n<link rel=\"stylesheet\" href=\"rwa-target-dashboard-v2-hardening.css?v=2.1.0\" data-rwa-target-hardening=\"1\">\n<style id=\"rwaTargetFirstPaintCritical\">\nhtml.rwa-target-prepaint body{background:#030812!important;color:#eef4ff!important;overflow-x:hidden!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .productbar,html.rwa-target-prepaint body.rwa-target-dashboard-v2 .trustbar,html.rwa-target-prepaint body.rwa-target-dashboard-v2 #rwaExperienceRail,html.rwa-target-prepaint body.rwa-target-dashboard-v2 .credibility-strip{display:none!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .topbar{top:0!important;height:62px!important;min-height:62px!important;max-height:62px!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .app{padding-top:62px!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .layout{margin-top:0!important;width:100%!important;max-width:100%!important;grid-template-columns:286px minmax(0,1fr) 236px!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .left,html.rwa-target-prepaint body.rwa-target-dashboard-v2 .right{top:62px!important;height:calc(100vh - 62px)!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .right>.aside-label{display:none!important}\nhtml.rwa-target-prepaint body.rwa-target-dashboard-v2 .topnav>[data-rwa-target-nav]{display:inline-flex!important;align-items:center!important;visibility:visible!important;opacity:1!important}\nhtml.rwa-target-prepaint-shop body.rwa-target-dashboard-v2 .layout{grid-template-columns:286px minmax(0,calc(100% - 962px)) 236px!important}\n#rwaFirstPaintCommerceSkeleton{display:none;position:fixed;z-index:9690;top:62px;right:0;bottom:34px;width:440px;box-sizing:border-box;background:#030a13;border-left:1px solid #202b3b;color:#eaf1fb;font-family:Inter,system-ui,sans-serif;overflow:hidden}\nhtml.rwa-target-prepaint-shop:not(.rwa-target-runtime-ready) #rwaFirstPaintCommerceSkeleton{display:block}\n#rwaFirstPaintCommerceSkeleton .fp-head{height:58px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1d2b3e;background:#050d17}#rwaFirstPaintCommerceSkeleton .fp-head b{font-size:12px}#rwaFirstPaintCommerceSkeleton .fp-head small{display:block;margin-top:3px;color:#8190a5;font-size:7px}#rwaFirstPaintCommerceSkeleton .fp-pill{padding:4px 8px;border:1px solid #0a744c;border-radius:999px;color:#31e89c;font-size:6px;font-weight:900}\n#rwaFirstPaintCommerceSkeleton .fp-tabs{height:44px;display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid #18283c}#rwaFirstPaintCommerceSkeleton .fp-tabs span{display:grid;place-items:center;color:#9aa7ba;font-size:9px}#rwaFirstPaintCommerceSkeleton .fp-tabs span:first-child{color:#72a2ff;border-bottom:2px solid #3977ff}\n#rwaFirstPaintCommerceSkeleton .fp-body{padding:10px}#rwaFirstPaintCommerceSkeleton .fp-store{border:1px solid #21324a;border-radius:9px;background:#06111e;padding:12px}#rwaFirstPaintCommerceSkeleton .fp-store h3{margin:0;font-size:12px}#rwaFirstPaintCommerceSkeleton .fp-badges{display:flex;gap:5px;margin-top:7px}.fp-badges i{font-style:normal;padding:3px 5px;border-radius:4px;font-size:6px;font-weight:900}.fp-badges .warn{border:1px solid #67510c;background:#2a2105;color:#f3c340}.fp-badges .lock{border:1px solid #3d4655;background:#151b25;color:#aeb7c5}#rwaFirstPaintCommerceSkeleton .fp-store p{color:#7f90a8;font-size:7px;line-height:1.45}#rwaFirstPaintCommerceSkeleton .fp-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid #1c2c40;border-bottom:1px solid #1c2c40}.fp-metrics span{text-align:center;padding:8px 3px;border-right:1px solid #1c2c40}.fp-metrics span:last-child{border-right:0}.fp-metrics b{display:block;font-size:10px}.fp-metrics small{display:block;margin-top:2px;color:#718198;font-size:5.5px}#rwaFirstPaintCommerceSkeleton .fp-section{margin:12px 1px 7px;font-size:9px;font-weight:800}#rwaFirstPaintCommerceSkeleton .fp-products{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.fp-card{height:142px;border:1px solid #203149;border-radius:8px;background:linear-gradient(145deg,#10243a,#07111e);padding:8px;box-sizing:border-box}.fp-card:before{content:'';display:block;height:74px;margin:-8px -8px 8px;background:linear-gradient(145deg,#183958,#0c2237)}.fp-card b{font-size:7px}.fp-card small{display:block;margin-top:6px;color:#7f90a8;font-size:5.5px}#rwaFirstPaintCommerceSkeleton .fp-cart{margin-top:10px;padding:9px;border:1px solid #203149;border-radius:8px;background:#06111e;font-size:7px}.fp-cart strong{float:right}.fp-lockline{margin-top:7px;color:#efb92e;font-size:6.5px}\n@media(max-width:1400px) and (min-width:681px){html.rwa-target-prepaint-shop body.rwa-target-dashboard-v2 .layout{grid-template-columns:260px minmax(0,calc(100% - 920px)) 220px!important}}\n@media(max-width:680px){html.rwa-target-prepaint body.rwa-target-dashboard-v2 .topbar{height:56px!important;min-height:56px!important;max-height:56px!important}html.rwa-target-prepaint body.rwa-target-dashboard-v2 .app{padding-top:56px!important}#rwaFirstPaintCommerceSkeleton{top:56px;bottom:0;width:100vw}#rwaFirstPaintCommerceSkeleton .fp-products{grid-template-columns:repeat(2,1fr)!important}}\n</style>"""
          if 'rwaTargetFirstPaintBoot' not in s:
              assert anchor in s; s=s.replace(anchor,anchor+'\n'+boot)
          s=s.replace('<body class="mview-overview">','<body class="mview-overview rwa-target-dashboard-v2">')
          old='<header class="topbar">\n  <a class="brand" href="#terminal" aria-label="RWA Markets home"><span class="brandmark"><i></i><b>R</b></span><span class="brandcopy"><strong>RWA</strong><small>LIVE MARKET NETWORK</small></span></a>\n  <nav class="topnav" aria-label="Primary navigation"><button class="active">Markets</button><button onclick="toast(\'RWA Intelligence is available from Hub\')">Intelligence</button><button onclick="toast(\'Verified asset marketplace is available from Hub\')">Assets</button><button onclick="toast(\'Research workspace is available from Hub\')">Research</button><button onclick="toast(\'Company workspace is available from Hub\')">Company</button></nav>\n  <div class="top-actions"><div class="status"><span id="liveDot" class="dot"></span><span id="liveText">Market network</span></div><button class="signin">Connect Wallet</button><button class="institutional" onclick="toast(\'Institutional onboarding is being prepared\')">Request access</button><button class="mobile-social-head" style="display:none" data-mobile-header="social" aria-label="Open social trading">◎</button></div>\n</header>'
          new='<header class="topbar">\n  <a class="brand" href="#terminal" aria-label="RWA × Seablueprint market home"><span class="brandmark"><i></i><b>R</b></span><span class="brandcopy"><strong>RWA × Seablueprint</strong><small>LIVE MARKET NETWORK</small></span></a>\n  <nav class="topnav" aria-label="Primary navigation"><button class="active" data-rwa-target-nav="markets">Markets</button><button id="rwaSeablueprintCommerceLaunch" data-rwa-target-nav="ecommerce" data-rwa-seablueprint-commerce="1">Ecommerce <span class="rwa-target-new">NEW</span></button><button data-rwa-target-nav="intelligence">Intelligence</button><button data-rwa-target-nav="portfolio">Portfolio</button><button data-rwa-target-nav="orders">Orders</button><button data-rwa-target-nav="reports">Reports</button></nav>\n  <div class="top-actions"><span class="rwa-target-inpage"><b>IN-PAGE COMMERCE</b><small>• Single Shell •</small></span><div class="rwa-target-icon-actions"><button type="button" aria-label="Alerts">♧</button><button type="button" aria-label="Help">?</button><button type="button" aria-label="Theme">☾</button></div><button class="signin">Connect Wallet</button></div>\n</header>'
          assert old in s; s=s.replace(old,new)
          s=s.replace('<span>MARKET UNIVERSE</span>','<span>WATCHLIST</span>')
          skeleton='<aside id="rwaFirstPaintCommerceSkeleton" aria-label="Seablueprint Ecommerce first-paint shell"><div class="fp-head"><div><b>Seablueprint Ecommerce</b><small>Runs inside this RWA page</small></div><span class="fp-pill">IN-PAGE</span></div><div class="fp-tabs"><span>Stores</span><span>Products</span><span>Cart (2)</span></div><div class="fp-body"><section class="fp-store"><h3>Seablue Estate Marketplace</h3><div class="fp-badges"><i class="warn">VERIFICATION REQUIRED</i><i class="lock">BACKEND LOCKED</i></div><p>Tokenized real-estate and maritime UI preview. No merchant/store is represented as verified.</p><div class="fp-metrics"><span><b>0</b><small>Verified stores</small></span><span><b>4</b><small>Preview products</small></span><span><b>LOCKED</b><small>Checkout</small></span></div></section><div class="fp-section">Featured Products</div><div class="fp-products"><article class="fp-card"><b>Marina Bay Residences Token</b><small>Preview asset</small></article><article class="fp-card"><b>Blue Ocean Shipping Note</b><small>Preview asset</small></article><article class="fp-card"><b>Phuket Seaview Villas Token</b><small>Preview asset</small></article></div><section class="fp-cart"><b>Your Cart (2)</b><strong>2,315.00 USDC</strong><div class="fp-lockline">△ Verification required to purchase. Backend locked.</div></section></div></aside>'
          marker='<section class="social-screen"'
          if '<aside id="rwaFirstPaintCommerceSkeleton"' not in s:
              assert marker in s; s=s.replace(marker,skeleton+'\n'+marker,1)
          s=s.replace('chart-core.js?v=1','chart-core.js?v=2'); p.write_text(s)
          p=Path('rwa-seablueprint-commerce-bridge.js'); s=p.read_text()
          old="if(openNow){document.body.classList.add('rwa-seablueprint-commerce-open');document.documentElement.dataset.rwaCommerce='open'}"
          new="if(openNow){document.body.classList.add('rwa-seablueprint-commerce-open');document.documentElement.dataset.rwaCommerce='open';document.documentElement.classList.add('rwa-target-runtime-ready');document.getElementById('rwaFirstPaintCommerceSkeleton')?.remove()}"
          assert old in s; s=s.replace(old,new)
          old="function boot(){loadStyle('rwa-seablueprint-commerce-bridge.css?v=1.5.0','bridge');config().finally(reconcile);clearLegacyGrid();reconcile();new MutationObserver(()=>queueMicrotask(reconcile)).observe(document.documentElement,{subtree:true,childList:true});let n=0;const t=setInterval(()=>{reconcile();if(++n>50)clearInterval(t)},100)}"
          new="function boot(){loadStyle('rwa-seablueprint-commerce-bridge.css?v=1.5.0','bridge');config().finally(reconcile);clearLegacyGrid();reconcile();if(location.hash==='#shop')queueMicrotask(()=>open('stores'));new MutationObserver(()=>queueMicrotask(reconcile)).observe(document.documentElement,{subtree:true,childList:true});let n=0;const t=setInterval(()=>{reconcile();if(++n>50)clearInterval(t)},100)}"
          assert old in s; p.write_text(s.replace(old,new))
          p=Path('chart-core.js'); s=p.read_text().replace('rwa-seablueprint-commerce-bridge.js?v=1.5.0','rwa-seablueprint-commerce-bridge.js?v=1.5.1').replace('rwa-ecommerce-production-visual-v1.js?v=1.6.0','rwa-ecommerce-production-visual-v1.js?v=1.7.0')
          needle="if(screenshotParity&&!window.RWAScreenshotToCodeParity)await import('./rwa-screenshot-parity-v1.js?v=1.0.0')"
          assert needle in s; s=s.replace(needle,needle+";if(location.hash!=='#shop'){document.documentElement.classList.add('rwa-target-runtime-ready');document.getElementById('rwaFirstPaintCommerceSkeleton')?.remove()}"); p.write_text(s)
          p=Path('.github/workflows/ecommerce-target-parity.yml'); w=p.read_text()
          if "      - 'index.html'\n" not in w: w=w.replace("      - 'chart-core.js'\n","      - 'chart-core.js'\n      - 'index.html'\n      - 'rwa-target-topbar-cleanup-v1.js'\n      - 'rwa-seablueprint-commerce-bridge.js'\n      - 'tools/ecommerce-first-paint-browser.mjs'\n",1)
          step="      - name: Prove 0ms first paint has no legacy shell\n        env:\n          RWA_UI_URL: http://127.0.0.1:4173/rwa/\n          RWA_UI_PROOF_DIR: proof/ecommerce-first-paint-local\n        run: node tools/ecommerce-first-paint-browser.mjs\n"
          if 'Prove 0ms first paint has no legacy shell' not in w: w=w.replace('      - name: Run existing target interaction matrix\n',step+'      - name: Run existing target interaction matrix\n',1)
          step="      - name: Prove public 0ms first paint has no legacy shell\n        env:\n          RWA_UI_URL: https://copytolive.github.io/rwa/\n          RWA_UI_PROOF_DIR: proof/ecommerce-first-paint-public\n        run: node tools/ecommerce-first-paint-browser.mjs\n"
          if 'Prove public 0ms first paint has no legacy shell' not in w: w=w.replace('      - name: Run real public target interaction matrix\n',step+'      - name: Run real public target interaction matrix\n',1)
          if 'proof/ecommerce-first-paint-local/' not in w: w=w.replace('            proof/ecommerce-target-parity-local/\n','            proof/ecommerce-target-parity-local/\n            proof/ecommerce-first-paint-local/\n')
          if 'proof/ecommerce-first-paint-public/' not in w: w=w.replace('            proof/ecommerce-target-parity-public/\n','            proof/ecommerce-target-parity-public/\n            proof/ecommerce-first-paint-public/\n')
          p.write_text(w)
          p=Path('.github/workflows/seablueprint-commerce-single-shell.yml'); w=p.read_text().replace('rwa-seablueprint-commerce-bridge.js?v=1.5.0','rwa-seablueprint-commerce-bridge.js?v=1.5.1').replace('rwa-ecommerce-production-visual-v1.js?v=1.6.0','rwa-ecommerce-production-visual-v1.js?v=1.7.0'); p.write_text(w)
          PY
          git diff --check
          node --check chart-core.js
          node --check rwa-seablueprint-commerce-bridge.js
          node --check tools/ecommerce-first-paint-browser.mjs
      - name: Commit first-paint fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html chart-core.js rwa-seablueprint-commerce-bridge.js tools/ecommerce-first-paint-browser.mjs .github/workflows/ecommerce-target-parity.yml .github/workflows/seablueprint-commerce-single-shell.yml
          git commit -m 'ecommerce: eliminate legacy first paint at 0ms'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
