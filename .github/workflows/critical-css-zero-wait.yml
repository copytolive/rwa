# trigger: zero-wait-v2
name: Inline Critical Zero-Wait CSS

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/critical-css-zero-wait.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make full CSS non-blocking with inline first-paint shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<link rel="stylesheet" href="styles.css?v=6">\n<link rel="stylesheet" href="mobile.css?v=5">'
          critical='''<style id="rwa-critical">*{box-sizing:border-box}html,body{margin:0;background:#06070a;color:#f6f7fb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh;overflow-x:hidden}.app{min-height:100vh}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #202632;background:#07080b;position:relative;z-index:20}.brand{display:flex;align-items:center;gap:9px;color:inherit;text-decoration:none}.brandmark{width:32px;height:32px;border-radius:10px;background:#7869f4;display:grid;place-items:center;font-weight:900}.brandcopy{display:flex;flex-direction:column}.brandcopy strong{font-size:14px}.brandcopy small{font-size:7px;color:#7d8796;letter-spacing:.12em;margin-top:3px}.topnav,.signin,.institutional,.productbar,.trustbar,.mobile-home,.left,.right,.terminal-header,.bottom,.credibility-strip,.social-screen{display:none}.layout{display:block}.main{background:#080a0e;min-width:0}.chart-wrap{height:calc(100svh - 106px);min-height:300px;max-height:680px;position:relative;overflow:hidden;background:#07090c}.fallback-chart,.tv-host{position:absolute;inset:0;width:100%;height:100%}.fallback-chart{z-index:1;background:#07090c}.tv-host{z-index:2;background:transparent}.chart-watermark{position:absolute;right:14px;bottom:14px;z-index:0;color:rgba(255,255,255,.035);font-size:32px;font-weight:900}.mobile-detail-tabs{height:44px;display:flex!important;background:#080a0e;border-top:1px solid #202632;border-bottom:1px solid #202632}.mobile-detail-tabs button{flex:1;border:0;background:transparent;color:#7d8796;font:700 11px system-ui}.mobile-detail-tabs button.active{color:#fff}.mobile-tabs{position:fixed;z-index:1000;bottom:0;left:0;right:0;height:54px;background:#090b10;border-top:1px solid #202632;display:grid;grid-template-columns:repeat(5,1fr)}.mobile-tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#7d8796;text-decoration:none;font:700 9px system-ui}.mobile-tabs a span{font-size:16px}.mobile-tabs a.active{color:#f6f7fb}.status{display:flex;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#35daa0;box-shadow:0 0 10px rgba(53,218,160,.6)}@media(min-width:681px){.topbar{height:70px;padding:0 20px}.productbar,.trustbar{display:flex}.layout{display:grid;grid-template-columns:286px minmax(0,1fr) 318px}.left,.right,.terminal-header,.bottom,.credibility-strip{display:block}.chart-wrap{height:548px;max-height:none}.mobile-detail-tabs,.mobile-tabs{display:none!important}}</style>
<link rel="preload" href="styles.css?v=6" as="style" onload="this.onload=null;this.rel='stylesheet'">
<link rel="preload" href="mobile.css?v=5" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="styles.css?v=6"><link rel="stylesheet" href="mobile.css?v=5"></noscript>'''
          if old not in s: raise SystemExit('stylesheet contract changed')
          s=s.replace(old,critical,1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          grep -Fq 'id="rwa-critical"' index.html
          grep -Fq 'onload="this.onload=null;this.rel=' index.html
          node --check app.js
          node --check mobile.js
      - name: Commit and self-remove
        run: |
          rm .github/workflows/critical-css-zero-wait.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/critical-css-zero-wait.yml
          git commit -m 'perf: unblock first paint with inline critical chart CSS'
          git push
