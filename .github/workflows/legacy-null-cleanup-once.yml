name: Legacy Null Cleanup Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths:
      - '.github/workflows/legacy-null-cleanup-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Remove legacy null writer and align root-open test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          old="function setLive(ok,text){$('liveDot').className='dot'+(ok?' live':'');$('liveText').textContent=text}"
          new="function setLive(ok,text){const d=$('liveDot'),t=$('liveText');if(d)d.className='dot'+(ok?' live':'');if(t)t.textContent=text}"
          if old not in s: raise SystemExit('setLive marker not found')
          p.write_text(s.replace(old,new,1))

          p=Path('tools/ecommerce-target-parity-browser.mjs')
          s=p.read_text()
          old="""    const before=await rect(page,'.layout'),launcher=page.locator('#rwaSeablueprintCommerceLaunch,[data-rwa-seablueprint-commerce=\"1\"]').filter({visible:true}).first();\n    if(!(await launcher.isVisible().catch(()=>false)))throw new Error('Ecommerce launcher not visible');\n    await launcher.click();await page.waitForFunction(()=>document.querySelector('#rwaShopScreen')?.classList.contains('open'),{timeout:12000});await stabilize(page);"""
          new="""    const before=await rect(page,'.layout'),alreadyOpen=await page.locator('#rwaShopScreen.open').isVisible().catch(()=>false),launcher=page.locator('#rwaSeablueprintCommerceLaunch,[data-rwa-seablueprint-commerce=\"1\"]').filter({visible:true}).first();\n    if(!alreadyOpen){if(!(await launcher.isVisible().catch(()=>false)))throw new Error('Ecommerce neither open nor launchable');await launcher.click()}\n    await page.waitForFunction(()=>document.querySelector('#rwaShopScreen')?.classList.contains('open'),{timeout:12000});await stabilize(page);"""
          if old not in s: raise SystemExit('target parity launcher marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js tools/ecommerce-target-parity-browser.mjs
          git commit -m 'ui: remove legacy null writer after target root takeover'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
