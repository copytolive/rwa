name: GOLD Certification Native MT5 Factory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Certification workload
        required: true
        default: p45
        type: choice
        options:
          - p45
          - robust54
          - all
      broker_symbol:
        description: Exness MT5 symbol for P45 broker stage
        required: false
        default: XAUUSD
      from_date:
        description: Broker real-tick start YYYY.MM.DD
        required: false
        default: '2025.01.01'
      to_date:
        description: Broker real-tick end YYYY.MM.DD
        required: false
        default: '2026.08.25'
      method_filter:
        description: Optional ROBUST54 comma-separated IDs; ALL = all shard IDs
        required: false
        default: ALL

permissions:
  contents: read

jobs:
  p45-native:
    if: ${{ inputs.mode == 'p45' || inputs.mode == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN || secrets.EXNESS_MT5_LOGIN || secrets.EXNESS_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD || secrets.EXNESS_MT5_PASSWORD || secrets.EXNESS_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER || secrets.EXNESS_MT5_SERVER || secrets.EXNESS_SERVER }}
      MT5_SYMBOL: ${{ inputs.broker_symbol || 'XAUUSD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect broker secret presence without exposing values
        shell: powershell
        run: |
          $ready=(-not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_SERVER))
          Write-Host ("BROKER_SECRETS_CONFIGURED={0}" -f $ready)
          if(-not $ready){ Write-Host 'Same-dataset parity will still run; broker real-tick will be explicitly skipped.' }

      - name: Download immutable P45 hosted runner
        shell: powershell
        run: |
          python -m pip install --quiet gdown
          python -m gdown 1tTyqKrodNNH9OBrV77yPcmIPWBcuDKal -O P45_GITHUB_HOSTED_RUN.ps1
          if(!(Test-Path P45_GITHUB_HOSTED_RUN.ps1)){ throw 'P45 runner download failed' }
          $h=(Get-FileHash P45_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          if($h -ne '27e2c541e6daa4c06698a69768aa2e6c22627f68b62f65162d9e2c0d61eadcb1'){ throw "P45 runner SHA mismatch: $h" }
          Write-Host "P45_RUNNER_SHA256=$h"
          # Compatibility-only patches after immutable source hash verification; do not alter P45 signal/comparator semantics.
          $src=[IO.File]::ReadAllText('P45_GITHUB_HOSTED_RUN.ps1')
          $patched=$src.Replace('python -m gdown --id $id -O $out','python -m gdown $id -O $out')

          $old="Ensure ((Get-Content `$ImportReceipt -Raw) -match 'status=PASS') 'MT5 custom-symbol import failed'"
          $new=@'
          $ir=Get-Content $ImportReceipt -Raw
          if($ir -notmatch 'status=PASS'){
            if(($ir -match 'rows_read=5526570') -and ($ir -match 'bars_mt5=100000')){
              Write-Host 'MT5_IMPORT_BARSCAP_COMPAT=ACCEPTED rows_read=5526570 bars_mt5=100000; Bars() is chart-cap limited. Comparator remains authoritative.'
            }else{
              throw 'MT5 custom-symbol import failed'
            }
          }
          '@
          $patched=$patched.Replace($old,$new.TrimEnd())

          $oldImporterCopy="Copy-Item `$Importer (Join-Path `$ScriptDir 'GOLD_Parity_Importer.mq5') -Force"
          $newImporterCopy=@'
          Copy-Item $Importer (Join-Path $ScriptDir 'GOLD_Parity_Importer.mq5') -Force
          $importerLocal=Join-Path $ScriptDir 'GOLD_Parity_Importer.mq5'
          $importerBody=[IO.File]::ReadAllText($importerLocal)
          $importerBody=$importerBody.Replace('  SymbolSelect(InpCustomSymbol,true);','  if(!CustomSymbolSetString(InpCustomSymbol,SYMBOL_CURRENCY_MARGIN,"USD")) Print("WARN margin_currency ",GetLastError()); SymbolSelect(InpCustomSymbol,true);')
          [IO.File]::WriteAllText($importerLocal,$importerBody,(New-Object Text.UTF8Encoding($false)))
          Write-Host 'MT5_CUSTOM_SYMBOL_MARGIN_CURRENCY_PATCH=USD'
          '@
          $patched=$patched.Replace($oldImporterCopy,$newImporterCopy.TrimEnd())

          $oldReportInit='  $ini=Join-Path $Run ((Split-Path $Report -Leaf)+''.ini'')'
          $newReportInit=@'
            $ini=Join-Path $Run ((Split-Path $Report -Leaf)+'.ini')
            $reportLeaf=[IO.Path]::GetFileNameWithoutExtension($Report)
            Remove-Item $Report -Force -ErrorAction SilentlyContinue
          '@
          $patched=$patched.Replace($oldReportInit,$newReportInit.TrimEnd())
          $patched=$patched.Replace('Report=$Report','Report=$reportLeaf')

          $oldTesterLaunch='  & $Terminal "/config:$ini" | Out-Null'
          $newTesterLaunch=@'
            Get-Process terminal64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            if((-not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_SERVER))){
              $testerBody=[IO.File]::ReadAllText($ini)
              $testerBody=$testerBody.Replace('Expert=GoldAutopilot\\','Expert=GoldAutopilot\')
              Write-Host 'MT5_TESTER_EXPERT_PATH_NORMALIZED=TRUE'
              $common="[Common]`r`nLogin=$env:MT5_LOGIN`r`nPassword=$env:MT5_PASSWORD`r`nServer=$env:MT5_SERVER`r`n`r`n"
              [IO.File]::WriteAllText($ini,$common+$testerBody,(New-Object Text.UTF8Encoding($false)))
              Write-Host 'MT5_TESTER_ACCOUNT_CONTEXT=CONFIGURED'
            }else{
              Write-Host 'MT5_TESTER_ACCOUNT_CONTEXT=MISSING'
            }
            Write-Host "MT5_TESTER_INI=$ini"
            $safeIniPrelaunch=Get-Content $ini | ForEach-Object { if($_ -match '^Password='){ 'Password=***' } elseif($_ -match '^Login='){ 'Login=***' } elseif($_ -match '^Server='){ 'Server=***' } else { $_ } }
            $safeIniPrelaunch | Write-Host
            $tp=Start-Process -FilePath $Terminal -ArgumentList "/config:$ini" -WorkingDirectory $Mt5Dir -PassThru -Wait
            Write-Host "MT5_TESTER_EXIT_CODE=$($tp.ExitCode)"
          '@
          $patched=$patched.Replace($oldTesterLaunch,$newTesterLaunch.TrimEnd())

          $oldReportGate='  Ensure (Test-Path $Report) "Tester report missing: $Report"'
          $newReportGate=@'
            $reportFound=Get-ChildItem -Path @($Mt5Dir,$DataDir) -Filter ($reportLeaf+'*.htm*') -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if($null -ne $reportFound){
              Write-Host "MT5_REPORT_FOUND=$($reportFound.FullName)"
              Copy-Item $reportFound.FullName $Report -Force
            }
            $diag=Join-Path $Evidence ('tester-diag-'+$reportLeaf)
            New-Item -ItemType Directory -Force $diag | Out-Null
            foreach($root in @((Join-Path $DataDir 'Tester'))){
              if(Test-Path $root){
                Get-ChildItem $root -File -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 20 | ForEach-Object { Copy-Item $_.FullName (Join-Path $diag ($_.Name+'-'+([Math]::Abs($_.FullName.GetHashCode())))) -Force -ErrorAction SilentlyContinue }
              }
            }
            [IO.File]::WriteAllLines((Join-Path $diag ((Split-Path $ini -Leaf)+'.txt')),$safeIniPrelaunch,(New-Object Text.UTF8Encoding($false)))
            Ensure (Test-Path $Report) "Tester report missing: $Report"
          '@
          $patched=$patched.Replace($oldReportGate,$newReportGate.TrimEnd())

          if($patched -eq $src){ throw 'Expected compatibility patch targets not found in verified P45 runner' }
          if($patched -notmatch 'MT5_IMPORT_BARSCAP_COMPAT=ACCEPTED'){ throw 'MT5 bar-cap compatibility patch was not applied' }
          if($patched -notmatch 'MT5_CUSTOM_SYMBOL_MARGIN_CURRENCY_PATCH=USD'){ throw 'MT5 custom-symbol margin currency patch was not applied' }
          if($patched -notmatch 'MT5_TESTER_INI'){ throw 'MT5 tester diagnostic patch was not applied' }
          if($patched -notmatch 'MT5_REPORT_FOUND'){ throw 'MT5 tester report-discovery patch was not applied' }
          if($patched -notmatch 'MT5_TESTER_ACCOUNT_CONTEXT=CONFIGURED'){ throw 'MT5 tester account-context patch was not applied' }
          if($patched -notmatch 'MT5_TESTER_EXPERT_PATH_NORMALIZED=TRUE'){ throw 'MT5 tester expert-path normalization patch was not applied' }
          if($patched -notmatch 'safeIniPrelaunch'){ throw 'MT5 tester pre-launch INI sanitization patch was not applied' }
          [IO.File]::WriteAllText('P45_GITHUB_HOSTED_RUN.ps1',$patched,(New-Object Text.UTF8Encoding($false)))
          $ph=(Get-FileHash P45_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          Write-Host "P45_RUNNER_COMPAT_PATCH_SHA256=$ph"

      - name: Execute P45 native MT5 parity + optional Exness real ticks
        shell: powershell
        run: |
          ./P45_GITHUB_HOSTED_RUN.ps1 `
            -Login $env:MT5_LOGIN `
            -Password $env:MT5_PASSWORD `
            -Server $env:MT5_SERVER `
            -BrokerSymbol '${{ inputs.broker_symbol || 'XAUUSD' }}' `
            -FromDate '${{ inputs.from_date || '2025.01.01' }}' `
            -ToDate '${{ inputs.to_date || '2026.08.25' }}'

      - name: Upload P45 MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-mt5-${{ github.run_id }}
          path: p45-hosted/evidence/**
          if-no-files-found: warn
          retention-days: 90

  robust54-native:
    if: ${{ inputs.mode == 'robust54' || inputs.mode == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: s1
            methods: P45,P01,P02,P03,P04,P05,P06,P07,P08
          - shard: s2
            methods: P09,P10,P11,P12,P13,P14,P15,P16,P17
          - shard: s3
            methods: P21,P22,P23,P24,P26,P27,P28,P29,P30
          - shard: s4
            methods: P31,P32,P33,P34,P35,P41,P44,P48,P51
          - shard: s5
            methods: P52,P55,P56,P61,P62,P63,P64,P66,P67
          - shard: s6
            methods: P69,P70,P71,P72,P75,P76,P77,P78,P79
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable ROBUST54 factory runner
        shell: powershell
        run: |
          python -m pip install --quiet gdown
          python -m gdown 1py8K2oPx6AKh1OfuXEdmSaJr3JfYm8EL -O GOLD_54_GITHUB_HOSTED_RUN.ps1
          if(!(Test-Path GOLD_54_GITHUB_HOSTED_RUN.ps1)){ throw 'ROBUST54 runner download failed' }
          $h=(Get-FileHash GOLD_54_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          if($h -ne 'f6fe0d3c190b76b4f80b329f811592cdb84940d879b74b7e2dc9ce6994813bd6'){ throw "ROBUST54 runner SHA mismatch: $h" }
          Write-Host "ROBUST54_RUNNER_SHA256=$h"
      - name: Execute native MT5 replay parity shard
        shell: powershell
        run: |
          ./GOLD_54_GITHUB_HOSTED_RUN.ps1 `
            -ShardIds '${{ matrix.methods }}' `
            -MethodFilter '${{ inputs.method_filter }}'
      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold54-${{ matrix.shard }}-${{ github.run_id }}
          path: gold54-hosted/evidence/**
          if-no-files-found: warn
          retention-days: 90
