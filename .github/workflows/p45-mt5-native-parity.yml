name: GOLD Certification Native MT5 Factory

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p45-mt5-native-parity.yml'

permissions:
  contents: read

jobs:
  p45-native:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN || secrets.EXNESS_MT5_LOGIN || secrets.EXNESS_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD || secrets.EXNESS_MT5_PASSWORD || secrets.EXNESS_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER || secrets.EXNESS_MT5_SERVER || secrets.EXNESS_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect broker secret presence without exposing values
        shell: powershell
        run: |
          $ready=(-not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_SERVER))
          Write-Host ("BROKER_SECRETS_CONFIGURED={0}" -f $ready)
          if(-not $ready){ Write-Host 'Same-dataset parity will still run; broker real-tick will be explicitly skipped.' }

      - name: Download immutable P45 hosted runner
        shell: powershell
        run: |
          python -m pip install --quiet gdown
          python -m gdown 1tTyqKrodNNH9OBrV77yPcmIPWBcuDKal -O P45_GITHUB_HOSTED_RUN.ps1
          if(!(Test-Path P45_GITHUB_HOSTED_RUN.ps1)){ throw 'P45 runner download failed' }
          $h=(Get-FileHash P45_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          if($h -ne '27e2c541e6daa4c06698a69768aa2e6c22627f68b62f65162d9e2c0d61eadcb1'){ throw "P45 runner SHA mismatch: $h" }
          Write-Host "P45_RUNNER_SHA256=$h"
          $src=[IO.File]::ReadAllText('P45_GITHUB_HOSTED_RUN.ps1')
          $patched=$src.Replace('python -m gdown --id $id -O $out','python -m gdown $id -O $out')
          $old="Ensure ((Get-Content `$ImportReceipt -Raw) -match 'status=PASS') 'MT5 custom-symbol import failed'"
          $new=@'
          $ir=Get-Content $ImportReceipt -Raw
          if($ir -notmatch 'status=PASS'){
            if(($ir -match 'rows_read=5526570') -and ($ir -match 'bars_mt5=100000')){
              Write-Host 'MT5_IMPORT_BARSCAP_COMPAT=ACCEPTED rows_read=5526570 bars_mt5=100000; Bars() is chart-cap limited. Comparator remains authoritative.'
            }else{
              throw 'MT5 custom-symbol import failed'
            }
          }
          '@
          $patched=$patched.Replace($old,$new.TrimEnd())
          $oldReportInit='  $ini=Join-Path $Run ((Split-Path $Report -Leaf)+''.ini'')'
          $newReportInit=@'
            $ini=Join-Path $Run ((Split-Path $Report -Leaf)+'.ini')
            $reportLeaf=[IO.Path]::GetFileNameWithoutExtension($Report)
            $reportDir=Join-Path $Mt5Dir 'reports\GoldAutopilot'
            New-Item -ItemType Directory -Force $reportDir | Out-Null
            $reportRel="\reports\GoldAutopilot\$reportLeaf"
            $reportActual=Join-Path $reportDir ($reportLeaf+'.htm')
            Remove-Item $reportActual -Force -ErrorAction SilentlyContinue
          '@
          $patched=$patched.Replace($oldReportInit,$newReportInit.TrimEnd())
          $patched=$patched.Replace('Report=$Report','Report=$reportRel')
          $oldReportGate='  Ensure (Test-Path $Report) "Tester report missing: $Report"'
          $newReportGate=@'
            if(Test-Path $reportActual){ Copy-Item $reportActual $Report -Force }
            Ensure (Test-Path $Report) "Tester report missing: $Report"
          '@
          $patched=$patched.Replace($oldReportGate,$newReportGate.TrimEnd())
          if($patched -eq $src){ throw 'Expected compatibility patch targets not found in verified P45 runner' }
          if($patched -notmatch 'MT5_IMPORT_BARSCAP_COMPAT=ACCEPTED'){ throw 'MT5 bar-cap compatibility patch was not applied' }
          if($patched -notmatch 'reports\\GoldAutopilot'){ throw 'MT5 tester report-path compatibility patch was not applied' }
          [IO.File]::WriteAllText('P45_GITHUB_HOSTED_RUN.ps1',$patched,(New-Object Text.UTF8Encoding($false)))
          $ph=(Get-FileHash P45_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          Write-Host "P45_RUNNER_COMPAT_PATCH_SHA256=$ph"

      - name: Execute P45 native MT5 parity + optional Exness real ticks
        shell: powershell
        run: |
          ./P45_GITHUB_HOSTED_RUN.ps1 `
            -Login $env:MT5_LOGIN `
            -Password $env:MT5_PASSWORD `
            -Server $env:MT5_SERVER `
            -BrokerSymbol 'XAUUSD' `
            -FromDate '2025.01.01' `
            -ToDate '2026.08.25'

      - name: Upload P45 MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-mt5-${{ github.run_id }}
          path: p45-hosted/evidence/**
          if-no-files-found: warn
          retention-days: 90
