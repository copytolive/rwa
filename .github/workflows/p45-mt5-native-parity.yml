name: P45 GOLD Native MT5 + Exness Real Ticks
on:
  workflow_dispatch:
    inputs:
      broker_symbol:
        description: Exness MT5 symbol
        required: false
        default: XAUUSD
      from_date:
        description: Broker real-tick start YYYY.MM.DD
        required: false
        default: '2025.01.01'
      to_date:
        description: Broker real-tick end YYYY.MM.DD
        required: false
        default: '2026.08.25'
permissions:
  contents: read
jobs:
  p45-native:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # Supports likely historical secret names without printing values.
      MT5_LOGIN: ${{ secrets.MT5_LOGIN || secrets.EXNESS_MT5_LOGIN || secrets.EXNESS_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD || secrets.EXNESS_MT5_PASSWORD || secrets.EXNESS_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER || secrets.EXNESS_MT5_SERVER || secrets.EXNESS_SERVER }}
      MT5_SYMBOL: ${{ inputs.broker_symbol }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Detect broker secret presence without exposing values
        shell: powershell
        run: |
          $ready=(-not [string]::IsNullOrWhiteSpace($env:MT5_LOGIN)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)) -and (-not [string]::IsNullOrWhiteSpace($env:MT5_SERVER))
          Write-Host ("BROKER_SECRETS_CONFIGURED={0}" -f $ready)
          if(-not $ready){ Write-Host 'Same-dataset native MT5 parity will still run; broker real-tick stage will be explicitly skipped.' }

      - name: Download immutable hosted runner script from Drive
        shell: powershell
        run: |
          python -m pip install --quiet gdown
          python -m gdown --id 1tTyqKrodNNH9OBrV77yPcmIPWBcuDKal -O P45_GITHUB_HOSTED_RUN.ps1
          if(!(Test-Path P45_GITHUB_HOSTED_RUN.ps1)){ throw 'Runner script download failed' }
          $runnerHash=(Get-FileHash P45_GITHUB_HOSTED_RUN.ps1 -Algorithm SHA256).Hash.ToLower()
          if($runnerHash -ne '27e2c541e6daa4c06698a69768aa2e6c22627f68b62f65162d9e2c0d61eadcb1'){ throw "Runner SHA256 mismatch: $runnerHash" }
          Write-Host "RUNNER_SHA256=$runnerHash"

      - name: Execute native MT5 parity and Exness real-tick Strategy Tester
        shell: powershell
        run: |
          ./P45_GITHUB_HOSTED_RUN.ps1 `
            -Login $env:MT5_LOGIN `
            -Password $env:MT5_PASSWORD `
            -Server $env:MT5_SERVER `
            -BrokerSymbol '${{ inputs.broker_symbol }}' `
            -FromDate '${{ inputs.from_date }}' `
            -ToDate '${{ inputs.to_date }}'

      - name: Upload complete MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-mt5-exness-${{ github.run_id }}
          path: p45-hosted/evidence/**
          if-no-files-found: warn
          retention-days: 90
