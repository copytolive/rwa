name: P45 GOLD Native MT5 + Exness Real Ticks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p45-mt5-native-parity.yml'
  workflow_dispatch:
    inputs:
      broker_symbol:
        description: Exness MT5 symbol
        required: false
        default: XAUUSD
      from_date:
        description: Broker real-tick start YYYY.MM.DD
        required: false
        default: '2025.01.01'
      to_date:
        description: Broker real-tick end YYYY.MM.DD
        required: false
        default: '2026.08.25'
permissions:
  contents: read
jobs:
  p45-native:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN || secrets.EXNESS_MT5_LOGIN || secrets.EXNESS_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD || secrets.EXNESS_MT5_PASSWORD || secrets.EXNESS_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER || secrets.EXNESS_MT5_SERVER || secrets.EXNESS_SERVER }}
      MT5_SYMBOL: ${{ inputs.broker_symbol || 'XAUUSD' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate secret presence without exposing values
        shell: powershell
        run: |
          if([string]::IsNullOrWhiteSpace($env:MT5_LOGIN)){ throw 'MT5 login secret not found under supported names' }
          if([string]::IsNullOrWhiteSpace($env:MT5_PASSWORD)){ throw 'MT5 password secret not found under supported names' }
          if([string]::IsNullOrWhiteSpace($env:MT5_SERVER)){ throw 'MT5 server secret not found under supported names' }
          Write-Host 'Broker secrets detected; values remain masked.'

      - name: Download immutable hosted runner script from Drive
        shell: powershell
        run: |
          python -m pip install --quiet gdown
          python -m gdown --id 1ICksf5-9GTGDAWuiLZyUAWHttPHY_MYZ -O P45_GITHUB_HOSTED_RUN.ps1
          if(!(Test-Path P45_GITHUB_HOSTED_RUN.ps1)){ throw 'Runner script download failed' }

      - name: Execute native MT5 parity and Exness real-tick Strategy Tester
        shell: powershell
        run: |
          ./P45_GITHUB_HOSTED_RUN.ps1 `
            -Login $env:MT5_LOGIN `
            -Password $env:MT5_PASSWORD `
            -Server $env:MT5_SERVER `
            -BrokerSymbol '${{ inputs.broker_symbol || 'XAUUSD' }}' `
            -FromDate '${{ inputs.from_date || '2025.01.01' }}' `
            -ToDate '${{ inputs.to_date || '2026.08.25' }}'

      - name: Upload complete MT5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p45-mt5-exness-${{ github.run_id }}
          path: p45-hosted/evidence/**
          if-no-files-found: warn
          retention-days: 90
