name: GOLD24 Latest Selected Script Parity

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-latest-script-parity.yml'
      - 'backtest/gold24/SCRIPT_PARITY_KICK'

permissions:
  contents: read
  actions: read

concurrency:
  group: gold24-latest-script-parity
  cancel-in-progress: true

jobs:
  exact-python-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STATE_DIR: ${{ github.workspace }}/.gold24-canonical-v11
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Restore latest authoritative canonical state
        shell: bash
        run: |
          set -euo pipefail
          eval "$(python - <<'PY'
          import json
          x=json.load(open('backtest/gold24/runtime_v11/latest_validation_summary.json'))
          assert x['validation']=='PASS' and x['gate_a_strict']['gate_a']=='PASS'
          print('SOURCE_RUN_ID='+str(x['github_run_id']))
          print('SOURCE_BATCH='+str(x['batch']))
          print('SOURCE_CURSOR='+str(x['candidate_cursor']))
          PY
          )"
          echo "SOURCE_BATCH=$SOURCE_BATCH" >> "$GITHUB_ENV"
          echo "SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          rm -rf "$STATE_DIR"; mkdir -p "$STATE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n gold24-canonical-v11-state -D "$STATE_DIR"
          test -s "$STATE_DIR/gold24-v11.db"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"
      - name: Exact selected-set Python and wrapper parity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/latest-script-parity.json"
          python backtest/gold24/qualified_scripts/validate_qualified_scripts.py --state-dir "$STATE_DIR" --out "$OUT"
          python - "$OUT" <<'PY'
          import csv,json,sys
          p=json.load(open(sys.argv[1]))
          strict=list(csv.DictReader(open('backtest/gold24/runtime_mt5_lot/latest_entry100_net20000_standard_lot.csv',encoding='utf-8-sig')))
          multi=list(csv.DictReader(open('backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv',encoding='utf-8-sig')))
          assert p['status']=='PASS'
          assert p['strict_count']==len(strict)==3
          assert p['multi_count']==len(multi)
          assert p['total_method_pairs']==len(strict)+len(multi)
          assert all(x.get('wrapper_static')=='PASS' and x.get('canonical_python_parity')=='PASS' for x in p['checks'])
          print(f"LATEST_SCRIPT_PARITY_PASS strict={len(strict)} multi={len(multi)} total={len(strict)+len(multi)}")
          PY
      - name: Upload exact parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-latest-script-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/latest-script-parity.json
          if-no-files-found: error
          retention-days: 90

  native-mt5-compile:
    needs: exact-python-parity
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for selected-set static validator
        shell: powershell
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Resolve exact selected wrappers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'static.json'
          python backtest/gold24/qualified_scripts/validate_qualified_scripts.py --out $out
          if($LASTEXITCODE -ne 0){throw 'selected-set static validator failed'}
          $p=Get-Content $out -Raw | ConvertFrom-Json
          if($p.status -ne 'PASS'){throw 'static parity not PASS'}
          $names=@($p.checks | ForEach-Object {$_.stem})
          if($names.Count -ne [int]$p.total_method_pairs){throw 'selected wrapper count mismatch'}
          $names | Set-Content (Join-Path $env:RUNNER_TEMP 'selected-stems.txt') -Encoding ASCII
          "EXPECTED_EA_COUNT=$($names.Count)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install official Exness MT5 and locate terminal + MetaEditor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'exness5setup.exe'
          Invoke-WebRequest -UseBasicParsing 'https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe' -OutFile $setup
          Start-Process -FilePath $setup -ArgumentList '/auto' -Wait
          Start-Sleep -Seconds 12
          $term=@(); foreach($r in @('C:\Program Files','C:\Program Files (x86)',"$env:LOCALAPPDATA\Programs")){if(Test-Path $r){$term+=Get-ChildItem $r -Filter terminal64.exe -File -Recurse -ErrorAction SilentlyContinue}}
          $terminal=($term|Sort-Object LastWriteTime -Descending|Select-Object -First 1).FullName
          if([string]::IsNullOrWhiteSpace($terminal)){throw 'terminal64.exe not found'}
          $meta=Join-Path (Split-Path $terminal) 'MetaEditor64.exe'
          if(!(Test-Path $meta)){throw 'MetaEditor64.exe not found next to terminal'}
          "MT5_TERMINAL=$terminal" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_META=$meta" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Initialize MT5 data directory
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $env:MT5_TERMINAL -PassThru
          Start-Sleep -Seconds 25
          if(-not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          Get-Process terminal64,metatester64 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $base=Join-Path $env:APPDATA 'MetaQuotes\Terminal'
          $cand=Get-ChildItem $base -Directory -ErrorAction Stop | Where-Object {Test-Path (Join-Path $_.FullName 'MQL5')} | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if($null -eq $cand){throw 'MT5 data directory missing'}
          "MT5_DATA=$($cand.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Native MetaEditor compile exact selected set
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP 'compile-evidence'; New-Item -ItemType Directory -Force $evidence|Out-Null
          $expert=Join-Path $env:MT5_DATA 'MQL5\Experts\Gold24Latest'; New-Item -ItemType Directory -Force $expert|Out-Null
          Copy-Item 'backtest/gold24/qualified_scripts/qualified_engine.mqh' $expert -Force
          Copy-Item 'backtest/gold24/qualified_scripts/multimethod_engine.mqh' $expert -Force
          $stems=@(Get-Content (Join-Path $env:RUNNER_TEMP 'selected-stems.txt') | Where-Object {$_})
          if($stems.Count -ne [int]$env:EXPECTED_EA_COUNT){throw 'selected stems changed'}
          foreach($stem in $stems){Copy-Item "backtest/gold24/qualified_scripts/$stem.mq5" (Join-Path $expert "$stem.mq5") -Force}
          foreach($stem in $stems){
            $p=Join-Path $expert "$stem.mq5"
            $log=[IO.Path]::ChangeExtension($p,'.log'); $ex5=[IO.Path]::ChangeExtension($p,'.ex5')
            Remove-Item $log,$ex5 -Force -ErrorAction SilentlyContinue
            $proc=Start-Process -FilePath $env:MT5_META -ArgumentList @("/compile:$p",'/log') -PassThru
            if(-not $proc.WaitForExit(120000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue;throw "compile timeout $stem"}
            for($i=0;$i -lt 30 -and (!(Test-Path $log) -or !(Test-Path $ex5));$i++){Start-Sleep -Milliseconds 500}
            if(!(Test-Path $log) -or !(Test-Path $ex5)){throw "compile evidence missing $stem log=$(Test-Path $log) ex5=$(Test-Path $ex5)"}
            $txt=Get-Content $log -Raw; Copy-Item $log (Join-Path $evidence "$stem.log") -Force
            if($txt -notmatch '0 errors, 0 warnings'){throw "compile not clean $stem`n$txt"}
          }
          "NATIVE_MT5_COMPILE_PASS ea_count=$($stems.Count)" | Tee-Object -FilePath (Join-Path $evidence 'receipt.txt')
      - name: Upload native compile evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-latest-native-compile-${{ github.run_id }}
          path: ${{ runner.temp }}/compile-evidence
          if-no-files-found: error
          retention-days: 90
