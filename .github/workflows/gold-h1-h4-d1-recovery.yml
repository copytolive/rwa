name: GOLD H1 H4 D1 Data Recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold-h1-h4-d1-recovery.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold-h1-h4-d1-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY: ${{ runner.temp }}/gold-h1-h4-d1-recovery
      RECOVERY_BRANCH: recovery/gold-h1-h4-d1-data-20260905
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -r backtest/gold24/requirements.txt
          python -m pip install 'git+https://github.com/rongardF/tvdatafeed.git'
          mkdir -p "$RECOVERY/D1" "$RECOVERY/H4" "$RECOVERY/H1"

      - name: Fetch direct D1 and H4
        shell: bash
        run: |
          set +e
          python -u backtest/gold24/tradingview_gate_a.py --out-dir "$RECOVERY/D1" --bars 6500
          echo "D1_RC=$?"
          python -u backtest/gold24/tradingview_native_h4_gate_a.py --out-dir "$RECOVERY/H4" --bars 20000
          echo "H4_RC=$?"
          set -e

      - name: Fetch direct native H1
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/h1_gate.py" <<'PY'
          from __future__ import annotations
          import hashlib, json, sys
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from tvDatafeed import Interval, TvDatafeed

          out=Path(sys.argv[1]); out.mkdir(parents=True,exist_ok=True)
          pp=out/'GC1_COMEX_TRADINGVIEW_H1_PRIMARY.csv'
          xp=out/'XAUUSD_OANDA_TRADINGVIEW_H1_CROSSCHECK.csv'
          rp=out/'gate_a_receipt.json'

          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()

          def norm(df, volume_required):
              if df is None or df.empty: raise RuntimeError('TradingView returned no H1 bars')
              x=df.reset_index() if isinstance(df.index,pd.DatetimeIndex) else df.copy()
              cols={str(c).lower():c for c in x.columns}
              dtc=cols.get('datetime') or cols.get('date') or cols.get('index') or x.columns[0]
              ren={}
              for a,b in [('open','Open'),('high','High'),('low','Low'),('close','Close'),('volume','Volume')]:
                  if a in cols: ren[cols[a]]=b
              x=x.rename(columns=ren)
              for c in ['Open','High','Low','Close']:
                  if c not in x: raise RuntimeError('missing '+c)
              r=pd.DataFrame({'Date':pd.to_datetime(x[dtc],utc=True,errors='coerce'),'Open':pd.to_numeric(x['Open'],errors='coerce'),'High':pd.to_numeric(x['High'],errors='coerce'),'Low':pd.to_numeric(x['Low'],errors='coerce'),'Close':pd.to_numeric(x['Close'],errors='coerce')})
              r['Volume']=pd.to_numeric(x['Volume'],errors='coerce') if 'Volume' in x else 0.0
              if volume_required and r['Volume'].isna().any(): raise RuntimeError('primary volume missing')
              r['Volume']=r['Volume'].fillna(0.0)
              if r.isna().any().any(): raise RuntimeError('NaN H1 data')
              r=r.drop_duplicates('Date',keep='last').sort_values('Date').reset_index(drop=True)
              o,h,l,c=(r[z].to_numpy(float) for z in ['Open','High','Low','Close'])
              if np.any(h<l) or np.any(o<l) or np.any(o>h) or np.any(c<l) or np.any(c>h): raise RuntimeError('OHLC consistency')
              med=float(r['Date'].diff().dropna().dt.total_seconds().median()/3600.0)
              if med>2.5: raise RuntimeError(f'not H1 cadence: {med}h')
              return r

          receipt={'schema':'copytolive-gold-h1-gate-a-v3','provider':'TradingView','symbol':'GOLD','timeframe':'H1','construction':'DIRECT_SOURCE_H1_BARS_NO_RESAMPLING','no_resampling_attested':True}
          try:
              tv=TvDatafeed()
              p=norm(tv.get_hist(symbol='GC1!',exchange='COMEX',interval=Interval.in_1_hour,n_bars=40000,extended_session=False),True)
              x=norm(tv.get_hist(symbol='XAUUSD',exchange='OANDA',interval=Interval.in_1_hour,n_bars=40000,extended_session=False),False)
              p.to_csv(pp,index=False,date_format='%Y-%m-%dT%H:%M:%SZ'); x.to_csv(xp,index=False,date_format='%Y-%m-%dT%H:%M:%SZ')
              a=pd.merge_asof(p[['Date','Close']].rename(columns={'Date':'pd','Close':'pc'}).sort_values('pd'),x[['Date','Close']].rename(columns={'Date':'xd','Close':'xc'}).sort_values('xd'),left_on='pd',right_on='xd',direction='nearest',tolerance=pd.Timedelta(minutes=90)).dropna()
              ar=np.log(a['pc']).diff(); br=np.log(a['xc']).diff(); g=ar.notna()&br.notna()
              corr=float(ar[g].corr(br[g])) if g.sum()>2 else float('nan')
              direction=float((np.sign(ar[g])==np.sign(br[g])).mean()) if g.any() else 0.0
              pdaily=p.assign(day=p.Date.dt.floor('D')).groupby('day').Close.last(); xdaily=x.assign(day=x.Date.dt.floor('D')).groupby('day').Close.last(); d=pd.concat([pdaily.rename('p'),xdaily.rename('x')],axis=1).dropna(); drp=np.log(d.p).diff(); drx=np.log(d.x).diff(); dg=drp.notna()&drx.notna(); dc=float(drp[dg].corr(drx[dg])) if dg.sum()>2 else float('nan'); dd=float((np.sign(drp[dg])==np.sign(drx[dg])).mean()) if dg.any() else 0.0
              days=float((p.Date.iloc[-1]-p.Date.iloc[0]).total_seconds()/86400.0); floor=max(10000,int(min(len(p),len(x))*0.90)); delta=float(((a.pc/a.xc)-1).abs().median())
              criteria={'primary_rows_ge_20000':len(p)>=20000,'primary_history_ge_4_years':days>=1460,'primary_reaches_2026':p.Date.iloc[-1].year>=2026,'crosscheck_reaches_2026':x.Date.iloc[-1].year>=2026,'overlap_ge_90pct':len(a)>=floor,'h1_log_return_corr_ge_0_70':bool(np.isfinite(corr) and corr>=0.70),'h1_direction_ge_0_70':direction>=0.70,'daily_corr_ge_0_85':bool(np.isfinite(dc) and dc>=0.85),'daily_direction_ge_0_75':dd>=0.75,'median_abs_price_delta_le_0_08':delta<=0.08}
              receipt.update({'crosscheck_pass':bool(all(criteria.values())),'criteria':criteria,'primary_symbol':'COMEX:GC1!','crosscheck_symbol':'OANDA:XAUUSD','primary_rows':len(p),'crosscheck_rows':len(x),'primary_start_utc':str(p.Date.iloc[0]),'primary_end_utc':str(p.Date.iloc[-1]),'crosscheck_start_utc':str(x.Date.iloc[0]),'crosscheck_end_utc':str(x.Date.iloc[-1]),'primary_history_days':days,'overlap_rows':len(a),'h1_log_return_correlation':corr,'h1_direction_agreement':direction,'daily_validation_log_return_correlation':dc,'daily_validation_direction_agreement':dd,'median_absolute_price_delta_fraction':delta,'primary_sha256':sha(pp),'crosscheck_data_sha256':sha(xp)})
          except Exception as e:
              receipt.update({'crosscheck_pass':False,'error':f'{type(e).__name__}: {e}'})
          receipt['generated_at']=pd.Timestamp.now(tz='UTC').isoformat(); rp.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n'); print(json.dumps(receipt,indent=2,sort_keys=True))
          PY
          python -u "$RUNNER_TEMP/h1_gate.py" "$RECOVERY/H1" || true

      - name: Write recovery status
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=Path(os.environ['RECOVERY'])
          def load(rel):
              p=r/rel
              if not p.exists(): return {'crosscheck_pass':False,'error':'receipt missing'}
              try: return json.loads(p.read_text())
              except Exception as e: return {'crosscheck_pass':False,'error':repr(e)}
          d1=load('D1/gate_a_receipt.json'); h4=load('H4/gate_a_h4_receipt.json'); h1=load('H1/gate_a_receipt.json')
          s={'D1':d1,'H4':h4,'H1':h1,'all_pass':bool(d1.get('crosscheck_pass') and h4.get('crosscheck_pass') and h1.get('crosscheck_pass'))}
          (r/'RECOVERY_STATUS.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'D1_PASS':d1.get('crosscheck_pass'),'H4_PASS':h4.get('crosscheck_pass'),'H1_PASS':h1.get('crosscheck_pass'),'H1_ROWS':h1.get('primary_rows'),'H1_HISTORY_DAYS':h1.get('primary_history_days'),'ALL_PASS':s['all_pass']},indent=2))
          PY

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-h1-h4-d1-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/gold-h1-h4-d1-recovery
          retention-days: 30
          if-no-files-found: error

      - name: Publish to recovery branch
        run: |
          set -euo pipefail
          git config user.name 'gold-recovery-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin "$RECOVERY_BRANCH:$RECOVERY_BRANCH"
          git switch "$RECOVERY_BRANCH"
          rm -rf backtest/gold24/recovery_data
          mkdir -p backtest/gold24/recovery_data
          cp -a "$RECOVERY/." backtest/gold24/recovery_data/
          git add backtest/gold24/recovery_data
          git commit -m 'chore(gold): publish H1 H4 D1 recovery data [skip ci]' || true
          git push origin HEAD:"$RECOVERY_BRANCH"

      - name: Final gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads((Path(os.environ['RECOVERY'])/'RECOVERY_STATUS.json').read_text())
          print('D1_PASS=',s['D1'].get('crosscheck_pass'))
          print('H4_PASS=',s['H4'].get('crosscheck_pass'))
          print('H1_PASS=',s['H1'].get('crosscheck_pass'))
          print('H1_ROWS=',s['H1'].get('primary_rows'))
          print('H1_HISTORY_DAYS=',s['H1'].get('primary_history_days'))
          if not s.get('all_pass'): raise SystemExit('RECOVERY_BLOCKED')
          print('H1_H4_D1_REMOTE_RECOVERY=PASS')
          PY

