name: GOLD H1 H4 D1 Data Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gold-h1-h4-d1-recovery.yml
      - backtest/gold24/remote_recovery_h1h4d1.py
      - backtest/gold24/tradingview_gate_a.py
      - backtest/gold24/tradingview_native_h4_gate_a.py

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RECOVERY: /tmp/gold-h1-h4-d1-recovery
      RECOVERY_BRANCH: recovery/gold-h1-h4-d1-data-20260905
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install -r backtest/gold24/requirements.txt
          python -m pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Recover direct native bars
        run: python -u backtest/gold24/remote_recovery_h1h4d1.py

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-h1-h4-d1-recovery-${{ github.run_id }}
          path: /tmp/gold-h1-h4-d1-recovery
          retention-days: 30
          if-no-files-found: error

      - name: Publish recovery branch
        run: |
          git config user.name gold-recovery-bot
          git config user.email actions@users.noreply.github.com
          git fetch origin "$RECOVERY_BRANCH"
          git switch -C "$RECOVERY_BRANCH" "origin/$RECOVERY_BRANCH"
          rm -rf backtest/gold24/recovery_data
          mkdir -p backtest/gold24/recovery_data
          cp -a "$RECOVERY/." backtest/gold24/recovery_data/
          git add backtest/gold24/recovery_data
          git commit -m 'chore(gold): publish H1 H4 D1 recovery data [skip ci]' || true
          git push origin HEAD:"$RECOVERY_BRANCH"

      - name: Final gate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RECOVERY']) / 'RECOVERY_STATUS.json'
          s = json.loads(p.read_text())
          print('D1_PASS=', s['D1'].get('crosscheck_pass'))
          print('H4_PASS=', s['H4'].get('crosscheck_pass'))
          print('H1_PASS=', s['H1'].get('crosscheck_pass'))
          print('H1_ROWS=', s['H1'].get('primary_rows'))
          print('H1_HISTORY_DAYS=', s['H1'].get('primary_history_days'))
          print('H1_CONSTRUCTION=', s['H1'].get('construction'))
          if not s.get('all_pass'):
              raise SystemExit('RECOVERY_BLOCKED')
          print('H1_H4_D1_REMOTE_RECOVERY=PASS')
          PY
