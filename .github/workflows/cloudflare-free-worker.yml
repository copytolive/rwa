name: RWA Free Worker — Cloudflare

on:
  push:
    branches: ["main"]
    paths:
      - "agent-worker/cloudflare/**"
      - "agent-worker/package.json"
      - "agent-worker/execution.mjs"
      - "agent-worker/copy-engine.mjs"
      - ".github/workflows/cloudflare-free-worker.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy/refresh the free Cloudflare worker"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  statuses: write

concurrency:
  group: rwa-cloudflare-free-worker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install worker dependencies
        working-directory: agent-worker
        run: npm install --ignore-scripts
      - name: Validate Node + Cloudflare source
        working-directory: agent-worker
        run: npm run check
      - name: Validate Cloudflare bundle
        working-directory: agent-worker
        run: npx wrangler deploy --config cloudflare/wrangler.toml --dry-run --outdir /tmp/rwa-worker-dist
      - name: Publish free-worker build status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/free-worker-build' -f description='Cloudflare Workers Free + Durable Object bundle PASS'
      - name: Publish free-worker build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/free-worker-build' -f description='Cloudflare free worker build failed'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Detect free Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish credential-waiting status
        if: steps.creds.outputs.available != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='rwa/free-worker-live' -f description='Free worker bundle ready; add Cloudflare Free API token + account ID as GitHub Actions secrets'
      - name: Install worker dependencies
        if: steps.creds.outputs.available == 'true'
        working-directory: agent-worker
        run: npm install --ignore-scripts
      - name: Create persistent encryption secret once
        if: steps.creds.outputs.available == 'true'
        working-directory: agent-worker
        run: |
          if ! npx wrangler secret list --config cloudflare/wrangler.toml --json | grep -q 'RWA_KEY_ENCRYPTION_SECRET'; then
            openssl rand -hex 48 | npx wrangler secret put RWA_KEY_ENCRYPTION_SECRET --config cloudflare/wrangler.toml
          fi
      - name: Deploy free Cloudflare Worker
        if: steps.creds.outputs.available == 'true'
        id: deploy
        working-directory: agent-worker
        run: |
          set -o pipefail
          npx wrangler deploy --config cloudflare/wrangler.toml 2>&1 | tee /tmp/rwa-worker-deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/rwa-worker-deploy.log | tail -1)"
          test -n "$URL" || { echo 'Could not resolve workers.dev URL'; exit 3; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Verify deployed health contract
        if: steps.creds.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body="$(curl -fsSL --max-time 20 "$URL/healthz")"
          node -e "const x=JSON.parse(process.argv[1]); if(!(x.ok===true&&x.single_write_path==='RWAWorkerExecutionAPI'&&x.idempotency==='deterministic-cloid-v1'&&x.origin_bound===true)) process.exit(1)" "$body"
      - name: Activate TESTNET worker only
        if: steps.creds.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          python - <<'PY'
          import json, os
          p='agent-worker/public-config.json'
          x=json.load(open(p)); x.update({'schema':1,'enabled':True,'base_url':os.environ['URL'],'mode':'delegated-agent','master_private_key_required':False,'agent_private_key_scope':'trade-only delegated Hyperliquid agent','note':'Free Cloudflare worker; TESTNET activation. MAINNET remains launch-gated.'})
          open(p,'w').write(json.dumps(x,indent=2)+'\n')
          p='agent-worker/control.json'
          x=json.load(open(p)); x.update({'schema':1,'enabled':True,'kill_switch':False,'mainnet_enabled':False,'production_ready':True,'note':'Free Cloudflare worker active for TESTNET/beta. MAINNET remains hard locked until READY_FOR_MAINNET.'})
          open(p,'w').write(json.dumps(x,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent-worker/public-config.json agent-worker/control.json
          if ! git diff --cached --quiet; then
            git commit -m 'worker: activate free Cloudflare TESTNET runtime'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Wait for repository control and ready gate
        if: steps.creds.outputs.available == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          ok=0
          for i in {1..60}; do
            ready="$(curl -fsSL --max-time 20 "$URL/readyz" || true)"
            if node -e "try{const x=JSON.parse(process.argv[1]);process.exit(x.ok===true?0:1)}catch{process.exit(1)}" "$ready"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish free worker live status
        if: steps.creds.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/free-worker-live' -f description='Cloudflare Workers Free runtime health + ready PASS; TESTNET only'
