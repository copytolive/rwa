name: GOLD24 Portable System Export

on:
  push:
    paths:
      - '.github/workflows/gold24-portable-system-export.yml'
      - 'backtest/gold24/PORTABLE_EXPORT_KICK'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gold24-portable-system-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build portable GOLD24 system package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/GOLD24_PORTABLE_SYSTEM_2026-08-31"
          mkdir -p "$OUT/repo/backtest" "$OUT/repo/.github/workflows" "$OUT/evidence"

          cp -a backtest/gold24 "$OUT/repo/backtest/gold24"
          find .github/workflows -maxdepth 1 -type f \( -iname '*gold24*' -o -iname '*multimethod*' \) -exec cp {} "$OUT/repo/.github/workflows/" \;

          # Keep this package portable and connector-downloadable. Large durable state/data stays referenced by digest,
          # because the authoritative canonical Actions artifact is ~858 MB and exceeds connector download limits.
          find "$OUT/repo/backtest/gold24" -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.parquet' -o -name '*.arrow' -o -name '*.feather' \) -print -delete > "$OUT/evidence/OMITTED_STATE_FILES.txt" || true
          find "$OUT/repo/backtest/gold24" -type f -size +25M -print -delete >> "$OUT/evidence/OMITTED_STATE_FILES.txt" || true

          git rev-parse HEAD > "$OUT/evidence/SOURCE_SHA.txt"
          git log -1 --format=fuller > "$OUT/evidence/SOURCE_COMMIT.txt"
          git ls-tree -r --long HEAD backtest/gold24 .github/workflows > "$OUT/evidence/SOURCE_TREE_MANIFEST.txt"

          cat > "$OUT/evidence/CANONICAL_STATE_POINTER.txt" <<'EOF'
          Canonical GOLD state is intentionally not embedded in this portable package.
          Latest authoritative checkpoint at package design time:
          run_id=33330845155
          batch=242
          candidate_cursor=28242557
          configs_archived=62630
          artifact_name=gold24-canonical-v11-state
          artifact_id=9737955707
          artifact_size_bytes=858384547
          artifact_sha256=4ab44114de2a1cd0bd5dea5f730da4b52e19d6ed39cfc0da62894bff2034a55e
          Reason omitted: artifact exceeds the 512 MiB connector download limit and is not required to clone the architecture to a new pair.
          EOF

          cat > "$OUT/README_FIRST.txt" <<'EOF'
          GOLD24 PORTABLE SYSTEM EXPORT

          Purpose: transfer the COMPLETE GOLD24 source architecture, workflows, rules and published runtime evidence needed to reproduce the system for another market pair without transporting oversized canonical DB/data artifacts.

          Primary paths:
            repo/backtest/gold24/
            repo/.github/workflows/

          For a new pair, create a NEW namespace (bitcoin24/btc24). Do not overwrite gold24.
          Resolve instrument symbol, dataset feeds, tick/contract/min-qty/fees/funding/spread/slippage from real sources before any claim of PASS.

          Large canonical state is referenced in evidence/CANONICAL_STATE_POINTER.txt and can stay on the original repository. It is not needed for BITCOIN architecture replication.
          EOF

          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/GOLD24_PORTABLE_SYSTEM_2026-08-31.tar.gz" GOLD24_PORTABLE_SYSTEM_2026-08-31
          ls -lh "$RUNNER_TEMP/GOLD24_PORTABLE_SYSTEM_2026-08-31.tar.gz"

      - name: Upload portable system artifact
        uses: actions/upload-artifact@v4
        with:
          name: GOLD24_PORTABLE_SYSTEM_2026-08-31
          path: ${{ runner.temp }}/GOLD24_PORTABLE_SYSTEM_2026-08-31.tar.gz
          if-no-files-found: error
          retention-days: 30
