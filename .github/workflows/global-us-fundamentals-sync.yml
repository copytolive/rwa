name: Global US Fundamentals Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * 6'
  push:
    branches: [main]
    paths:
      - '.github/workflows/global-us-fundamentals-sync.yml'
      - 'tools/sync-sec-us-frames.mjs'
      - 'tools/sync-sec-us-dividends.mjs'
permissions:
  contents: write
concurrency:
  group: global-us-fundamentals-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Direct SEC is authoritative; the gateway is transport-only when SEC blocks GitHub runner IPs.
      - name: Refresh official SEC US issuer associations first
        env:
          SEC_USER_AGENT: RWA Global Asset Terminal 183281927+narzulalistiqlal@users.noreply.github.com
        run: |
          mkdir -p tmp/sec
          SEC_HEADERS=(-H "User-Agent: ${SEC_USER_AGENT}" -H 'Accept: application/json' -H 'Accept-Encoding: gzip, deflate' -H 'Referer: https://www.sec.gov/about/developer-resources')
          if ! curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 "${SEC_HEADERS[@]}" --compressed -o tmp/sec/company_tickers_exchange.json 'https://www.sec.gov/files/company_tickers_exchange.json?output=1'; then
            if ! curl --http1.1 --fail --location --retry 2 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 120 "${SEC_HEADERS[@]}" --compressed -o tmp/sec/company_tickers_exchange.json 'https://www.sec.gov/files/company_tickers.json?output=1'; then
              echo 'SEC CDN blocked the GitHub runner; using a transport gateway while retaining SEC as content authority.'
              curl --fail --location --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 180 -o tmp/sec/company_tickers_exchange.json 'https://r.jina.ai/http://www.sec.gov/files/company_tickers_exchange.json'
            fi
          fi
          node tools/sync-sec-us-catalog.mjs tmp/sec/company_tickers_exchange.json
      - name: Build 10-year regulator-backed financial bootstrap
        env:
          SEC_USER_AGENT: RWA Global Asset Terminal 183281927+narzulalistiqlal@users.noreply.github.com
        run: node tools/sync-sec-us-frames.mjs
      - name: Add SEC-filed dividend-per-share history
        env:
          SEC_USER_AGENT: RWA Global Asset Terminal 183281927+narzulalistiqlal@users.noreply.github.com
        run: node tools/sync-sec-us-dividends.mjs
      - name: Accuracy and provenance gate
        run: node tools/global-data-audit.mjs
      - name: Commit generated US regulator data
        run: |
          if git diff --quiet -- data/global/security-master.json data/global/fundamental-shards/US data/global/coverage/us.json; then
            echo 'No regulator data change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/global/security-master.json data/global/fundamental-shards/US data/global/coverage/us.json
          git commit -m 'data: sync SEC regulator-backed US fundamentals and dividends'
          git push
