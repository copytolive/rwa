name: RWA Quick Actions Smoke
on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "quick-actions.js"
      - "suite.js"
      - "suite-ui.js"
      - ".github/workflows/quick-actions-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-quick-actions-smoke
  cancel-in-progress: true
jobs:
  quick-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check quick-actions.js
          grep -Fq 'quick-actions.js?v=1' index.html
          grep -Fq 'RWAQuickActions' quick-actions.js
          grep -Fq 'data-rwa-trade-now' quick-actions.js
          grep -Fq "openTab('watch')" quick-actions.js
          grep -Fq "openTab('rwa')" quick-actions.js
          grep -Fq "new URL('trade/'" quick-actions.js
          grep -Fq 'navigator.share' quick-actions.js
          grep -Fq 'navigator.clipboard.writeText' quick-actions.js
          ! grep -Fq 'ExchangeClient' quick-actions.js
      - name: Publish source status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/quick-actions-source' -f description='Watch, alert, share, RWA access and perps routing verified'
      - name: Verify live bundle
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            js="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/quick-actions.js?v=$q" || true)"
            if grep -Fq 'quick-actions.js?v=1' <<<"$html" \
              && grep -Fq 'RWAQuickActions' <<<"$js" \
              && grep -Fq 'data-rwa-trade-now' <<<"$js" \
              && grep -Fq "openTab('watch')" <<<"$js" \
              && grep -Fq "new URL('trade/'" <<<"$js"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/quick-actions-live' -f description='Actionable market shortcuts verified live on GitHub Pages'
      - name: Publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/quick-actions-live' -f description='Quick actions live verification failed'
