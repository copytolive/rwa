name: MT5 Native Public Smoke

on:
  push:
    branches: [mt5-ci-smoke]
    paths:
      - '.github/workflows/mt5-ci-smoke.yml'
      - 'mt5-ci/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mt5-ci-smoke.yml'
      - 'mt5-ci/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mt5-ci-smoke
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate frozen synthetic Bid Ask ticks
        shell: pwsh
        run: python mt5-ci/scripts/generate_smoke.py
      - name: Install and execute native MT5
        shell: pwsh
        run: ./mt5-ci/scripts/run.ps1
      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-native-smoke-${{ github.run_id }}
          path: |
            mt5-ci/generated/**
            mt5-ci/results/latest/**
          if-no-files-found: warn
          retention-days: 30
      - name: Commit compact latest evidence
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "chatgpt-mt5-smoke"
          git config user.email "actions@users.noreply.github.com"
          git add -f mt5-ci/results/latest/
          if (git diff --cached --quiet) { Write-Host 'No result changes' }
          else { git commit -m 'Update MT5 native smoke evidence [skip ci]'; git push origin HEAD:mt5-ci-smoke }
