name: Ecommerce Public Production Smoke

on:
  # The Ecommerce drawer lives in the shared /rwa/ shell. A change outside the
  # commerce files can still regress its production geometry, so every main
  # deployment must re-prove the public HTTPS contextual-panel contract.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact GitHub Pages SHA
        shell: bash
        run: |
          set -euxo pipefail
          url='https://copytolive.github.io/rwa/deployment-sha.txt'
          for i in $(seq 1 60); do
            deployed="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "${url}?v=${GITHUB_SHA}-${i}" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Exact Pages SHA is live: $deployed"
              exit 0
            fi
            echo "Waiting for Pages. expected=$GITHUB_SHA actual=${deployed:-unavailable}"
            sleep 10
          done
          echo 'Exact merged SHA did not reach GitHub Pages in time' >&2
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run public desktop and mobile browser matrix
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/ecommerce-public-production
        run: node tools/launch-ui-final-browser.mjs

      - name: Capture 1440x900 public Ecommerce visual proof
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, serviceWorkers: 'block' });
          const page = await context.newPage();
          await page.goto(`https://copytolive.github.io/rwa/?__ecommerce_1440_proof=${Date.now()}`, { waitUntil: 'domcontentloaded', timeout: 50000 });
          await page.waitForFunction(() => window.RWASeablueprintCommerceBridge?.version === '1.5.0', { timeout: 30000 });
          await page.locator('#rwaSeablueprintCommerceLaunch').click();
          await page.waitForFunction(() => document.querySelector('#rwaShopScreen')?.classList.contains('open'), { timeout: 12000 });
          await page.waitForSelector('#rwaShopScreen .rwa-product-card', { state: 'visible', timeout: 8000 });
          const proof = await page.evaluate(() => {
            const rect = (selector) => {
              const r = document.querySelector(selector)?.getBoundingClientRect();
              return r ? { left: Math.round(r.left), right: Math.round(r.right), top: Math.round(r.top), bottom: Math.round(r.bottom), width: Math.round(r.width), height: Math.round(r.height) } : null;
            };
            return {
              path: location.pathname,
              hash: location.hash,
              dock: rect('#rwaCommerceDock'),
              layout: rect('.layout'),
              commerce: window.RWASeablueprintCommerceBridge?.audit?.(),
              backendLocked: /BACKEND LOCKED/.test(document.querySelector('[data-seablueprint-source]')?.textContent || ''),
              screenParent: document.querySelector('#rwaShopScreen')?.parentElement?.id || ''
            };
          });
          if (proof.path !== '/rwa/' || proof.hash !== '#shop') throw new Error(`unexpected route ${JSON.stringify(proof)}`);
          if (!proof.dock || proof.dock.width < 420 || proof.dock.width > 442) throw new Error(`invalid contextual dock ${JSON.stringify(proof)}`);
          if (!proof.commerce?.ok || proof.commerce?.mode !== 'CONTEXT_PANEL' || proof.commerce?.apiBaseConfigured) throw new Error(`invalid commerce audit ${JSON.stringify(proof)}`);
          if (Number(proof.commerce?.panelCoverage || 1) > 0.38 || Number(proof.commerce?.exposedChartWidth || 0) < 420) throw new Error(`market context not preserved ${JSON.stringify(proof)}`);
          if (!proof.backendLocked || proof.screenParent !== 'rwaCommerceDock') throw new Error(`truth/placement failed ${JSON.stringify(proof)}`);
          await page.screenshot({ path: 'proof/ecommerce-public-production/desktop-1440x900-ecommerce.png', fullPage: true });
          console.log(JSON.stringify(proof, null, 2));
          await browser.close();
          JS

      - name: Verify public proof contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='proof/ecommerce-public-production/browser-result.json'
          d=json.load(open(p))
          assert d['ok'] is True, d
          assert d['publicMode'] is True, d
          assert d['bridgeVersion']=='1.5.0', d
          assert not d['failures'], d
          print('PUBLIC_ECOMMERCE_CONTEXT_PANEL_PASS')
          PY

      - name: Upload public browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-public-production-${{ github.sha }}
          path: proof/ecommerce-public-production/
          if-no-files-found: error
          retention-days: 30