name: Bump Browser Recovery
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/bump-browser-recovery.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text();
          if 'browser-recovery.js?v=1' not in s: raise SystemExit('recovery v1 not found')
          p.write_text(s.replace('browser-recovery.js?v=1','browser-recovery.js?v=2',1))
          PY
          node --check browser-recovery.js
          grep -Fq 'browser-recovery.js?v=2' index.html
      - run: |
          rm .github/workflows/bump-browser-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-browser-recovery.yml
          git commit -m 'fix: force fresh browser recovery bootstrap'
          git push
