name: GOLD10B Global D1-H4 Correlation Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold10b-global-cross-timeframe-corr.yml'
      - 'backtest/gold24/GLOBAL_D1_H4_CORR_KICK'
  workflow_run:
    workflows:
      - GOLD10B Native H4 HARD PASS Discovery
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: gold10b-global-d1-h4-corr
  cancel-in-progress: true

env:
  D1_SOURCE_RUN_ID: '33667987913'
  D1_ARTIFACT: gold24-canonical-v11-state

jobs:
  cross_tf:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt

      - name: Resolve published H4 result and source run
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:backtest/gold24/runtime_native_h4/latest_native_h4_hardpass.json > "$RUNNER_TEMP/h4-result.json"
          python - <<'PY' >> "$GITHUB_ENV"
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/h4-result.json'))
          assert x['status']=='PASS'
          print('H4_HARDPASS_COUNT='+str(int(x.get('native_h4_hardpass_kept',0))))
          event=os.environ.get('GITHUB_EVENT_NAME','')
          # Last completed native-H4 source run is pinned for manual/push replays.
          print('H4_SOURCE_RUN_ID=33791624885')
          PY

      - name: Zero-H4 exact global closure
        if: env.H4_HARDPASS_COUNT == '0'
        run: |
          set -euo pipefail
          mkdir -p backtest/gold24/runtime_global_cross_tf
          python - <<'PY'
          import json,pathlib,collections,os
          repo=pathlib.Path('.')
          h4=json.loads(pathlib.Path(os.environ['RUNNER_TEMP']+'/h4-result.json').read_text())
          audit=json.loads((repo/'backtest/gold24/runtime_screening_gpt/combined_portfolio_audit.json').read_text())
          d1=json.loads((repo/'backtest/gold24/runtime_v11/latest_validation_summary.json').read_text())
          rows=audit.get('rows',[])
          kept=[r for r in rows if r.get('global_selection')=='KEPT']
          selected=[]
          for r in kept:
              selected.append({
                'config_hash':r['config_hash'],'method':r['method'],'family':r['family'],'timeframe':'D1',
                'correlation_max':r.get('global_corr_max'),'hard_pass_gate_count':r.get('hard_pass_gate_count'),
                'classification':r.get('classification')
              })
          payload={
            'schema':'gold10b-global-cross-timeframe-correlation-v1-zero-h4-closure','status':'PASS',
            'correlation_rule':'absolute Pearson(log-return equity), global per-symbol',
            'correlation_alignment':{
              'common_frequency':'UTC daily equity close','D1':'native D1 bar PnL',
              'H4':'no H4 HARD PASS entered global selection','backtest_resampling':False,
              'reason':'native H4 discovery produced zero HARD PASS, so exact existing D1 global greedy set is unchanged'
            },
            'source_h4_run_id':os.environ['H4_SOURCE_RUN_ID'],
            'datasets':{
              'D1':{'rows':d1['gate_a_strict']['primary_rows'],'sha256':d1['gate_a_strict']['primary_sha256'],
                    'start_utc':d1['gate_a_strict']['primary_start_utc'],'end_utc':d1['gate_a_strict']['primary_end_utc'],'provider':'TradingView'},
              'H4':{'rows':h4['dataset']['rows'],'sha256':h4['dataset']['dataset_sha256'],
                    'start_utc':h4['dataset']['start_utc'],'end_utc':h4['dataset']['end_utc'],'provider':h4['dataset']['provider'],
                    'construction':h4['dataset']['construction']}
            },
            'methods_input_d1':int(audit['methods_input']),'methods_input_h4_internal_hardpass':0,
            'methods_input_total':int(audit['methods_input']),'selected_global':int(audit['methods_final']),
            'rejected_global':int(audit['methods_input'])-int(audit['methods_final']),
            'greedy_comparisons_executed':int(audit['global_pair_count']),
            'greedy_rejections_corr_gt_0_50':int(audit['methods_input'])-int(audit['methods_final']),
            'raw_pairs_corr_gt_0_50':int(audit['pairs_gt_0_50']),
            'hard_pass_global':int(audit['hard_pass_count']),'watch_global':int(audit['watch_count']),'fail_global':int(audit['fail_count']),
            'h4_selected_after_global_corr':0,'h4_hard_pass_after_global_corr':0,
            'distinct_family':int(audit['final_distinct_family_count']),
            'family_counts':audit['family_counts_final'],'max_family_concentration':float(audit['final_max_family_share']),
            'portfolio_min_6_family_gate':int(audit['final_distinct_family_count'])>=6 and float(audit['final_max_family_share'])<=0.25,
            'portfolio_target_10_family_gate':int(audit['final_distinct_family_count'])>=10,
            'selected':selected,'rejected':[],
            'portfolio_readiness':'NOT_READY','live_ready':False,
            'live_ready_reason':'HARD PASS=0 and margin/slippage/broker interaction still requires explicit validation'
          }
          out=repo/'backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json'
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          print(json.dumps({k:payload[k] for k in ['status','methods_input_total','selected_global','hard_pass_global','h4_hard_pass_after_global_corr','distinct_family','max_family_concentration']},indent=2))
          PY

      - name: Download H4 artifact and exact D1 state when H4 HARD PASS exists
        if: env.H4_HARDPASS_COUNT != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .cross-h4 .cross-d1
          mkdir -p .cross-h4 .cross-d1
          gh run download "$H4_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "gold10b-native-h4-$H4_SOURCE_RUN_ID" -D .cross-h4
          gh run download "$D1_SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$D1_ARTIFACT" -D .cross-d1
          test -s .cross-h4/GC1_COMEX_TRADINGVIEW_H4_PRIMARY.csv
          test -s .cross-h4/gate_a_h4_receipt.json
          test -s .cross-h4/native_h4_hardpass.json
          test -s .cross-d1/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
          test -s .cross-d1/gate_a/gate_a_receipt.json

      - name: Run exact global cross-timeframe correlation filter when needed
        if: env.H4_HARDPASS_COUNT != '0'
        run: |
          set -euo pipefail
          python -u backtest/gold24/global_cross_timeframe_corr.py \
            --d1-state-dir .cross-d1 --h4-artifact-dir .cross-h4 --repo-root . \
            --h4-source-run-id "$H4_SOURCE_RUN_ID" \
            --out backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json

      - name: Enforce global output
        run: |
          python - <<'PY'
          import json
          p='backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json';x=json.load(open(p))
          assert x['status']=='PASS'
          assert x['correlation_rule']=='absolute Pearson(log-return equity), global per-symbol'
          assert x['correlation_alignment']['backtest_resampling'] is False
          assert x['datasets']['D1']['rows']==6500
          assert x['datasets']['H4']['rows']>=3000
          assert x['methods_input_d1']==118
          assert x['max_family_concentration']<=0.25+1e-12
          assert x['distinct_family']>=6
          print('GOLD10B_GLOBAL_D1_H4_CORR_PASS')
          PY

      - name: Publish cross-timeframe evidence race-safe
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/latest_global_d1_h4_corr.json"
          cp backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json "$PAYLOAD"
          git config user.name 'gold10b-bot';git config user.email 'gold10b-bot@users.noreply.github.com'
          for TRY in 1 2 3 4 5; do
            git fetch origin main;git reset --hard origin/main;mkdir -p backtest/gold24/runtime_global_cross_tf
            cp "$PAYLOAD" backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json
            git add backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'chore(gold10b): publish global D1-H4 correlation proof [skip ci]'
            if git push origin HEAD:main; then exit 0; fi;sleep $((TRY*2))
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: gold10b-global-d1-h4-corr-${{ github.run_id }}
          path: backtest/gold24/runtime_global_cross_tf/latest_global_d1_h4_corr.json
          if-no-files-found: error
          retention-days: 90
