name: RWA Worker Public Candidate Probe

on:
  push:
    branches: [main]
    paths:
      - 'agent-worker/public-config.json'
      - 'tools/worker-candidate-probe.mjs'
      - '.github/workflows/worker-candidate-probe.yml'
  pull_request:
    paths:
      - 'agent-worker/public-config.json'
      - 'tools/worker-candidate-probe.mjs'
      - '.github/workflows/worker-candidate-probe.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate candidate contract
        run: |
          set -euo pipefail
          node --check tools/worker-candidate-probe.mjs
          python -m json.tool agent-worker/public-config.json >/dev/null
          grep -Fq '"enabled": false' agent-worker/public-config.json
          grep -Fq '"base_url": ""' agent-worker/public-config.json
          grep -Fq '"candidate_base_url": "https://seablueprint.com/rwa-worker"' agent-worker/public-config.json
      - name: Probe candidate honestly
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/worker-candidate-probe.mjs --require-live | tee /tmp/rwa-worker-candidate.log
      - name: Publish worker live status
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/worker-candidate-live' -f description='TESTNET worker health + ready + single-write-path PASS; mainnet remains locked'
      - name: Publish waiting status
        if: steps.probe.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=pending -f context='rwa/worker-candidate-live' -f description='Seablueprint worker candidate not operational yet'
