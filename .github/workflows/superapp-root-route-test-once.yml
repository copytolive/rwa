name: Superapp Root Route Test Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/superapp-root-route-test-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Point legacy Super App contract at explicit markets route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/superapp-v5-browser.mjs')
          s=p.read_text()
          old="await page.goto(BASE,{waitUntil:'domcontentloaded',timeout:30000});await waitV5(page);await page.waitForTimeout(1200);await assertRoot(page,'root');"
          new="await page.goto(BASE+'#markets',{waitUntil:'domcontentloaded',timeout:30000});await waitV5(page);await page.waitForTimeout(1200);await assertRoot(page,'markets root');"
          if old not in s: raise SystemExit('desktop root probe marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/superapp-v5-browser.mjs
          git commit -m 'test: probe Super App on explicit markets route'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
