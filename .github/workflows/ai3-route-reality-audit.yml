name: AI3 Route Reality Audit
on:
  push:
    branches: [main]
    paths:
      - "ai3-route-reality-requests/**"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-route-reality-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai3-route-reality-results/$ID" >> "$GITHUB_OUTPUT"
      - name: Run real route audit
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
          OUT_DIR: ${{ steps.req.outputs.out }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          python3 -m pip install --quiet websocket-client
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-address=127.0.0.1 --remote-debugging-port=9781 --remote-allow-origins=* about:blank >/tmp/ai3rr.out 2>/tmp/ai3rr.err &
          PID=$!; trap 'kill $PID 2>/dev/null || true' EXIT
          python3 tools/ai3_route_reality.py
      - name: Commit report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}";test -s "$OUT/report.json"
          git config user.name "CopyToLive AI3 Route Reality"
          git config user.email "copytolive-ai3-routereality@local.invalid"
          git add "$OUT/report.json"
          git commit -m "ai3 route reality: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; sleep "$n"; continue; }
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.id }}
          path: ${{ steps.req.outputs.out }}
          if-no-files-found: error
