name: RWA Product Parity Gate
on:
  push:
    branches: ["main"]
    paths:
      - "trade/**"
      - "index.html"
      - "quick-actions.js"
      - "suite-ui.js"
      - "suite-v2.js"
      - "social-trade-monitor.js"
      - "social-notification-defaults.js"
      - "social-trading-pro.js"
      - "execution-api.js"
      - "agent-worker/**"
      - "launch/readiness.json"
      - "tools/product-parity-contract.mjs"
      - ".github/workflows/product-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-product-parity
  cancel-in-progress: true
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate social trading parity contract
        run: |
          node --check social-notification-defaults.js
          node --check social-trading-pro.js
          node --check tools/product-parity-contract.mjs
          node tools/product-parity-contract.mjs
      - name: Publish parity status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/product-parity' -f description='Trade + portfolio + leaderboard + copy + venue social feed + opt-in alerts parity PASS'
      - name: Publish parity failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/product-parity' -f description='RWA product parity contract failed'
