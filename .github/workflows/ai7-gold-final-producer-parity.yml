name: AI7 GOLD Final Producer Parity

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai7-gold-final-producer-parity.yml"
      - "backtest/gold24/AI7_FINAL_PARITY_KICK"
      - "backtest/gold24/copytolive_active_replay.py"
      - "backtest/gold24/fetch_copytolive_gold_h1.cjs"

permissions:
  contents: read
  actions: read

concurrency:
  group: ai7-gold-final-producer-parity-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FROM_DATE: "2003-05-05"
      TO_DATE: "2026-05-01"
      COPYTOLIVE_IGNORE_FLATS: "true"
      DATA_DIR: ${{ github.workspace }}/.ai7-gold-final
      H1_FILE: ${{ github.workspace }}/.ai7-gold-final/GOLD_H1.csv
      D1_FILE: ${{ github.workspace }}/.ai7-gold-final/GOLD_D1.csv
      OUT_DIR: ${{ github.workspace }}/backtest/gold24/runtime_ai7_final_parity

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backtest/gold24/requirements.txt
          python -m pip install "TA-Lib>=0.6,<0.7"
          npm install --no-save --ignore-scripts dukascopy-node@1.50.0

      - name: Validate producer code and source lock
        run: |
          set -euo pipefail
          python -m py_compile backtest/gold24/copytolive_active_replay.py
          cd backtest/gold24
          python -m unittest -v test_copytolive_compat.py
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path("copytolive_active_gold_manifest.json").read_text())
          s=json.loads(pathlib.Path("copytolive_gold_strategy_sources.json").read_text())
          assert m["snapshot"]["active_gold_count"]==118
          assert m["snapshot"]["timeframe_counts"]=={"H1":118}
          assert len(m["strategies"])==118
          assert len(s["scripts"])==118
          assert s["farm_sha256"]==m["snapshot"]["farm_sha256"]
          assert s["state_sha256"]==m["snapshot"]["state_sha256"]
          for row in m["strategies"]:
              sid=row["id"]
              assert hashlib.sha256(s["scripts"][sid].encode()).hexdigest()==row["source_script"]["sha256"]
          weeks={int(row["backtestDurationWeeks"]) for row in m["strategies"]}
          print({"source_lock":"PASS","strategies":118,"backtestDurationWeeks":sorted(weeks)})
          PY

      - name: Restore exact no-session reconstruction cache
        uses: actions/cache@v4
        with:
          path: |
            .ai7-gold-final
            .dukascopy-cache-copytolive-gold-m1
          key: ai7-xauusd-m1-ignoreflats-h1d1-v9-${{ env.FROM_DATE }}-${{ env.TO_DATE }}

      - name: Build canonical-shape GOLD H1 and D1
        run: |
          set -euo pipefail
          mkdir -p "$DATA_DIR"
          if [ ! -s "$H1_FILE" ] || [ ! -s "$D1_FILE" ]; then
            node backtest/gold24/fetch_copytolive_gold_h1.cjs "$H1_FILE" "$D1_FILE" "$FROM_DATE" "$TO_DATE"
          fi
          python - <<'PY'
          import hashlib, os, pandas as pd
          h1=os.environ["H1_FILE"]; d1=os.environ["D1_FILE"]

          a=pd.read_csv(h1)
          b=pd.read_csv(d1)
          a["Date"]=pd.to_datetime(a["Date"],utc=True,errors="raise")
          b["Date"]=pd.to_datetime(b["Date"],utc=True,errors="raise")
          assert 120000 <= len(a) <= 150000, len(a)
          assert 6900 <= len(b) <= 7150, len(b)
          print({
            "h1_rows":len(a),"h1_start":str(a["Date"].iloc[0]),"h1_end":str(a["Date"].iloc[-1]),
            "h1_sha256":hashlib.sha256(open(h1,"rb").read()).hexdigest(),
            "d1_rows":len(b),"d1_start":str(b["Date"].iloc[0]),"d1_end":str(b["Date"].iloc[-1]),
            "d1_sha256":hashlib.sha256(open(d1,"rb").read()).hexdigest(),
            "construction":"ONLINE_DUKASCOPY_M1_IGNORE_FLATS_RESAMPLE_H1_D1_DIAGNOSTIC"
          })
          PY

      - name: Replay exact 118 active GOLD strategies
        run: |
          set -euo pipefail
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          python backtest/gold24/copytolive_active_replay.py             --dataset "$H1_FILE"             --d1-dataset "$D1_FILE"             --out-dir "$OUT_DIR"
          test -s "$OUT_DIR/latest_copytolive_active_replay.json"
          test -s "$OUT_DIR/latest_copytolive_active_replay.csv"
          test -s "$OUT_DIR/latest_copytolive_active_replay_summary.json"

      - name: Build exact parity report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          out=pathlib.Path(os.environ["OUT_DIR"])
          x=json.loads((out/"latest_copytolive_active_replay.json").read_text())
          rows=x.get("ranking") or x.get("rows") or []
          assert len(rows)==118
          tolerances={
            "totalTrades":0.0,
            "winRate":0.11,
            "profitFactor":0.011,
            "netProfit":0.51,
            "maxDrawdownPercent":0.11,
            "sqn":0.011,
            "recoveryFactor":0.011,
            "wf_test_pf":0.011,
          }
          by={k:0 for k in tolerances}; max_abs={k:0.0 for k in tolerances}; worst={k:None for k in tolerances}; exact=0
          for row in rows:
              ok=True
              parity=row.get("parity_delta") or {}
              for key,tol in tolerances.items():
                  item=parity.get(key)
                  if item is None:
                      ok=False
                      continue
                  delta=abs(float(item["delta"]))
                  if delta<=tol: by[key]+=1
                  else: ok=False
                  if delta>max_abs[key]:
                      max_abs[key]=delta
                      worst[key]={
                        "strategy_id":row.get("strategy_id"),
                        "expected":item.get("expected"),
                        "actual":item.get("actual"),
                        "delta":item.get("delta"),
                      }
              exact+=int(ok)
          report={
            "status":"PASS" if exact==118 else "PARITY_MISMATCH",
            "strategies":118,
            "exact_all_metrics":exact,
            "parity_by_metric":by,
            "max_abs_delta":max_abs,
            "worst_delta":worst,
            "dataset":x["dataset"],
            "d1_dataset":x["d1_dataset"],
            "producer_reference":x.get("producer_reference"),
            "producer_filter_modes":x.get("producer_filter_modes"),
            "source":x["source"],
            "execution_contract":x["execution_contract"],
            "strict_gate_counts":{
              "pre_corr_pass_count":x["pre_corr_pass_count"],
              "corr_kept_count":x["corr_kept_count"],
              "hard_pass_count":x["hard_pass_count"],
            },
          }
          (out/"copytolive_production_parity.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload final parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai7-gold-final-parity-${{ github.run_id }}
          path: |
            backtest/gold24/runtime_ai7_final_parity
            .ai7-gold-final/GOLD_H1.csv
            .ai7-gold-final/GOLD_D1.csv
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact 118/118
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["OUT_DIR"])/"copytolive_production_parity.json"
          x=json.loads(p.read_text())
          assert x["status"]=="PASS", x
          assert int(x["exact_all_metrics"])==118, x
          print("COPYTOLIVE GOLD FINAL PARITY PASS 118/118")
          PY
