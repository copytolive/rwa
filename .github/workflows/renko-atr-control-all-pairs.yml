name: RENKO GOLD ATR Chromium Gate

on:
  push:
    branches:
      - main
      - fix/renko-gold-final-no-drift-20260901
    paths:
      - 'renko/**'
      - '.github/workflows/renko-atr-control-all-pairs.yml'
      - '.github/workflows/renko-gold-current-main-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Serve exact GOLD checkout
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-gold-atr-site
          mkdir -p /tmp/renko-gold-atr-site/rwa
          cp -a . /tmp/renko-gold-atr-site/rwa/
          cd /tmp/renko-gold-atr-site
          python3 -m http.server 8080 >/tmp/renko-gold-atr-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko-gold-atr-http.log
          exit 1
      - name: GOLD ATR Chromium — desktop + mobile
        run: |
          node --input-type=module <<'NODE'
          import { chromium, devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function prove(contextOptions,label){
            const page=await browser.newPage(contextOptions);const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`http://127.0.0.1:8080/rwa/renko/?gold=1&atrGoldGate=1&v=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.RENKO_GOLD_ONLY===true&&document.documentElement.dataset.renkoGoldRecent==='true'&&window.RWARenkoTV?.state?.symbol==='XAUUSD'&&document.querySelector('#chartHost canvas'),{timeout:60000});
            await page.fill('#atrLength','14');await page.click('[data-apply-method="atr"]');
            await page.waitForFunction(()=>window.RWARenkoTV?.settings?.method==='atr'&&Number(window.RWARenkoTV?.state?.box)>0,{timeout:15000});
            const r=await page.evaluate(async()=>{const T=window.RWARenkoTV,H=window.RWARenkoGoldTotalHistory,m=await H.loadManifest();return{symbol:T.state.symbol,method:T.settings.method,box:Number(T.state.box),atrLength:Number(T.settings.atrLength),interval:T.settings.interval,bars:T.state.closedBars.length,provider:m.provider,instrument:m.instrumentCode,complete:m.backfillComplete,months:m.months.length,canvas:!!document.querySelector('#chartHost canvas'),goldOnly:window.RENKO_GOLD_ONLY===true};});
            if(r.symbol!=='XAUUSD'||r.method!=='atr'||!(r.box>0)||r.atrLength!==14||r.interval!=='1s'||r.bars<100||r.provider!=='Dukascopy'||r.instrument!=='XAU-USD'||!r.complete||!r.canvas||!r.goldOnly||errors.length)throw new Error(JSON.stringify({label,r,errors}));
            console.log('GOLD_ATR_CHROMIUM_PASS',JSON.stringify({label,...r}));await page.close();
          }
          await prove({viewport:{width:1672,height:941}},'desktop');await prove({...devices['iPhone 13']},'mobile');await browser.close();
          NODE

  public-production:
    if: github.ref == 'refs/heads/main'
    needs: exact-browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for exact public GOLD SHA
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            got=$(curl -fsS "https://copytolive.github.io/rwa/renko/deployment-sha.txt?cb=$RANDOM" 2>/dev/null | tr -d '\r\n' || true)
            [ "$got" = "$GITHUB_SHA" ] && { echo "GOLD_ATR_PUBLIC_SHA_PASS $got"; exit 0; }
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: PUBLIC GOLD ATR Chromium — desktop + mobile
        run: |
          node --input-type=module <<'NODE'
          import { chromium, devices } from 'playwright';
          const browser=await chromium.launch({headless:true});
          async function prove(contextOptions,label){
            const page=await browser.newPage(contextOptions);const errors=[];page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(`https://copytolive.github.io/rwa/renko/?gold=1&atrGoldPublicGate=1&v=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.RENKO_GOLD_ONLY===true&&document.documentElement.dataset.renkoGoldRecent==='true'&&window.RWARenkoTV?.state?.symbol==='XAUUSD'&&document.querySelector('#chartHost canvas'),{timeout:60000});
            await page.fill('#atrLength','14');await page.click('[data-apply-method="atr"]');
            await page.waitForFunction(()=>window.RWARenkoTV?.settings?.method==='atr'&&Number(window.RWARenkoTV?.state?.box)>0,{timeout:15000});
            const r=await page.evaluate(async()=>{const T=window.RWARenkoTV,H=window.RWARenkoGoldTotalHistory,m=await H.loadManifest();return{symbol:T.state.symbol,method:T.settings.method,box:Number(T.state.box),atrLength:Number(T.settings.atrLength),interval:T.settings.interval,bars:T.state.closedBars.length,provider:m.provider,instrument:m.instrumentCode,complete:m.backfillComplete,months:m.months.length,canvas:!!document.querySelector('#chartHost canvas'),goldOnly:window.RENKO_GOLD_ONLY===true};});
            if(r.symbol!=='XAUUSD'||r.method!=='atr'||!(r.box>0)||r.atrLength!==14||r.interval!=='1s'||r.bars<100||r.provider!=='Dukascopy'||r.instrument!=='XAU-USD'||!r.complete||!r.canvas||!r.goldOnly||errors.length)throw new Error(JSON.stringify({label,r,errors}));
            console.log('PUBLIC_GOLD_ATR_CHROMIUM_PASS',JSON.stringify({label,...r}));await page.close();
          }
          await prove({viewport:{width:1672,height:941}},'desktop');await prove({...devices['iPhone 13']},'mobile');await browser.close();
          NODE
