name: RENKO ATR Control All Pairs Gate
on:
  push:
    branches:
      - main
      - fix/renko-atr-control-all-pairs-20260828
      - fix/renko-atr-chart-stability-20260828
      - fix/renko-tiny-price-precision-20260829
    paths:
      - 'renko/**'
      - 'tools/renko-atr-control-all-pairs-report.mjs'
      - 'tools/renko-atr-stability-report.mjs'
      - 'tools/renko-xaut-*.mjs'
      - '.github/workflows/renko-atr-control-all-pairs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static ATR control + stability contract
        run: |
          set -euo pipefail
          node --check renko/renko-tv-atr-control.js
          node --check tools/renko-atr-control-all-pairs-report.mjs
          node --check tools/renko-atr-stability-report.mjs
          grep -q 'renko-tv-atr-control.js?v=2' renko/index.html
          grep -q 'snapshot-box-stable-between-closes' renko/renko-tv-atr-control.js
          grep -q '_exactBox=box' renko/renko-tv-atr-control.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: Serve exact checkout
        run: |
          set -euo pipefail
          rm -rf /tmp/renko-atr-control-site
          mkdir -p /tmp/renko-atr-control-site/rwa
          cp -a . /tmp/renko-atr-control-site/rwa/
          cd /tmp/renko-atr-control-site
          python3 -m http.server 8080 >/tmp/renko-atr-control-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/rwa/renko/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/renko-atr-control-http.log
          exit 1
      - name: Desktop — physical ATR 100 Apply on all 50 launch pairs
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_ATR_VIEWPORT=desktop RENKO_ATR_CONTROL_OUT=artifacts/atr-control-desktop node tools/renko-atr-control-all-pairs-report.mjs
      - name: Mobile — physical ATR 100 Apply on all 50 launch pairs
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_ATR_VIEWPORT=mobile RENKO_ATR_CONTROL_OUT=artifacts/atr-control-mobile node tools/renko-atr-control-all-pairs-report.mjs
      - name: Desktop — ATR chart pulse stability across real 1s closes
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_ATR_STABILITY_VIEWPORT=desktop RENKO_ATR_STABILITY_OUT=artifacts/atr-stability-desktop node tools/renko-atr-stability-report.mjs
      - name: Mobile — ATR chart pulse stability across real 1s closes
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_ATR_STABILITY_VIEWPORT=mobile RENKO_ATR_STABILITY_OUT=artifacts/atr-stability-mobile node tools/renko-atr-stability-report.mjs
      - name: XAUT provider regression — desktop + mobile
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_XAUT_OUT=artifacts/xaut-provider node tools/renko-xaut-live-provider-report.mjs
      - name: XAUT deep ATR matrix regression — desktop + mobile
        run: RWA_TEST_URL=http://127.0.0.1:8080/rwa RENKO_XAUT_MATRIX_OUT=artifacts/xaut-atr-matrix node tools/renko-xaut-atr-matrix-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-atr-control-all-pairs-${{ github.sha }}
          path: |
            artifacts/atr-control-desktop
            artifacts/atr-control-mobile
            artifacts/atr-stability-desktop
            artifacts/atr-stability-mobile
            artifacts/xaut-provider
            artifacts/xaut-atr-matrix
          retention-days: 30
  public-production:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/renko-atr-chart-stability-20260828'
    needs: exact-browser
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for deployed anti-pulse runtime
        run: |
          set -euo pipefail
          index='https://copytolive.github.io/rwa/renko/'
          control='https://copytolive.github.io/rwa/renko/renko-tv-atr-control.js'
          stamp='https://copytolive.github.io/rwa/renko-deployment-sha.txt'
          for i in $(seq 1 90); do
            ts=$(date +%s%N)
            got=$(curl -fsS "$stamp?ts=$ts" 2>/dev/null | tr -d '\r\n' || true)
            html=$(curl -fsS "$index?ts=$ts" 2>/dev/null || true)
            js=$(curl -fsS "$control?ts=$ts" 2>/dev/null || true)
            echo "attempt=$i deployed=$got"
            if grep -q 'renko-tv-atr-control.js?v=2' <<<"$html" && grep -q 'snapshot-box-stable-between-closes' <<<"$js"; then
              echo "PUBLIC_ANTI_PULSE_RUNTIME_PRESENT deployed=$got"
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0 lightweight-charts@5.1.0
          npx playwright install --with-deps chromium
      - name: PUBLIC desktop — ATR 100 Apply on all 50 launch pairs
        run: RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_ATR_VIEWPORT=desktop RENKO_ATR_CONTROL_OUT=artifacts/public-atr-control-desktop node tools/renko-atr-control-all-pairs-report.mjs
      - name: PUBLIC mobile — ATR 100 Apply on all 50 launch pairs
        run: RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_ATR_VIEWPORT=mobile RENKO_ATR_CONTROL_OUT=artifacts/public-atr-control-mobile node tools/renko-atr-control-all-pairs-report.mjs
      - name: PUBLIC desktop — visible ATR + Renko history do not pulse
        run: RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_ATR_STABILITY_VIEWPORT=desktop RENKO_ATR_STABILITY_OUT=artifacts/public-atr-stability-desktop node tools/renko-atr-stability-report.mjs
      - name: PUBLIC mobile — visible ATR + Renko history do not pulse
        run: RWA_TEST_URL=https://copytolive.github.io/rwa RENKO_ATR_STABILITY_VIEWPORT=mobile RENKO_ATR_STABILITY_OUT=artifacts/public-atr-stability-mobile node tools/renko-atr-stability-report.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renko-atr-stability-public-${{ github.sha }}
          path: |
            artifacts/public-atr-control-desktop
            artifacts/public-atr-control-mobile
            artifacts/public-atr-stability-desktop
            artifacts/public-atr-stability-mobile
          retention-days: 30
