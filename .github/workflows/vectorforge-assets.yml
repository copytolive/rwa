name: VectorForge Asset Source Verification

on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
  push:
    branches: ['main']
    paths:
      - 'backtest/data/assets.json'
      - 'backtest/data/validate_assets.cjs'
      - '.github/workflows/vectorforge-assets.yml'

permissions:
  contents: write

concurrency:
  group: vectorforge-asset-source-verification
  cancel-in-progress: false

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned Dukascopy adapter
        run: npm install --no-save --ignore-scripts dukascopy-node@1.50.0
      - name: Validate catalog JSON
        run: python -m json.tool backtest/data/assets.json >/dev/null
      - name: Verify historical sources
        run: node backtest/data/validate_assets.cjs
      - name: Validate generated status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('backtest/data/asset_status.json').read_text())
          assert x['total_assets'] == len(x['assets'])
          assert x['verified_assets'] + x['failed_assets'] == x['total_assets']
          for a in x['assets']:
              if a['status']=='VERIFIED':
                  assert len(a['sample_sha256'])==64
          print(f"PASS {x['verified_assets']}/{x['total_assets']} verified")
          PY
      - name: Persist public verification status
        run: |
          git config user.name 'vectorforge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backtest/data/asset_status.json
          if git diff --cached --quiet; then
            echo 'No status changes.'
          else
            git commit -m 'VectorForge asset source verification'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
