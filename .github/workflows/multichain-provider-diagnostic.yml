name: RWA Multi Chain Provider Diagnostic

on:
  push:
    branches:
      - fix/multichain-live-provider-proof-20260828
    paths:
      - .github/workflows/multichain-provider-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe LI.FI coverage and Base to Solana quote without transactions
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 25 -fsSL 'https://li.quest/v1/chains' -o /tmp/chains.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/chains.json'))
          chains=x.get('chains',x) if isinstance(x,dict) else x
          ids={int(c['id']) for c in chains if isinstance(c,dict) and str(c.get('id','')).isdigit()}
          required={1,42161,8453,56,137,43114,143}
          missing=sorted(required-ids)
          assert not missing, f'LI.FI EVM coverage missing {missing}'
          print('MULTICHAIN_EVM_PROVIDER_COVERAGE=PASS:'+','.join(map(str,sorted(required))))
          PY

          sol_chain='1151111081099710'
          sol_usdc='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          curl --connect-timeout 5 --max-time 20 -fsSL "https://li.quest/v1/token?chain=${sol_chain}&token=${sol_usdc}" -o /tmp/sol-token.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/sol-token.json'))
          assert int(x.get('chainId',0))==1151111081099710, x
          assert x.get('symbol')=='USDC', x
          print('MULTICHAIN_SOLANA_TOKEN_IDENTITY=PASS:1151111081099710:USDC')
          PY

          from_chain='8453'
          to_chain='1151111081099710'
          from_token='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          to_token='EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v'
          from_amount='10000000'
          from_address='0x1111111111111111111111111111111111111111'
          to_address='11111111111111111111111111111111'

          probe_quote() {
            name="$1"; shift
            code="$(curl --connect-timeout 5 --max-time 30 --get -sS 'https://li.quest/v1/quote' \
              --data-urlencode "fromChain=${from_chain}" \
              --data-urlencode "toChain=${to_chain}" \
              --data-urlencode "fromToken=${from_token}" \
              --data-urlencode "toToken=${to_token}" \
              --data-urlencode "fromAmount=${from_amount}" \
              --data-urlencode "fromAddress=${from_address}" \
              --data-urlencode "toAddress=${to_address}" \
              --data-urlencode 'slippage=0.005' "$@" \
              -o "/tmp/${name}.json" -w '%{http_code}' || true)"
            echo "QUOTE_PROBE=${name}:HTTP=${code}"
            python - "$name" "$code" "/tmp/${name}.json" <<'PY'
          import json,sys,os
          name,code,path=sys.argv[1:]
          raw=open(path).read() if os.path.exists(path) else ''
          try:
            x=json.loads(raw)
          except Exception:
            print('QUOTE_BODY',name,raw[:1000]); raise SystemExit(0)
          if code!='200':
            print('QUOTE_ERROR',name,{k:x.get(k) for k in ('message','error','code')},'raw=',raw[:1500]); raise SystemExit(0)
          a=x.get('action') or {}; e=x.get('estimate') or {}; tx=x.get('transactionRequest') or {}
          print('QUOTE_OK',name,'tool=',x.get('tool'),'from=',a.get('fromChainId'),'to=',a.get('toChainId'),'min=',e.get('toAmountMin'),'tx=',bool(tx))
          PY
          }

          probe_quote no_integrator
          probe_quote with_integrator --data-urlencode 'integrator=copytolive-rwa'
          echo 'MULTICHAIN_PROVIDER_DIAGNOSTIC_COMPLETE=PASS'
