name: RWA Zero-Cost Stack Gate

on:
  push:
    branches: ["main"]
    paths:
      - "launch/free-stack.json"
      - "agent-worker/public-config.json"
      - "agent-worker/cloudflare/**"
      - "trade/config.js"
      - ".github/workflows/free-stack-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  free-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-cost policy
        run: |
          python - <<'PY'
          import json
          x=json.load(open('launch/free-stack.json'))
          assert x['policy']=='ZERO_COST_LAUNCH_STACK'
          assert x['frontend']['provider']=='GitHub Pages' and x['frontend']['paid_plan_required'] is False
          assert x['ci']['provider']=='GitHub Actions' and x['ci']['paid_plan_required'] is False
          assert x['worker']['provider']=='Cloudflare Workers Free' and x['worker']['paid_plan_required'] is False
          assert x['worker']['fail_closed_on_free_limit'] is True
          assert x['forbidden']['replit'] is True
          assert x['forbidden']['vercel'] is True
          assert x['forbidden']['paid_database'] is True
          assert x['forbidden']['paid_worker_hosting'] is True
          assert x['mainnet']['requires_global_ready_for_mainnet'] is True
          PY
          grep -Fq 'workers_dev = true' agent-worker/cloudflare/wrangler.toml
          grep -Fq 'new_sqlite_classes' agent-worker/cloudflare/wrangler.toml
          grep -Fq 'mainnetEnabled: false' trade/config.js
          python - <<'PY'
          import json
          x=json.load(open('agent-worker/public-config.json'))
          url=str(x.get('base_url') or '').lower()
          assert 'replit' not in url and 'vercel' not in url
          PY
      - name: Publish zero-cost status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/free-stack-gate' -f description='GitHub Pages + public Actions + Cloudflare Workers Free; no Replit/Vercel/paid worker DB'
      - name: Publish zero-cost failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/free-stack-gate' -f description='Zero-cost launch policy violation'
