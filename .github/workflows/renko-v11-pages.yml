name: RENKO V13 Setup + Formation Production Gate

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "superapp-v5.js"
      - "renko/**"
      - "tools/renko-v13-functional.mjs"
      - ".github/workflows/renko-v11-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "renko-v13-pages"
  cancel-in-progress: false

jobs:
  verify-renko-v13:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate stable V13 shell and runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Parent Research shell: never destroy/recreate an iframe after the user starts editing setup.
          p=Path('superapp-v5.js');s=p.read_text()
          s=s.replace("setTimeout(routeFromHash,0);setTimeout(routeFromHash,800);","setTimeout(routeFromHash,0);")
          old="const toolUrl=`${tab}/?embed=1&symbol=${encodeURIComponent(sym)}`;"
          new="const toolUrl=`${tab}/?embed=1&v=${tab==='renko'?'130':'1'}&symbol=${encodeURIComponent(sym)}`;"
          if old in s:s=s.replace(old,new)
          s=re.sub(r"const toolUrl=`\$\{tab\}/\?embed=1&v=\$\{tab==='renko'\?'\d+':'1'\}&symbol=\$\{encodeURIComponent\(sym\)\}`;",new,s,count=1)
          if 'setTimeout(routeFromHash,800)' in s:raise SystemExit('duplicate Research iframe rerender still present')
          if "tab==='renko'?'130':'1'" not in s:raise SystemExit('RENKO iframe cache version missing')
          p.write_text(s)

          # Root shell cache-bust.
          p=Path('index.html');s=p.read_text();s=re.sub(r'superapp-v5\.js\?v=\d+','superapp-v5.js?v=13',s);p.write_text(s)

          # Child RENKO route must load only the new formation core + stable profiles.
          p=Path('renko/index.html');s=p.read_text()
          s=s.replace('RENKO V12 — Tick Native','RENKO V13 — Lossless Tick Native')
          s=s.replace('ATR · TICK · V12','ATR · TICK · V13')
          s=s.replace('RENKO V12 tick-native chart','RENKO V13 lossless tick-native chart')
          s=s.replace('PERCENTAGE (LTP)','PERCENTAGE')
          s=s.replace('RENKO V12 — tick formation, immediate close & wick rules','RENKO V13 — setup, lossless tick formation & reversal rules')
          s=s.replace('The percentage is applied to the symbol-load last traded price snapshot, rounded to Binance minimum tick size. Formation after sizing remains tick-by-tick.','The percentage is applied to each confirmed Renko level and recalculated after every confirmed brick, rounded to Binance minimum tick size.')
          s=s.replace('ATR is used only to assign the box size. Because ATR mathematically requires bars, V12 calibrates it from recent completed 1-minute bars internally. That hidden calibration never delays brick confirmation: trades still lock bricks immediately.','ATR is used only to assign the box size: Wilder ATR from completed 1-minute bars × ATR Factor. The bar calibration never delays brick confirmation: every buffered trade still locks bricks immediately.')
          s=re.sub(r'<script src="renko-v3\.js\?v=\d+"></script><script src="renko-v12\.js\?v=\d+"></script><script src="renko-v12-method-profiles\.js\?v=\d+"></script><script src="renko-v12-instant-history\.js\?v=\d+"></script>', '<script src="renko-v3.js?v=31"></script><script src="renko-v13.js?v=130"></script><script src="renko-v13-method-profiles.js?v=130"></script>', s)
          if 'renko-v13.js?v=130' not in s or 'renko-v13-method-profiles.js?v=130' not in s:raise SystemExit('V13 runtime scripts missing')
          if re.search(r'<script src="renko-v12(?:-|\.)',s):raise SystemExit('legacy V12 runtime still loaded')
          p.write_text(s)
          PY

      - name: Static setup and formation contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check superapp-v5.js
          node --check renko/renko-v13.js
          node --check renko/renko-v13-worker.js
          node --check renko/renko-v13-method-profiles.js
          node --check tools/renko-v13-functional.mjs
          grep -Fq 'superapp-v5.js?v=13' index.html
          ! grep -Fq 'setTimeout(routeFromHash,800)' superapp-v5.js
          grep -Fq "tab==='renko'?'130':'1'" superapp-v5.js
          grep -Fq 'renko-v13.js?v=130' renko/index.html
          grep -Fq 'renko-v13-method-profiles.js?v=130' renko/index.html
          ! grep -Eq '<script src="renko-v12(-|\.)' renko/index.html
          grep -Fq "liveDrain:'all-unseen-v3-trades-in-order'" renko/renko-v13.js
          grep -Fq "rebuildRule:'latest-build-wins-and-replay-pending-live'" renko/renko-v13.js
          grep -Fq "percentageRule:'confirmed-renko-level-times-percent'" renko/renko-v13.js
          grep -Fq 'if(S.building){queuePending(t);return false}' renko/renko-v13.js
          grep -Fq 'unseen.reverse();for(const t of unseen)' renko/renko-v13.js
          grep -Fq "setupContract:'independent-method-profiles'" renko/renko-v13-method-profiles.js
          grep -Fq "inputContract:'draft-never-overwritten'" renko/renko-v13-method-profiles.js
          git diff --check

      - name: Formation engine unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v13-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);const E=s.RenkoV13Engine;
          const mk=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:mk([100,110,120,170])});
          if(r.bricks.length!==7||r.bricks.at(-1).close!==170)throw Error('multi-brick continuation failed');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:mk([100,110,120,100,90])});
          if(r.bricks.length!==4||r.bricks[2].isReversal!==true||r.bricks[2].open!==110||r.bricks[2].close!==100||r.bricks[3].close!==90)throw Error('2-box reversal failed');
          r=E.buildTicks({method:'atr',atrValue:20,atrFactor:.5,tickSize:.01,wicks:false,ticks:mk([100,110,120])});
          if(Math.abs(r.box-10)>.001)throw Error('ATR × Factor mapping failed');
          r=E.buildTicks({method:'percentage',percentage:.10,tickSize:.01,wicks:false,ticks:mk([100,150])});
          const closes=r.bricks.map(x=>Number(x.close.toFixed(2)));
          if(JSON.stringify(closes)!==JSON.stringify([110,121,133.1,146.41]))throw Error('dynamic percentage confirmed-level sizing failed: '+JSON.stringify(closes));
          if(r.bricks.some(b=>b.high!==Math.max(b.open,b.close)||b.low!==Math.min(b.open,b.close)))throw Error('wicks=false changed body geometry');
          console.log('RENKO V13 FORMATION UNIT MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance - setup and formation
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/renko-v13-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || true; sleep 1; done
          RENKO_TEST_BASE='http://127.0.0.1:8080/' node tools/renko-v13-functional.mjs

      - name: Persist browser-verified production source
        shell: bash
        run: |
          if git diff --quiet -- index.html superapp-v5.js renko/index.html; then
            echo 'Production shell already on verified V13'
          else
            git config user.name 'copytolive-actions'
            git config user.email 'actions@users.noreply.github.com'
            git add index.html superapp-v5.js renko/index.html
            git commit -m 'Activate verified RENKO V13 setup and lossless formation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: verify-renko-v13
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO V13 Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
