name: RENKO V15 Tick Native Compact Production Gate

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "superapp-v5.js"
      - "renko/**"
      - "tools/renko-v15-functional.mjs"
      - ".github/workflows/renko-v11-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "renko-v15-pages"
  cancel-in-progress: true

jobs:
  verify-renko-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static tick-native contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check renko/renko-v15.js
          node --check renko/renko-v15-worker.js
          node --check renko/renko-v15-method-profiles.js
          node --check tools/renko-v15-functional.mjs
          grep -Fq 'RENKO V15' renko/index.html
          grep -Fq 'renko-v15.js?v=150' renko/index.html
          grep -Fq 'renko-v15-method-profiles.js?v=150' renko/index.html
          grep -Fq 'renko-v15.css?v=150' renko/index.html
          ! grep -Fq 'id="v14Resolution"' renko/index.html
          ! grep -Fq '>RESOLUTION<' renko/index.html
          ! grep -Fq '1 minute</option>' renko/index.html
          ! grep -Fq 'projection → bar-close' renko/index.html
          ! grep -Fq 'Bar close</b>' renko/index.html
          grep -Fq "formationSource:'trade-events-only'" renko/renko-v15.js
          grep -Fq "confirmationRule:'every-trade-immediate'" renko/renko-v15.js
          grep -Fq "timeframeControl:false" renko/renko-v15.js
          grep -Fq "liveDrain:'all-unseen-raw-trades-in-order'" renko/renko-v15.js
          grep -Fq 'uniformAudit' renko/renko-v15-worker.js
          git diff --check

      - name: Tick formation unit matrix
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('renko/renko-v15-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV15Engine;
          const ticks=prices=>prices.map((price,i)=>({id:i+1,price,time:i+1}));
          const uniform=(r,label)=>{if(!r.audit?.ok)throw Error(label+' audit '+JSON.stringify(r.audit));const tol=Math.max(1e-10,Math.abs(r.box)*1e-9);for(const b of r.bricks){if(Math.abs(Math.abs(b.close-b.open)-r.box)>tol)throw Error(label+' non-uniform body')}};
          let r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,150])});
          if(r.bricks.length!==5||r.bricks.at(-1).close!==150)throw Error('one trade did not lock five continuation bricks immediately');uniform(r,'Traditional multi-brick');
          r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:false,ticks:ticks([100,110,120,100,90])});
          if(r.bricks.length!==4||!r.bricks[2].isReversal||r.bricks[2].open!==110||r.bricks[2].close!==100)throw Error('2-box reversal failed');uniform(r,'Traditional reversal');
          r=E.buildTicks({method:'percentage',percentage:.01,ltpSnapshot:79130,tickSize:.01,wicks:false,ticks:ticks([79130,82330])});
          if(Math.abs(r.box-800)>.001)throw Error('Percentage LTP fixed box failed '+r.box);uniform(r,'Percentage');
          r=E.buildTicks({method:'atr',atrValue:32.51,tickSize:.01,wicks:false,ticks:ticks([79000,79100,79200])});
          if(Math.abs(r.box-32.51)>.001)throw Error('ATR snapshot box failed '+r.box);uniform(r,'ATR');
          console.log('RENKO V15 TICK MATRIX PASS');
          NODE

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance - no timeframe, compact setup, symbols and formation
        shell: bash
        run: |
          python3 -m http.server 8080 > /tmp/renko-v15-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8080/ >/dev/null && break || true; sleep 1; done
          RENKO_TEST_BASE='http://127.0.0.1:8080/' node tools/renko-v15-functional.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: verify-renko-v15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified RENKO V15 Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
