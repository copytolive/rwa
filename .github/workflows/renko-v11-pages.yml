name: RENKO V11 Production Pages

on:
  push:
    branches: ["main"]
    paths:
      - "renko/index.html"
      - "renko/renko-v11.js"
      - "renko/renko-v11-worker.js"
      - "renko/renko-v11.css"
      - "renko/.v11"
      - ".github/workflows/renko-v11-pages.yml"
      - ".github/workflows/renko-v11.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify-renko-v11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax and production contract
        run: |
          node --check renko/renko-v3.js
          node --check renko/renko-v11.js
          node --check renko/renko-v11-worker.js
          test -s renko/index.html
          test -s renko/renko-v11.css
          grep -Fq 'RENKO V11' renko/index.html
          grep -Fq 'renko-v11.js?v=111' renko/index.html
          grep -Fq 'renko-v11-worker.js?v=111' renko/renko-v11.js
          grep -Fq 'data-renko-method="atr"' renko/index.html
          grep -Fq 'data-renko-method="traditional"' renko/index.html
          grep -Fq 'data-renko-method="percentage"' renko/index.html
          grep -Fq 'id="v11Wicks"' renko/index.html
          grep -Fq 'id="v11Source"' renko/index.html
          grep -Fq 'id="v11Interval"' renko/index.html
      - name: Core Renko parity smoke
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const code=fs.readFileSync('renko/renko-v11-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);
          const E=s.RenkoV11Engine,bars=[100,110,120,111,100].map((c,i)=>[i*60000,c,c,c,c,0,i*60000+59999]);
          const r=E.buildRenko({method:'traditional',source:'close',traditionalBox:10,tickSize:1,wicks:true,bars});
          if(r.bricks.length!==3||!r.bricks[2].isReversal||r.bricks[2].open!==110||r.bricks[2].close!==100)throw Error('Renko 2-box reversal smoke failed');
          console.log('RENKO V11 production smoke PASS');
          NODE

  deploy:
    needs: verify-renko-v11
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
