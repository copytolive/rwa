name: RENKO V12 Tick Native Production Pages

on:
  push:
    branches: ["main"]
    paths:
      - "renko/index.html"
      - "renko/renko-v3.js"
      - "renko/renko-v12.js"
      - "renko/renko-v12-worker.js"
      - "renko/renko-v12-method-profiles.js"
      - "renko/renko-v11.css"
      - ".github/workflows/renko-v11-pages.yml"
      - ".github/workflows/renko-v11.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  verify-renko-v12:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Syntax and tick-native contract
        run: |
          set -euo pipefail
          node --check renko/renko-v3.js
          node --check renko/renko-v12.js
          node --check renko/renko-v12-worker.js
          node --check renko/renko-v12-method-profiles.js
          test -s renko/index.html
          test -s renko/renko-v11.css
          grep -Fq 'RENKO V12' renko/index.html
          grep -Fq 'renko-v12.js?v=120' renko/index.html
          grep -Fq 'renko-v12-method-profiles.js?v=121' renko/index.html
          grep -Fq 'renko-v12-worker.js?v=120' renko/renko-v12.js
          grep -Fq 'V12 desktop density pass' renko/renko-v11.css
          grep -Fq '3 SEPARATE SETTINGS' renko/renko-v12-method-profiles.js
          grep -Fq 'ATR, Traditional and Percentage never share box parameters, Wicks or Entry Confirm.' renko/renko-v12-method-profiles.js
          ! grep -Fq 'id="v11Interval"' renko/index.html
          grep -Fq 'if one trade crosses 5 boxes, all 5 bricks lock immediately' renko/index.html
          grep -Fq "formation:'tick-by-tick'" renko/renko-v12.js
          grep -Fq "lockRule:'every-trade-threshold'" renko/renko-v12.js
      - name: Core immediate-lock smoke
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');const code=fs.readFileSync('renko/renko-v12-worker.js','utf8');
          const s={console,postMessage(){}};s.self=s;s.globalThis=s;vm.createContext(s);vm.runInContext(code,s);const E=s.RenkoV12Engine;
          const ticks=[100,110,120,170].map((price,i)=>({id:i+1,price,time:i+1}));
          const r=E.buildTicks({method:'traditional',traditionalBox:10,tickSize:1,wicks:true,ticks});
          if(r.bricks.length!==7||r.bricks.at(-1).close!==170)throw Error('tick immediate-lock smoke failed');
          console.log('RENKO V12 immediate-lock production smoke PASS');
          NODE

  deploy:
    needs: verify-renko-v12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4