name: RWA Golden HOME Parity

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "rwa-golden-home-integration-v1.js"
      - "rwa-screenshot-parity-v1.js"
      - "rwa-screenshot-parity-v1.css"
      - "rwa-screenshot-parity-interaction-v1.css"
      - "rwa-screenshot-parity-visual-v2.css"
      - "assets/ecommerce/**"
      - "tools/golden-home-parity-browser.mjs"
      - ".github/workflows/golden-home-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local RWA
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/rwa-golden-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-golden-http.log
          exit 1
      - name: Validate production HOME geometry and interactions
        env:
          RWA_UI_URL: http://127.0.0.1:4173/rwa/
          RWA_UI_PROOF_DIR: proof/golden-home-local
        run: node tools/golden-home-parity-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-home-local-${{ github.sha }}
          path: proof/golden-home-local/
          if-no-files-found: error
          retention-days: 30

  public-browser:
    needs: local-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact Pages SHA
        shell: bash
        run: |
          set -euo pipefail
          URL='https://copytolive.github.io/rwa/deployment-sha.txt'
          for i in $(seq 1 60); do
            LIVE="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$URL?v=$GITHUB_SHA-$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$LIVE" = "$GITHUB_SHA" ]; then exit 0; fi
            echo "waiting expected=$GITHUB_SHA live=${LIVE:-none}"
            sleep 10
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate public HOME geometry and interactions
        env:
          RWA_UI_URL: https://copytolive.github.io/rwa/
          RWA_UI_PROOF_DIR: proof/golden-home-public
        run: node tools/golden-home-parity-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-home-public-${{ github.sha }}
          path: proof/golden-home-public/
          if-no-files-found: error
          retention-days: 30
