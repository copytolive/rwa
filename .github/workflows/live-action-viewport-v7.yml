name: Verify Live Action Viewport V7

on:
  push:
    branches:
      - verify/live-action-viewport-v7-20260827

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production Action click keeps viewport fixed
        env:
          RWA_TEST_URL: https://copytolive.github.io/rwa/
        run: node tools/global-chrome-persistence-browser.mjs
