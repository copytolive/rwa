name: GOLD10B Million Candidate Discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gold10b-million-discovery.yml'
      - 'backtest/gold24/GOLD10B_MILLION_KICK'
      - 'backtest/gold24/gold10b_million_consolidate.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold10b-million-discovery
  cancel-in-progress: true

env:
  SOURCE_RUN_ID: '33667987913'
  STATE_ARTIFACT: gold24-canonical-v11-state

jobs:
  shard:
    name: discovery-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Restore canonical state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .gold10b-state
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$STATE_ARTIFACT" -D .gold10b-state
          test -s .gold10b-state/gold24-v11.db
          test -s .gold10b-state/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv
      - name: Seed shard with current cumulative 292k authority
        run: |
          set -euo pipefail
          mkdir -p shard-out
          cp backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json shard-out/latest_multimethod_v1_discovery.json
      - name: Simulate 100k unique strict candidates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          SEED=$((2026090400 + SHARD))
          python backtest/gold24/multimethod_v1_discovery_strict.py \
            --state-dir .gold10b-state \
            --out-dir shard-out \
            --source-summary backtest/gold24/runtime_v11/latest_validation_summary.json \
            --existing-library backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json \
            --candidate-count 100000 \
            --base-seed "$SEED" \
            --workers 2
          test -s shard-out/latest_multimethod_v1_discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: gold10b-million-shard-${{ matrix.shard }}
          path: |
            shard-out/latest_multimethod_v1_discovery.json
            shard-out/latest_multimethod_v1_discovery_summary.json
          if-no-files-found: error
          retention-days: 14

  consolidate:
    name: million-global-consolidate
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r backtest/gold24/requirements.txt
      - name: Restore canonical state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .gold10b-state
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$STATE_ARTIFACT" -D .gold10b-state
      - uses: actions/download-artifact@v4
        with:
          pattern: gold10b-million-shard-*
          path: shard-artifacts
      - name: Consolidate all shards under one global correlation authority
        run: |
          set -euo pipefail
          rm -rf million-out
          python backtest/gold24/gold10b_million_consolidate.py \
            --state-dir .gold10b-state \
            --prior-json backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json \
            --shard-root shard-artifacts \
            --out-dir million-out
          python - <<'PY'
          import json
          x=json.load(open('million-out/latest_multimethod_v1_discovery_summary.json'))
          assert x['status']=='PASS'
          assert x['evaluated_config_hash_count_cumulative']>=1_000_000
          assert x['implemented_family_count']==48
          print('GOLD10B_MILLION_PASS',json.dumps(x,indent=2))
          PY
      - name: Publish million-candidate selected authority race-safe
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/gold10b-million-payload"
          mkdir -p "$PAYLOAD"
          cp million-out/latest_multimethod_v1_discovery.json "$PAYLOAD/"
          cp million-out/latest_multimethod_v1_discovery_summary.json "$PAYLOAD/"
          cp million-out/latest_multimethod_v1_discovery.csv "$PAYLOAD/"
          git config user.name 'gold10b-bot'
          git config user.email 'gold10b-bot@users.noreply.github.com'
          for TRY in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$PAYLOAD/"* backtest/gold24/runtime_multimethod_v1/
            git add backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json \
                    backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery_summary.json \
                    backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv
            if git diff --cached --quiet; then echo 'million authority already current'; exit 0; fi
            git commit -m 'chore(gold10b): publish million-candidate global selection'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((TRY*3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: gold10b-million-global-${{ github.run_id }}
          path: million-out/
          if-no-files-found: error
          retention-days: 90
