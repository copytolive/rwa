name: GOLD24 Health
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    environment: gold24-production
    steps:
      - name: Configure SSH
        env:
          KEY: ${{ secrets.GOLD24_SSH_KEY }}
          HOST: ${{ secrets.GOLD24_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/gold24
          chmod 600 ~/.ssh/gold24
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Health check
        env:
          HOST: ${{ secrets.GOLD24_HOST }}
          USER: ${{ secrets.GOLD24_USER }}
        run: ssh -i ~/.ssh/gold24 "$USER@$HOST" 'sudo /opt/rwa/deploy/gold24/healthcheck.sh'
