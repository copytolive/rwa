name: RWA Live Browser Smoke

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "monitor/status.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-live-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser and execution source
        run: |
          node --check app.js
          node --check realtime-core.js
          node --check mobile.js
          node --check suite-nav.js
          node --check execution-api.js
          node --check execution-ui.js
          node --check execution-ops-bridge.js
          node --check suite-execution-patch.js
          python -m json.tool rwa-execution-config.json >/dev/null
          test -s EXECUTION_API.md
          grep -Fq 'realtime-core.js?v=2' index.html
          grep -Fq 'execution-api.js?v=2' index.html
          grep -Fq 'execution-ops-bridge.js?v=2' index.html
          grep -Fq 'execution-ui.js?v=3' index.html
          grep -Fq 'suite-execution-patch.js?v=6' index.html
          ! grep -Fq 'browser-recovery.js' index.html
          ! grep -Fq 'instantChartBoot();loadSuite()' mobile.js
          grep -Fq 'stream.binance.com:9443' realtime-core.js
          grep -Fq 'stream.binance.com:443' realtime-core.js
          grep -Fq 'REST fallback' realtime-core.js
          grep -Fq 'execution-api.js?v=2' suite-nav.js
          grep -Fq 'execution-ops-bridge.js?v=2' suite-nav.js
          grep -Fq 'execution-ui.js?v=2' suite-nav.js
          grep -Fq 'suite-execution-patch.js?v=5' suite-nav.js
          grep -Fq "version:'2.0.0'" execution-api.js
          grep -Fq 'approveAgent' execution-api.js
          grep -Fq 'AES-GCM' execution-api.js
          grep -Fq 'async function limit' execution-api.js
          grep -Fq 'async function market' execution-api.js
          grep -Fq 'async function cancel(' execution-api.js
          grep -Fq 'async function modify' execution-api.js
          grep -Fq 'async function cancelAll' execution-api.js
          grep -Fq 'RWAExecutionOpsBridge' execution-ops-bridge.js
          grep -Fq 'if(window.RWAExecutionBridge)return;' suite-execution-patch.js
          grep -Fq "executionEngine'))return true;" execution-ui.js
      - name: Publish source success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/execution-source' -f description='Wallet login + dedicated execution API source verified'
      - name: Wait for GitHub Pages propagation
        id: live
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            core="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/realtime-core.js?v=$q" || true)"
            mobile="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" || true)"
            nav="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-nav.js?v=$q" || true)"
            execapi="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/execution-api.js?v=$q" || true)"
            execui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/execution-ui.js?v=$q" || true)"
            execops="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/execution-ops-bridge.js?v=$q" || true)"
            execbridge="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/suite-execution-patch.js?v=$q" || true)"
            cfg="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-execution-config.json?v=$q" || true)"
            if grep -Fq 'realtime-core.js?v=2' <<<"$html" && \
               grep -Fq 'execution-api.js?v=2' <<<"$html" && \
               grep -Fq 'execution-ops-bridge.js?v=2' <<<"$html" && \
               grep -Fq 'execution-ui.js?v=3' <<<"$html" && \
               grep -Fq 'suite-execution-patch.js?v=6' <<<"$html" && \
               grep -Fq 'styles.css?v=7' <<<"$html" && \
               grep -Fq 'mobile.css?v=6' <<<"$html" && \
               ! grep -Fq 'browser-recovery.js' <<<"$html" && \
               grep -Fq 'stream.binance.com:9443' <<<"$core" && \
               grep -Fq 'REST fallback' <<<"$core" && \
               ! grep -Fq 'instantChartBoot();loadSuite()' <<<"$mobile" && \
               grep -Fq 'execution-api.js?v=2' <<<"$nav" && \
               grep -Fq 'execution-ops-bridge.js?v=2' <<<"$nav" && \
               grep -Fq "version:'2.0.0'" <<<"$execapi" && \
               grep -Fq 'approveAgent' <<<"$execapi" && \
               grep -Fq 'approveBuilderFee' <<<"$execapi" && \
               grep -Fq 'AES-GCM' <<<"$execapi" && \
               grep -Fq 'async function cancelAll' <<<"$execapi" && \
               grep -Fq 'FAST API WALLET' <<<"$execui" && \
               grep -Fq "executionEngine'))return true;" <<<"$execui" && \
               grep -Fq 'execution.cancel_all' <<<"$execops" && \
               grep -Fq 'if(window.RWAExecutionBridge)return;' <<<"$execbridge" && \
               grep -Fq 'RWAExecutionAPI' <<<"$execbridge" && \
               grep -Fq '"venue": "hyperliquid"' <<<"$cfg"; then
              ok=1
              echo "Live wallet + dedicated execution API verified on attempt $i"
              break
            fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live success statuses
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/live-browser-smoke' -f description='Live wallet + realtime application verified'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/execution-api-smoke' -f description='Dedicated execution API and agent wallet bundle verified live'
      - name: Publish live failure statuses
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/live-browser-smoke' -f description='Live browser smoke failed; source status may still be valid'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/execution-api-smoke' -f description='Dedicated execution API live verification failed'
