name: RWA Live Browser Smoke

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "monitor/status.json"

permissions:
  contents: read
  statuses: write

concurrency:
  group: rwa-live-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser and execution source
        run: |
          node --check app.js
          node --check realtime-core.js
          node --check chart-core.js
          node --check wallet-core.js
          node --check walletconnect.js
          node --check mobile.js
          node --check suite-nav.js
          node --check execution-api.js
          node --check execution-ui.js
          node --check execution-ops-bridge.js
          node --check exchange-core.js
          node --check exchange-ui.js
          node --check suite-execution-patch.js
          python -m json.tool rwa-execution-config.json >/dev/null
          python -m json.tool token/config.json >/dev/null
          test -s EXECUTION_API.md
          test -s chart-core.js
          test -s wallet-core.js
          grep -Fq 'realtime-core.js?v=2' index.html
          grep -Fq 'chart-core.js?v=1' index.html
          grep -Fq 'walletconnect.js?v=3' index.html
          grep -Fq 'wallet-core.js?v=3' index.html
          ! grep -Fq 'wallet-seamless.js' index.html
          grep -Fq 'execution-api.js?v=2' index.html
          grep -Fq 'execution-ops-bridge.js?v=3' index.html
          grep -Fq 'exchange-core.js?v=1' index.html
          grep -Fq 'exchange-ui.js?v=1' index.html
          ! grep -Fq 'browser-recovery.js' index.html
          ! grep -Fq 'instantChartBoot();loadSuite()' mobile.js
          grep -Fq 'REST fallback' realtime-core.js
          grep -Fq 'waitWalletAuth' execution-ops-bridge.js
          grep -Fq 'window.loadTradingView=openTradingView' chart-core.js
          grep -Fq 'liveCandle' chart-core.js
          grep -Fq 'eip6963:requestProvider' wallet-core.js
          grep -Fq 'personal_sign' wallet-core.js
          grep -Fq 'personal_ecRecover' wallet-core.js
          grep -Fq "version:'3.0.0'" wallet-core.js
          grep -Fq 'Wallet account switched' wallet-core.js
          grep -Fq "version:'2.0.0'" execution-api.js
          grep -Fq "version:'1.0.0'" exchange-core.js
          grep -Fq 'RWA EXCHANGE CORE' exchange-ui.js
      - name: Publish source success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/execution-source' -f description='Dedicated execution API source verified'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/chart-wallet-source' -f description='Realtime chart + seamless wallet v3 verified'
      - name: Wait for GitHub Pages propagation
        shell: bash
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/?v=$q" || true)"
            core="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/realtime-core.js?v=$q" || true)"
            chart="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/chart-core.js?v=$q" || true)"
            wallet="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/wallet-core.js?v=$q" || true)"
            execapi="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/execution-api.js?v=$q" || true)"
            excore="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-core.js?v=$q" || true)"
            exui="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/exchange-ui.js?v=$q" || true)"
            if grep -Fq 'wallet-core.js?v=3' <<<"$html" && ! grep -Fq 'wallet-seamless.js' <<<"$html" && grep -Fq 'exchange-core.js?v=1' <<<"$html" && grep -Fq 'REST fallback' <<<"$core" && grep -Fq 'liveCandle' <<<"$chart" && grep -Fq "version:'3.0.0'" <<<"$wallet" && grep -Fq 'Wallet account switched' <<<"$wallet" && grep -Fq "version:'2.0.0'" <<<"$execapi" && grep -Fq "version:'1.0.0'" <<<"$excore" && grep -Fq 'RWA EXCHANGE CORE' <<<"$exui"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish live success statuses
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/live-browser-smoke' -f description='Live chart + seamless wallet v3 + exchange verified'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/chart-wallet-smoke' -f description='Chart and seamless wallet login verified live'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/execution-api-smoke' -f description='Dedicated execution API verified live'
      - name: Publish live failure statuses
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/live-browser-smoke' -f description='Live browser smoke failed'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/chart-wallet-smoke' -f description='Chart or wallet live verification failed'
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/execution-api-smoke' -f description='Execution API live verification failed'