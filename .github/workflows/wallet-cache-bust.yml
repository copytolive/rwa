name: Apply Wallet Login Cache Bust
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/wallet-cache-bust.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump wallet core asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('wallet-core.js?v=1','wallet-core.js?v=2')
          p.write_text(s)
          assert 'wallet-core.js?v=2' in s
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: force provider-native wallet core v2 [skip ci]' || exit 0
          git push