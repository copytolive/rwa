name: RWA Launch Dashboard Smoke

on:
  push:
    branches: ["main"]
    paths:
      - "launch/**"
      - ".github/workflows/launch-dashboard-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  launch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launch dashboard source
        run: |
          node --check launch/status.js
          python -m json.tool launch/readiness.json >/dev/null
          python -m json.tool launch/free-stack.json >/dev/null
          grep -Fq 'Launch readiness' launch/index.html
          grep -Fq 'ZERO-COST STACK' launch/index.html
          grep -Fq 'Replit/Vercel/paid worker hosting excluded' launch/index.html
          grep -Fq 'requires_global_ready_for_mainnet' launch/free-stack.json
      - name: Verify live GitHub Pages dashboard
        run: |
          ok=0
          for i in {1..120}; do
            q="${GITHUB_RUN_ID}-${i}"
            html="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/launch/?v=$q" || true)"
            js="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/launch/status.js?v=$q" || true)"
            ready="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/launch/readiness.json?v=$q" || true)"
            if grep -Fq 'Launch readiness' <<<"$html" \
              && grep -Fq 'ZERO-COST STACK' <<<"$html" \
              && grep -Fq 'real_wallet_e2e' <<<"$js" \
              && grep -Fq '"engineering_ready": true' <<<"$ready"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
      - name: Publish launch-dashboard status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/launch-dashboard-live' -f description='Public zero-cost launch readiness dashboard live on GitHub Pages'
