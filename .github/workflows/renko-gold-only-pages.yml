name: RENKO GOLD Only Public Release

on:
  push:
    branches:
      - fix/renko-gold-only-public-20260830
    paths:
      - 'renko/index.html'
      - 'renko/renko-gold-recent-history.js'
      - 'renko/history/gold/**'
      - '.github/workflows/renko-gold-only-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: renko-gold-only-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate GOLD release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s renko/index.html
          test -s renko/renko-gold-recent-history.js
          test -s renko/history/gold/manifest.json
          test -s renko/history/gold/2026-08-28.json.gz
          node --check renko/renko-gold-recent-history.js
          grep -Fq 'renko-gold-recent-history.js?v=1' renko/index.html
          python3 - <<'PY'
          import gzip,json,pathlib
          root=pathlib.Path('renko')
          m=json.load(open(root/'history/gold/manifest.json'))
          assert m['schema']=='renko-gold-s1-manifest-v1'
          assert m['provider']=='Dukascopy' and m['instrumentCode']=='XAU-USD' and m['symbol']=='XAUUSD' and m['interval']=='1s'
          assert m['documentedEarliestS1Ms']==1052092863421
          assert len(m['chunks'])==12 and m['chunks'][0]['date']=='2026-08-28'
          assert m['continuousRecent'] is True and m['backfillComplete'] is False
          total=0
          for c in m['chunks']:
              j=json.loads(gzip.decompress((root/c['url']).read_bytes()))
              assert j['schema']=='renko-gold-s1-chunk-v1' and j['provider']=='Dukascopy' and j['instrumentCode']=='XAU-USD' and j['interval']=='1s'
              assert j['date']==c['date'] and j['payloadSha256']==c['payloadSha256'] and len(j['bars'])==c['barCount']
              total+=len(j['bars'])
          assert total==673253
          print('RENKO_GOLD_RELEASE_PAYLOAD_PASS',len(m['chunks']),total)
          PY

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp exact GOLD release SHA
        run: |
          printf '%s\n' "$GITHUB_SHA" > renko-deployment-sha.txt
          printf '%s\n' "$GITHUB_SHA" > renko/deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy GOLD release to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-gold-browser:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact public GOLD bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://copytolive.github.io/rwa'
          ok=0
          for i in $(seq 1 60); do
            got="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE/renko-deployment-sha.txt?gold=$GITHUB_SHA&n=$i" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$got" = "$GITHUB_SHA" ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          for f in renko/index.html renko/renko-gold-recent-history.js renko/history/gold/manifest.json renko/history/gold/2026-08-28.json.gz renko/history/gold/2026-08-27.json.gz; do
            local_sha="$(sha256sum "$f" | awk '{print $1}')"
            remote_sha="$(curl -fsSL -H 'Cache-Control: no-cache' "$BASE/$f?sha=$GITHUB_SHA" | sha256sum | awk '{print $1}')"
            test "$local_sha" = "$remote_sha"
            echo "GOLD_BYTE_PARITY $f $local_sha"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Chromium public desktop + mobile GOLD navigation
        shell: bash
        run: |
          mkdir -p artifacts/renko-gold-public
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const base='https://copytolive.github.io/rwa/renko/';
          const receipt={schema:'renko-gold-only-public-v1',sha:process.env.GITHUB_SHA,url:base,rows:[],status:'PASS'};
          for(const mode of [{name:'desktop',width:1900,height:1000},{name:'mobile',width:430,height:932}]){
            const page=await browser.newPage({viewport:{width:mode.width,height:mode.height}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            await page.addInitScript(()=>localStorage.setItem('rwa_renko_tradingview_settings_v1',JSON.stringify({source:'close',method:'atr',boxSize:1,atrLength:14,wicks:true})));
            const resp=await page.goto(base+'?symbol=ZECUSDT&gold=1&release='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp||resp.status()!==200)throw Error(mode.name+' HTTP '+(resp?.status()||0));
            await page.waitForFunction(()=>window.RWARenkoTV?.state&&window.RWARenkoGoldRecentHistory?.version==='1.0.0',null,{timeout:30000});
            await page.evaluate(()=>window.RWARenkoGoldRecentHistory.addControls());
            const ok=await page.evaluate(()=>window.RWARenkoGoldRecentHistory.newest());
            if(!ok)throw Error(mode.name+' newest returned false');
            await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecentDate==='2026-08-28'&&window.RWARenkoTV.state.symbol==='XAUUSD'&&window.RWARenkoTV.state.status==='history-gold',null,{timeout:90000});
            const newest=await page.evaluate(()=>({date:document.documentElement.dataset.renkoGoldRecentDate,bars:RWARenkoTV.state.closedBars.length,provider:RWARenkoTV.state.historyMeta?.provider,instrument:RWARenkoTV.state.historyMeta?.instrumentCode,interval:RWARenkoTV.state.historyMeta?.interval,losses:Number(RWARenkoTV.state.historyMeta?.losses),canvas:document.querySelectorAll('#chartHost canvas').length,pair:document.getElementById('pairName')?.textContent,coverage:document.getElementById('tvCoverage')?.textContent,failures:Number(RWARenkoGoldRecentHistory.stats.failures)}));
            if(newest.date!=='2026-08-28'||newest.bars!==64309||newest.provider!=='Dukascopy'||newest.instrument!=='XAU-USD'||newest.interval!=='1s'||newest.losses!==0||newest.canvas<1||newest.pair!=='XAU / USD'||newest.failures!==0)throw Error(mode.name+' newest '+JSON.stringify(newest));
            await page.locator('#tvGoldOlder').click();
            await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecentDate==='2026-08-27',null,{timeout:90000});
            const older=await page.evaluate(()=>({date:document.documentElement.dataset.renkoGoldRecentDate,bars:RWARenkoTV.state.closedBars.length,provider:RWARenkoTV.state.historyMeta?.provider,interval:RWARenkoTV.state.historyMeta?.interval,canvas:document.querySelectorAll('#chartHost canvas').length}));
            if(older.date!=='2026-08-27'||older.bars!==64913||older.provider!=='Dukascopy'||older.interval!=='1s'||older.canvas<1)throw Error(mode.name+' older '+JSON.stringify(older));
            await page.locator('#tvGoldNewer').click();
            await page.waitForFunction(()=>document.documentElement.dataset.renkoGoldRecentDate==='2026-08-28',null,{timeout:90000});
            if(pageErrors.length)throw Error(mode.name+' page errors '+JSON.stringify(pageErrors));
            const screenshot=`artifacts/renko-gold-public/${mode.name}-gold-public-2026-08-28.png`;
            await page.screenshot({path:screenshot,fullPage:true});
            receipt.rows.push({mode:mode.name,newest,older,screenshot,pass:true});
            await page.close();
          }
          fs.writeFileSync('artifacts/renko-gold-public/receipt.json',JSON.stringify(receipt,null,2));
          console.log('RENKO_GOLD_PUBLIC_PASS',JSON.stringify(receipt));
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: renko-gold-public-${{ github.sha }}
          path: artifacts/renko-gold-public/
          retention-days: 30
