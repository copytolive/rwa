name: Verify Wallet Auth

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate wallet-only auth source
        run: |
          node --check wallet-auth.js
          node --check suite-nav.js
          node --check suite.js
          grep -q "wallet-auth.js" suite-nav.js
          grep -q "RWAWalletAuth" wallet-auth.js
          grep -q "accountsChanged" wallet-auth.js
          grep -q "System health" wallet-auth.js
          grep -q "suite-nav.js" mobile.js
      - name: Verify production wallet auth bundle
        run: |
          ok=0
          for i in {1..18}; do
            q="${GITHUB_RUN_ID}-${i}"
            if curl -fsSL "https://narzulalistiqlal.github.io/rwa/mobile.js?v=$q" | grep -q "suite-nav.js" && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/suite-nav.js?v=$q" | grep -q "wallet-auth.js" && \
               curl -fsSL "https://narzulalistiqlal.github.io/rwa/wallet-auth.js?v=$q" | grep -q "RWAWalletAuth"; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = "1"
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "WALLET-ONLY AUTH DEPLOYMENT SUCCESS. Wallet signature is the only login/logout session. System Health, account-change handling, scoped wallet data, Hyperliquid refresh, and production bundle checks passed."
