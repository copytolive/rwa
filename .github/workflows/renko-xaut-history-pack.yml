name: RENKO XAUT History Pack
on:
  push:
    branches:
      - main
      - fix/renko-xaut-atr-matrix-20260828
    paths:
      - 'tools/build-xaut-gate-1m-pack.py'
      - '.github/workflows/renko-xaut-history-pack.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: renko-xaut-history-pack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build or increment XAUT Gate 1m pack
        run: python3 tools/build-xaut-gate-1m-pack.py
      - name: Validate pack
        run: |
          python3 - <<'PY'
          import gzip,json,csv
          from pathlib import Path
          m=json.loads(Path('renko/data/xaut-gate-1m-pack.meta.json').read_text())
          assert m['rows'] >= 1000999, m
          with gzip.open('renko/data/xaut-gate-1m-pack.csv.gz','rt') as f:
              rows=sum(1 for _ in f)
          assert rows == m['rows'], (rows,m['rows'])
          print('RENKO_XAUT_PACK_PASS',json.dumps({k:m[k] for k in ['rows','firstUtc','lastUtc','gzipBytes','gzipSha256']}))
          PY
      - name: Commit refreshed pack to source branch
        run: |
          set -euo pipefail
          git config user.name 'copytolive-renko-bot'
          git config user.email 'copytolive@gmail.com'
          git add -f renko/data/xaut-gate-1m-pack.csv.gz renko/data/xaut-gate-1m-pack.meta.json
          if git diff --cached --quiet; then echo 'pack unchanged'; exit 0; fi
          git commit -m 'data(renko): refresh XAUT Gate 1m history pack'
          git push origin HEAD:${GITHUB_REF_NAME}
