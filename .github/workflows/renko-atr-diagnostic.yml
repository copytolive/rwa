name: RENKO ATR Length Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/renko-atr-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare ATR 14 vs 140 on live SOL trades
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://data-api.binance.vision/api/v3/aggTrades?symbol=SOLUSDT&limit=1000' -o /tmp/agg.json
          node - <<'NODE'
          const rows=require('/tmp/agg.json');
          const ticks=rows.map(x=>({price:Number(x.p),time:Number(x.T)}));
          function oldAtr(ticks,len){len=Math.max(1,Math.floor(Number(len)||14));const src=ticks.slice(-Math.max(500,len*50)),moves=[];let prev=NaN;for(const t of src){const p=Number(t.price);if(!Number.isFinite(p))continue;if(Number.isFinite(prev)){const tr=Math.abs(p-prev);if(tr>0)moves.push(tr)}prev=p}if(!moves.length)return NaN;const recent=moves.slice(-Math.max(len,Math.min(moves.length,len*20)));if(recent.length<len)return recent.reduce((a,b)=>a+b,0)/recent.length;let a=recent.slice(0,len).reduce((x,y)=>x+y,0)/len;for(let i=len;i<recent.length;i++)a=((a*(len-1))+recent[i])/len;return a}
          function rangeAtr(ticks,len){
            len=Math.max(1,Math.min(200,Math.floor(Number(len)||14)));
            const prices=[];let prev=NaN;
            for(const t of ticks){const p=Number(t.price);if(!Number.isFinite(p)||p===prev)continue;prices.push(p);prev=p}
            if(prices.length<2)return NaN;
            const block=8, trs=[];let prevClose=prices[0];
            for(let i=0;i<prices.length;i+=block){const a=prices.slice(i,i+block);if(a.length<2)continue;const hi=Math.max(...a),lo=Math.min(...a),cl=a.at(-1);trs.push(Math.max(hi-lo,Math.abs(hi-prevClose),Math.abs(lo-prevClose)));prevClose=cl}
            if(!trs.length)return NaN;const use=trs.slice(-Math.max(len,Math.min(trs.length,len*4)));
            if(use.length<len)return use.reduce((a,b)=>a+b,0)/use.length;
            let x=use.slice(0,len).reduce((a,b)=>a+b,0)/len;for(let i=len;i<use.length;i++)x=((x*(len-1))+use[i])/len;return x;
          }
          const out={old14:oldAtr(ticks,14),old140:oldAtr(ticks,140),range14:rangeAtr(ticks,14),range140:rangeAtr(ticks,140),ticks:ticks.length};
          console.log('ATR_DIAGNOSTIC',JSON.stringify(out));
          if(!(Math.abs(out.range14-out.range140)>1e-9)) throw Error('proposed ATR still insensitive');
          NODE
