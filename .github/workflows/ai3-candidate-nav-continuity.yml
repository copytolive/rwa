name: AI3 Candidate Nav Continuity
on:
  push:
    branches: [main]
    paths:
      - "ai3-candidate-requests/**"
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-candidate-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=ai3-candidate-results/$ID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test candidate against live production
        env:
          ACCEPT_ID: ${{ steps.req.outputs.id }}
          OUT_DIR: ${{ steps.req.outputs.out }}
        run: node tools/ai3_candidate_nav_continuity.cjs
      - name: Commit result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.req.outputs.out }}";test -s "$OUT/report.json"
          git config user.name "CopyToLive AI3 Candidate"
          git config user.email "copytolive-ai3-candidate@local.invalid"
          git add "$OUT/report.json"
          git commit -m "ai3 candidate nav result: ${{ steps.req.outputs.id }}" || true
          for n in 1 2 3 4 5; do git fetch origin main;git rebase origin/main || { git rebase --abort || true;sleep "$n";continue; };git push origin HEAD:main && exit 0;sleep "$n";done
          exit 1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.id }}
          path: ${{ steps.req.outputs.out }}
          if-no-files-found: error
      - name: Enforce
        if: always()
        run: node -e "const d=require('./${{ steps.req.outputs.out }}/report.json');process.exit(d.ok?0:1)"
