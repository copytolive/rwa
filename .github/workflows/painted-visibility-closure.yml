name: Painted Visibility Closure

on:
  push:
    branches:
      - fix/total-ui-audit-seablueprint-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/total-ui-audit-seablueprint-20260830
          fetch-depth: 0
      - name: Patch visual audit to painted visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/visual-style-audit-browser.mjs')
          s=p.read_text()
          old="const visible=el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);return r.width>0&&r.height>0&&c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity)>0};"
          new="const visible=el=>{const r=el.getBoundingClientRect(),c=getComputedStyle(el);if(!(r.width>0&&r.height>0&&c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity)>0))return false;if(r.right<=0||r.bottom<=0||r.left>=innerWidth||r.top>=innerHeight)return false;const x=Math.min(innerWidth-1,Math.max(0,r.left+r.width/2)),y=Math.min(innerHeight-1,Math.max(0,r.top+r.height/2));const stack=document.elementsFromPoint(x,y);if(stack.includes(el))return true;const parent=el.parentElement,interactive=el.closest('button,[role=button],a[href]');return !!((parent&&parent!==document.body&&stack.includes(parent))||(interactive&&stack.includes(interactive)))};"
          if old not in s:
              raise SystemExit('expected visibility implementation not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          grep -F "document.elementsFromPoint" tools/visual-style-audit-browser.mjs
      - name: Commit closure patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/visual-style-audit-browser.mjs
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "test(ui): audit only painted visible elements"
          git push origin HEAD:fix/total-ui-audit-seablueprint-20260830
