name: GOLD Multi-Method v1 Adaptive Discovery macOS

on:
  workflow_dispatch:
    inputs:
      candidate_count:
        description: New targeted configs to simulate
        required: false
        default: '5000'
      base_seed:
        description: Deterministic discovery seed
        required: false
        default: '2026083102'
  push:
    paths:
      - '.github/workflows/gold24-multimethod-v1-discovery-macos.yml'
      - 'backtest/gold24/MULTIMETHOD_V1_DISCOVERY_KICK'
      - 'backtest/gold24/core.py'
      - 'backtest/gold24/MASTER_METHOD_UNIVERSE.json'
      - 'backtest/gold24/multimethod_v1_discovery.py'
      - 'backtest/gold24/multimethod_v1_discovery_strict.py'
      - 'backtest/gold24/multimethod_v1_finalize_strict.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: gold24-multimethod-v1-adaptive-discovery-macos
  cancel-in-progress: true

jobs:
  discover:
    name: Adaptive Multi-Method v1 discovery
    runs-on: macos-15
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      STATE_DIR: ${{ github.workspace }}/.gold24-multimethod-v1-discovery-state
      OUT_DIR: ${{ github.workspace }}/backtest/gold24/runtime_multimethod_v1
      SOURCE_SUMMARY: ${{ github.workspace }}/backtest/gold24/runtime_v11/latest_validation_summary.json
      CANDIDATE_COUNT: ${{ github.event.inputs.candidate_count || '5000' }}
      BASE_SEED: ${{ github.event.inputs.base_seed || '2026083102' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install -r backtest/gold24/requirements.txt

      - name: Freeze latest authoritative canonical source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/source.env"
          import json, os, pathlib
          x=json.loads(pathlib.Path(os.environ['SOURCE_SUMMARY']).read_text())
          assert x.get('validation') == 'PASS'
          assert x.get('gate_a_strict',{}).get('gate_a') == 'PASS'
          assert x.get('simulation_executed') is True
          assert x.get('strategy_engine') == 'RUNNING'
          print('SOURCE_RUN_ID=' + str(x['github_run_id']))
          print('SOURCE_BATCH=' + str(x['batch']))
          print('SOURCE_CURSOR=' + str(x['candidate_cursor']))
          print('SOURCE_ARCHIVED=' + str(x['cumulative_configs_archived']))
          PY
          cat "$RUNNER_TEMP/source.env"
          cat "$RUNNER_TEMP/source.env" >> "$GITHUB_ENV"

      - name: Restore full canonical archive artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" -n gold24-canonical-v11-state -D "$STATE_DIR"
          test -s "$STATE_DIR/gold24-v11.db"
          test -s "$STATE_DIR/gate_a/GC1_COMEX_TRADINGVIEW_D1_PRIMARY.csv"
          test -s "$STATE_DIR/gate_a/gate_a_receipt.json"
          python - <<'PY'
          import json, os, sqlite3
          db=sqlite3.connect(os.environ['STATE_DIR']+'/gold24-v11.db')
          n=db.execute('SELECT COUNT(*) FROM configs').fetchone()[0]
          cursor=int(json.loads(db.execute("SELECT v FROM state WHERE k='candidate_cursor'").fetchone()[0]))
          batch=int(json.loads(db.execute("SELECT v FROM state WHERE k='batch'").fetchone()[0]))
          db.close()
          assert n==int(os.environ['SOURCE_ARCHIVED']), (n, os.environ['SOURCE_ARCHIVED'])
          assert cursor==int(os.environ['SOURCE_CURSOR']), (cursor, os.environ['SOURCE_CURSOR'])
          assert batch==int(os.environ['SOURCE_BATCH']), (batch, os.environ['SOURCE_BATCH'])
          print(f'canonical restore PASS rows={n} batch={batch} cursor={cursor}')
          PY

      - name: Run cumulative adaptive discovery with economic floor before correlation
        shell: bash
        run: |
          set -euo pipefail
          EXISTING_LIBRARY="$OUT_DIR/latest_multimethod_v1_discovery.json"
          if [ ! -s "$EXISTING_LIBRARY" ]; then
            EXISTING_LIBRARY="$OUT_DIR/latest_multimethod_v1_full_rescan.json"
          fi
          test -s "$EXISTING_LIBRARY"
          echo "Cumulative library source: $EXISTING_LIBRARY"
          python backtest/gold24/multimethod_v1_discovery_strict.py \
            --state-dir "$STATE_DIR" \
            --out-dir "$OUT_DIR" \
            --source-summary "$SOURCE_SUMMARY" \
            --existing-library "$EXISTING_LIBRARY" \
            --candidate-count "$CANDIDATE_COUNT" \
            --base-seed "$BASE_SEED"
          test -s "$OUT_DIR/latest_multimethod_v1_discovery.json"
          test -s "$OUT_DIR/latest_multimethod_v1_discovery.csv"
          test -s "$OUT_DIR/latest_multimethod_v1_discovery_summary.json"
          python - <<'PY'
          import json, os, pathlib
          x=json.loads((pathlib.Path(os.environ['OUT_DIR'])/'latest_multimethod_v1_discovery_summary.json').read_text())
          assert x['status']=='PASS'
          assert int(x['source_batch'])==int(os.environ['SOURCE_BATCH'])
          assert int(x['source_candidate_cursor'])==int(os.environ['SOURCE_CURSOR'])
          assert int(x['source_archive_total'])==int(os.environ['SOURCE_ARCHIVED'])
          assert int(x['simulated_new_configs_this_run'])==int(os.environ['CANDIDATE_COUNT'])
          assert int(x['implemented_category_count']) == 20
          assert x['all_implemented_categories_sampled'] is True
          assert len(x['generated_category_counts_this_run']) == 20
          assert all(int(v) > 0 for v in x['generated_category_counts_this_run'].values())
          assert int(x['implemented_family_count']) == 24
          family_counts={str(k):int(v) for k,v in x['generated_family_counts_this_run'].items()}
          assert len(family_counts)==24
          assert max(family_counts.values())-min(family_counts.values()) <= 1
          assert int(x['library_count']) >= 1
          print(json.dumps(x, indent=2, sort_keys=True))
          PY

      - name: Enforce Entry100 USD20k and Corr selection contract
        shell: bash
        run: |
          set -euo pipefail
          python backtest/gold24/multimethod_v1_finalize_strict.py --out-dir "$OUT_DIR"
          python - <<'PY'
          import csv, json, os, pathlib
          out=pathlib.Path(os.environ['OUT_DIR'])
          rows=list(csv.DictReader((out/'latest_multimethod_v1_discovery.csv').open()))
          summary=json.loads((out/'latest_multimethod_v1_discovery_summary.json').read_text())
          assert rows
          assert len(rows)==int(summary['library_count'])
          assert int(summary['implemented_category_count']) == 20
          assert summary['all_implemented_categories_sampled'] is True
          for row in rows:
              assert int(row['total_entry']) >= 100
              assert float(row['standard_lot_net_profit_usd_same_cost_model']) >= 20000.0
              assert abs(float(row['correlation_max'])) <= 0.50 + 1e-12
              assert row['correlation_gate']=='PASS'
          print(f"economic selection PASS final={len(rows)} cumulative={summary['evaluated_config_hash_count_cumulative']}")
          PY

      - name: Publish discovery result race-safe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json \
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv \
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery_summary.json
          if git diff --cached --quiet; then
            echo "No discovery output delta to publish"
            exit 0
          fi
          git commit -m "chore(gold24): publish Multi-Method v1 adaptive discovery [skip ci]"
          for TRY in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "publish PASS try=$TRY"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((TRY * 2))
          done
          exit 1

      - name: Upload compact discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold24-multimethod-v1-adaptive-discovery
          path: |
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.json
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery.csv
            backtest/gold24/runtime_multimethod_v1/latest_multimethod_v1_discovery_summary.json
          if-no-files-found: error
          retention-days: 30
