name: GOLD24 Complete Handoff Package

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gold24-handoff-package.yml'
      - 'backtest/gold24/HANDOFF_PACKAGE_KICK'

permissions:
  contents: read
  actions: read

concurrency:
  group: gold24-complete-handoff-package
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete portable package
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/gold24-handoff"
          mkdir -p "$OUT/GOLD_SYSTEM_SNAPSHOT/.github/workflows"
          cp -a backtest/gold24 "$OUT/GOLD_SYSTEM_SNAPSHOT/backtest-gold24"
          find .github/workflows -maxdepth 1 -type f \( -iname '*gold24*' -o -iname '*multimethod*' \) -print0 | xargs -0 -r -I{} cp {} "$OUT/GOLD_SYSTEM_SNAPSHOT/.github/workflows/"

          git rev-parse HEAD > "$OUT/MAIN_SHA.txt"
          git status --short > "$OUT/GIT_STATUS.txt"
          git log -1 --format=fuller > "$OUT/LATEST_COMMIT.txt"
          git bundle create "$OUT/rwa-full-history.bundle" --all
          git bundle verify "$OUT/rwa-full-history.bundle" > "$OUT/BUNDLE_VERIFY.txt" 2>&1
          git archive --format=zip --output="$OUT/rwa-source-snapshot.zip" HEAD

          cat > "$OUT/README_RESTORE.txt" <<'EOF'
          COMPLETE HANDOFF PACKAGE - copytolive/rwa GOLD24

          Contents:
          - rwa-full-history.bundle : full Git history and refs available to this checkout.
          - rwa-source-snapshot.zip : source tree at MAIN_SHA.
          - GOLD_SYSTEM_SNAPSHOT/   : focused GOLD24 engine/workflows/runtime source.
          - MAIN_SHA.txt            : exact source commit.
          - BUNDLE_VERIFY.txt       : git bundle verification result.

          Restore to a new repository:
            git clone rwa-full-history.bundle rwa-restored
            cd rwa-restored
            git remote remove origin || true
            git remote add origin https://github.com/NEW_OWNER/NEW_REPO.git
            git push --mirror origin

          Never copy GitHub tokens, passwords, broker credentials, private keys, or API secrets into source files.
          EOF

          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/gold24-complete-handoff-2026-08-31.tar.gz" gold24-handoff

      - name: Upload complete handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold24-complete-handoff-2026-08-31
          path: ${{ runner.temp }}/gold24-complete-handoff-2026-08-31.tar.gz
          if-no-files-found: error
          retention-days: 30
