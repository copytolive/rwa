name: Global Asset Terminal Smoke
on:
  pull_request:
    paths:
      - 'index.html'
      - 'global-asset-terminal.js'
      - 'global-asset-terminal.css'
      - 'global-fundamental-shard-bridge.js'
      - 'GLOBAL_ASSET_TERMINAL_1_50.md'
      - 'data/global/**'
      - 'tools/global-*.mjs'
      - 'tools/sync-sec-us-*.mjs'
      - '.github/workflows/global-asset-terminal-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'global-asset-terminal.js'
      - 'global-asset-terminal.css'
      - 'global-fundamental-shard-bridge.js'
      - 'GLOBAL_ASSET_TERMINAL_1_50.md'
      - 'data/global/**'
      - 'tools/global-*.mjs'
      - 'tools/sync-sec-us-*.mjs'
      - '.github/workflows/global-asset-terminal-smoke.yml'
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax contracts
        run: |
          node --check global-asset-terminal.js
          node --check global-fundamental-shard-bridge.js
          node --check tools/global-candle-10m.mjs
          node --check tools/global-fundamental-normalizer.mjs
          node --check tools/global-data-audit.mjs
          node --check tools/global-dividend-engine.mjs
          node --check tools/global-corporate-actions.mjs
          node --check tools/global-quality-score.mjs
          node --check tools/global-security-index.mjs
          node --check tools/global-readiness-1-50.mjs
          node --check tools/sync-sec-us-catalog.mjs
          node --check tools/sync-sec-us-fundamentals.mjs
          node --check tools/sync-sec-us-frames.mjs
          node --check tools/sync-sec-us-dividends.mjs
      - name: 10m candle self-test
        run: node tools/global-candle-10m.mjs
      - name: Fundamental normalizer self-test
        run: node tools/global-fundamental-normalizer.mjs
      - name: Dividend self-test
        run: node tools/global-dividend-engine.mjs
      - name: Corporate action self-test
        run: node tools/global-corporate-actions.mjs
      - name: Quality score self-test
        run: node tools/global-quality-score.mjs
      - name: Fail-closed data audit
        run: node tools/global-data-audit.mjs
      - name: Build compact security index
        run: node tools/global-security-index.mjs
      - name: Global 1-50 machine gate
        run: node tools/global-readiness-1-50.mjs
      - name: Canonical root source contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('global-asset-terminal.js','utf8');
          const must=['global-asset-terminal.css?v=1','global-fundamental-shard-bridge.js?v=1','global-asset-terminal.js?v=1'];
          for(const x of must)if(!h.includes(x))throw new Error('missing '+x);
          if(!js.includes("const STOCK_TF='10'"))throw new Error('stock timeframe is not locked to 10m');
          if(!js.includes('No unlicensed depth data'))throw new Error('stock depth fail-closed guard missing');
          if(!js.includes('stock data is never labelled VERIFIED'))throw new Error('stock/RWA verification separation missing');
          if(/location\.(href|assign|replace)\s*=/.test(js))throw new Error('global terminal must not navigate away from canonical root');
          const r=JSON.parse(fs.readFileSync('data/global/readiness-1-50.json','utf8'));
          if(r.engineering_passed!==50||r.engineering_complete!==true)throw new Error('1-50 engineering gate incomplete');
          if(r.global_data_complete!==false)throw new Error('global data coverage must not be fabricated as complete');
          console.log('GLOBAL ROOT CONTRACT PASS · engineering 50/50 · external coverage fail-closed');
          NODE
      - name: Install browser proof dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start deterministic static server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/rwa-global-server.log 2>&1 &
          echo $! > /tmp/rwa-global-server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/rwa-global-server.log
          exit 1
      - name: Desktop + mobile stock proof
        env:
          BASE_URL: http://127.0.0.1:8000/
        run: node tools/global-asset-terminal-browser.mjs
      - name: Preserve launch safety boundary
        run: |
          node - <<'NODE'
          const r=require('./launch/readiness.json');
          if(r.mainnet_ready===true && r.status!=='READY')throw new Error('inconsistent mainnet readiness');
          if(!r.checks?.browser_global_mainnet_lock?.ok)throw new Error('global mainnet lock no longer proven');
          console.log('LAUNCH SAFETY BOUNDARY PASS · current status='+r.status);
          NODE
      - name: Wait for canonical Pages deployment
        if: github.event_name == 'push'
        run: |
          url='https://narzulalistiqlal.github.io/rwa/'
          for i in {1..90}; do
            body="$(curl -fsSL --max-time 20 "$url" || true)"
            if printf '%s' "$body" | grep -q 'global-asset-terminal.js?v=1'; then
              echo 'PUBLIC PAGES GLOBAL ASSET TERMINAL READY'
              exit 0
            fi
            echo "Waiting for Pages deployment ($i/90)..."
            sleep 6
          done
          echo 'Pages did not expose the merged Global Asset Terminal in time.'
          exit 1
      - name: Public Pages desktop + mobile proof
        if: github.event_name == 'push'
        env:
          BASE_URL: https://narzulalistiqlal.github.io/rwa/
        run: node tools/global-asset-terminal-browser.mjs
