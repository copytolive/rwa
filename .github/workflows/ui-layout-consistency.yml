name: RWA UI Layout Consistency

on:
  pull_request:
    paths:
      - 'apps/realworldasset/**'
      - 'tools/realworldasset-layout-consistency-audit.py'
      - '.github/workflows/ui-layout-consistency.yml'
  push:
    branches: [main]
    paths:
      - 'apps/realworldasset/**'
      - 'tools/realworldasset-layout-consistency-audit.py'
      - '.github/workflows/ui-layout-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rwa-ui-layout-consistency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  layout-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/realworldasset/package-lock.json

      - name: Install UI dependencies
        working-directory: apps/realworldasset
        run: npm ci --no-audit --no-fund

      - name: Verify live-only truth, typecheck and build canonical UI
        working-directory: apps/realworldasset
        env:
          RWA_BASE_PATH: /rwa
          GITHUB_ACTIONS: 'true'
        run: |
          npm run verify:live-only
          npm run typecheck
          npm run build

      - name: Compose local production shape
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rwa-layout-site
          mkdir -p /tmp/rwa-layout-site/rwa
          cp -a apps/realworldasset/out/. /tmp/rwa-layout-site/rwa/
          printf '%s\n' "$GITHUB_SHA" > /tmp/rwa-layout-site/rwa/deployment-sha.txt
          test -s /tmp/rwa-layout-site/rwa/index.html
          test "$(cat /tmp/rwa-layout-site/rwa/deployment-sha.txt)" = "$GITHUB_SHA"
          COUNT="$(find /tmp/rwa-layout-site/rwa -name index.html -type f | wc -l | tr -d ' ')"
          test "$COUNT" -ge 30
          echo "LAYOUT_ACTUAL_ROUTE_SET=$COUNT"

      - name: Install Chromium
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          python3 -m playwright install --with-deps chromium

      - name: Start local production
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory /tmp/rwa-layout-site > /tmp/rwa-layout-server.log 2>&1 &
          echo $! > /tmp/rwa-layout-server.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/rwa/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/rwa-layout-server.log
          exit 1

      - name: Audit cross-sector desktop and mobile geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/realworldasset-layout-consistency-audit.py \
            --base http://127.0.0.1:4173/rwa/ \
            --artifact ui-layout-consistency

      - name: Stop local production
        if: always()
        run: kill "$(cat /tmp/rwa-layout-server.pid)" 2>/dev/null || true

      - name: Upload layout screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rwa-ui-layout-consistency-${{ github.sha }}
          path: ui-layout-consistency/
          retention-days: 14
