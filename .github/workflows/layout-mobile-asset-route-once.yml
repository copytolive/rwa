name: Layout Mobile Asset Route Once
on:
  push:
    branches: [fix/ecommerce-first-paint-0ms-20260829]
    paths: ['.github/workflows/layout-mobile-asset-route-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ecommerce-first-paint-0ms-20260829
      - name: Use canonical asset detail route on mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/ui-layout-integrity-v15-browser.mjs')
          s=p.read_text()
          old="await mobile.p.evaluate(()=>window.RWASuperApp.navigate('assets'));await mobile.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('assets'));await mobile.p.waitForSelector('#rwaSuperWorkspace:not([hidden])',{state:'visible'});"
          new="await mobile.p.evaluate(()=>window.RWASuperApp.navigate('asset/PENDLE'));await mobile.p.waitForFunction(()=>String(window.RWASuperApp?.route?.()).startsWith('asset/PENDLE'));await mobile.p.waitForSelector('#rwaSuperWorkspace:not([hidden])',{state:'visible'});"
          if old not in s: raise SystemExit('mobile generic assets route block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/ui-layout-integrity-v15-browser.mjs
          git commit -m 'test: use canonical asset detail route for mobile layout'
          git push origin HEAD:fix/ecommerce-first-paint-0ms-20260829
