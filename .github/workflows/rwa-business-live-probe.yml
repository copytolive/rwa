name: RWA Business Live Probe
on:
  push:
    branches: ["main"]
    paths:
      - "rwa-commerce-config.json"
      - "tools/rwa-business-live-probe.mjs"
      - ".github/workflows/rwa-business-live-probe.yml"
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Probe fail-closed or live business backend
        run: node tools/rwa-business-live-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rwa-business-live-probe-${{ github.run_id }}
          path: artifacts/rwa-business-live-probe
          if-no-files-found: error
