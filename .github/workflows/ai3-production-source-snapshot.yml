name: AI3 Production Source Snapshot
on:
  push:
    branches: [main]
    paths:
      - "ai3-prod-source-requests/**"
permissions:
  contents: read
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^ai3-prod-source-requests/.*\.json$' | tail -n1)"
          ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$FILE")"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "out=/tmp/$ID" >> "$GITHUB_OUTPUT"
      - name: Fetch public production source
        shell: bash
        env:
          OUT: ${{ steps.req.outputs.out }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import os,re,urllib.request,urllib.parse,json,hashlib
          out=os.environ["OUT"]; base="https://copytolive.com/"
          def get(url):
              req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read()
          html=get(base)
          open(out+"/index.html","wb").write(html)
          text=html.decode("utf-8","replace")
          urls=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)["\']',r'<link[^>]+href=["\']([^"\']+)["\']']:
              urls += re.findall(pat,text,re.I)
          rows=[]
          for u in urls:
              full=urllib.parse.urljoin(base,u)
              if urllib.parse.urlparse(full).netloc!="copytolive.com": continue
              path=urllib.parse.urlparse(full).path
              if not (path.endswith(".js") or path.endswith(".css")): continue
              try:
                  b=get(full)
                  name=path.strip("/").replace("/","__") or "root"
                  open(out+"/"+name,"wb").write(b)
                  rows.append({"url":full,"file":name,"bytes":len(b),"sha256":hashlib.sha256(b).hexdigest()})
              except Exception as e: rows.append({"url":full,"error":repr(e)})
          open(out+"/manifest.json","w").write(json.dumps(rows,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.req.outputs.id }}
          path: ${{ steps.req.outputs.out }}
          if-no-files-found: error
