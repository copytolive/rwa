name: RWA Physical Commerce UI
on:
  push:
    branches: ["main"]
    paths:
      - "rwa-commerce-registry.json"
      - "rwa-storefront.js"
      - "rwa-storefront-safety-patch.js"
      - "rwa-store-draft-ui.js"
      - "rwa-store-draft-ui.css"
      - "rwa-home-commerce.js"
      - "rwa-home-commerce.css"
      - "rwa-market-labels.js"
      - "rwa-store-detail.js"
      - "rwa-store-detail.css"
      - "rwa-checkout-ui.js"
      - "rwa-checkout-ui.css"
      - "rwa-ui-pro.css"
      - "quick-actions.js"
      - "trade/ui-polish.js"
      - "trade/ui-polish.css"
      - "trade/config.js"
      - "tools/storefront-ui-contract.mjs"
      - "tools/storefront-browser.mjs"
      - ".github/workflows/storefront-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: rwa-storefront-ui
  cancel-in-progress: true
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate storefront source contract
        run: |
          node --check rwa-storefront.js
          node --check rwa-storefront-safety-patch.js
          node --check rwa-store-draft-ui.js
          node --check rwa-home-commerce.js
          node --check rwa-market-labels.js
          node --check rwa-store-detail.js
          node --check rwa-checkout-ui.js
          node --check quick-actions.js
          node --check trade/ui-polish.js
          node --check tools/storefront-ui-contract.mjs
          node --check tools/storefront-browser.mjs
          python -m json.tool rwa-commerce-registry.json >/dev/null
          test -s rwa-store-detail.css
          test -s rwa-checkout-ui.css
          node tools/storefront-ui-contract.mjs
          grep -Fq 'preview-no-fake-price-trade-v1' rwa-storefront-safety-patch.js
          grep -Fq 'ONE_TOKEN_ONE_PHYSICAL_STORE_V1' rwa-store-draft-ui.js
          grep -Fq 'UNVERIFIED_LOCAL_DRAFT' rwa-store-draft-ui.js
          grep -Fq 'landing-commerce-surface-v1' rwa-home-commerce.js
          grep -Fq 'public-rwa-linked-vs-store-token-v1' rwa-market-labels.js
          grep -Fq 'physical-store-evidence-detail-v1' rwa-store-detail.js
          grep -Fq 'backend-gated-checkout-preview-v1' rwa-checkout-ui.js
          grep -Fq 'Place order after backend verification' rwa-checkout-ui.js
          grep -Fq 'async function shellRoute' quick-actions.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for Pages and run desktop/mobile storefront smoke
        shell: bash
        run: |
          ok=0
          for i in {1..60}; do
            q="${GITHUB_RUN_ID}-${i}"
            quick="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/quick-actions.js?v=$q" || true)"
            store="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-storefront.js?v=$q" || true)"
            safety="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-storefront-safety-patch.js?v=$q" || true)"
            draft="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-store-draft-ui.js?v=$q" || true)"
            home="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-home-commerce.js?v=$q" || true)"
            labels="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-market-labels.js?v=$q" || true)"
            detail="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-store-detail.js?v=$q" || true)"
            detailcss="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-store-detail.css?v=$q" || true)"
            checkout="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-checkout-ui.js?v=$q" || true)"
            checkoutcss="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-checkout-ui.css?v=$q" || true)"
            reg="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/rwa-commerce-registry.json?v=$q" || true)"
            trade="$(curl --connect-timeout 5 --max-time 12 -fsSL "https://narzulalistiqlal.github.io/rwa/trade/ui-polish.js?v=$q" || true)"
            if grep -Fq "premium-shell-storefront-v1" <<<"$quick" \
              && grep -Fq "async function shellRoute" <<<"$quick" \
              && grep -Fq "rwa-storefront-safety-patch.js?v=1" <<<"$quick" \
              && grep -Fq "rwa-store-draft-ui.js?v=1" <<<"$quick" \
              && grep -Fq "rwa-home-commerce.js?v=1" <<<"$quick" \
              && grep -Fq "rwa-market-labels.js?v=1" <<<"$quick" \
              && grep -Fq "rwa-store-detail.js?v=1" <<<"$quick" \
              && grep -Fq "rwa-checkout-ui.js?v=1" <<<"$quick" \
              && grep -Fq "ONE_TOKEN_ONE_PHYSICAL_STORE_V1" <<<"$store" \
              && grep -Fq "preview-no-fake-price-trade-v1" <<<"$safety" \
              && grep -Fq "UNVERIFIED_LOCAL_DRAFT" <<<"$draft" \
              && grep -Fq "landing-commerce-surface-v1" <<<"$home" \
              && grep -Fq "public-rwa-linked-vs-store-token-v1" <<<"$labels" \
              && grep -Fq "physical-store-evidence-detail-v1" <<<"$detail" \
              && grep -Fq ".rwa-store-detail-layer" <<<"$detailcss" \
              && grep -Fq "backend-gated-checkout-preview-v1" <<<"$checkout" \
              && grep -Fq ".rwa-checkout-layer" <<<"$checkoutcss" \
              && grep -Fq '"one_token_one_physical_store": true' <<<"$reg" \
              && grep -Fq "desktop-mobile-commerce-polish-v1" <<<"$trade"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = "1"
          node tools/storefront-browser.mjs
      - name: Publish storefront UI status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/storefront-ui' -f description='Frontend COMPLETE: desktop/mobile navigation store detail cart checkout preview onboarding PASS'
      - name: Publish storefront UI failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/storefront-ui' -f description='Physical-store ecommerce UI validation failed'
