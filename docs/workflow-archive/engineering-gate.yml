name: RWA Engineering Gate

on:
  push:
    branches: ["main"]
    paths:
      - "*.js"
      - "*.json"
      - "agent-worker/**"
      - "launch/**"
      - "tools/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate final engineering package
        run: |
          node --check execution-api.js
          node --check exchange-core.js
          node --check testnet-e2e.js
          node --check copy-24x7-client.js
          node --check launch-status.js
          node --check beta-proof-client.js
          node --check rwa-verify-client.js
          node --check rwa-verification-evidence.js
          node --check social-notification-defaults.js
          node --check social-trading-pro.js
          node --check rwa-storefront.js
          node --check rwa-storefront-safety-patch.js
          node --check rwa-store-draft-ui.js
          node --check rwa-home-commerce.js
          node --check rwa-market-labels.js
          node --check rwa-store-detail.js
          node --check rwa-checkout-ui.js
          node --check trade/ui-polish.js
          node --check agent-worker/execution.mjs
          node --check agent-worker/copy-engine.mjs
          node --check agent-worker/worker.mjs
          node --check tools/security-gate.mjs
          node --check tools/launch-gate.mjs
          node --check tools/worker-watch.mjs
          node --check tools/e2e-proof.mjs
          node --check tools/rwa-evidence-policy.mjs
          node --check tools/rwa-verify.mjs
          node --check tools/beta-proof.mjs
          node --check tools/product-parity-contract.mjs
          node --check tools/storefront-ui-contract.mjs
          node --check tools/storefront-browser.mjs
          python -m json.tool rwa-commerce-registry.json >/dev/null
          test -s rwa-store-detail.css
          test -s rwa-checkout-ui.css
          node --test tools/test/*.test.mjs
          grep -Fq 'HEALTHCHECK' agent-worker/Dockerfile
          grep -Fq 'restart: unless-stopped' agent-worker/docker-compose.yml
          grep -Fq 'RWA_KEY_ENCRYPTION_SECRET' agent-worker/.env.example
          grep -Fq 'RWA_PUBLIC_ORIGIN' agent-worker/.env.example
          grep -Fq 'rwa-verification-evidence.js?v=1' suite-nav.js
          grep -Fq 'public-https-distinct-probed-v1' tools/rwa-evidence-policy.mjs
          grep -Fq 'probeEvidencePayload' tools/rwa-verify.mjs
          grep -Fq "policy:'explicit-opt-in-v1'" social-notification-defaults.js
          grep -Fq 'venue-backed-social-feed-v1' social-trading-pro.js
          grep -Fq 'social-notification-defaults.js?v=1' index.html
          grep -Fq 'social-trading-pro.js?v=1' index.html
          grep -Fq 'ONE_TOKEN_ONE_PHYSICAL_STORE_V1' rwa-storefront.js
          grep -Fq 'preview-no-fake-price-trade-v1' rwa-storefront-safety-patch.js
          grep -Fq 'UNVERIFIED_LOCAL_DRAFT' rwa-store-draft-ui.js
          grep -Fq 'landing-commerce-surface-v1' rwa-home-commerce.js
          grep -Fq 'public-rwa-linked-vs-store-token-v1' rwa-market-labels.js
          grep -Fq 'physical-store-evidence-detail-v1' rwa-store-detail.js
          grep -Fq 'Trade after venue + RWA verification' rwa-store-detail.js
          grep -Fq 'backend-gated-checkout-preview-v1' rwa-checkout-ui.js
          grep -Fq 'Place order after backend verification' rwa-checkout-ui.js
          grep -Fq '"one_token_one_physical_store": true' rwa-commerce-registry.json
          grep -Fq "import './ui-polish.js?v=1'" trade/config.js
          node tools/security-gate.mjs
          node tools/product-parity-contract.mjs
          node tools/storefront-ui-contract.mjs
          node tools/launch-gate.mjs --require-engineering >/tmp/engineering.json
          node -e "const x=require('/tmp/engineering.json');if(!x.engineering_ready||x.schema<4)process.exit(1);console.log('ENGINEERING COMPLETE schema='+x.schema)"
      - name: Publish engineering success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context='rwa/engineering-gate' -f description='Engineering COMPLETE: trading social physical-store ecommerce checkout UI privacy security worker proofs beta monitoring PASS'
      - name: Publish engineering failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context='rwa/engineering-gate' -f description='Engineering package incomplete'
